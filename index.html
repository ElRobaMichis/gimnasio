/* ---------- cronómetro por serie (ejercicios por tiempo) ---------- */
let setTimerInt = null;
let setTimerState = null;
function startSetTimer(xi, si){
  const ex = db.active && db.active.exercises[xi];
  if(!ex) return;
  const typed = parseInt(ex.sets[si].r, 10);
  const target = (!isNaN(typed) && typed > 0) ? typed
    : (ex.sugg && ex.sugg.reps ? ex.sugg.reps : effRange(ex.key).lo);
  clearInterval(setTimerInt);
  setTimerState = { xi, si, target, phase:'prep', count:3 };
  openModal(`
    <h2 style="text-align:center;font-size:17px">${esc(ex.name)} · serie ${si+1}</h2>
    <div class="clock num" id="settimer" style="font-size:76px;text-align:center;margin:10px 0 2px">3</div>
    <p class="tiny" id="settimerhint" style="text-align:center;margin-bottom:16px">Prepárate… objetivo: ${target} s</p>
    <button class="btn" onclick="stopSetTimer(true)">Terminar antes</button>
    <button class="btn ghost" style="margin-top:8px" onclick="stopSetTimer(false)">Cancelar</button>`);
  setTimerInt = setInterval(() => {
    const el = document.getElementById('settimer');
    const st = setTimerState;
    if(!el || !st){ clearInterval(setTimerInt); return; }
    if(st.phase === 'prep'){
      st.count--;
      if(st.count <= 0){
        st.phase = 'run'; st.count = st.target;
        beep();
        const h = document.getElementById('settimerhint');
        if(h) h.textContent = '¡Sostén!';
      }
      el.textContent = st.count;
    } else {
      st.count--;
      el.textContent = Math.max(0, st.count);
      if(st.count <= 0) finishSetTimer(st.target);
    }
  }, 1000);
}
function finishSetTimer(seconds){
  const st = setTimerState;
  clearInterval(setTimerInt);
  setTimerState = null;
  if(!st) return;
  beep();
  setVal(st.xi, st.si, 'r', String(seconds));
  closeModal(); render();
}
function stopSetTimer(early){
  const st = setTimerState;
  clearInterval(setTimerInt);
  setTimerState = null;
  if(early && st && st.phase === 'run'){
    const elapsed = st.target - Math.max(0, st.count);
    if(elapsed > 0){ setVal(st.xi, st.si, 'r', String(elapsed)); closeModal(); render(); return; }
  }
  closeModal();
}

function collectEntries(s){
  const entries = [];
  for(const ex of s.exercises){
    const corp = ['corporal','tiempo'].includes(exMeta(ex.key).type);
    const sets = ex.sets.map(st => {
      let w = parseFloat(st.w);
      if(isNaN(w) && corp && st.r !== '' && st.r !== undefined) w = 0;  /* corporal/tiempo: peso en blanco = 0 */
      /* si hubo conversiones de unidad, mandan los kg canónicos: así el
         historial no hereda el redondeo de la pantalla (10 lb, no 10,01) */
      const canon = parseFloat(st.wkg);
      if(!isNaN(w)) w = !isNaN(canon) ? Math.round(canon*1000)/1000
                                      : Math.round(toKgEx(ex.key, w)*1000)/1000;
      const r = parseInt(st.r,10);
      const out = { w, r };
      const rir = parseInt(st.rir,10);
      if(!isNaN(rir)) out.rir = Math.min(9, Math.max(0, rir));
      return out;
    }).filter(st => !isNaN(st.w) && st.w >= 0 && !isNaN(st.r) && st.r > 0);
    if(sets.length) entries.push({ key:ex.key, name:ex.name, sets });
  }
  return entries;
}

function askFinish(){
  const s = db.active;
  const done = collectEntries(s).reduce((a,e) => a + e.sets.length, 0);
  const dur = Math.floor((Date.now() - s.start)/1000);
  if(!done){
    confirmModal('No registraste ninguna serie', 'Si terminas ahora, la sesión se descarta sin guardarse.',
      'Descartar sesión', () => { db.active = null; restUntil = null; releaseWake(); save(); go({name:'home'}); });
    return;
  }
  confirmModal('¿Terminar la sesión?',
    `Llevas ${fmtDur(dur)} y registraste ${done} serie${done===1?'':'s'}. Se guarda en tu historial y las sugerencias se actualizan.`,
    'Terminar y guardar', finishSession, true);
}

/* mejor marca previa de un ejercicio: e1RM (normal) o reps máximas (corporal) */
/* récord en asistidos: la MENOR ayuda con la que se logró el piso del rango */
function bestAssistBefore(key){
  const { lo } = effRange(key);
  let best = Infinity;
  for(const h of db.history){
    if(h.deload) continue;
    const e = h.entries.find(x => x.key === key);
    if(!e) continue;
    for(const st of e.sets) if(st.r >= lo && st.w < best) best = st.w;
  }
  return best;
}

function bestMetricBefore(key){
  const repsMode = ['corporal','tiempo'].includes(exMeta(key).type);
  let best = 0;
  for(const h of db.history){
    const e = h.entries.find(x => x.key === key);
    if(!e) continue;
    const v = repsMode ? Math.max(0, ...e.sets.map(st => st.r)) : bestE1RM(e.sets);
    if(v > best) best = v;
  }
  return best;
}

/* =====================================================================
   CIERRE DE SESIÓN — «el titular y su recibo»
   Arriba, una cifra grande que siempre tiene noticia que dar: el récord
   si lo hubo, y si no, el peso movido. Abajo, el detalle impreso como un
   recibo de trabajo. Todo sale de datos que la app ya calculaba.
   ===================================================================== */
/* miles con espacio fino: 8 528 se lee de un vistazo */
/* «1 sesión» / «3 sesiones»: el singular lleva acento y el plural no */
function nSesiones(n){ return `${n} sesi${n === 1 ? 'ón' : 'ones'}`; }
function fmtInt(n){
  return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}
/* duración sin segundos para el pie del titular: «52 min», no «52 min 0 s» */
function fmtDurShort(sec){
  const m = Math.floor(sec / 60);
  return m >= 60 ? `${Math.floor(m/60)} h ${m%60} min` : `${m} min`;
}
/* peso movido de un ejercicio: en asistidos los kg son AYUDA y en los de
   tiempo las «reps» son segundos — ninguno de los dos es volumen */
function entryVolume(key, sets){
  const t = exMeta(key).type;
  if(t === 'asistido' || t === 'tiempo') return 0;
  return sets.reduce((a, st) => a + (st.w > 0 ? st.w * st.r : 0), 0);
}
function sessionVolume(entries){
  return entries.reduce((a, e) => a + entryVolume(e.key, e.sets), 0);
}
function sessionReps(entries){
  return entries.reduce((a, e) => a + e.sets.reduce((b, st) => b + st.r, 0), 0);
}
/* las sesiones del mismo día del split, para comparar contra la anterior */
function routineSessions(rec){
  return db.history.filter(h => !h.deload &&
    (h.routineId ? h.routineId === rec.routineId : h.routineName === rec.routineName));
}
/* cuándo se logró la marca que hoy se superó */
function bestBeforeDate(key, value, assist){
  let out = null;
  for(const h of db.history){
    if(assist && h.deload) continue;
    const e = h.entries.find(x => x.key === key);
    if(!e || !e.sets.length) continue;
    let v;
    if(assist){
      const { lo } = effRange(key);
      v = Math.min(...e.sets.filter(st => st.r >= lo).map(st => st.w), Infinity);
    } else {
      v = ['corporal','tiempo'].includes(exMeta(key).type)
        ? Math.max(0, ...e.sets.map(st => st.r)) : bestE1RM(e.sets);
    }
    if(Math.abs(v - value) < 1e-6 && (!out || h.date > out)) out = h.date;
  }
  return out;
}
function agoLong(iso){
  if(!iso) return '';
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 864e5);
  if(d <= 1) return ' de ayer';
  if(d < 14) return ` de hace ${d} días`;
  const w = Math.round(d / 7);
  if(w < 9) return ` de hace ${w} semanas`;
  const m = Math.round(d / 30);
  return ` de hace ${m} ${m === 1 ? 'mes' : 'meses'}`;
}
/* la curva: una serie, trazo de 2 px, relleno tenue y el último punto marcado */
function sparkSVG(vals, color, opts){
  if(!Array.isArray(vals) || vals.length < 2) return '';
  const o = opts || {};
  const W = o.w || 196, H = o.h || 44, P = o.p || 8;
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const x = i => Math.round((P + i * ((W - P*2) / (vals.length - 1))) * 10) / 10;
  const y = v => Math.round((H - 4 - ((v - min) / span) * (H - 12)) * 10) / 10;
  const pts = vals.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const id = 'sk' + Math.random().toString(36).slice(2, 7);
  const lx = x(vals.length - 1), ly = y(vals[vals.length - 1]);
  return `<svg viewBox="0 0 ${W} ${H+4}" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".26"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${pts} ${x(vals.length-1)},${H+4} ${x(0)},${H+4}" fill="url(#${id})"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="${o.r || 4.5}" fill="${color}" stroke="#08080A" stroke-width="2"/>
  </svg>`;
}
/* la serie que acompaña al récord: la misma métrica, sesión a sesión */
function prMetricSeries(key, n){
  const meta = exMeta(key);
  const hist = exerciseHistory(key).slice(-(n || 6));
  return hist.map(h => {
    if(meta.type === 'asistido'){
      const { lo } = effRange(key);
      const v = Math.min(...h.sets.filter(st => st.r >= lo).map(st => st.w), Infinity);
      return v === Infinity ? null : -v;          /* menos ayuda = más alto */
    }
    if(['corporal','tiempo'].includes(meta.type)) return Math.max(0, ...h.sets.map(st => st.r));
    return bestE1RM(h.sets);
  }).filter(v => v !== null && v > -Infinity);
}
/* un 1RM estimado se enseña con UN decimal: 107,7 y no 107,67 */
function fmtE1RM(key, kg){ return fmtNum(Math.round(fromKgEx(key, kg) * 10) / 10); }
/* cómo se enseña una marca según el tipo de ejercicio */
function prValueHTML(pr){
  if(pr.assist) return pr.now === 0 ? 'sin asistencia'
    : `${fmtWEx(pr.key, pr.now)} ${uLabelEx(pr.key)} de ayuda`;
  if(pr.unit === 's' || pr.unit === 'reps') return `${fmtNum(Math.round(pr.now*10)/10)} ${pr.unit}`;
  return `${fmtE1RM(pr.key, pr.now)} ${uLabelEx(pr.key)}`;
}
function prPrevHTML(pr){
  if(pr.assist) return `antes ${fmtWEx(pr.key, pr.prev)}`;
  if(pr.unit === 's' || pr.unit === 'reps') return `antes ${fmtNum(Math.round(pr.prev*10)/10)}`;
  return `antes ${fmtE1RM(pr.key, pr.prev)}`;
}

/* las series de un ejercicio en una línea: «85 × 8 · 8 · 7», agrupando por
   peso en vez de repetirlo en cada serie */
function setsLine(key, sets){
  const meta = exMeta(key);
  if(meta.type === 'tiempo') return sets.map(st => fmtSet(key, st)).join(' · ');
  const grupos = [];
  for(const st of sets){
    const ult = grupos[grupos.length - 1];
    if(ult && Math.abs(ult.w - st.w) < 1e-9) ult.r.push(st.r);
    else grupos.push({ w:st.w, r:[st.r] });
  }
  const txt = grupos.map(g => (g.w === 0)
    ? `${g.r.join(' · ')} reps`
    : `${fmtWEx(key, g.w)} × ${g.r.join(' · ')}`).join('   ');
  const rirs = sets.map(st => st.rir).filter(x => x !== undefined && x !== null);
  return txt + (rirs.length === sets.length && rirs.length ? ` · RIR ${rirs.join('·')}` : '');
}
/* el detalle impreso: un renglón por ejercicio con su volumen, y sus series debajo */
function receiptHTML(entries, prKeys){
  return entries.map(e => {
    const v = entryVolume(e.key, e.sets);
    const esPR = !!(prKeys && prKeys.has(e.key));
    return `<div class="fin-row${esPR ? ' is-pr' : ''}">
        <span class="nm">${esc(exBaseName(e.name))}</span>
        ${esPR ? '<span class="fin-mark">PR</span>' : ''}
        <span class="dots"></span>
        <span class="vl">${v > 0 ? fmtInt(fromKg(v)) : '—'}</span>
      </div>
      <div class="fin-sets">${setsLine(e.key, e.sets)}</div>`;
  }).join('');
}

/* la pantalla completa que sustituye al modal de cierre */
function finishScreenHTML(rec, prs, failNote){
  const isDeload = !!rec.deload;
  const vol = sessionVolume(rec.entries);
  const nSets = rec.entries.reduce((a, e) => a + e.sets.length, 0);
  const best = prs.length ? prs[0] : null;

  /* ---- el titular ---- */
  let glow, eyebrow, num, unit, sub, spark, axis = ['', 'Hoy'];
  if(best){
    const delta = best.assist ? best.prev - best.now : best.now - best.prev;
    const dTxt = best.assist
      ? `<b>−${fmtWEx(best.key, delta)} ${uLabelEx(best.key)}</b> de ayuda`
      : (best.unit === 's' || best.unit === 'reps')
        ? `<b>+${fmtNum(Math.round(delta*10)/10)} ${best.unit}</b>`
        : `<b>+${fmtE1RM(best.key, delta)} ${uLabelEx(best.key)}</b>`;
    glow = '';
    eyebrow = `Nuevo récord · ${esc(exBaseName(best.name))}`;
    if(best.assist){ num = fmtWEx(best.key, best.now); unit = `${uLabelEx(best.key)} de ayuda`; }
    else if(best.unit === 's' || best.unit === 'reps'){
      num = fmtNum(Math.round(best.now*10)/10); unit = best.unit;
    } else { num = fmtE1RM(best.key, best.now); unit = uLabelEx(best.key); }
    sub = best.assist
      ? (best.now === 0
          ? `Ya lo haces <b>sin asistencia</b>: cero ayuda de la máquina.`
          : `La menor ayuda con la que has sostenido el rango. ${dTxt} sobre tu marca${agoLong(best.date)}.`)
      : `${(best.unit === 's' || best.unit === 'reps') ? 'Tu mejor marca.' : '1RM estimado.'}
         ${dTxt} sobre tu marca${agoLong(best.date)}.`;
    const serie = prMetricSeries(best.key, 6);
    spark = sparkSVG(serie.map(v => best.assist ? -v : v), '#D7A44B');
    axis = [`Hace ${serie.length} sesiones`, 'Hoy'];
  } else {
    const prev = routineSessions(rec).filter(h => h.id !== rec.id);
    const last = prev.length ? prev[prev.length - 1] : null;
    const lastVol = last ? sessionVolume(last.entries) : 0;
    glow = ' up';
    if(isDeload){
      eyebrow = 'Descarga guardada';
      sub = `Series suaves, a propósito. Tu progresión y tus récords no se tocan:
             la próxima sesión normal retoma exactamente donde ibas.`;
    } else if(last && lastVol > 0 && vol > 0){
      const d = vol - lastVol, up = d >= 0;
      eyebrow = `Peso movido · ${esc(rec.routineName)}`;
      sub = `Levantados en ${nSets} serie${nSets===1?'':'s'}. <b>${up?'+':'−'}${fmtInt(Math.abs(fromKg(d)))} ${uLabel()}</b>
             sobre tu ${esc(rec.routineName)} anterior.`;
    } else {
      eyebrow = `Peso movido · ${esc(rec.routineName)}`;
      sub = `Levantados en ${nSets} serie${nSets===1?'':'s'}.
             ${last ? 'Sigue registrando y aquí verás la comparación.' : 'Tu primera vez de este día: desde aquí se mide todo lo demás.'}`;
    }
    if(vol > 0){ num = fmtInt(fromKg(vol)); unit = uLabel(); }
    else { num = fmtInt(sessionReps(rec.entries)); unit = 'reps'; }
    const serie = routineSessions(rec).slice(-5).map(h => sessionVolume(h.entries)).filter(v => v > 0);
    spark = (vol > 0 && !isDeload) ? sparkSVG(serie, '#7FD3A8') : '';
    axis = [`Hace ${serie.length} sesiones`, 'Hoy'];
  }

  /* ---- los demás récords, o lo más pesado del día ---- */
  let more = '';
  if(prs.length > 1){
    more = `<div class="fin-more"><div class="fin-lbl">También hoy</div>
      ${prs.slice(1).map(pr => `<div class="fin-pr">
        <span class="nm">${esc(exBaseName(pr.name))}</span>
        <span class="vl">${prValueHTML(pr)} <s>${prPrevHTML(pr)}</s></span>
      </div>`).join('')}</div>`;
  } else if(!best && !isDeload){
    let top = null;
    for(const e of rec.entries){
      if(['asistido','tiempo'].includes(exMeta(e.key).type)) continue;
      for(const st of e.sets) if(st.w > 0 && (!top || st.w > top.w)) top = { w:st.w, r:st.r, e };
    }
    if(top) more = `<div class="fin-more"><div class="fin-lbl">Lo más pesado del día</div>
      <div class="fin-pr"><span class="nm">${esc(exBaseName(top.e.name))}</span>
        <span class="vl" style="color:var(--bone)">${fmtWEx(top.e.key, top.w)} ${uLabelEx(top.e.key)} × ${top.r}</span></div></div>`;
  }

  /* ---- el recibo ---- */
  const filas = receiptHTML(rec.entries, new Set(prs.map(p => p.key)));
  const totalTxt = vol > 0
    ? `${fmtInt(fromKg(vol))}<i> ${uLabel()}</i>`
    : `${fmtInt(sessionReps(rec.entries))}<i> reps</i>`;

  return `
    <div class="fin-hero">
      <div class="fin-glow${glow}"></div>
      <div class="fin-eyebrow${glow}">${eyebrow}</div>
      <div class="fin-n"><b>${num}</b><i>${unit}</i></div>
      <div class="fin-sub${glow}">${sub}</div>
      ${ spark ? `<div class="fin-spark">${spark}
        <div class="fin-ax"><span>${axis[0]}</span><span>${axis[1]}</span></div></div>` : '' }
    </div>
    ${more}
    <div class="fin-foot">${fmtDurShort(rec.duration).toUpperCase()} · ${nSets} SERIES · ${rec.entries.length} EJERCICIOS</div>
    ${failNote ? `<div style="margin-top:18px">${failNote}</div>` : ''}
    <div class="fin-more"><div class="fin-lbl">El detalle</div>
      ${filas}
      <div class="fin-total"><span class="l">${vol > 0 ? 'Total movido' : 'Total de reps'}</span>
        <span class="v">${totalTxt}</span></div>
      <button class="note-a" style="display:block;margin:14px auto 0"
        onclick="closeModal(); go({name:'history'})">Ver historial</button>
    </div>
    <div class="fin-dock">
      ${healthBtnHTML(rec.duration)}
      <button class="btn" style="margin-top:9px" onclick="closeModal(); go({name:'home'})">Listo</button>
    </div>`;
}

function finishSession(){
  const s = db.active;
  const entries = collectEntries(s);
  const isDeload = !!s.deload;

  /* récords personales: comparar contra la mejor marca histórica ANTES de guardar
     (una descarga nunca compite por récords) */
  const prs = [];
  if(!isDeload) for(const e of entries){
    const meta = exMeta(e.key);
    if(meta.type === 'asistido'){
      /* asistido: el récord es lograr el rango con MENOS ayuda */
      const { lo } = effRange(e.key);
      const prevBest = bestAssistBefore(e.key);
      const nowBest = Math.min(...e.sets.filter(st => st.r >= lo).map(st => st.w), Infinity);
      if(prevBest !== Infinity && nowBest < prevBest - 1e-9){
        prs.push({ key:e.key, name:e.name, now:nowBest, prev:prevBest, assist:true,
                   unit:uLabelEx(e.key), date:bestBeforeDate(e.key, prevBest, true),
                   gain:(prevBest - nowBest) / (prevBest || 1) });
      }
      continue;
    }
    const repsMode = ['corporal','tiempo'].includes(meta.type);
    const prev = bestMetricBefore(e.key);
    const now = repsMode ? Math.max(0, ...e.sets.map(st => st.r)) : bestE1RM(e.sets);
    if(prev > 0 && now > prev){
      const unit = meta.type === 'tiempo' ? 's' : (meta.type === 'corporal' ? 'reps' : uLabelEx(e.key));
      prs.push({ key:e.key, name:e.name, now, prev, assist:false, unit,
                 date:bestBeforeDate(e.key, prev, false), gain:(now - prev) / prev });
    }
  }
  /* el titular se lo lleva la mejora mayor, no la primera de la lista */
  prs.sort((a, b) => b.gain - a.gain);

  const rec = {
    id: s.id, routineId: s.routineId, routineName: s.routineName,
    date: new Date().toISOString(),
    duration: Math.floor((Date.now() - s.start)/1000),
    entries
  };
  if(isDeload) rec.deload = true;
  /* los récords se guardan CON la sesión: así el historial puede marcarlos
     sin recalcular todo el pasado cada vez que se abre la pantalla */
  if(prs.length) rec.prs = prs.map(x => ({ key:x.key, name:x.name, now:x.now,
                                           prev:x.prev, unit:x.unit, assist:!!x.assist }));
  /* nota educativa: sesión mayormente al fallo (RIR 0) — salvo que el split
     esté marcado «al fallo a propósito»: ahí es el programa, no un descuido */
  const rrF = db.routines.find(x => x.id === rec.routineId);
  const spF = rrF && db.splits.find(x => x.id === rrF.split);
  const rirAll = entries.flatMap(e => e.sets).filter(s => s.rir !== undefined && s.rir !== null);
  const zeros = rirAll.filter(s => s.rir === 0).length;
  const failNote = (!(spF && spF.failOk) && rirAll.length >= 4 && zeros / rirAll.length >= 0.7) ? `
    <div class="note" style="margin:0 0 18px">
      <div class="note-t">Hoy llegaste al fallo (RIR 0) en ${zeros} de ${rirAll.length} series</div>
      <div class="note-d">Ir al fallo da casi el mismo músculo que quedarte a 1–3 reps de él,
        pero alarga la recuperación 24–48 h. Prueba dejar 1–2 reps en reserva en la mayoría de series —
        progresarás igual y llegarás con más energía a la próxima sesión.</div>
    </div>` : '';

  db.history.push(rec);
  db.active = null;
  restUntil = null;
  showUpdateToast();   /* si había una actualización esperando, ya puede salir */
  releaseWake();
  save();
  if(!isDeload){
    /* la progresión se juzga con las reglas del split de ESTA sesión,
       aunque hayas cambiado el split en curso antes de terminar */
    const rr = db.routines.find(x => x.id === rec.routineId);
    ctxSplitOverride = (rr && rr.split) || null;
    for(const e of entries) updateProgress(e.key, e.sets, rec.date);
    ctxSplitOverride = null;
  }
  closeModal();
  openFullModal(finishScreenHTML(rec, prs, failNote));
}

/* ---------- cambio de unidad kg ⇄ lb ---------- */
function askUnitSwitch(target){
  const nu = target || (db.settings.unit === 'lb' ? 'kg' : 'lb');
  if(nu === db.settings.unit) return;
  confirmModal(`¿Cambiar a ${nu === 'lb' ? 'libras (lb)' : 'kilos (kg)'}?`,
    `Tus datos guardados NO se modifican — internamente todo vive en kg y solo cambia cómo se muestra y cómo escribes.
     ${db.active ? 'Lo que ya escribiste en esta sesión se convierte automáticamente a la nueva unidad.' : ''}
     Puedes alternar cuando quieras. Si es porque entrenas en OTRO gimnasio, mejor crea un gimnasio
     en Ajustes → Mi equipo: guarda su unidad, su equipo y sus máquinas completas.`,
    `Cambiar a ${nu}`, () => setUnit(nu), true);
}
function setUnit(u){
  if(db.settings.unit === u) return;
  /* convertir lo ya escrito en la sesión activa (estaba en la unidad anterior) */
  if(db.active){
    for(const ex of db.active.exercises){
      if(pinnedUnit(ex.key)) continue;   /* esa torre tiene su propia unidad */
      for(const st of ex.sets) convertTypedW(st, db.settings.unit, u);
    }
  }
  /* el juego estándar INTACTO sigue a la unidad: en lb los discos
     estándar son otros (45, 35, 25…), no los de kg con decimales.
     Un inventario que editaste no se toca: esos discos existen de
     verdad y en la otra unidad pesan lo que pesan (25 kg = 55,12 lb). */
  const prev = db.settings.unit;
  for(const kind of ['plates','bars','dumbbells'])
    if(gymKindPristine(kind, prev)) db.gym[kind] = defaultGym(u)[kind];
  invalidatePlates();
  db.settings.unit = u;
  db.gym.unit = u;   /* el gimnasio activo recuerda su unidad para los cambios */
  /* regenerar sugerencias: sus textos llevan la unidad y el redondeo cambia */
  if(db.active) for(const ex of db.active.exercises) ex.sugg = computeSuggestion(ex.key);
  save(); render();
}
function setScreenOn(v){

}
function askWipe(){
  confirmModal('¿Borrar todos los datos?', 'Se eliminan rutinas, historial y ajustes de este dispositivo. No se puede deshacer. Tip: descarga antes un respaldo.',
    'Borrar todo', () => {
      localStorage.removeItem(LS_KEY);
      db = load(); go({name:'home'});
    });
}

/* =====================================================================
   CALENTAMIENTO CALCULADO
   Evidencia: escalera específica 40–80 % de la carga de trabajo con reps
   decrecientes (Ribeiro 2021); cargas moderadas necesitan 0–2 series
   (Ribeiro 2020); pesado → llegar a ~80 % con intención de velocidad
   (scoping review 2025); músculo ya caliente → menos (Iversen 2021).
   ===================================================================== */
function warmupPlan(xi){
  const s = db.active, ex = s.exercises[xi];
  const meta = exMeta(ex.key);
  const { hi } = effRange(ex.key);

  /* peso de trabajo de hoy: lo escrito en la serie 1, o la sugerencia del coach */
  let W = NaN;
  const typed = parseFloat(ex.sets[0] && ex.sets[0].w);
  if(!isNaN(typed) && typed > 0) W = toKg(typed);
  else if(ex.sugg && ex.sugg.w > 0) W = ex.sugg.w;

  /* ¿el músculo ya viene caliente de un ejercicio anterior de esta sesión? */
  let first = true;
  if(meta.muscle && meta.muscle !== 'none'){
    for(let i = 0; i < xi; i++){
      if(exMeta(s.exercises[i].key).muscle === meta.muscle){ first = false; break; }
    }
  } else first = (xi === 0);

  if(meta.type === 'tiempo'){
    const target = ex.sugg ? ex.sugg.reps : hi;
    const easy = Math.max(10, Math.round(target * 0.5 / 5) * 5);
    return { rows: [`1 serie × ${easy} s suaves (misma posición, lejos del límite)`], first,
             note: 'En isométricos basta una serie corta para activar el patrón.' };
  }
  if(meta.type === 'corporal'){
    const target = ex.sugg ? ex.sugg.reps : hi;
    const easy = Math.max(3, Math.round(target * 0.5));
    return { rows: [`1 serie × ${easy} reps fáciles (misma técnica, lejos del fallo)`], first,
             note: 'En peso corporal basta una serie suave del mismo movimiento para activar el patrón.' };
  }
  if(isNaN(W) || W <= 0) return null;         /* aún no hay peso de referencia */
  if(meta.type === 'asistido'){
    const helpW = roundToStep(W * 1.5, effStep(ex.key, W));
    return { rows: [`1 serie × 6 con más ayuda (~${fmtWEx(ex.key, helpW)} ${uLabelEx(ex.key)})`], first,
             note: 'En asistidos, calentar = misma técnica con bastante más asistencia.' };
  }
  if(W <= 12){
    return { rows: [], first, W,
             note: 'Peso ligero: la evidencia muestra que con cargas moderadas el calentamiento específico aporta poco. Si es tu primer ejercicio del día, haz 1 serie suave del mismo movimiento y listo.' };
  }
  const heavy = hi <= 7;    /* rango de fuerza → cargas relativas altas */
  const scheme = heavy
    ? (first ? [[0.4,5],[0.6,3],[0.8,2]] : [[0.55,3],[0.8,2]])
    : (first ? [[0.5,6],[0.75,3]]        : [[0.7,4]]);
  const rows = [], steps = [], seen = new Set();
  for(const [pct, reps] of scheme){
    let wk = roundToStep(W * pct);
    wk = fitWeight(ex.key, wk) || wk;   /* que el escalón se pueda armar de verdad */
    if(wk <= 0 || wk >= W || seen.has(wk)) continue;
    seen.add(wk);
    rows.push(`${fmtWEx(ex.key, wk)} ${uLabelEx(ex.key)} × ${reps}`);
    steps.push({ w:wk, reps });
  }
  return { rows, steps, first, W, heavy,
           note: rows.length ? null : 'El peso de trabajo es tan bajo que no salen escalones útiles: 1 serie suave alcanza.' };
}

/* un escalón del calentamiento con su carga dibujada */
function warmStepHTML(key, label, value, w, work){

  const head = `
    <div class="load-row">
      <span class="load-l"${work ? ' style="color:var(--up)"' : ''}>${label}</span>
      <span class="load-v"><b${work ? ' style="color:var(--up)"' : ''}>${value}</b></span>
    </div>`;
  let body = '';
  if(p && p.kind === 'placas'){
    body = `<div style="display:flex;justify-content:center;padding:6px 0 2px">
        ${stackSVG(p.stack.index, Math.max(p.stack.index + 4, 12), { h:104 })}</div>
      <div class="load-row"><span class="load-l">Pon el pin en</span>
        <span class="load-v">Placa <b>${p.stack.index}</b>${stackExtraLabel(p.stack)}</span></div>`;
  } else if(p && (p.kind === 'barra' || p.kind === 'discos')){
    const lbl = p.points === 1 ? 'En un solo lado' : (p.points === 2 ? 'Por lado' : `En cada pitón`);

/* =====================================================================
   TIMER DE DESCANSO
   ===================================================================== */
function restSecs(key){
  const r = db.settings.rest;
  if(r === 'off') return null;
  if(key){                       /* descanso del split en contexto, o el propio del ejercicio */
    const oc = splitConf(key);
    const sr = oc ? parseInt(oc.rest, 10) : NaN;
    if(!isNaN(sr) && sr > 0) return sr;
    const er = parseInt(exMeta(key).rest, 10);
    if(!isNaN(er) && er > 0) return er;
  }
  if(r && r !== 'auto'){ const n = parseInt(r,10); if(!isNaN(n) && n > 0) return n; }
  return GOALS[db.settings.goal || 'ambas'].rest;
}
function startRestAuto(key){
  const s = restSecs(key); if(!s) return;
  restUntil = Date.now() + s*1000;
  tickRest();
}
function toggleRest(){
  if(restUntil) restUntil = null;
  else startRestAuto();
  tickRest();
}
/* ---------- notificaciones del sistema (opt-in) ---------- */
function canNotify(){
  return db.settings.notify === 'on' &&
         typeof Notification !== 'undefined' && Notification.permission === 'granted';
}
/* solo avisa cuando la app NO está a la vista: en pantalla, el sonido/vibración bastan */
function notify(title, body, tag){
  if(!canNotify()) return;
  if(typeof document !== 'undefined' && document.visibilityState === 'visible') return;
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready
        .then(reg => reg.showNotification(title, { body, tag, icon:'icon-192.png', badge:'icon-192.png' }))
        .catch(() => {});
    } else {
      new Notification(title, { body, tag });
    }
  }catch(e){}
}
function enableNotifications(){
  if(typeof Notification === 'undefined'){
    infoModal('No disponible en este navegador',
      'En iPhone, las notificaciones solo funcionan con la app instalada en la pantalla de inicio (Safari → Compartir → Añadir a pantalla de inicio) y iOS 16.4 o más nuevo. Instálala y actívalas desde ahí.');
    return;
  }
  Notification.requestPermission().then(perm => {
    if(perm === 'granted'){
      db.settings.notify = 'on'; save(); render();
      infoModal('Notificaciones activadas ✓',
        'Te avisaré cuando termine tu descanso y si una sesión queda abierta sin actividad — solo cuando la app no esté a la vista.');
    } else {
      db.settings.notify = 'off'; save(); render();
      if(perm === 'denied') infoModal('Permiso bloqueado',
        'El navegador tiene bloqueadas las notificaciones para esta app. Para permitirlas: ajustes del navegador/teléfono → notificaciones de este sitio → permitir, y vuelve a intentarlo.');
    }
  });
}
function disableNotifications(){ db.settings.notify = 'off'; save(); render(); }

/* sesión olvidada: abierta 15+ min sin anotar nada */
function checkIdleSession(){
  if(!db.active) return;
  const last = db.active.lastLog || db.active.start;
  if(Date.now() - last > 15*60*1000 && !(db.active.idleNotified > last)){
    db.active.idleNotified = Date.now();

/* pantalla siempre encendida durante la sesión (Wake Lock) */
let wakeLock = null;
async function acquireWake(){
  try{
    if('wakeLock' in navigator && db.settings.screenOn !== 'off' && db.active && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  }catch(e){}
}
function releaseWake(){
  try{ if(wakeLock) wakeLock.release(); }catch(e){}
  wakeLock = null;
}

function beep(){
  try{
    if(navigator.vibrate) navigator.vibrate([200,120,200]);
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    for(const [f, t] of [[880, 0], [1175, 0.22]]){
      const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
      o.connect(gn); gn.connect(audioCtx.destination);
      o.frequency.value = f;
      gn.gain.setValueAtTime(0.18, t0 + t);
      gn.gain.exponentialRampToValueAtTime(0.001, t0 + t + 0.25);
      o.start(t0 + t); o.stop(t0 + t + 0.3);
    }
  }catch(e){}
}
function tickRest(){
  const box = document.getElementById('rest');
  if(!box) return;
  const t = document.getElementById('resttime');
  const l = document.getElementById('restlabel');
  const f = document.getElementById('restfill');
  const total = restSecs() || 0;
  if(restUntil === null){
    if(box.className !== 'rest'){
      box.className = 'rest';
      if(l) l.textContent = 'Descanso';
      if(t) t.textContent = fmtClock(total);
      if(f) f.style.width = '0%';
    }
    return;
  }
  const rem = Math.ceil((restUntil - Date.now())/1000);
  if(rem <= 0){
    restUntil = null;
    beep();
    notify('Descanso listo', '¡A la siguiente serie!', 'hierro-rest');
    box.className = 'rest done';
    if(l) l.textContent = 'Listo';
    if(t) t.textContent = '¡Vamos!';
    if(f) f.style.width = '100%';
    setTimeout(() => { if(restUntil === null) tickRest(); }, 4000);
    setTimeout(() => {
      const b2 = document.getElementById('rest');
      if(b2 && restUntil === null){
        b2.className = 'rest';
        const l2 = document.getElementById('restlabel');
        const t2 = document.getElementById('resttime');
        const f2 = document.getElementById('restfill');
        if(l2) l2.textContent = 'Descanso';
        if(t2) t2.textContent = fmtClock(restSecs() || 0);
        if(f2) f2.style.width = '0%';
      }
    }, 4200);
    return;
  }
  box.className = 'rest on';
  if(l) l.textContent = 'Descansando';
  if(t) t.textContent = fmtClock(rem);
  if(f) f.style.width = (total ? Math.max(0, Math.min(100, (1 - rem/total) * 100)) : 0) + '%';
}

/* =====================================================================
   GRÁFICA DE PROGRESO (canvas, una serie: 1RM estimado o reps)
   ===================================================================== */
function drawChart(){
  const cv = document.getElementById('exchart');
  if(!cv) return;
  const pts = window.__chartPts || [];
  if(pts.length < 2) return;
  const W = cv.parentElement.clientWidth, H = 120;
  const dpr = window.devicePixelRatio || 1;
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  const padL = 4, padR = 8, padT = 10, padB = 10;
  const dmin = Math.min(...pts.map(p=>p.v)), dmax = Math.max(...pts.map(p=>p.v));
  let lo = dmin, hi = dmax;
  if(lo === hi){ lo -= 1; hi += 1; }
  const span = hi - lo; lo -= span*0.14; hi += span*0.14;
  const X = i => padL + (W-padL-padR) * (pts.length === 1 ? 0.5 : i/(pts.length-1));
  const Y = v => padT + (H-padT-padB) * (1 - (v-lo)/(hi-lo));

  /* rejilla recesiva: tres líneas sin números — el valor vive en el titular */
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
  for(const frac of [0, 0.5, 1]){
    const y = padT + (H-padT-padB) * frac;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  /* línea de la serie */
  ctx.strokeStyle = '#F3F1EC'; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  pts.forEach((p,i) => i ? ctx.lineTo(X(i), Y(p.v)) : ctx.moveTo(X(0), Y(p.v)));
  ctx.stroke();
  /* cada punto es una sesión; el último se resalta */
  pts.forEach((p,i) => {
    const last = i === pts.length-1;
    ctx.beginPath();
    ctx.arc(X(i), Y(p.v), last ? 3.6 : 2.4, 0, 7);
    ctx.fillStyle = last ? '#F3F1EC' : '#8B8E94';
    ctx.fill();
  });

  /* interacción: tocar o arrastrar muestra el detalle de la sesión más cercana */
  const pick = ev => {
    const rect = cv.getBoundingClientRect();
    const x = ev.clientX - rect.left;
    let i = Math.round((x - padL) / ((W-padL-padR) / (pts.length-1)));
    i = Math.max(0, Math.min(pts.length-1, i));
    const tip = document.getElementById('charttip');
    if(tip) tip.innerHTML = `${fmtDateShort(pts[i].date)} · ${fmtNum(pts[i].v)} ${window.__chartUnit}`;
  };
  cv.onpointerdown = pick;
  cv.onpointermove = ev => { if(ev.buttons || ev.pointerType === 'mouse') pick(ev); };
}

/* =====================================================================
   IMPORTACIÓN DESDE HEVY (CSV)
   ===================================================================== */
function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    }
    else if(c === '"') q = true;
    else if(c === ',') { row.push(cur); cur = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i+1] === '\n') i++;
      row.push(cur); cur = '';
      if(row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    }
    else cur += c;
  }
  if(cur !== '' || row.length){ row.push(cur); if(row.length > 1 || row[0] !== '') rows.push(row); }
  return rows;
}

const HEVY_MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseHevyDate(s){
  const m = /(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4}),?\s+(\d{1,2}):(\d{2})\s*([ap]m)?/i.exec(s || '');
  if(!m) return null;
  const mo = HEVY_MONTHS[m[2].toLowerCase()];
  if(mo === undefined) return null;
  let h = parseInt(m[4],10);
  const ap = (m[6]||'').toLowerCase();
  if(ap === 'pm' && h < 12) h += 12;
  if(ap === 'am' && h === 12) h = 0;
  return new Date(parseInt(m[3],10), mo, parseInt(m[1],10), h, parseInt(m[5],10));
}

function importHevy(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onerror = () => infoModal('No se pudo leer el archivo', 'Vuelve a intentarlo o revisa que sea el CSV exportado por Hevy.');
  reader.onload = () => {
    try{
      const rows = parseCSV(String(reader.result));
      const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
      const col = n => head.indexOf(n);
      const iT = col('title'), iS = col('start_time'), iE = col('end_time'),
            iX = col('exercise_title'), iTy = col('set_type'),
            iR = col('reps'), iRPE = col('rpe');
      /* Hevy exporta según la unidad de la cuenta: weight_kg (kg) o weight_lbs (libras) */
      let iW = col('weight_kg'), wFactor = 1, wUnit = 'kg';
      if(iW < 0){
        iW = col('weight_lbs');
        if(iW >= 0){ wFactor = LB_KG; wUnit = 'lb'; }
      }
      if(iT < 0 || iS < 0 || iX < 0 || iR < 0){
        infoModal('Formato no reconocido', 'El archivo no parece una exportación de Hevy: faltan las columnas title, start_time, exercise_title o reps.');
        return;
      }
      const sessions = new Map();
      let skippedWarmup = 0;
      for(const r of rows){
        const start = parseHevyDate(r[iS]);
        if(!start || !r[iX]) continue;
        if(iTy >= 0 && (r[iTy]||'').toLowerCase() === 'warmup'){ skippedWarmup++; continue; }
        const reps = parseInt(r[iR],10);
        if(isNaN(reps) || reps <= 0) continue;              /* cardio / series sin reps */
        let w = iW >= 0 ? parseFloat(r[iW]) : NaN;
        if(isNaN(w) || w < 0) w = 0;                        /* peso corporal → 0 kg */
        w = Math.round(w * wFactor * 1000) / 1000;          /* si venía en lb, a kg (canónico) */
        const skey = (r[iT]||'Hevy') + '|' + r[iS];
        if(!sessions.has(skey)){
          const end = iE >= 0 ? parseHevyDate(r[iE]) : null;
          sessions.set(skey, {
            hevyKey: skey, title: r[iT] || 'Hevy',
            date: start.toISOString(),
            duration: (end && end > start) ? Math.floor((end - start)/1000) : 0,
            ex: new Map()
          });
        }
        const s = sessions.get(skey);
        if(!s.ex.has(r[iX])) s.ex.set(r[iX], []);
        const set = { w, r: reps };
        if(iRPE >= 0){
          const rpe = parseFloat(r[iRPE]);
          if(!isNaN(rpe) && rpe > 0) set.rir = Math.max(0, Math.min(5, Math.round(10 - rpe)));
        }
        s.ex.get(r[iX]).push(set);
      }
      const existingMap = new Map(db.history.filter(h => h.hevyKey).map(h => [h.hevyKey, h]));
      const news = [], repairs = [];
      for(const s of sessions.values()){
        if(!s.ex.size) continue;
        const old = existingMap.get(s.hevyKey);
        if(!old){ news.push(s); continue; }
        /* auto-reparación: la sesión existe pero se importó sin pesos (bug previo con
           CSV en libras) y el archivo sí trae pesos → se actualiza en vez de saltarse */
        const oldAllZero = old.entries.every(e => e.sets.every(st => !st.w));
        const incomingHasW = [...s.ex.values()].some(sets => sets.some(st => st.w > 0));
        if(oldAllZero && incomingHasW) repairs.push(s);
      }
      if(!news.length && !repairs.length){
        infoModal('Nada nuevo para importar', sessions.size
          ? 'Todas las sesiones del archivo ya están en tu historial, con sus pesos correctos.'
          : 'No se encontraron sesiones con series de peso y reps en el archivo.');
        return;
      }
      window.__hevyImport = { news, repairs };
      const titles = [...new Set(news.concat(repairs).map(s => s.title))];
      const nSets = news.reduce((a,s) => a + [...s.ex.values()].reduce((b,x) => b + x.length, 0), 0);
      openModal(`
        <h2>Importar de Hevy</h2>
        <p class="muted">${news.length ? `Se encontraron <b style="color:var(--bone)">${news.length} sesiones</b> nuevas (${nSets} series) de: ${titles.map(esc).join(', ')}.` : ''}
          ${repairs.length ? `<b style="color:var(--hold)">${repairs.length} sesiones que se habían importado sin pesos se repararán</b> con los pesos correctos del archivo.` : ''}
          Pesos del archivo detectados en <b style="color:var(--bone)">${wUnit === 'lb' ? 'libras' : 'kilos'}</b>${wUnit === 'lb' ? ' — se convierten automáticamente (internamente todo vive en kg)' : ''}.
          ${skippedWarmup ? `Se omiten ${skippedWarmup} series de calentamiento.` : ''}
          Las rutinas que no existan se crean con los ejercicios de la sesión más reciente.</p>
        <button class="btn" onclick="applyHevyImport()">Importar todo</button>
        <button class="btn ghost" style="margin-top:8px" onclick="closeModal()">Cancelar</button>`);
    }catch(err){
      infoModal('No se pudo importar', 'El archivo no se pudo procesar: ' + esc(err.message));
    }
  };
  reader.readAsText(file);
}

function applyHevyImport(){
  const { news = [], repairs = [] } = window.__hevyImport || {};
  if(!news.length && !repairs.length){ closeModal(); return; }
  for(const s of news){
    db.history.push({
      id: uid(), hevyKey: s.hevyKey, routineId: null,
      routineName: s.title, date: s.date, duration: s.duration,
      entries: [...s.ex.entries()].map(([name, sets]) => ({ key: exKey(name), name, sets }))
    });
  }
  /* reparar sesiones importadas sin pesos por el bug de weight_lbs */
  for(const s of repairs){
    const old = db.history.find(h => h.hevyKey === s.hevyKey);
    if(!old) continue;
    old.entries = [...s.ex.entries()].map(([name, sets]) => ({ key: exKey(name), name, sets }));
    if(!old.duration && s.duration) old.duration = s.duration;
    /* deshacer el "peso corporal" mal asignado cuando ahora sí hay pesos */
    for(const [nm, sets] of s.ex){
      const m = exMeta(exKey(nm));
      if(m.type === 'corporal' && sets.some(x => x.w > 0)){
        m.type = /assisted/i.test(nm) ? 'asistido' : 'normal';
      }
    }
  }
  db.history.sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));

  /* detectar tipo automáticamente: "(Assisted)" → asistido; todo a 0 kg → corporal */
  const traits = new Map();
  for(const s of news) for(const [nm, sets] of s.ex){
    const k = exKey(nm);
    const t = traits.get(k) || { zero:true, assisted:/assisted/i.test(nm) };
    if(sets.some(x => x.w > 0)) t.zero = false;
    traits.set(k, t);
  }
  for(const [k, t] of traits){
    const m = exMeta(k);
    if(m.type === 'normal'){
      if(t.assisted) m.type = 'asistido';
      else if(t.zero) m.type = 'corporal';
    }
  }

  /* crear rutinas que falten, con los ejercicios de la sesión más reciente de cada título */
  const byTitle = new Map();
  for(const s of news){
    const c = byTitle.get(s.title);
    if(!c || s.date > c.date) byTitle.set(s.title, s);
  }
  let newRoutines = 0;
  for(const [title, s] of byTitle){
    if(db.routines.some(r => r.name.trim().toLowerCase() === title.trim().toLowerCase())) continue;
    db.routines.push({ id: uid(), name: title,
      exercises: [...s.ex.keys()].map(n => ({ id: uid(), name: n, key: exKey(n) })) });
    newRoutines++;
  }

  /* tipos y grupos musculares de lo recién importado */
  migrateTypes(); migratePRs();

  /* reconstruir el estado adaptativo reproduciendo todo el historial en orden */
  db.progress = {};
  for(const h of db.history)
    for(const e of h.entries) updateProgress(e.key, e.sets, h.date);

  window.__hevyImport = null;
  save(); closeModal();
  openModal(`
    <h2>Importación lista</h2>
    <p class="muted">${news.length ? `${news.length} sesiones agregadas al historial` : ''}${news.length && newRoutines ? ` y ${newRoutines} rutina${newRoutines===1?'':'s'} creada${newRoutines===1?'':'s'}` : ''}${news.length && repairs.length ? '. ' : ''}
      ${repairs.length ? `${repairs.length} sesiones reparadas con sus pesos correctos.` : ''}
      Los ejercicios asistidos y de peso corporal se detectaron solos, y las sugerencias del coach ya usan todo tu historial.</p>
    <button class="btn" onclick="closeModal(); go({name:'home'})">Ver rutinas</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeModal(); go({name:'history'})">Ver historial</button>`);
}

function rirInfo(){
  infoModal('¿Qué es el RIR?', `
    <b style="color:var(--bone)">RIR = “reps en reserva”</b>: cuántas repeticiones MÁS podrías haber hecho
    al terminar la serie.<br><br>
    · Hiciste 10 reps pero podías hacer 12 → RIR 2.<br>
    · No podías hacer ni una más → RIR 0 (llegaste al fallo).<br><br>
    <b style="color:var(--bone)">¿Para qué sirve?</b> La ciencia dice que lo ideal es entrenar dejando
    1–3 reps en reserva: suficiente esfuerzo para crecer, sin el desgaste de ir al fallo siempre.<br><br>
    <b style="color:var(--bone)">Es opcional</b>, pero si lo anotas el coach afina mejor: si pones RIR 4+
    (te sobraban muchas reps), te sugerirá subir el peso antes; si pones RIR 0 seguido, sabrá que ese peso
    te queda pesado.`);
}
function e1rmInfo(){
  infoModal('¿Qué es el 1RM estimado?', `
    Tu <b style="color:var(--bone)">1RM</b> (repetición máxima) es el peso más pesado que podrías levantar
    UNA sola vez. No hace falta probarlo de verdad (¡ni es recomendable!): se puede
    <b style="color:var(--bone)">estimar</b> desde cualquier serie con una fórmula
    (Epley: peso × (1 + reps/30)).<br><br>
    Por ejemplo: 60 kg × 10 reps ≈ 80 kg de 1RM estimado.<br><br>
    <b style="color:var(--bone)">¿Para qué sirve?</b> Es la mejor forma de ver tu progreso real:
    aunque una semana hagas 8 reps y otra 11, o cambies de rango, el 1RM estimado
    los vuelve comparables. La gráfica de cada ejercicio muestra cómo evoluciona.`);
}
function asistInfo(){
  infoModal('¿Qué son los ejercicios asistidos?', `
    Son ejercicios donde una máquina o banda elástica <b style="color:var(--bone)">te ayuda</b> a completar
    el movimiento, típicamente dominadas y fondos asistidos.<br><br>
    <b style="color:var(--bone)">Clave:</b> los kg que marcas en la máquina son la AYUDA que recibes,
    no el peso que levantas. Por eso aquí el progreso funciona al revés:<br><br>
    · Menos kg de ayuda = más difícil = <b style="color:var(--bone)">progreso</b> ✓<br>
    · Más kg de ayuda = más fácil.<br><br>
    Si marcas un ejercicio como “Asistido” (tocándolo en su rutina), el coach lo entiende y te sugiere
    ir bajando la ayuda hasta que puedas hacerlo libre. Los importados de Hevy con “(Assisted)” se
    detectan solos.`);
}
function coachInfo(){
  infoModal('¿Cómo me sugiere progresar el coach?', `
    Usa <b style="color:var(--bone)">doble progresión</b>, el método con más respaldo científico:<br><br>
    1. Cada ejercicio tiene un rango de reps según tu objetivo (ej. 8–12).<br>
    2. Con el mismo peso, intenta sumar reps sesión a sesión.<br>
    3. Cuando llegas al tope del rango en TODAS las series → sube el peso (~2,5 %) y vuelve a empezar
    desde el piso del rango.<br><br>
    Además se adapta a ti, por ejercicio: si fallas tras subir, los saltos se hacen más pequeños;
    si no sostienes el rango 2 veces seguidas, te propone bajar ~5 % y reconstruir; si te estancas
    varias sesiones, te suma una serie (más volumen = más progreso). En peso corporal progresas por
    reps y en asistidos bajando la ayuda.<br><br>
    Sobre las series: la zona ideal es <b style="color:var(--bone)">2–4 series por ejercicio</b> —
    a partir de la 4ª el beneficio por sesión cae en picada. Si vienes haciendo 5 o más, el coach
    te sugerirá concentrar el trabajo en menos series más intensas. Con 4+ series, la peor no cuenta
    para evaluar tu progreso (que la última se caiga es fatiga normal).<br><br>
    Regla de oro: termina tus series dejando 1–3 reps en reserva (RIR 1–3) — esfuerzo alto sin
    ir al fallo cada vez.`);
}

function afterRender(){

    const tick = () => {
      const el = document.getElementById('clock');
      if(!el || !db.active) return;
      el.textContent = fmtClock(Math.floor((Date.now() - db.active.start)/1000));
      tickRest();
    };

/* migración: detectar asistidos/corporales en historial ya importado */
/* el historial anterior a 2.1 no guarda sus récords: se reconstruyen una vez
   recorriendo las sesiones en orden y llevando la mejor marca viva de cada
   ejercicio — una sola pasada, sin volver a mirar atrás en cada sesión */
function migratePRs(){
  if(!db.history.length) return;
  if(db.history.every(h => h.prs !== undefined)) return;
  const best = new Map();
  const ordenadas = [...db.history].sort((a,b) => a.date < b.date ? -1 : 1);
  for(const h of ordenadas){
    const prs = [];
    for(const e of h.entries){
      if(!e.sets.length) continue;
      const meta = exMeta(e.key);
      const assist = meta.type === 'asistido';
      let now;
      if(assist){
        const { lo } = effRange(e.key);
        now = Math.min(...e.sets.filter(st => st.r >= lo).map(st => st.w), Infinity);
        if(now === Infinity) continue;
      } else {
        now = ['corporal','tiempo'].includes(meta.type)
          ? Math.max(0, ...e.sets.map(st => st.r)) : bestE1RM(e.sets);
        if(!(now > 0)) continue;
      }
      const prev = best.get(e.key);
      const mejora = prev !== undefined && (assist ? now < prev - 1e-9 : now > prev);
      if(mejora && !h.deload){
        prs.push({ key:e.key, name:e.name, now, prev, assist,
          unit: meta.type === 'tiempo' ? 's' : (meta.type === 'corporal' ? 'reps' : uLabelEx(e.key)) });
      }
      if(prev === undefined || (assist ? now < prev : now > prev)) best.set(e.key, now);
    }
    h.prs = prs;
  }
  save();
}
function migrateTypes(){
  const traits = new Map();
  for(const h of db.history) for(const e of h.entries){
    if(db.exmeta[e.key]) continue;   /* ya configurado por el usuario */
    const t = traits.get(e.key) || { zero:true, assisted:/assisted|asistid/i.test(e.name) };
    if(e.sets.some(x => x.w > 0)) t.zero = false;
    traits.set(e.key, t);
  }
  let changed = false;
  for(const [k, t] of traits){
    if(t.assisted){ exMeta(k).type = 'asistido'; changed = true; }
    else if(t.zero){ exMeta(k).type = 'corporal'; changed = true; }
  }
  /* grupo muscular y equipo: adivinar donde falten (corregibles en la ficha) */
  for(const [key, info] of allExerciseNames()){
    const m = exMeta(key);
    if(m.muscle === undefined || m.muscle === null){
      const g = guessMuscle(info.name);
      if(g){ m.muscle = g; changed = true; }
    }
    if(m.equip === undefined || m.equip === null){
      const e = guessEquip(info.name);
      if(e){ m.equip = e; changed = true; }
    }
  }
  if(changed) save();
}

/* ---------- arranque ---------- */
(function init(){
  /* pedir almacenamiento persistente: sin esto, el navegador puede purgar
     los datos del sitio si anda corto de espacio — y aquí viven tus marcas */
  try{
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }catch(e){}
  /* PWA: registrar el service worker para funcionar sin conexión */
  const seguro = location.protocol === 'https:' || location.hostname === 'localhost';
  if('serviceWorker' in navigator && seguro){
    navigator.serviceWorker.register('sw.js').then(reg => {
      /* cuando termine de bajarse una versión nueva, avisar en pantalla */
      reg.addEventListener('updatefound', () => {
        const nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener('statechange', () => {
          if(nuevo.state === 'installed' && navigator.serviceWorker.controller){
            updateReady = true;
            render();
          }
        });
      });
      /* buscarla al abrir y cada vez que vuelves a la app */
      const buscar = () => { try{ reg.update(); }catch(e){} };
      buscar();
      document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible') buscar();
      });
      /* la red del gym: si el documento fresco llegó tarde (se sirvió la
         copia local), el SW avisa en cuanto termina la descarga — la red
         ya respira y es EL momento de buscar la versión nueva, en vez de
         esperar a que llegues a tu casa con buen wifi */
      navigator.serviceWorker.addEventListener('message', ev => {
        if(ev.data && ev.data.tipo === 'documento-fresco') buscar();
      });
      window.addEventListener('online', buscar);
    }).catch(() => {});
  }
  /* el wake lock se libera solo al minimizar; re-adquirirlo al volver */
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && db.active) acquireWake();
  });
  setInterval(checkIdleSession, 60*1000);
  migrateTypes(); migratePRs();
  render();
  if(!db.settings.goal){
    openModal(`
      <h2>¿Cuál es tu objetivo?</h2>
      <p class="muted">Define el rango de reps y cómo el coach te sugiere progresar. Lo puedes cambiar en Ajustes.</p>
      <div class="stack">
        ${Object.entries(GOALS).map(([k,v]) => `
          <button class="opt" onclick="setGoal('${k}'); closeModal()">
            <b>${v.label}</b><span>${v.desc}</span>
          </button>`).join('')}
      </div>`);
  }
  if(db.active) go({name:'session'});
})();
</script>
