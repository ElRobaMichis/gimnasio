<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hierro">
<meta name="color-scheme" content="dark">
<title>Hierro — tu registro de gimnasio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
  :root{
    --bg:#101216;
    --panel:#181b21;
    --panel-2:#1f232b;
    --line:#2a2f3a;
    --ink:#eae6dc;
    --mut:#8e94a0;
    --acc:#f5c242;
    --acc-ink:#1a1608;
    --good:#6cc283;
    --warn:#e2984a;
    --bad:#e25c5c;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.45;
    overscroll-behavior-y:contain;
  }
  #app{
    max-width:560px;margin:0 auto;min-height:100dvh;
    display:flex;flex-direction:column;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  main{flex:1;padding:16px 16px 24px}

  /* ---------- tipografía utilitaria ---------- */
  .eyebrow{
    font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--mut);
  }
  h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
  h2{font-size:19px;font-weight:750;letter-spacing:-.01em}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- header ---------- */
  header.app{
    padding:calc(18px + env(safe-area-inset-top, 0px)) 16px 6px;
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  }
  header.app .brand{display:flex;flex-direction:column;gap:2px}

  /* ---------- cards / listas ---------- */
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;
  }
  .stack{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:10px}
  .row > input{min-width:0}
  .grow{flex:1;min-width:0}
  .clickable{cursor:pointer;transition:border-color .12s ease, transform .05s ease}
  .clickable:active{transform:scale(.985)}
  .clickable:hover{border-color:#3a4150}
  .muted{color:var(--mut);font-size:13.5px}
  .tiny{font-size:12px;color:var(--mut)}
  .linkish{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}

  /* ---------- botones ---------- */
  button{
    font:inherit;color:inherit;background:none;border:none;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .clickable:focus-visible{
    outline:2px solid var(--acc);outline-offset:2px;border-radius:8px;
  }
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    border-radius:12px;padding:13px 18px;font-weight:700;font-size:15.5px;
    background:var(--panel-2);border:1px solid var(--line);width:100%;
    transition:transform .05s ease;
  }
  .btn:active{transform:scale(.98)}
  .btn-acc{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
  .btn-danger{color:var(--bad);border-color:#4a2f33}
  .btn-ghost{background:transparent}
  .iconbtn{
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    color:var(--mut);font-size:18px;flex:none;
  }
  .iconbtn:hover{color:var(--ink);background:var(--panel-2)}

  /* ---------- inputs ---------- */
  input[type=text], input[type=number], select, textarea{
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:11px 12px;font:inherit;width:100%;
  }
  textarea{resize:vertical;min-height:64px}
  input::placeholder, textarea::placeholder{color:#5b6170}
  input[type=number]{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
  /* placeholders de sugerencia = "shadow text" dorado */
  input.sugg::placeholder{color:#8a7a45}
  .field{display:flex;flex-direction:column;gap:5px}
  .field > span{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}

  /* ---------- nav inferior ---------- */
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:rgba(16,18,22,.92);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabs .inner{max-width:560px;margin:0 auto;display:flex}
  nav.tabs button{
    flex:1;padding:11px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--mut);font-size:11px;font-weight:600;letter-spacing:.04em;
  }
  nav.tabs button .ic{font-size:19px;line-height:1}
  nav.tabs button.on{color:var(--acc)}

  /* ---------- barra de sesión (cronómetro + descanso) ---------- */
  .sessionbar{
    position:sticky;top:0;z-index:30;
    background:linear-gradient(180deg,#15181d 0%, rgba(16,18,22,.97) 100%);
    border-bottom:1px solid var(--line);
    margin:-16px -16px 16px;
    padding:calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
    display:flex;flex-direction:column;gap:10px;
  }
  .clock{
    font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em;
    line-height:1;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){ .dot{animation:none} }
  .restchip{
    width:100%;padding:9px;border:1px dashed var(--line);border-radius:10px;
    color:var(--mut);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;
  }
  .restchip.on{border-style:solid;border-color:var(--acc);color:var(--acc);background:#241f10}
  .restchip.done{border-style:solid;border-color:var(--good);color:var(--good);background:#132015}

  /* ---------- sugerencia del coach ---------- */
  .coach{
    border-left:3px solid var(--acc);
    background:#1d1f22;
    border-radius:8px;padding:9px 12px;margin-top:8px;
    font-size:13.5px;
  }
  .coach b{color:var(--acc)}
  .coach.good{border-left-color:var(--good)} .coach.good b{color:var(--good)}
  .coach.warn{border-left-color:var(--warn)} .coach.warn b{color:var(--warn)}
  .coach .why{display:block;color:var(--mut);font-size:12px;margin-top:2px}

  /* ---------- filas de series ---------- */
  .sethead, .setrow{display:grid;grid-template-columns:24px 1.15fr 1fr .95fr 32px;gap:7px;align-items:center}
  .sethead{margin-top:12px}
  .sethead span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;text-align:center;font-weight:700}
  .setrow{margin-top:8px}
  .setrow .idx{
    text-align:center;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;
  }
  .setrow input{padding:11px 6px}
  .addset{
    margin-top:10px;width:100%;padding:9px;border:1px dashed var(--line);border-radius:10px;
    color:var(--mut);font-weight:600;font-size:14px;
  }
  .addset:hover{color:var(--acc);border-color:var(--acc)}

  /* ---------- autocompletado de ejercicios ---------- */
  .acwrap{position:relative;flex:1;min-width:0}
  .aclist{
    position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:45;
    background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.5);
  }
  .aclist button{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    width:100%;text-align:left;padding:11px 14px;font-size:14.5px;
    border-bottom:1px solid #232833;
  }
  .aclist button:last-child{border-bottom:none}
  .aclist button:hover, .aclist button:focus-visible{background:#262b35}
  .aclist b{color:var(--acc)}
  .aclist .from{color:var(--mut);font-size:11px;white-space:nowrap;flex:none}

  /* ---------- volumen semanal ---------- */
  .volrow{display:grid;grid-template-columns:82px 1fr 86px;gap:10px;align-items:center;padding:4px 0}
  .volrow .lbl{font-size:13px}
  .volbar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
  .volbar i{display:block;height:100%;border-radius:3px}
  .volrow .val{font-size:12px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---------- gráfica ---------- */
  .chartwrap{margin-top:10px}
  .chartwrap canvas{display:block;width:100%;touch-action:pan-y;border-radius:8px}
  .bignum{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .bignum small{font-size:15px;font-weight:600;color:var(--mut)}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;background:rgba(8,9,12,.72);
    display:flex;align-items:flex-end;justify-content:center;
  }
  @media(min-width:480px){ .overlay{align-items:center} }
  .modal{
    background:var(--panel);border:1px solid var(--line);
    border-radius:18px 18px 0 0;width:100%;max-width:480px;
    max-height:86dvh;overflow-y:auto;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  }
  @media(min-width:480px){ .modal{border-radius:18px;padding-bottom:22px} }
  .modal h2{margin-bottom:6px}
  .modal .muted{margin-bottom:16px}

  /* ---------- opciones tipo tarjeta (objetivo, tipo de ejercicio) ---------- */
  .goal-opt{
    display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;
    background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
  }
  .goal-opt.on{border-color:var(--acc);background:#242113}
  .goal-opt b{font-size:15px}
  .goal-opt span{font-size:12.5px;color:var(--mut)}

  .empty{text-align:center;padding:44px 20px;color:var(--mut)}
  .empty .big{font-size:40px;margin-bottom:10px}

  .pill{
    display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;
    background:var(--panel-2);border:1px solid var(--line);border-radius:99px;
    padding:2px 9px;color:var(--mut);white-space:nowrap;
  }
  .pill.acc{color:var(--acc-ink);background:var(--acc);border-color:var(--acc)}

  details.hist{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
  details.hist summary{
    list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;
  }
  details.hist summary::-webkit-details-marker{display:none}
  details.hist .body{border-top:1px solid var(--line);padding:12px 16px 14px;font-size:14px}
  details.hist .exline{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #232833}
  details.hist .exline:last-child{border-bottom:none}
  details.hist .exline .sets{color:var(--mut);font-variant-numeric:tabular-nums;text-align:right}
</style>
</head>
<body>
<div id="app">
  <header class="app" id="topbar"></header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs"></nav>
<div id="modalhost"></div>

<script>
'use strict';
/* =====================================================================
   Hierro — registro de entrenamiento con progresión basada en evidencia
   Motor: doble progresión (reps → peso) con RIR, incrementos adaptativos
   por ejercicio, tipos normal / asistido / peso corporal, 1RM estimado
   (Epley) y progresión de volumen ante estancamiento.
   Referencias: Pelland 2025 (volumen), Robinson 2024 (cercanía al fallo),
   Kassiano 2026 (sobrecarga progresiva), NMA 2025 (autorregulación).
   ===================================================================== */

const LS_KEY = 'hierro.v1';

const GOALS = {
  hipertrofia: { label:'Hipertrofia', lo:8,  hi:12, rest:90,  desc:'Ganar músculo · series de 8–12 reps' },
  fuerza:      { label:'Fuerza',      lo:4,  hi:6,  rest:180, desc:'Levantar más pesado · series de 4–6 reps' },
  ambas:       { label:'Ambas',       lo:6,  hi:10, rest:120, desc:'Fuerza y músculo · series de 6–10 reps' },
};
const INC_START = 0.025, INC_MIN = 0.0125, INC_MAX = 0.06;
const MAX_SETS_SUGG = 5;
const TYPE_LABEL = { normal:'', asistido:'Asistido', corporal:'Peso corporal', tiempo:'Por tiempo' };
const TIEMPO_RANGE = { lo:20, hi:45 };   /* segundos por defecto para isométricos */
const MUSCLES = [
  ['pecho','Pecho'], ['espalda','Espalda'], ['hombros','Hombros'],
  ['biceps','Bíceps'], ['triceps','Tríceps'], ['pierna','Pierna'],
  ['gluteos','Glúteos'], ['core','Core']
];
const PUSH_G = ['pecho','hombros','triceps'], PULL_G = ['espalda','biceps'];

/* ---------- estado ---------- */
let db = load();
let view = { name:'home' };
let timerInt = null;
let restUntil = null;
let audioCtx = null;

function normalize(d){
  d = (d && typeof d === 'object') ? d : {};
  d.settings = (d.settings && typeof d.settings === 'object') ? d.settings : {};
  if(d.settings.goal === undefined) d.settings.goal = null;
  if(d.settings.rest === undefined) d.settings.rest = 'auto';
  if(d.settings.screenOn === undefined) d.settings.screenOn = 'on';
  if(d.settings.notify === undefined) d.settings.notify = 'off';
  if(d.settings.unit !== 'lb') d.settings.unit = 'kg';
  d.routines = Array.isArray(d.routines) ? d.routines : [];
  d.history  = Array.isArray(d.history)  ? d.history  : [];
  d.progress = (d.progress && typeof d.progress === 'object') ? d.progress : {};
  d.exmeta   = (d.exmeta   && typeof d.exmeta   === 'object') ? d.exmeta   : {};
  d.active   = d.active || null;
  return d;
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return normalize(JSON.parse(raw));
  }catch(e){}
  return normalize(null);
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(db)); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function exKey(name){
  return name.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
}
function fmtDate(iso){
  return new Date(iso).toLocaleDateString('es', { weekday:'short', day:'numeric', month:'short' });
}
function fmtDateShort(iso){
  return new Date(iso).toLocaleDateString('es', { day:'numeric', month:'short' });
}
function fmtDur(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return m >= 60 ? `${Math.floor(m/60)} h ${m%60} min` : `${m} min ${s} s`;
}
/* ---------- unidades: TODO se guarda en kg; la unidad solo cambia la vista ---------- */
const LB_KG = 0.45359237;
function uLabel(){ return db.settings.unit === 'lb' ? 'lb' : 'kg'; }
function fromKg(kg){ return db.settings.unit === 'lb' ? kg / LB_KG : kg; }
function toKg(x){ return db.settings.unit === 'lb' ? x * LB_KG : x; }
function fmtNum(x){ return (Math.round(x*100)/100).toString().replace('.',','); }
/* fmtW SIEMPRE recibe kg y muestra en la unidad activa */
function fmtW(kg){ return fmtNum(fromKg(kg)); }
/* valor para atributos value= de inputs (punto decimal, en unidad activa) */
function inputW(kg){ return String(Math.round(fromKg(kg)*100)/100); }
function fmtClock(sec){ return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; }
/* una serie en texto: "60×10" o, en ejercicios por tiempo, "45s" / "10+45s" (lastre) */
function fmtSet(key, s){
  if(exMeta(key).type === 'tiempo') return (s.w > 0 ? fmtW(s.w) + '+' : '') + s.r + 's';
  return `${fmtW(s.w)}×${s.r}`;
}

/* =====================================================================
   MOTOR DE SUGERENCIAS
   ===================================================================== */
function goalRange(){ return GOALS[db.settings.goal || 'ambas']; }

function prog(key){
  if(!db.progress[key]) db.progress[key] = { inc:INC_START, fail:0, stall:0 };
  return db.progress[key];
}

/* metadatos por ejercicio: tipo, rango de reps propio, salto de kg, notas */
function exMeta(key){
  if(!db.exmeta[key]) db.exmeta[key] = { type:'normal', lo:null, hi:null, step:null, notes:'', rest:null, muscle:null };
  return db.exmeta[key];
}

/* adivinar el grupo muscular por el nombre del ejercicio (es/en) */
const MUSCLE_HINTS = [
  ['core',    ['leg raise','crunch','plank','plancha','abdominal',' abs','ab wheel','oblique','oblicuo','russian','sit up','situp','woodchop']],
  ['pierna',  ['squat','sentadilla','leg press','leg curl','leg extension','lunge','zancada','calf','gemelo','soleo','rdl','romanian','femoral','cuadriceps','hack','bulgarian','prensa','adductor','aductor','abductor','peso muerto rumano','step up','sissy']],
  ['gluteos', ['glute','gluteo','hip thrust','puente','kickback','hip abduction','patada']],
  ['hombros', ['shoulder','lateral','deltoid','delt','face pull','overhead','military','militar','arnold','pajaro','elevacion','upright row','rear fly']],
  ['triceps', ['triceps','tricep','pushdown','skull','frances','rompecraneos','katana','jm press']],
  ['biceps',  ['curl','biceps','bicep','preacher','predicador','martillo','hammer','bayesian']],
  ['espalda', ['row','pulldown','pull up','pullup','pull-up','pull over','pullover','chin','dorsal','remo','jalon','deadlift','shrug','encogimiento','rack pull','good morning','hiperextension','back extension','lat ']],
  ['pecho',   ['bench','chest','banca','pecho','fly','apertura','dip','fondos','push up','pushup','flexion','pec deck','crossover','press de banca','svend']],
];
function guessMuscle(name){
  const n = ' ' + acNorm(name) + ' ';
  for(const [group, words] of MUSCLE_HINTS)
    if(words.some(w => n.includes(w))) return group;
  return null;
}
function effRange(key){
  const m = exMeta(key);
  const g = m.type === 'tiempo' ? TIEMPO_RANGE : goalRange();
  let lo = parseInt(m.lo,10), hi = parseInt(m.hi,10);
  if(isNaN(lo) || lo < 1) lo = g.lo;
  if(isNaN(hi) || hi < 1) hi = g.hi;
  if(hi <= lo) hi = lo + 1;
  return { lo, hi };
}
function effStep(key, w){
  const st = parseFloat(exMeta(key).step);
  return (!isNaN(st) && st > 0) ? st : roundStep(w);
}

/* 1RM estimado — fórmula de Epley: peso × (1 + reps/30) */
function epley(w, r){ return (r > 0 && w > 0) ? w * (1 + r/30) : 0; }
function bestE1RM(sets){ return Math.max(0, ...sets.map(s => epley(s.w, s.r))); }
function avgRIR(sets){
  const rs = sets.map(s => s.rir).filter(x => x !== undefined && x !== null && !isNaN(x));
  return rs.length ? rs.reduce((a,b) => a+b, 0) / rs.length : null;
}

/* último registro histórico de un ejercicio (opcional: solo antes de una fecha) */
function lastEntry(key, beforeISO){
  let best = null;
  for(const s of db.history){
    if(beforeISO && s.date >= beforeISO) continue;
    const e = s.entries.find(x => x.key === key);
    if(e && e.sets.length && (!best || s.date > best.session.date)) best = { entry:e, session:s };
  }
  return best;
}

/* peso "de trabajo": el más usado en la sesión; empate → el mayor */
function workWeight(sets){
  const count = {};
  for(const s of sets) count[s.w] = (count[s.w]||0) + 1;
  let best = null, n = 0;
  for(const w in count){
    const wn = parseFloat(w);
    if(count[w] > n || (count[w] === n && wn > best)){ best = wn; n = count[w]; }
  }
  return best;
}
function roundStep(wKg){
  if(db.settings.unit === 'lb'){
    /* pasos nativos de discos en lb para que las sugerencias salgan "limpias" (95, 100…) */
    const wLb = wKg / LB_KG;
    const stepLb = wLb >= 45 ? 5 : (wLb >= 25 ? 2.5 : 1);
    return stepLb * LB_KG;
  }
  return wKg >= 20 ? 2.5 : (wKg >= 10 ? 1 : 0.5);
}
function roundToStep(w, st){ st = st || roundStep(w); return Math.round(w/st)*st; }

/*  computeSuggestion(key) → null (primera vez) o
    { w, reps, sets, type, msg, why }                                   */
function computeSuggestion(key){
  const last = lastEntry(key);
  if(!last) return null;

  const meta = exMeta(key);
  const { lo, hi } = effRange(key);
  const p = prog(key);
  const sets = last.entry.sets;
  const w = workWeight(sets);
  const atW = sets.filter(s => s.w === w);
  const repsAtW = atW.map(s => s.r).sort((a,b) => a - b);
  /* con 4+ series se ignora la peor: que la última se caiga es fatiga normal, no mal peso */
  const minAll = repsAtW[0];
  const minR = repsAtW.length >= 4 ? repsAtW[1] : repsAtW[0];
  const maxR = repsAtW[repsAtW.length - 1];
  const nSets = sets.length;
  const rir = avgRIR(atW);
  const step = effStep(key, w);

  /* vuelta tras una pausa: la fuerza cae tras ~2 semanas sin un ejercicio → descontar */
  const gapDays = Math.floor((Date.now() - new Date(last.session.date).getTime()) / 864e5);
  if(gapDays >= 14){
    const factor = gapDays < 28 ? 0.925 : (gapDays < 60 ? 0.85 : 0.8);
    const weeks = Math.round(gapDays / 7);
    let back;
    if(meta.type === 'asistido' && w > 0){
      const nw = roundToStep(w * (2 - factor), step);
      back = { w:nw, reps:lo, type:'back',
        msg:`Vuelta tras ~${weeks} semanas: <b>${fmtW(nw)} ${uLabel()} de ayuda × ${lo}</b>`,
        why:`Llevas ${gapDays} días sin este ejercicio. Retoma con algo más de asistencia; en 1–2 sesiones vuelves a tu marca.` };
    } else if(meta.type === 'tiempo'){
      const target = Math.max(lo, Math.round(maxR * factor / 5) * 5);
      back = { w, reps:target, type:'back',
        msg:`Vuelta tras ~${weeks} semanas: apunta a <b>${target} s</b>`,
        why:`Llevas ${gapDays} días sin este ejercicio. Retoma sin exigirte el récord; en 1–2 sesiones recuperas el nivel.` };
    } else if(meta.type === 'corporal' || w === 0){
      const target = Math.max(lo, Math.round(maxR * factor));
      back = { w, reps:target, type:'back',
        msg:`Vuelta tras ~${weeks} semanas: apunta a <b>${target} reps</b>`,
        why:`Llevas ${gapDays} días sin este ejercicio. Retoma sin exigirte el récord; en 1–2 sesiones recuperas el nivel.` };
    } else {
      let nw = roundToStep(w * factor, step);
      if(nw <= 0) nw = w;
      back = { w:nw, reps:lo, type:'back',
        msg:`Vuelta tras ~${weeks} semanas: <b>${fmtW(nw)} ${uLabel()} × ${lo}</b> (~${Math.round((1-factor)*100)} % menos)`,
        why:`Llevas ${gapDays} días sin hacer este ejercicio y la fuerza cae un poco con la pausa. Arranca más liviano — en 1–2 sesiones estás de vuelta en ${fmtW(w)} ${uLabel()}. Esto evita lesiones y agujetas brutales.` };
    }
    back.sets = Math.max(1, nSets - (gapDays >= 28 ? 1 : 0));
    return back;
  }

  let sugg;

  if(meta.type === 'asistido' && w > 0){
    /* asistido: los kg son AYUDA → progresar = bajar kg */
    if(minR >= hi){
      const nw = Math.max(0, roundToStep(w - step, step));
      sugg = (nw <= 0 || w <= 2.5)
        ? { w:0, reps:lo, type:'up',
            msg:`¡Prueba <b>sin asistencia</b>!`,
            why:`Llegaste a ${hi} reps con solo ${fmtW(w)} ${uLabel()} de ayuda. Intenta la versión libre y registra 0 kg.` }
        : { w:nw, reps:lo, type:'up',
            msg:`Baja la ayuda: <b>${fmtW(nw)} ${uLabel()} × ${lo}</b>`,
            why:`En asistidos, menos peso de ayuda = más difícil = progreso. Llegaste a ${hi} reps con ${fmtW(w)} ${uLabel()} de ayuda.` };
    } else if(minR < lo){
      if(p.fail >= 2){
        sugg = { w:w + step, reps:lo, type:'deload',
          msg:`Sube la ayuda a <b>${fmtW(w + step)} ${uLabel()}</b> y reconstruye`,
          why:`Van ${p.fail} sesiones sin sostener el rango (${lo}–${hi}). Con un poco más de asistencia vuelves a progresar.` };
      } else {
        sugg = { w, reps:lo, type:'hold',
          msg:`Misma ayuda (<b>${fmtW(w)} ${uLabel()}</b>): busca al menos ${lo} reps`,
          why:`Consolida el rango (${lo}–${hi}) antes de bajar la asistencia.` };
      }
    } else {
      const target = Math.min(hi, maxR + 1);
      sugg = { w, reps:target, type:'reps',
        msg:`Misma ayuda (<b>${fmtW(w)} ${uLabel()}</b>), apunta a <b>${target} reps</b>`,
        why:`Cuando llegues a ${hi} reps en todas las series, te sugeriré bajar la ayuda.` };
    }
  } else if(meta.type === 'tiempo'){
    /* isométricos: progresar = más segundos (de 5 en 5); lastre opcional */
    if(minR >= hi){
      sugg = { w, reps:maxR + 5, type:'up',
        msg:`Suma tiempo: apunta a <b>${maxR + 5} s</b>`,
        why:`Sostuviste ${hi}+ segundos en todas las series. Progresa de 5 en 5; si se vuelve muy fácil, agrega lastre y registra ese peso.` };
    } else if(minR < lo){
      sugg = { w, reps:lo, type:'hold',
        msg:`Busca al menos <b>${lo} s</b> por serie`,
        why:`Consolida el rango (${lo}–${hi} s) antes de sumar tiempo.` };
    } else {
      const target = Math.min(hi, maxR + 5);
      sugg = { w, reps:target, type:'reps',
        msg:`Apunta a <b>${target} s</b>`,
        why:`Cinco segundos más que la última vez ya es progreso.` };
    }
  } else if(meta.type === 'corporal' || w === 0){
    /* peso corporal (o sin peso externo): progresar = más reps / series / lastre */
    if(minR >= hi){
      sugg = { w, reps:maxR + 1, type:'up',
        msg:`Suma reps: apunta a <b>${maxR + 1}</b> por serie`,
        why:`Sin peso externo progresas sumando reps o series. Si ya es muy fácil, agrega lastre (peso extra, ej. mochila o disco) y regístralo.` };
    } else if(minR < lo){
      sugg = { w, reps:lo, type:'hold',
        msg:`Busca al menos <b>${lo} reps</b> por serie`,
        why:`Consolida el rango (${lo}–${hi}); si no llegas, usa una variante más fácil o la versión asistida.` };
    } else {
      sugg = { w, reps:Math.min(hi, maxR + 1), type:'reps',
        msg:`Apunta a <b>${Math.min(hi, maxR + 1)} reps</b>`,
        why:`Una rep más que la última vez ya es progreso.` };
    }
  } else {
    /* normal: doble progresión reps → peso, modulada por RIR si lo registras */
    const cap = parseFloat(meta.cap);
    const hasCap = !isNaN(cap) && cap > 0;
    const atCap = hasCap && w >= cap - 1e-9;
    if(minR >= hi){
      if(atCap){
        /* la máquina no da más → progresión por reps abiertas (y series, vía estancamiento) */
        sugg = { w, reps:maxR + 1, type:'reps',
          msg:`Tope de la máquina: mantén <b>${fmtW(w)} ${uLabel()}</b> y apunta a <b>${maxR + 1} reps</b>`,
          why:`Marcaste ${fmtW(cap)} ${uLabel()} como máximo disponible en este equipo. Sin más peso, el progreso sigue por reps y series — y cuando lo superes con holgura, considera una variante más difícil o agregar lastre.` };
      } else {
        const boost = (rir !== null && rir >= 3) ? 1.7 : 1;
        let nw = roundToStep(w * (1 + p.inc * boost), step);
        if(nw - w < step/2) nw = w + step;   /* progreso real de al menos un paso (evita errores de redondeo) */
        const capped = hasCap && nw > cap;
        if(capped) nw = cap;                 /* último salto: justo hasta el tope */
        sugg = { w:nw, reps:lo, type:'up',
          msg:`Sube el peso: <b>${fmtW(nw)} ${uLabel()} × ${lo}</b>${capped ? ' (tope de la máquina)' : ''}`,
          why:`Llegaste a ${hi} reps en todas las series con ${fmtW(w)} ${uLabel()}.` +
              (boost > 1 ? ` Además te sobraban reps (RIR ${Math.round(rir)}), así que el salto es un poco mayor.`
                         : ` Toca progresar la carga (~${(p.inc*100).toFixed(1)} %).`) +
              (capped ? ' Con este salto llegas al máximo del equipo.' : '') };
      }
    } else if(minR < lo){
      if(p.fail >= 2){
        let nw = roundToStep(w * 0.95, step);
        if(w - nw < step/2) nw = w - step;   /* retroceso real de al menos un paso */
        if(nw <= 0) nw = w;
        sugg = { w:nw, reps:lo, type:'deload',
          msg:`Baja un poco: <b>${fmtW(nw)} ${uLabel()} × ${lo}</b>`,
          why:`Van ${p.fail} sesiones sin sostener el rango con ${fmtW(w)} ${uLabel()}. Retroceder ~5 % y volver a construir es lo que mejor funciona.` };
      } else {
        sugg = { w, reps:lo, type:'hold',
          msg:`Consolida <b>${fmtW(w)} ${uLabel()}</b>: busca al menos ${lo} reps por serie`,
          why:`La última vez alguna serie quedó bajo el rango (${lo}–${hi}). Repite el peso dejando 1–3 reps en reserva antes de subir.` };
      }
    } else if(rir !== null && rir >= 4 && !atCap){
      let nw = roundToStep(w * (1 + p.inc), step);
      if(nw - w < step/2) nw = w + step;   /* progreso real de al menos un paso (evita errores de redondeo) */
      if(hasCap && nw > cap) nw = cap;
      sugg = { w:nw, reps:lo, type:'up',
        msg:`Sube ya el peso: <b>${fmtW(nw)} ${uLabel()} × ${lo}</b>`,
        why:`Registraste RIR ${Math.round(rir)} (te sobraban ~${Math.round(rir)} reps): ese peso te queda liviano, no hace falta esperar al tope del rango.` };
    } else {
      const target = Math.min(hi, maxR + 1);
      sugg = { w, reps:target, type:'reps',
        msg:`Mismo peso (<b>${fmtW(w)} ${uLabel()}</b>), apunta a <b>${target} reps</b>`,
        why:`Doble progresión: primero llena el rango de reps (${lo}–${hi}), después sube el peso.` };
    }
  }

  sugg.sets = nSets;
  if(p.stall >= 3 && nSets < MAX_SETS_SUGG && sugg.type !== 'up' && sugg.type !== 'deload'){
    sugg.sets = nSets + 1;
    sugg.msg += ` · y suma una serie extra (${nSets + 1} en total)`;
    sugg.why = `Varias sesiones sin avanzar: más volumen semanal también genera progreso (con retornos decrecientes). ` + sugg.why;
  }
  /* consolidación de series: 5+ series del mismo ejercicio rinden poco por sesión
     (Pelland 2025 per-session: retornos decrecientes fuertes tras 3-4 series) */
  if(nSets >= 5 && meta.type === 'normal'){
    const target = Math.max(3, nSets - 2);
    const flat = (maxR - minAll) <= 1;   /* reps casi idénticas en todas → mucha reserva */
    let nwC = 0;
    if(sugg.type === 'reps' && flat && minR >= lo){
      nwC = roundToStep(w * (1 + p.inc), step);
      if(nwC - w < step/2) nwC = w + step;
      const capC = parseFloat(meta.cap);
      if(!isNaN(capC) && capC > 0 && nwC > capC) nwC = capC;   /* respeta el tope de la máquina */
    }
    if(nwC > w + 1e-9){
      const reps = Math.min(hi, Math.max(lo, maxR));
      sugg = { w: nwC, reps, sets: target, type:'up',
        msg:`Concentra el trabajo: <b>${fmtW(nwC)} ${uLabel()} × ${reps}</b> en <b>${target} series</b> (antes ${nSets})`,
        why:`Hiciste ${nSets} series casi idénticas (${minAll}–${maxR} reps): te sobra reserva, y a partir de la 4ª serie del mismo ejercicio el beneficio por sesión cae en picada. Con ${target} series intensas (RIR 1–3) y algo más de peso logras lo mismo en menos tiempo.` };
    } else {
      sugg.sets = target;
      sugg.msg += ` · en <b>${target} series</b> (antes ${nSets})`;
      sugg.why = `${nSets} series del mismo ejercicio rinden poco a partir de la 4ª (retornos decrecientes por sesión): con ${target} series intensas logras prácticamente lo mismo y llegas con menos fatiga a las últimas. ` + sugg.why;
    }
  }
  if(p.stall >= 6 && sugg.type !== 'up'){
    sugg.why = `🔁 Lleva ${p.stall} sesiones estancado: considera rotarlo por una variante del mismo músculo durante 4–6 semanas — un estímulo nuevo suele reactivar el progreso. ` + sugg.why;
  }
  return sugg;
}

/* actualizar el estado adaptativo tras guardar una sesión */
function updateProgress(key, newSets, dateISO){
  const p = prog(key);
  const prev = lastEntry(key, dateISO);
  if(!prev || !newSets.length) return;

  const meta = exMeta(key);
  const { lo, hi } = effRange(key);
  const dir = meta.type === 'asistido' ? -1 : 1;   /* asistido: menos kg = progreso */
  const wNow = workWeight(newSets);
  const atW = newSets.filter(s => s.w === wNow);
  const repsNow = atW.map(s => s.r).sort((a,b) => a - b);
  const minR = repsNow.length >= 4 ? repsNow[1] : repsNow[0];   /* misma tolerancia que el coach */
  const maxR = repsNow[repsNow.length - 1];
  const wPrev = workWeight(prev.entry.sets);
  const prevAtW = prev.entry.sets.filter(s => s.w === wPrev);
  const maxRPrev = Math.max(...prevAtW.map(s => s.r));

  if(wNow * dir > wPrev * dir){
    if(minR >= lo){                       /* progresó la carga y aguantó el rango */
      p.fail = 0; p.stall = 0;
      if(minR >= hi) p.inc = Math.min(INC_MAX, p.inc * 1.15);
    } else {                              /* progresó la carga y no llegó al rango */
      p.fail++; p.stall = 0;
      p.inc = Math.max(INC_MIN, p.inc * 0.7);
    }
  } else if(wNow === wPrev){
    p.fail = (minR < lo) ? p.fail + 1 : 0;
    /* sin mejora de reps = estancamiento (también por encima del rango, ej. tope de máquina) */
    p.stall = (maxR <= maxRPrev) ? p.stall + 1 : 0;
  } else {                                /* retrocedió la carga (deload propio) */
    p.fail = 0; p.stall = 0;
    p.inc = Math.max(INC_MIN, p.inc * 0.85);
  }
  save();
}

/* ---------- fatiga sistémica: si retrocede casi todo a la vez, falta descanso ---------- */
function systemicFatigue(){
  const cut = new Date(Date.now() - 10*864e5).toISOString();
  if(db.settings.fatigueDismissed && db.settings.fatigueDismissed > cut) return null;
  const perKey = new Map();
  for(const h of db.history) for(const e of h.entries){
    if(!e.sets.length) continue;
    if(!perKey.has(e.key)) perKey.set(e.key, []);
    perKey.get(e.key).push({ date:h.date, sets:e.sets });
  }
  let evaluated = 0, regressed = 0;
  for(const [key, arr] of perKey){
    arr.sort((a,b) => a.date < b.date ? -1 : 1);
    const lastE = arr[arr.length-1], prev = arr[arr.length-2];
    if(!prev || lastE.date < cut) continue;                        /* no entrenado en la ventana */
    if(new Date(lastE.date) - new Date(prev.date) > 45*864e5) continue;  /* comparación sin sentido */
    const repsMode = ['corporal','tiempo'].includes(exMeta(key).type);
    const mNow = repsMode ? Math.max(...lastE.sets.map(s=>s.r)) : bestE1RM(lastE.sets);
    const mPrev = repsMode ? Math.max(...prev.sets.map(s=>s.r)) : bestE1RM(prev.sets);
    if(mPrev <= 0) continue;
    evaluated++;
    if(mNow < mPrev * 0.98) regressed++;
  }
  return (evaluated >= 4 && regressed / evaluated >= 0.5) ? { regressed, evaluated } : null;
}
function dismissFatigue(){
  db.settings.fatigueDismissed = new Date().toISOString();
  save(); render();
}
function daysSinceBackup(){
  return db.settings.lastBackup
    ? Math.floor((Date.now() - new Date(db.settings.lastBackup).getTime()) / 864e5)
    : null;
}

/* hábito de entrenar al fallo: mayoría de RIR 0 en varias sesiones recientes */
function failureHabit(){
  if(db.settings.rirDismissed &&
     (Date.now() - new Date(db.settings.rirDismissed).getTime()) < 14*864e5) return null;
  const recent = db.history.slice(-5);
  let withData = 0, failSessions = 0;
  for(const h of recent){
    const rirs = h.entries.flatMap(e => e.sets)
      .map(s => s.rir).filter(x => x !== undefined && x !== null);
    if(rirs.length < 3) continue;
    withData++;
    if(rirs.filter(x => x === 0).length / rirs.length >= 0.6) failSessions++;
  }
  return (withData >= 2 && failSessions >= 2) ? { failSessions } : null;
}
function dismissRIR(){
  db.settings.rirDismissed = new Date().toISOString();
  save(); render();
}

/* ---------- HOME ---------- */
function viewHome(){
  let cards = db.routines.map(r => {
    const lastS = [...db.history].reverse().find(h => h.routineId === r.id || h.routineName === r.name);
    return `
    <div class="card clickable" role="button" tabindex="0" onclick="go({name:'routine', id:'${r.id}'})"
         onkeydown="if(event.key==='Enter')go({name:'routine', id:'${r.id}'})">
      <div class="row">
        <div class="grow">
          <h2>${esc(r.name)}</h2>
          <div class="muted">${r.exercises.length} ejercicio${r.exercises.length===1?'':'s'}
            ${lastS ? ` · última vez: ${fmtDate(lastS.date)}` : ''}</div>
        </div>
        <span style="color:var(--mut);font-size:20px">›</span>
      </div>
    </div>`;
  }).join('');

  if(!db.routines.length){
    cards = `<div class="empty">
      <div class="big">🏋️</div>
      <p><b>Todavía no tienes rutinas.</b></p>
      <p class="muted">Crea la primera — por ejemplo “Torso”, “Pierna” o “Full body”.</p>
    </div>`;
  }
  const resume = db.active ? `
    <button class="btn btn-acc" onclick="go({name:'session'})">
      ⏱️ Continuar sesión en curso — ${esc(db.active.routineName)}
    </button>` : '';

  const fat = systemicFatigue();
  const fatBanner = fat ? `
    <div class="coach warn" style="margin-top:0">
      🪫 Señal de fatiga acumulada: retrocediste en <b>${fat.regressed} de ${fat.evaluated}</b> ejercicios recientes.
      <span class="why">Cuando cae casi todo a la vez, el problema no es un ejercicio: es falta de recuperación.
      Lo que mejor funciona: una semana de descarga (mismos ejercicios, la mitad de las series y ~10 % menos peso)
      o 2–3 días extra de descanso y sueño. Después se progresa mejor que forzando.</span>
      <button class="btn btn-ghost" style="margin-top:8px;padding:7px;font-size:13px" onclick="dismissFatigue()">Entendido — ocultar 10 días</button>
    </div>` : '';

  const fh = failureHabit();
  const rirBanner = fh ? `
    <div class="coach warn" style="margin-top:0">
      🛑 Vienes llegando al fallo (RIR 0) en ${fh.failSessions} de tus últimas sesiones.
      <span class="why">Ir al fallo da casi el mismo músculo que parar a 1–3 reps en reserva, pero tu cuerpo
      tarda 24–48 h más en recuperarse — incluso con el mismo volumen total. Deja 1–2 reps en reserva
      en la mayoría de las series; si acaso, guarda el fallo para la última serie de máquinas o aislamientos.</span>
      <button class="btn btn-ghost" style="margin-top:8px;padding:7px;font-size:13px" onclick="dismissRIR()">Entendido — ocultar 14 días</button>
    </div>` : '';

  const dsb = daysSinceBackup();
  const backupBanner = (db.history.length >= 5 && (dsb === null || dsb >= 30)) ? `
    <div class="card" style="border-color:#4a4630">
      <div class="row">
        <div class="grow">
          <b style="font-size:14.5px">💾 ${dsb === null ? 'Aún no tienes respaldo de tus datos' : `Hace ${dsb} días del último respaldo`}</b>
          <div class="tiny">Tus datos viven solo en este dispositivo. Un respaldo (.json) te protege.</div>
        </div>
        <button class="btn" style="width:auto;flex:none;padding:9px 12px;font-size:13px" onclick="exportBackup()">Descargar</button>
      </div>
    </div>` : '';

  return `<div class="stack">
    ${resume}
    ${fatBanner}
    ${rirBanner}
    ${backupBanner}
    ${cards}
    <button class="btn" onclick="promptNewRoutine()">＋ Nueva rutina</button>
  </div>`;
}

  const items = r.exercises.map(ex => {

    const notes = exMeta(ex.key).notes;
    return `
    <div class="card clickable" role="button" tabindex="0" onclick="openExercise('${r.id}','${ex.id}')"
         onkeydown="if(event.key==='Enter')openExercise('${r.id}','${ex.id}')">

        <div class="grow">
          <div class="row" style="gap:8px"><b>${esc(ex.name)}</b>${typePill(ex.key)}</div>
          <div class="tiny">${ last
            ? `Última vez: ${last.entry.sets.map(s => fmtSet(ex.key, s)).join(' · ')}`
            : 'Sin registros todavía — toca para configurar' }</div>
          ${notes ? `<div class="tiny">📝 ${esc(notes)}</div>` : ''}
        </div>
        <span style="color:var(--mut);font-size:18px">›</span>
        <button class="iconbtn" aria-label="Eliminar ejercicio"
          onclick="event.stopPropagation(); removeExercise('${r.id}','${ex.id}')">✕</button>
      </div>
      ${ sugg ? `<div class="coach ${sugg.type==='up'?'good':((sugg.type==='deload'||sugg.type==='back')?'warn':'')}">
          ${sugg.msg}<span class="why">${sugg.why}</span></div>` : '' }
    </div>`;
  }).join('');

  return `<div class="stack">
    <button class="btn-ghost row" style="color:var(--mut);font-weight:600;width:auto" onclick="go({name:'home'})">‹ Rutinas</button>
    <div class="row">
      <h2 class="grow">${esc(r.name)}</h2>
      ${r.exercises.length > 1 ? `<button class="iconbtn" aria-label="Reordenar ejercicios" onclick="toggleSort()">↕️</button>` : ''}
      <button class="iconbtn" aria-label="Duplicar rutina" onclick="duplicateRoutine('${r.id}')">⧉</button>
      <button class="iconbtn" aria-label="Eliminar rutina" onclick="deleteRoutine('${r.id}')">🗑️</button>
    </div>
    ${items || `<div class="empty"><p class="muted">Agrega los ejercicios de esta rutina.</p></div>`}
    <form class="row" onsubmit="addExercise(event,'${r.id}')" autocomplete="off">
      <div class="acwrap">
        <input type="text" id="newex" placeholder="Nombre del ejercicio (ej. Press banca)" autocomplete="off"
          oninput="acUpdate('${r.id}')" onfocus="acUpdate('${r.id}')" onblur="acHide()">
        <div class="aclist" id="aclist" style="display:none" role="listbox"></div>
      </div>
      <button class="btn" style="width:auto;flex:none" type="submit">Agregar</button>
    </form>
    ${ r.exercises.length ? `
      <button class="btn btn-acc" style="font-size:17px;padding:16px" onclick="startSession('${r.id}')">▶ &nbsp;Empezar sesión</button>
      <p class="tiny" style="text-align:center">Rango objetivo según tu meta: ${goal.lo}–${goal.hi} reps por serie, dejando 1–3 en reserva.
        Toca un ejercicio para ver su progreso y ajustes.</p>` : '' }
  </div>`;
}

/* ---------- FICHA DE EJERCICIO (progreso + ajustes) ---------- */
function openExercise(rid, exid){
  const r = db.routines.find(x => x.id === rid);
  const ex = r && r.exercises.find(e => e.id === exid);
  if(!ex) return;
  go({ name:'exercise', key:ex.key, exname:ex.name, rid });
}

function exerciseHistory(key){
  const out = [];
  for(const h of db.history){
    const e = h.entries.find(x => x.key === key);
    if(e && e.sets.length) out.push({ date:h.date, sets:e.sets });
  }
  out.sort((a,b) => a.date < b.date ? -1 : 1);
  return out;
}

function viewExercise(){
  const key = view.key, meta = exMeta(key);
  const g = goalRange();
  const p = prog(key);
  const hist = exerciseHistory(key);
  const corporal = meta.type === 'corporal';
  const porTiempo = meta.type === 'tiempo';
  const repsMode = corporal || porTiempo;   /* la métrica es reps/segundos, no e1RM */
  const pts = hist.map(h => ({
    date: h.date,
    v: repsMode ? Math.max(...h.sets.map(s => s.r)) : Math.round(fromKg(bestE1RM(h.sets))*10)/10
  })).filter(p => p.v > 0);
  window.__chartPts = pts;
  window.__chartUnit = porTiempo ? 's' : (corporal ? 'reps' : uLabel());
  const best = pts.length ? Math.max(...pts.map(p => p.v)) : 0;

  const recent = [...hist].reverse().slice(0, 6).map(h => `
    <div class="exline" style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #232833">
      <span class="tiny">${fmtDate(h.date)}</span>
      <span class="tiny num" style="text-align:right">${h.sets.map(s => fmtSet(key, s) + (s.rir != null ? `@${s.rir}` : '')).join(' · ')}</span>
    </div>`).join('');

  return `<div class="stack" style="padding-top:calc(16px + env(safe-area-inset-top, 0px))">
    <button class="btn-ghost row" style="color:var(--mut);font-weight:600;width:auto"
      onclick="go({name:'routine', id:'${view.rid}'})">‹ Volver</button>
    <div class="row" style="gap:8px"><h2 class="grow">${esc(view.exname)}</h2>${typePill(key)}</div>

    <div class="card">
      <p class="eyebrow">Progreso</p>
      ${ pts.length ? `
        <div class="row" style="margin-top:8px;align-items:baseline">
          <div class="bignum grow">${fmtNum(best)} <small>${porTiempo ? 'segundos (tu récord)' : (corporal ? 'reps (tu récord)' : uLabel())}</small></div>
        </div>
        <p class="tiny">${porTiempo
          ? 'Tu mejor tiempo sostenido en una serie.'
          : corporal
          ? 'Tus mejores reps en una serie.'
          : `Tu récord de <span class="linkish" role="button" tabindex="0" onclick="e1rmInfo()">1RM estimado ⓘ</span> — el peso máximo que podrías levantar una sola vez, calculado desde tus series.`}</p>
        ${ pts.length >= 2 ? `
          <div class="chartwrap"><canvas id="exchart" height="190"></canvas></div>
          <p class="tiny" id="charttip" style="text-align:center;margin-top:6px">Toca la gráfica para ver cada sesión</p>`
          : `<p class="tiny" style="margin-top:8px">Registra al menos 2 sesiones para ver la gráfica.</p>` }`
        : `<p class="muted" style="margin-top:8px">Todavía no hay registros de este ejercicio. Cuando entrenes, aquí verás tu progreso.</p>` }
    </div>

    ${ (p.stall >= 6 && meta.muscle && meta.muscle !== 'none') ? (() => {
        const vars = [...allExerciseNames()]
          .filter(([k, info]) => k !== key && exMeta(k).muscle === meta.muscle)
          .slice(0, 3).map(([k, info]) => esc(info.name));
        return `<div class="card">
          <p class="eyebrow" style="margin-bottom:6px">🔁 Rotación sugerida</p>
          <p class="muted" style="font-size:13.5px;line-height:1.6">
            Este ejercicio lleva <b style="color:var(--ink)">${p.stall} sesiones sin avanzar</b> a pesar del volumen extra.
            Cambiarlo por una variante del mismo músculo durante 4–6 semanas suele reactivar el progreso
            (estímulo nuevo, mismas ganancias). Después puedes volver.
            ${vars.length ? `Variantes que ya conoces: <b style="color:var(--ink)">${vars.join(', ')}</b>.` : ''}
          </p>
        </div>`;
      })() : '' }

    <div class="card">
      <p class="eyebrow" style="margin-bottom:8px">¿Cómo se progresa en este ejercicio?</p>
      <div class="stack">
        <button class="goal-opt ${meta.type==='normal'?'on':''}" onclick="setExType('${key}','normal')">
          <b>Normal ${meta.type==='normal'?'✓':''}</b>
          <span>Levantas el peso tú. Progresar = subir kg. (La mayoría: press, remo, sentadilla…)</span>
        </button>
        <button class="goal-opt ${meta.type==='asistido'?'on':''}" onclick="setExType('${key}','asistido')">
          <b>Asistido ${meta.type==='asistido'?'✓':''}</b>
          <span>Una máquina o banda te AYUDA (dominadas/fondos asistidos). Los kg que anotas son la ayuda, no la carga: progresar = usar MENOS kg.</span>
        </button>
        <button class="goal-opt ${meta.type==='corporal'?'on':''}" onclick="setExType('${key}','corporal')">
          <b>Peso corporal ${meta.type==='corporal'?'✓':''}</b>
          <span>Sin peso externo (flexiones, dominadas libres). Progresar = más reps o series. Puedes dejar el peso en blanco; si usas lastre, anótalo.</span>
        </button>
        <button class="goal-opt ${meta.type==='tiempo'?'on':''}" onclick="setExType('${key}','tiempo')">
          <b>Por tiempo ${meta.type==='tiempo'?'✓':''}</b>
          <span>Isométricos y sostenidos (plancha, colgado, farmer carry, estiramientos): mides segundos, no reps. Con cronómetro y alarma integrados. Lastre opcional.</span>
        </button>
      </div>
    </div>

    <div class="card">
      <p class="eyebrow" style="margin-bottom:10px">Ajustes finos (opcional)</p>
      <div class="row" style="align-items:flex-end">
        <div class="field grow"><span>${meta.type==='tiempo' ? 'Seg' : 'Reps'} mín.</span>
          <input type="number" inputmode="numeric" min="1" placeholder="${meta.type==='tiempo' ? TIEMPO_RANGE.lo : g.lo}" value="${meta.lo ?? ''}"
            oninput="setExRange('${key}','lo',this.value)"></div>
        <div class="field grow"><span>${meta.type==='tiempo' ? 'Seg' : 'Reps'} máx.</span>
          <input type="number" inputmode="numeric" min="2" placeholder="${meta.type==='tiempo' ? TIEMPO_RANGE.hi : g.hi}" value="${meta.hi ?? ''}"
            oninput="setExRange('${key}','hi',this.value)"></div>
        <div class="field grow"><span>Salto mínimo</span>
          <select onchange="setExStep('${key}',this.value)">

      </div>
      ${ meta.type === 'normal' ? `
      <div class="field" style="margin-top:10px"><span>Peso máximo disponible (${uLabel()})</span>
        <input type="number" inputmode="decimal" step="any" min="0" placeholder="—"
          value="${meta.cap != null ? inputW(meta.cap) : ''}"
          oninput="setExCap('${key}',this.value)">
        <span style="text-transform:none;letter-spacing:0;font-weight:400">
          Si la máquina o tus mancuernas llegan hasta cierto peso, anótalo: al alcanzarlo, el coach
          progresa por reps y series en vez de pedirte kilos imposibles.</span>
      </div>` : '' }
      <div class="field" style="margin-top:10px"><span>Grupo muscular</span>
        <select onchange="setExMuscle('${key}',this.value)">
          <option value="none" ${!meta.muscle || meta.muscle==='none' ? 'selected':''}>Sin grupo</option>
          ${MUSCLES.map(([k,l]) => `<option value="${k}" ${meta.muscle===k?'selected':''}>${l}</option>`).join('')}
        </select>
        <span style="text-transform:none;letter-spacing:0;font-weight:400">Alimenta el resumen semanal de volumen (pestaña Historial).</span>
      </div>

        <select onchange="setExRest('${key}',this.value)">
          <option value="auto" ${!meta.rest?'selected':''}>Igual que el general (Ajustes)</option>
          ${[45,60,90,120,150,180,240].map(s => `
            <option value="${s}" ${String(meta.rest)===String(s)?'selected':''}>${fmtClock(s)} min</option>`).join('')}
        </select>
      </div>
      <p class="tiny" style="margin-top:8px">

        (ej. abdominales 15–25). “Salto mínimo” = el aumento más pequeño posible en tu gimnasio
        (en kg: mancuernas de 2 en 2, barra de 2,5 en 2,5 · en lb: de 5 en 5). El descanso propio es útil
        para básicos pesados (sentadilla → 3:00) o accesorios ligeros (curl → 1:00).
      </p>
    </div>

    <div class="card">
      <p class="eyebrow" style="margin-bottom:8px">Notas</p>

      <p class="tiny" style="margin-top:6px">Las verás durante la sesión, debajo del nombre del ejercicio.</p>
    </div>

    ${ recent ? `<div class="card">
      <p class="eyebrow" style="margin-bottom:6px">Últimas sesiones</p>${recent}
      <p class="tiny" style="margin-top:6px">Formato: kg×reps. El “@2” es tu RIR (reps que te quedaban).</p>
    </div>` : '' }
  </div>`;
}

function setExType(key, t){ exMeta(key).type = t; save(); render(); }
function setExRange(key, which, val){
  const v = parseInt(val,10);
  exMeta(key)[which] = isNaN(v) ? null : v;
  save();
}
function setExStep(key, val){
  exMeta(key).step = (val === 'auto') ? null : parseFloat(val);
  save();
}
/* opciones de salto en la unidad activa; el valor guardado siempre es kg */
function stepOptionsHTML(cur){
  const lb = db.settings.unit === 'lb';
  const opts = lb
    ? [1.25, 2.5, 5, 10].map(v => [Math.round(v*LB_KG*1000)/1000, v + ' lb'])
    : [0.5, 1, 2, 2.5, 5].map(v => [v, String(v).replace('.',',') + ' kg']);
  let html = `<option value="auto" ${cur == null ? 'selected' : ''}>Auto</option>`;
  let matched = cur == null;
  for(const [kg, label] of opts){
    const sel = cur != null && Math.abs(cur - kg) < 0.01;
    if(sel) matched = true;
    html += `<option value="${kg}" ${sel ? 'selected' : ''}>${label}</option>`;
  }
  if(!matched) html += `<option value="${cur}" selected>Actual: ${fmtW(cur)} ${uLabel()}</option>`;
  return html;
}
function setExNotes(key, val){ exMeta(key).notes = val.slice(0,300); save(); }
function setExRest(key, val){
  exMeta(key).rest = (val === 'auto') ? null : parseInt(val,10);
  save();
}
function setExMuscle(key, val){ exMeta(key).muscle = val; save(); }
function setExCap(key, val){
  const v = parseFloat(val);
  exMeta(key).cap = (isNaN(v) || v <= 0) ? null : Math.round(toKg(v)*1000)/1000;
  save();
}

/* ---------- SESIÓN ACTIVA ---------- */
function viewSession(){
  const s = db.active;
  const blocks = s.exercises.map((ex, xi) => {
    const meta = exMeta(ex.key);
    const t = meta.type;
    const { lo, hi } = effRange(ex.key);
    const firstTime = !ex.sugg;
    let firstMsg = '';
    if(firstTime){
      if(t === 'corporal') firstMsg = `Primera vez. Haz las reps que puedas con buena técnica (ideal ${lo}–${hi} por serie). El peso puedes dejarlo en blanco; si usas lastre, anótalo.`;
      else if(t === 'tiempo') firstMsg = `Primera vez. Mide los segundos que sostienes con buena técnica (ideal ${lo}–${hi} s). Toca el ▶ de cada serie para usar el cronómetro con alarma.`;
      else if(t === 'asistido') firstMsg = `Primera vez. Anota la AYUDA de la máquina/banda (en ${uLabel()}). Elige una ayuda con la que logres ${lo}–${hi} reps quedándote 1–3 en reserva.`;
      else firstMsg = `Primera vez con este ejercicio. Elige un peso con el que puedas hacer ${lo}–${hi} reps quedándote 1–3 en reserva (sin llegar al fallo). Desde la próxima, te sugiero la progresión.`;
    }
    return `
    <div class="card" id="exb-${xi}">
      <div class="row" style="gap:8px"><b style="font-size:16px" class="grow">${esc(ex.name)}</b>${typePill(ex.key)}</div>
      ${ meta.notes ? `<div class="tiny">📝 ${esc(meta.notes)}</div>` : '' }
      ${ ex.sugg ? `<div class="coach ${ex.sugg.type==='up'?'good':((ex.sugg.type==='deload'||ex.sugg.type==='back')?'warn':'')}">
          Hoy: ${ex.sugg.msg}<span class="why">${ex.sugg.why}</span></div>`
        : `<div class="coach">${firstMsg}</div>` }
      <button class="linkish tiny" style="margin-top:8px" onclick="showWarmup(${xi})">🔥 Calentamiento sugerido</button>
      <div class="sethead"><span>${t==='tiempo' ? '▶' : '#'}</span><span>${(t==='corporal'||t==='tiempo') ? 'lastre' : (t==='asistido' ? 'ayuda' : uLabel())}</span><span>${t==='tiempo' ? 'seg' : 'reps'}</span><span class="linkish" role="button" tabindex="0" onclick="rirInfo()">rir ⓘ</span><span></span></div>
      <div id="sets-${xi}">
        ${ ex.sets.map((st, si) => setRowHTML(xi, si, st, ex.sugg, t)).join('') }
      </div>
      <button class="addset" onclick="addSet(${xi})">＋ Agregar serie</button>
    </div>`;
  }).join('');
  const addExBtn = `<button class="addset" style="border-style:solid" onclick="promptAddExercise()">＋ Agregar ejercicio a la sesión</button>`;

  const rest = restSecs();
  return `
    <div class="sessionbar">
      <div class="row" style="width:100%">
        <span class="dot" aria-hidden="true"></span>
        <div class="grow">
          <div class="clock num" id="clock">0:00</div>
          <div class="tiny">${esc(s.routineName)} · en curso</div>
        </div>
        <button class="btn btn-danger" style="width:auto;padding:10px 16px" onclick="askFinish()">Terminar</button>
      </div>
      <div class="row">
        ${ rest ? `<button class="restchip" id="restchip" style="width:auto;flex:1" onclick="toggleRest()">▶ Descanso (${fmtClock(rest)})</button>` : '<span class="grow"></span>' }
        <button class="btn" style="width:auto;padding:9px 13px;font-size:13px;flex:none"
          aria-label="Cambiar unidad de peso" onclick="askUnitSwitch()">${uLabel()} ⇄</button>
      </div>
    </div>
    <div class="stack">${blocks}${addExBtn}</div>`;
}

function setRowHTML(xi, si, st, sugg, t){
  const tiempo = t === 'tiempo';
  const pw = sugg ? fmtW(sugg.w) : ((t === 'corporal' || tiempo) ? '0' : uLabel());
  const pr = sugg ? sugg.reps : (tiempo ? 'seg' : 'reps');
  const cls = sugg ? 'class="sugg"' : '';
  const idxCell = tiempo
    ? `<button class="idx linkish" style="background:none;border:none;color:var(--acc);cursor:pointer"
         aria-label="Cronómetro serie ${si+1}" onclick="startSetTimer(${xi},${si})">▶</button>`
    : `<span class="idx">${si+1}</span>`;
  return `
  <div class="setrow" id="set-${xi}-${si}">
    ${idxCell}
    <input type="number" inputmode="decimal" step="any" min="0" ${cls}
      placeholder="${pw}" value="${st.w ?? ''}"
      aria-label="Peso serie ${si+1}"
      oninput="setVal(${xi},${si},'w',this.value)">
    <input type="number" inputmode="numeric" step="1" min="0" ${cls}
      placeholder="${pr}" value="${st.r ?? ''}"
      aria-label="${tiempo ? 'Segundos' : 'Reps'} serie ${si+1}"
      oninput="setVal(${xi},${si},'r',this.value)">
    <input type="number" inputmode="numeric" step="1" min="0" max="9"
      placeholder="1–3" value="${st.rir ?? ''}"
      aria-label="Reps en reserva serie ${si+1}"
      oninput="setVal(${xi},${si},'rir',this.value)">
    <button class="iconbtn" aria-label="Quitar serie" onclick="removeSet(${xi},${si})">✕</button>
  </div>`;
}

/* ---------- HISTORIAL ---------- */
/* series de los últimos 7 días por grupo muscular + desbalance empuje/jalón (14 días) */
function volumeCardHTML(){
  const now = Date.now();
  const cut7 = new Date(now - 7*864e5).toISOString();
  const cut14 = new Date(now - 14*864e5).toISOString();
  const counts = {}; let untagged = 0, push = 0, pull = 0, any = false;
  for(const h of db.history){
    if(h.date < cut14) continue;
    for(const e of h.entries){
      const m = exMeta(e.key).muscle;
      const n = e.sets.length;
      if(h.date >= cut7){
        any = true;
        if(!m || m === 'none') untagged += n;
        else counts[m] = (counts[m]||0) + n;
      }
      if(m && PUSH_G.includes(m)) push += n;
      if(m && PULL_G.includes(m)) pull += n;
    }
  }
  if(!any) return '';
  const rows = MUSCLES.filter(([k]) => counts[k]).map(([k,l]) => {
    const c = counts[k];
    const pct = Math.min(100, c/20*100);
    const color = c > 20 ? 'var(--warn)' : (c >= 10 ? 'var(--good)' : '#5b6170');
    const tag = c > 20 ? 'alto' : (c >= 10 ? '✓ óptimo' : 'bajo');
    return `<div class="volrow">
      <span class="lbl">${l}</span>
      <span class="volbar"><i style="width:${pct}%;background:${color}"></i></span>
      <span class="val num">${c} · ${tag}</span>
    </div>`;
  }).join('');
  let imb = '';
  if(push + pull >= 24 && (push > pull*1.75 || pull > push*1.75)){
    const masEmpuje = push > pull;
    imb = `<div class="coach warn" style="margin-top:10px">
      ⚖️ Desbalance (14 días): <b>${masEmpuje?'empuje':'jalón'} ${masEmpuje?push:pull} series</b> vs ${masEmpuje?'jalón':'empuje'} ${masEmpuje?pull:push}.
      <span class="why">Empuje = pecho/hombros/tríceps · jalón = espalda/bíceps. Mantenerlos cerca de 1:1 protege tus hombros:
      suma ${masEmpuje?'remos y jalones':'presses y aperturas'}.</span></div>`;
  }
  return `<div class="card">
    <p class="eyebrow" style="margin-bottom:8px">Series · últimos 7 días</p>
    ${rows || '<p class="muted">Asigna un grupo muscular a tus ejercicios (tocándolos en su rutina) para ver este resumen.</p>'}
    ${rows ? '<p class="tiny" style="margin-top:8px">La evidencia: 10–20 series semanales por grupo es la zona óptima; más da retornos decrecientes.</p>' : ''}
    ${untagged ? `<p class="tiny">${untagged} series sin grupo asignado (se asigna en la ficha de cada ejercicio).</p>` : ''}
    ${imb}
  </div>`;
}

function viewHistory(){
  if(!db.history.length) return `<div class="empty">
    <div class="big">📅</div>
    <p><b>Sin sesiones todavía.</b></p>
    <p class="muted">Cuando termines tu primera sesión, la verás aquí.</p></div>`;

  const items = [...db.history].reverse().map(h => {
    const nSets = h.entries.reduce((a,e) => a + e.sets.length, 0);
    const vol = h.entries.reduce((a,e) => a + e.sets.reduce((b,s) => b + s.w*s.r, 0), 0);
    return `
    <details class="hist">
      <summary>
        <div class="grow">
          <b>${esc(h.routineName)}</b>
          <div class="tiny">${fmtDate(h.date)}${h.duration ? ` · ${fmtDur(h.duration)}` : ''} · ${nSets} series${vol ? ` · ${fmtNum(Math.round(fromKg(vol)))} ${uLabel()} movidos` : ''}</div>
        </div>
        <span style="color:var(--mut)">▾</span>
      </summary>

/* ---------- editar / borrar sesiones ---------- */
function rebuildProgress(){
  db.history.sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  db.progress = {};
  for(const h of db.history)
    for(const e of h.entries) updateProgress(e.key, e.sets, h.date);
  save();
}
function deleteSession(id){
  const h = db.history.find(x => x.id === id);
  if(!h) return;
  confirmModal(`¿Borrar la sesión de ${esc(h.routineName)}?`,
    `${fmtDate(h.date)} · ${h.entries.reduce((a,e)=>a+e.sets.length,0)} series. Las sugerencias del coach se recalculan sin ella. No se puede deshacer.`,
    'Borrar sesión', () => {
      db.history = db.history.filter(x => x.id !== id);
      rebuildProgress(); render();
    });
}
function editSession(id){
  const h = db.history.find(x => x.id === id);
  if(!h) return;
  /* el modelo de edición vive SIEMPRE en la unidad activa (strings);
     se convierte a kg una sola vez al guardar — así re-renderizar es seguro */
  window.__edit = {
    id: h.id, routineName: h.routineName, date: h.date,
    entries: h.entries.map(e => ({
      key: e.key, name: e.name,
      sets: e.sets.map(st => ({
        w: st.w != null ? inputW(st.w) : '',
        r: st.r != null ? String(st.r) : '',
        rir: (st.rir === undefined || st.rir === null) ? '' : String(st.rir)
      }))
    }))
  };
  renderEditModal();
}
function renderEditModal(){
  const ed = window.__edit;
  if(!ed) return;
  openModal(`
    <h2>Editar sesión</h2>
    <p class="muted">${esc(ed.routineName)} · ${fmtDate(ed.date)}. Corrige valores, agrega la serie
      que olvidaste o quita la que sobra. Al guardar, las sugerencias del coach se recalculan
      con los datos corregidos.</p>
    <div class="stack">
    ${ed.entries.map((e, ei) => `
      <div>
        <b style="font-size:14.5px">${esc(e.name)}</b>
        <div class="sethead"><span>#</span><span>${uLabel()}</span><span>reps</span><span>rir</span><span></span></div>
        ${e.sets.map((st, si) => `
          <div class="setrow">
            <span class="idx">${si+1}</span>
            <input type="number" inputmode="decimal" step="any" min="0" value="${st.w}"
              aria-label="Peso en ${uLabel()}" oninput="editVal(${ei},${si},'w',this.value)">
            <input type="number" inputmode="numeric" step="1" min="0" value="${st.r}"
              aria-label="Reps" oninput="editVal(${ei},${si},'r',this.value)">
            <input type="number" inputmode="numeric" step="1" min="0" max="9" value="${st.rir}" placeholder="–"
              aria-label="RIR" oninput="editVal(${ei},${si},'rir',this.value)">
            <button class="iconbtn" aria-label="Quitar serie" onclick="editRemoveSet(${ei},${si})">✕</button>
          </div>`).join('')}
        <button class="addset" onclick="editAddSet(${ei})">＋ Agregar serie</button>
      </div>`).join('')}
    </div>
    <button class="btn btn-acc" style="margin-top:16px" onclick="saveEditedSession()">Guardar cambios</button>
    <button class="btn btn-ghost" style="margin-top:8px" onclick="closeModal()">Cancelar</button>`);
}
function editVal(ei, si, field, val){ window.__edit.entries[ei].sets[si][field] = val; }
function editAddSet(ei){
  const e = window.__edit.entries[ei];
  /* prellenar con la última serie: la olvidada casi siempre es "una más igual" */
  const prev = e.sets[e.sets.length - 1];
  e.sets.push(prev ? { w: prev.w, r: prev.r, rir: '' } : { w:'', r:'', rir:'' });
  renderEditModal();
}
function editRemoveSet(ei, si){
  window.__edit.entries[ei].sets.splice(si, 1);
  renderEditModal();
}
function saveEditedSession(){
  const ed = window.__edit;
  if(!ed) return;
  const entries = [];
  for(const e of ed.entries){
    const sets = e.sets.map(st => {
      let w = parseFloat(st.w);
      if(!isNaN(w)) w = Math.round(toKg(w)*1000)/1000;   /* editado en la unidad activa → kg */
      const r = parseInt(st.r,10), rir = parseInt(st.rir,10);
      const out = { w, r };
      if(!isNaN(rir)) out.rir = Math.min(9, Math.max(0, rir));
      return out;
    }).filter(st => !isNaN(st.w) && st.w >= 0 && !isNaN(st.r) && st.r > 0);
    if(sets.length) entries.push({ key: e.key, name: e.name, sets });
  }
  window.__edit = null;
  closeModal();
  if(!entries.length){ deleteSession(ed.id); return; }   /* quedó vacía → ofrecer borrarla */
  const h = db.history.find(x => x.id === ed.id);
  h.entries = entries;
  rebuildProgress(); render();
}

function addExercise(ev, rid){
  ev.preventDefault();
  const inp = document.getElementById('newex');
  const name = inp.value.trim();
  if(!name) return;
  const r = db.routines.find(x => x.id === rid);

/* ---------- autocompletado de ejercicios ---------- */
function allExerciseNames(){
  const seen = new Map();   /* key → { name, src } */
  for(const r of db.routines) for(const ex of r.exercises)
    if(!seen.has(ex.key)) seen.set(ex.key, { name: ex.name, src: r.name });
  for(const h of db.history) for(const e of h.entries)
    if(!seen.has(e.key)) seen.set(e.key, { name: e.name, src: 'historial' });
  return seen;
}
function acNorm(s){
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}
/* resalta la coincidencia sobre el nombre original (ignora acentos/mayúsculas) */
function acHighlight(name, q){
  const map = []; let norm = '';
  for(let i = 0; i < name.length; i++){
    const c = acNorm(name[i]);
    for(const ch of c){ norm += ch; map.push(i); }
  }
  const idx = norm.indexOf(q);
  if(idx < 0 || !q) return esc(name);
  const a = map[idx], b = map[idx + q.length - 1] + 1;
  return esc(name.slice(0,a)) + '<b>' + esc(name.slice(a,b)) + '</b>' + esc(name.slice(b));
}
function acUpdate(rid){
  const inp = document.getElementById('newex');
  const list = document.getElementById('aclist');
  if(!inp || !list) return;
  const q = acNorm(inp.value.trim());
  if(!q){ list.style.display = 'none'; return; }
  const r = db.routines.find(x => x.id === rid);
  const inRoutine = new Set(r ? r.exercises.map(e => e.key) : []);
  const cands = [];
  for(const [key, info] of allExerciseNames()){
    if(inRoutine.has(key)) continue;
    const idx = acNorm(info.name).indexOf(q);
    if(idx < 0) continue;
    /* ranking: empieza igual < empieza una palabra < contiene */
    const norm = acNorm(info.name);
    const rank = idx === 0 ? 0 : (norm[idx-1] === ' ' || norm[idx-1] === '(' ? 1 : 2);
    cands.push({ key, name: info.name, src: info.src, rank });
  }
  cands.sort((a,b) => a.rank - b.rank || a.name.localeCompare(b.name));
  const top = cands.slice(0, 6);
  window.__ac = top;
  if(!top.length){ list.style.display = 'none'; return; }
  list.innerHTML = top.map((c, i) => `
    <button type="button" role="option" onmousedown="event.preventDefault(); acPick('${rid}',${i})">
      <span>${acHighlight(c.name, q)}</span>
      <span class="from">${esc(c.src)}</span>
    </button>`).join('');
  list.style.display = '';
}
function acPick(rid, i){
  const c = (window.__ac || [])[i];
  if(!c) return;
  const r = db.routines.find(x => x.id === rid);
  if(!r || r.exercises.some(e => e.key === c.key)) return;
  r.exercises.push({ id:uid(), name: c.name, key: c.key });
  save(); render();
  setTimeout(() => { const inp = document.getElementById('newex'); if(inp) inp.focus(); }, 30);
}
function acHide(){
  setTimeout(() => { const l = document.getElementById('aclist'); if(l) l.style.display = 'none'; }, 150);
}
function removeExercise(rid, exid){
  const r = db.routines.find(x => x.id === rid);
  r.exercises = r.exercises.filter(e => e.id !== exid);
  save(); render();
}
function toggleSort(){ view.sort = !view.sort; render(); }
function moveEx(rid, i, dir){
  const r = db.routines.find(x => x.id === rid);
  const j = i + dir;
  if(j < 0 || j >= r.exercises.length) return;
  [r.exercises[i], r.exercises[j]] = [r.exercises[j], r.exercises[i]];
  save(); render();
}
function duplicateRoutine(rid){
  const r = db.routines.find(x => x.id === rid);
  const copy = { id:uid(), name: r.name + ' (copia)',
    exercises: r.exercises.map(e => ({ id:uid(), name:e.name, key:e.key })) };

function startSession(rid){
  const r = db.routines.find(x => x.id === rid);
  db.active = {
    id: uid(),
    routineId: r.id, routineName: r.name,
    start: Date.now(),
    exercises: r.exercises.map(ex => {
      const sugg = computeSuggestion(ex.key);
      const n = sugg ? sugg.sets : 1;
      return { key:ex.key, name:ex.name, sugg,
               sets: Array.from({length:Math.max(1,n)}, () => ({w:'', r:'', rir:''})) };
    })
  };
  restUntil = null;
  save(); go({name:'session'});
}

function setVal(xi, si, field, val){
  const st = db.active.exercises[xi].sets[si];
  const wasEmpty = (st[field] === '' || st[field] === undefined);
  st[field] = val;
  db.active.lastLog = Date.now();
  save();
  /* al anotar las reps de una serie, arranca solo el descanso (con el tiempo propio del ejercicio) */
  if(field === 'r' && val !== '' && wasEmpty) startRestAuto(db.active.exercises[xi].key);
}
function addSet(xi){
  const ex = db.active.exercises[xi];
  ex.sets.push({w:'', r:'', rir:''});
  save();
  const cont = document.getElementById('sets-'+xi);
  cont.insertAdjacentHTML('beforeend', setRowHTML(xi, ex.sets.length-1, {w:'',r:'',rir:''}, ex.sugg, exMeta(ex.key).type));

function removeSet(xi, si){

  document.getElementById('sets-'+xi).innerHTML =
    ex.sets.map((st,i) => setRowHTML(xi, i, st, ex.sugg, exMeta(ex.key).type)).join('');

function sessionAddExercise(ev){
  ev.preventDefault();
  if(!db.active) return;
  const inp = document.getElementById('sessnewex');
  const name = inp.value.trim();
  if(!name) return;
  const key = exKey(name);
  if(db.active.exercises.some(e => e.key === key)){
    infoModal('Ya está en la sesión', `“${esc(name)}” ya es parte de la sesión de hoy.`);
    return;
  }
  const known = allExerciseNames().get(key);
  const finalName = known ? known.name : name;
  if(exMeta(key).type === 'normal' && /assisted|asistid/i.test(finalName)) exMeta(key).type = 'asistido';
  if(!exMeta(key).muscle){ const g = guessMuscle(finalName); if(g) exMeta(key).muscle = g; }
  const sugg = computeSuggestion(key);
  const n = sugg ? sugg.sets : 1;
  db.active.exercises.push({ key, name: finalName, sugg,
    sets: Array.from({length: Math.max(1, n)}, () => ({w:'', r:'', rir:''})) });
  if(window.__keepRoutine){
    const r = db.routines.find(x => x.id === db.active.routineId);
    if(r && !r.exercises.some(e => e.key === key)) r.exercises.push({ id: uid(), name: finalName, key });
  }
  save(); closeModal(); render();
  setTimeout(() => {
    const el = document.getElementById('exb-' + (db.active.exercises.length - 1));
    if(el && el.scrollIntoView) el.scrollIntoView({ behavior:'smooth' });
  }, 80);
}

/* ---------- cronómetro por serie (ejercicios por tiempo) ---------- */
let setTimerInt = null;
let setTimerState = null;
function startSetTimer(xi, si){
  const ex = db.active && db.active.exercises[xi];
  if(!ex) return;
  const typed = parseInt(ex.sets[si].r, 10);
  const target = (!isNaN(typed) && typed > 0) ? typed
    : (ex.sugg && ex.sugg.reps ? ex.sugg.reps : effRange(ex.key).lo);
  clearInterval(setTimerInt);
  setTimerState = { xi, si, target, phase:'prep', count:3 };
  openModal(`
    <h2 style="text-align:center;font-size:17px">${esc(ex.name)} · serie ${si+1}</h2>
    <div class="clock num" id="settimer" style="font-size:76px;text-align:center;margin:10px 0 2px">3</div>
    <p class="tiny" id="settimerhint" style="text-align:center;margin-bottom:16px">Prepárate… objetivo: ${target} s</p>
    <button class="btn" onclick="stopSetTimer(true)">✓ Terminar antes</button>
    <button class="btn btn-ghost" style="margin-top:8px" onclick="stopSetTimer(false)">Cancelar</button>`);
  setTimerInt = setInterval(() => {
    const el = document.getElementById('settimer');
    const st = setTimerState;
    if(!el || !st){ clearInterval(setTimerInt); return; }
    if(st.phase === 'prep'){
      st.count--;
      if(st.count <= 0){
        st.phase = 'run'; st.count = st.target;
        beep();
        const h = document.getElementById('settimerhint');
        if(h) h.textContent = '¡Sostén!';
      }
      el.textContent = st.count;
    } else {
      st.count--;
      el.textContent = Math.max(0, st.count);
      if(st.count <= 0) finishSetTimer(st.target);
    }
  }, 1000);
}
function finishSetTimer(seconds){
  const st = setTimerState;
  clearInterval(setTimerInt);
  setTimerState = null;
  if(!st) return;
  beep();
  setVal(st.xi, st.si, 'r', String(seconds));
  closeModal(); render();
}
function stopSetTimer(early){
  const st = setTimerState;
  clearInterval(setTimerInt);
  setTimerState = null;
  if(early && st && st.phase === 'run'){
    const elapsed = st.target - Math.max(0, st.count);
    if(elapsed > 0){ setVal(st.xi, st.si, 'r', String(elapsed)); closeModal(); render(); return; }
  }
  closeModal();
}

function collectEntries(s){
  const entries = [];
  for(const ex of s.exercises){
    const corp = ['corporal','tiempo'].includes(exMeta(ex.key).type);
    const sets = ex.sets.map(st => {
      let w = parseFloat(st.w);
      if(isNaN(w) && corp && st.r !== '' && st.r !== undefined) w = 0;  /* corporal/tiempo: peso en blanco = 0 */
      if(!isNaN(w)) w = Math.round(toKg(w)*1000)/1000;                  /* lo escrito está en la unidad activa → guardar en kg */
      const r = parseInt(st.r,10);
      const out = { w, r };
      const rir = parseInt(st.rir,10);
      if(!isNaN(rir)) out.rir = Math.min(9, Math.max(0, rir));
      return out;
    }).filter(st => !isNaN(st.w) && st.w >= 0 && !isNaN(st.r) && st.r > 0);
    if(sets.length) entries.push({ key:ex.key, name:ex.name, sets });
  }
  return entries;
}

function askFinish(){
  const s = db.active;
  const done = collectEntries(s).reduce((a,e) => a + e.sets.length, 0);
  const dur = Math.floor((Date.now() - s.start)/1000);
  if(!done){
    confirmModal('No registraste ninguna serie', 'Si terminas ahora, la sesión se descarta sin guardarse.',
      'Descartar sesión', () => { db.active = null; restUntil = null; releaseWake(); save(); go({name:'home'}); });
    return;
  }
  confirmModal('¿Terminar la sesión?',
    `Llevas ${fmtDur(dur)} y registraste ${done} serie${done===1?'':'s'}. Se guarda en tu historial y las sugerencias se actualizan.`,
    'Terminar y guardar', finishSession, true);
}

/* mejor marca previa de un ejercicio: e1RM (normal) o reps máximas (corporal) */
function bestMetricBefore(key){
  const repsMode = ['corporal','tiempo'].includes(exMeta(key).type);
  let best = 0;
  for(const h of db.history){
    const e = h.entries.find(x => x.key === key);
    if(!e) continue;
    const v = repsMode ? Math.max(0, ...e.sets.map(st => st.r)) : bestE1RM(e.sets);
    if(v > best) best = v;
  }
  return best;
}

function finishSession(){
  const s = db.active;
  const entries = collectEntries(s);

  /* récords personales: comparar contra la mejor marca histórica ANTES de guardar */
  const prs = [];
  for(const e of entries){
    const meta = exMeta(e.key);
    if(meta.type === 'asistido') continue;   /* en asistidos el e1RM de la ayuda no significa nada */
    const repsMode = ['corporal','tiempo'].includes(meta.type);
    const prev = bestMetricBefore(e.key);
    const now = repsMode ? Math.max(0, ...e.sets.map(st => st.r)) : bestE1RM(e.sets);
    if(prev > 0 && now > prev){
      const fv = v => repsMode ? fmtNum(Math.round(v*10)/10) : fmtW(Math.round(v*10)/10);
      const unit = meta.type === 'tiempo' ? 's' : (meta.type === 'corporal' ? 'reps' : uLabel());
      prs.push(`${esc(e.name)}: <b style="color:var(--acc)">${fv(now)} ${unit}</b> <span class="tiny">(antes ${fv(prev)})</span>`);
    }
  }

  const rec = {
    id: s.id, routineId: s.routineId, routineName: s.routineName,
    date: new Date().toISOString(),
    duration: Math.floor((Date.now() - s.start)/1000),
    entries
  };
  /* nota educativa: sesión mayormente al fallo (RIR 0) */
  const rirAll = entries.flatMap(e => e.sets).filter(s => s.rir !== undefined && s.rir !== null);
  const zeros = rirAll.filter(s => s.rir === 0).length;
  const failNote = (rirAll.length >= 4 && zeros / rirAll.length >= 0.7) ? `
    <div class="coach warn" style="margin-bottom:16px">
      Hoy llegaste al fallo (RIR 0) en ${zeros} de ${rirAll.length} series registradas.
      <span class="why">La evidencia: ir al fallo da casi el mismo músculo que quedarte a 1–3 reps de él,
      pero alarga la recuperación 24–48 h. Prueba dejar 1–2 reps en reserva en la mayoría de series —
      progresarás igual y llegarás más fresca a la próxima sesión.</span>
    </div>` : '';

  db.history.push(rec);
  db.active = null;
  restUntil = null;
  releaseWake();
  save();
  for(const e of entries) updateProgress(e.key, e.sets, rec.date);
  closeModal();
  openModal(`
    <h2>${prs.length ? '🏆 ¡Sesión con récord!' : 'Sesión guardada 💪'}</h2>
    <p class="muted">${fmtDur(rec.duration)} · ${entries.reduce((a,e)=>a+e.sets.length,0)} series.
      ${prs.length ? '' : 'La próxima vez verás las sugerencias actualizadas en cada ejercicio.'}</p>
    ${prs.length ? `<div class="coach good" style="margin-bottom:16px">
      Nuevo récord${prs.length===1?'':'s'} de 1RM estimado:<br>${prs.join('<br>')}</div>` : ''}
    ${failNote}
    <button class="btn btn-acc" onclick="closeModal(); go({name:'history'})">Ver historial</button>
    <button class="btn btn-ghost" style="margin-top:8px" onclick="closeModal(); go({name:'home'})">Volver al inicio</button>`);
}

/* ---------- cambio de unidad kg ⇄ lb ---------- */
function askUnitSwitch(target){
  const nu = target || (db.settings.unit === 'lb' ? 'kg' : 'lb');
  if(nu === db.settings.unit) return;
  confirmModal(`¿Cambiar a ${nu === 'lb' ? 'libras (lb)' : 'kilos (kg)'}?`,
    `Tus datos guardados NO se modifican — internamente todo vive en kg y solo cambia cómo se muestra y cómo escribes.
     ${db.active ? 'Lo que ya escribiste en esta sesión se convierte automáticamente a la nueva unidad.' : ''}
     Puedes alternar cuando quieras (ej. si entrenas en otro gimnasio).`,
    `Cambiar a ${nu}`, () => setUnit(nu), true);
}
function setUnit(u){
  if(db.settings.unit === u) return;
  /* convertir lo ya escrito en la sesión activa (estaba en la unidad anterior) */
  if(db.active){
    const f = (u === 'lb') ? 1/LB_KG : LB_KG;
    for(const ex of db.active.exercises){
      for(const st of ex.sets){
        const n = parseFloat(st.w);
        if(st.w !== '' && st.w !== undefined && !isNaN(n)){
          st.w = String(Math.round(n * f * 100) / 100);
        }
      }
    }
  }
  db.settings.unit = u;
  /* regenerar sugerencias: sus textos llevan la unidad y el redondeo cambia */
  if(db.active) for(const ex of db.active.exercises) ex.sugg = computeSuggestion(ex.key);
  save(); render();
}
function setScreenOn(v){
  db.settings.screenOn = v; save(); render();
  if(v === 'off') releaseWake(); else acquireWake();
}
