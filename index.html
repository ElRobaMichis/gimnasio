/* resumen de los últimos 7 días para la tira superior */
function weekStats(){
  const cut = new Date(Date.now() - 7*864e5).toISOString();
  let sessions = 0, sets = 0, vol = 0;
  for(const h of db.history){
    if(h.date < cut) continue;
    sessions++;
    for(const e of h.entries){
      sets += e.sets.length;
      vol += entryVolume(e.key, e.sets);
    }
  }
  return { sessions, sets, vol };
}
function fmtVolShort(kg){
  const v = fromKg(kg);
  if(v >= 1000) return `${fmtNum(Math.round(v/100)/10)}<i>${db.settings.unit === 'lb' ? 'k' : 't'}</i>`;
  return `${Math.round(v)}<i>${uLabel()}</i>`;
}

function viewHome(){
  const sp = activeSplit();
  const days = sp ? splitRoutines(sp.id) : [];
  const nx = db.active ? null : nextDay();

  const w = weekStats();
  const strip = w.sessions ? `
    <div class="sect">Esta semana</div>
    <div class="strip">
      <div><div class="n">${w.sessions}</div><div class="l">Sesiones</div></div>
      <div><div class="n">${w.sets}</div><div class="l">Series</div></div>
      <div><div class="n">${fmtVolShort(w.vol)}</div><div class="l">Volumen</div></div>
    </div>` : '';

  const resume = db.active ? `
    <button class="btn" style="margin-top:18px" onclick="go({name:'session'})">
      Continuar sesión — ${esc(db.active.routineName)}
    </button>` : '';

  /* con más de un gimnasio: decir dónde estás y poder cambiar antes de empezar */
  const gymRow = db.gyms.length > 1 ? `
    <button class="rowitem" style="border-bottom:0;padding:14px 0 0" onclick="gymPickerModal()">
      <span class="grow row" style="gap:9px">
        <span class="load-l">Entrenando en</span>
        <span class="l-v" style="color:var(--bone)">${esc(db.gym.name)}</span>
      </span>
      <span class="note-a" style="margin:0">Cambiar ›</span>
    </button>` : '';

  /* la tarjeta de arriba: qué toca hoy */
  const today = nx ? `
    <div class="today">
      <div class="row" style="justify-content:space-between">
        <span class="load-l">Hoy toca</span>
        <span class="pill">Día ${nx.idx + 1} de ${nx.total}</span>
      </div>
      <button class="today-n" onclick="go({name:'routine', id:'${nx.routine.id}'})">${esc(nx.routine.name)}</button>
      <div class="row-sub">${nx.routine.exercises.length} ejercicio${nx.routine.exercises.length===1?'':'s'}${
        nx.last ? ` · ${daysAgoText(nx.last.date)} hiciste ${esc(nx.last.name)}` : ' · tu primera sesión de este plan'}</div>
      <button class="btn" style="margin-top:15px" onclick="startSession('${nx.routine.id}')">Empezar</button>
    </div>` : '';

  const fat = systemicFatigue();
  const fatBanner = fat ? `
    <div class="note">
      <div class="note-t">Señal de fatiga acumulada: ${fat.regressed} de ${fat.evaluated} ejercicios a la baja</div>
      <div class="note-d">Cuando cae casi todo a la vez, el problema no es un ejercicio: es falta de recuperación.
        Lo que mejor funciona es una semana de descarga o 2–3 días extra de descanso y sueño.
        En cada rutina tienes <b>“Empezar como descarga”</b>: el coach calcula solo los pesos y series suaves,
        y tu progresión no se toca.</div>
      <button class="note-a" onclick="dismissFatigue()">Entendido — ocultar 10 días</button>
    </div>` : '';

  const fh = failureHabit();
  const rirBanner = fh ? `
    <div class="note bad">
      <div class="note-t">Vienes llegando al fallo (RIR 0) en ${fh.failSessions} de tus últimas sesiones</div>
      <div class="note-d">Ir al fallo da casi el mismo músculo que parar a 1–3 reps en reserva, pero tu cuerpo
        tarda 24–48 h más en recuperarse — incluso con el mismo volumen total. Deja 1–2 reps en reserva en la
        mayoría de las series; si acaso, guarda el fallo para la última serie de máquinas o aislamientos.</div>
      <button class="note-a" onclick="dismissRIR()">Entendido — ocultar 14 días</button>
    </div>` : '';

  const dsb = daysSinceBackup();
  const backupBanner = (db.history.length >= 5 && (dsb === null || dsb >= 30)) ? `
    <div class="note">
      <div class="note-t">${dsb === null ? 'Aún no tienes respaldo de tus datos' : `Hace ${dsb} días del último respaldo`}</div>
      <div class="note-d">Tus datos viven solo en este dispositivo. Un respaldo (.json) te protege.</div>
      <button class="note-a" onclick="exportBackup()">Descargar respaldo</button>
    </div>` : '';

  if(!db.routines.length){
    return `${resume}${gymRow}${fatBanner}${rirBanner}${backupBanner}
      <div class="empty">
        <div class="big">Sin días</div>
        <p>Empieza por crear el primero.</p>
        <p class="muted">Por ejemplo “Torso”, “Pierna” o “Full body”. El orden en que los crees es el orden
          en que la app te los irá pidiendo.</p>
      </div>
      <button class="btn" onclick="promptNewRoutine()">Crear el primer día</button>`;
  }

  const rows = days.map((r, i) => {
    const lastS = [...db.history].reverse().find(h => h.routineId === r.id || h.routineName === r.name);
    const esHoy = nx && nx.routine.id === r.id;
    return `
    <button class="rowitem${esHoy ? ' next' : ''}" onclick="go({name:'routine', id:'${r.id}'})">
      <span class="dayn">${i + 1}</span>
      <span class="grow">
        <span class="row-name" style="display:block">${esc(r.name)}${esHoy ? ' <i class="dot up" style="display:inline-block;margin-left:7px;transform:none"></i>' : ''}</span>
        <span class="row-sub" style="display:block">${r.exercises.length} ejercicio${r.exercises.length===1?'':'s'}${lastS ? ` · ${fmtDate(lastS.date)}` : ''}</span>
      </span>
      <span class="chev">›</span>
    </button>`;
  }).join('');

  return `
    ${resume}
    ${gymRow}
    ${today}
    ${strip}
    ${fatBanner}${rirBanner}${backupBanner}
    <div class="row" style="justify-content:space-between;margin:26px 0 6px">
      <div class="sect" style="margin:0">${sp ? esc(sp.name) : 'Tus rutinas'} · ${days.length} día${days.length===1?'':'s'}</div>
      <button class="note-a" style="margin:0" onclick="go({name:'splits'})">Cambiar ›</button>
    </div>
    ${rows || `<div class="hint">Este plan no tiene días todavía.</div>`}
    <div style="margin-top:20px"><button class="btn ghost" onclick="promptNewRoutine()">Agregar día</button></div>
    <div class="hint">${ days.length > 1
      ? 'El punto verde marca el día que sigue en la rotación. Si te saltas uno no pasa nada: se cuenta desde el último que entrenaste, no desde el calendario.'
      : 'Toca un día para revisar las sugerencias del coach antes de empezar.' }</div>`;
}

/* ---------- SPLITS: lista y detalle ---------- */
function splitsHeadHTML(){
  const g = db.splits.filter(x => !x.active).length;
  return `
    <button class="back" onclick="go({name:'home'})">‹ Rutinas</button>
    <div class="head-row">
      <div class="title sm">Splits</div>
      <div class="tools"><button aria-label="Nuevo split" onclick="promptNewSplit()">${svgIcon('plus')}</button></div>
    </div>
    <div class="meta">${db.splits.length ? '1 en curso' : 'Ninguno'}${g ? ` · ${g} guardado${g===1?'':'s'}` : ''}</div>
    <div class="knurl"></div>`;
}

function viewSplits(){
  const act = activeSplit();
  const otros = db.splits.filter(x => !act || x.id !== act.id);

  const card = sp => {
    const days = splitRoutines(sp.id);
    const ses = splitSessions(sp.id);
    const hechos = new Set();
    /* cuántos días distintos llevas de la vuelta actual */
    for(let i = ses.length - 1; i >= 0 && hechos.size < days.length; i--){
      const r = days.find(x => x.id === ses[i].routineId || x.name === ses[i].routineName);
      if(!r) continue;
      if(hechos.has(r.id)) break;
      hechos.add(r.id);
    }
    return `
    <button class="card" style="border-color:rgba(127,211,168,.3);text-align:left" onclick="go({name:'split', id:'${sp.id}'})">
      <div class="card-top">
        <div>
          <div class="ex-title" style="font-size:17px">${esc(sp.name)} <i class="dot up" style="display:inline-block;margin-left:6px;transform:none"></i></div>
          <div class="last">${days.length} día${days.length===1?'':'s'}${sp.created ? ` · desde el ${fmtDateShort(sp.created)}` : ''} · ${nSesiones(ses.length)}</div>
        </div>
        <div class="chev">›</div>
      </div>
      ${ days.length ? `<div class="steps" style="margin-top:12px">
        <div class="bars">${days.map((_, i) => `<i class="${i < hechos.size ? 'up' : ''}"></i>`).join('')}</div>
        <div class="steps-v"><b>${hechos.size}</b>/${days.length} días esta vuelta</div>
      </div>` : '' }
    </button>`;
  };

  const fila = sp => {
    const days = splitRoutines(sp.id);
    const ses = splitSessions(sp.id);
    const ult = ses.length ? ses[ses.length-1].date : null;
    return `
    <button class="rowitem" onclick="go({name:'split', id:'${sp.id}'})">
      <span class="grow">
        <span class="row-name" style="display:block">${esc(sp.name)}</span>
        <span class="row-sub" style="display:block">${days.length} día${days.length===1?'':'s'} · ${nSesiones(ses.length)}${ult ? ` · hasta el ${fmtDateShort(ult)}` : ''}</span>
      </span>
      <span class="chev">›</span>
    </button>`;
  };

  return `
    ${ act ? `<div class="sect">En curso</div>${card(act)}` : '' }
    ${ otros.length ? `<div class="sect">Guardados</div>${otros.map(fila).join('')}` : '' }
    <div class="note">
      <div class="note-t">Cambiar de split no borra tu progreso</div>
      <div class="note-d">Tus marcas viven en cada ejercicio, no en la rutina. Si el press de banca estaba
        en Torso y ahora está en Push, llega con su historial, su récord y la sugerencia del coach
        exactamente donde la dejaste.</div>
    </div>
    <div style="margin-top:4px"><button class="btn ghost" onclick="promptNewSplit()">Nuevo split</button></div>
    <div style="margin-top:9px"><button class="btn ghost" onclick="document.getElementById('splitfile').click()">Importar un split (.json)</button></div>
    <input type="file" id="splitfile" accept=".json,application/json" style="display:none"
      onchange="importSplitFile(this.files[0]); this.value=''">
    <div class="hint">El .json de un split se comparte desde su ficha (la flecha de descarga). Trae los días,
      los ejercicios y su configuración — ideal para pasarle tu plan a alguien más.</div>`;
}

function viewSplit(){
  const sp = db.splits.find(x => x.id === view.id);
  if(!sp) return viewSplits();
  const days = splitRoutines(sp.id);
  const ses = splitSessions(sp.id);
  const vol = ses.reduce((a,h) => a + h.entries.reduce((b,e) => b + e.sets.reduce((c,x) => c + x.w*x.r, 0), 0), 0);

  if(view.sort){
    return `<div style="margin-top:18px">
      ${days.map((r, i) => `
        <div class="rowitem">
          <span class="dayn">${i+1}</span>
          <span class="grow"><span class="row-name">${esc(r.name)}</span></span>
          <button class="chev" style="font-size:17px" aria-label="Subir" ${i===0?'disabled style="opacity:.25;font-size:17px"':''}
            onclick="moveRoutine('${r.id}',-1)">↑</button>
          <button class="chev" style="font-size:17px" aria-label="Bajar" ${i===days.length-1?'disabled style="opacity:.25;font-size:17px"':''}
            onclick="moveRoutine('${r.id}',1)">↓</button>
        </div>`).join('')}
      <div class="hint">Este es el orden en que la app te irá pidiendo los días.</div>
      <div class="dock"><button class="btn" onclick="toggleSort()">Listo</button></div>
    </div>`;
  }

  return `
    <div class="sect">Sus días</div>
    ${ days.map((r, i) => `
      <button class="rowitem" onclick="go({name:'routine', id:'${r.id}'})">
        <span class="dayn">${i+1}</span>
        <span class="grow">
          <span class="row-name" style="display:block">${esc(r.name)}</span>
          <span class="row-sub" style="display:block">${r.exercises.length} ejercicio${r.exercises.length===1?'':'s'}</span>
        </span>
        <span class="chev">›</span>
      </button>`).join('') || '<div class="hint">Todavía no tiene días.</div>' }

    <div class="sect">Cómo se entrena</div>
    <div class="line">
      <div><div class="l-t">Al fallo a propósito</div>
        <div class="l-d">Para programas de bajo volumen (1–2 series a RIR 0, tipo Min-Max): el aviso de
          «vienes llegando al fallo» no cuenta las sesiones de este plan. Tus otros splits siguen protegidos.</div></div>
      <button class="tog ${sp.failOk ? 'on' : ''}" role="switch" aria-checked="${!!sp.failOk}"
        aria-label="Entrenar al fallo a propósito" onclick="toggleSplitFailOk('${sp.id}')"><i></i></button>
    </div>

      <div class="sect">Cuánto lo usaste</div>

        <div class="line"><div class="l-t">Sesiones</div><div class="l-v">${ses.length}</div></div>
        <div class="line"><div class="l-t">Del</div><div class="l-v">${fmtDateShort(ses[0].date)} al ${fmtDateShort(ses[ses.length-1].date)}</div></div>
        ${ vol ? `<div class="line"><div class="l-t">Volumen movido</div><div class="l-v">${fmtVolShort(vol).replace('<i>','').replace('</i>',' ')}</div></div>` : '' }
      </div>` : '' }

    <div class="dock">
      ${ sp.active
        ? `<button class="btn ghost" onclick="go({name:'home'})">Ver sus días en el inicio</button>`
        : `<button class="btn" onclick="activateSplit('${sp.id}')">Ponerlo en curso</button>
           <div class="hint" style="text-align:center;margin-top:12px">${
             activeSplit() ? `${esc(activeSplit().name)} pasa a guardados. Nada se borra.` : 'Nada se borra.'}</div>` }
    </div>`;
}

/* ---------- acciones de splits ---------- */
function promptNewSplit(){
  openModal(`
    <h2>Nuevo split</h2>
    <p class="muted">Un split es el orden de tus días. Ponle nombre y luego le vas creando los días
      que quieras — sin plantillas ni ataduras.</p>
    <form onsubmit="createSplit(event)" class="stack" autocomplete="off">
      <input type="text" id="newsplit" placeholder="Ej. PPL, Upper/Lower, Torso/Pierna" autocomplete="off">
      <button class="btn" type="submit">Crear y ponerlo en curso</button>
      <button class="btn ghost" type="button" onclick="closeModal()">Cancelar</button>
    </form>
    <div class="hint">El que tengas ahora pasa a guardados. Puedes volver a él cuando quieras, y tu
      progreso no se toca: vive en cada ejercicio, no en la rutina.</div>`);
  setTimeout(() => document.getElementById('newsplit')?.focus(), 60);
}
function createSplit(ev){
  ev.preventDefault();
  const name = document.getElementById('newsplit').value.trim();
  if(!name) return;
  const sp = { id:uid(), name, active:true, created:new Date().toISOString(), exconf:{} };
  db.splits.forEach(x => { x.active = false; });
  db.splits.push(sp);
  save(); closeModal(); go({name:'home'});
}
function activateSplit(id){
  db.splits.forEach(x => { x.active = (x.id === id); });
  save(); go({name:'home'});
}
function promptRenameSplit(id){
  const sp = db.splits.find(x => x.id === id);
  if(!sp) return;
  openModal(`
    <h2>Renombrar split</h2>
    <form onsubmit="renameSplit(event,'${id}')" class="stack" autocomplete="off">
      <input type="text" id="splitname" value="${esc(sp.name)}" autocomplete="off">
      <button class="btn" type="submit">Guardar</button>
      <button class="btn ghost" type="button" onclick="closeModal()">Cancelar</button>
    </form>`);
  setTimeout(() => document.getElementById('splitname')?.select(), 60);
}
function renameSplit(ev, id){
  ev.preventDefault();
  const sp = db.splits.find(x => x.id === id);
  const v = document.getElementById('splitname').value.trim();
  if(sp && v) sp.name = v;
  save(); closeModal(); render();
}
/* ---------- compartir splits completos ----------
   El perfil lleva el plan entero: días en orden, ejercicios de cada día,
   la configuración general de cada ejercicio (tipo, rango, equipo, torre…)
   y la config por split (series, rango, descanso). No lleva historial. */
function splitProfile(id){
  const sp = db.splits.find(x => x.id === id);
  if(!sp) return null;
  const days = splitRoutines(id).map(r => ({
    name: r.name,
    exercises: r.exercises.map(e => ({ name: e.name, key: e.key })),
  }));
  const keys = new Set(days.flatMap(d => d.exercises.map(e => e.key)));
  const exmeta = {}, exconf = {};
  for(const k of keys){
    if(db.exmeta[k]) exmeta[k] = JSON.parse(JSON.stringify(db.exmeta[k]));
    if(sp.exconf && sp.exconf[k]) exconf[k] = JSON.parse(JSON.stringify(sp.exconf[k]));
  }
  return { app:'hierro', kind:'split', version:APP_VERSION,
    split:{ name:sp.name, failOk: !!sp.failOk, days, exconf, exmeta } };
}
function exportSplit(id){
  const prof = splitProfile(id);
  if(!prof) return;
  const slug = prof.split.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'plan';
  const blob = new Blob([JSON.stringify(prof)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `hierro-split-${slug}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
function importSplitFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onerror = () => infoModal('No se pudo leer el archivo', 'Vuelve a intentarlo.');
  reader.onload = () => {
    try{
      const d = JSON.parse(String(reader.result));
      if(!d || d.kind !== 'split' || !d.split || typeof d.split !== 'object') throw new Error('estructura');
      confirmSplitImport(d);
    }catch(e){
      infoModal('Archivo no válido', 'No parece un split de Hierro (el .json que se comparte desde la ficha de un split).');
    }
  };
  reader.readAsText(file);
}
function confirmSplitImport(d){
  window.__splitImport = d;
  const days = Array.isArray(d.split.days) ? d.split.days : [];
  const nEx = days.reduce((a, x) => a + ((x && Array.isArray(x.exercises)) ? x.exercises.length : 0), 0);
  confirmModal(`¿Agregar el split “${esc(d.split.name || 'Sin nombre')}”?`,
    `Trae ${days.length} día${days.length===1?'':'s'} con ${nEx} ejercicio${nEx===1?'':'s'} y su configuración.
     Se agrega como un split más y se pone en curso; el tuyo pasa a guardados y nada se borra.
     Los ejercicios que ya conoces conservan TU configuración y tu progreso.`,
    'Agregar y ponerlo en curso', applySplitImport, true);
}
function applySplitImport(){
  const d = window.__splitImport;
  window.__splitImport = null;
  if(!d || !d.split || typeof d.split !== 'object') return;
  const src = d.split;
  const sp = { id:uid(), name:String(src.name || 'Split importado').slice(0,80),
               active:true, created:new Date().toISOString(), exconf:{} };
  if(src.failOk === true) sp.failOk = true;   /* la marca «al fallo a propósito» viaja con el plan */
  /* config por split: solo campos conocidos y con números válidos */
  if(src.exconf && typeof src.exconf === 'object'){
    for(const k in src.exconf){
      const o = src.exconf[k] || {}, out = {};
      for(const f of ['lo','hi','sets','rest']){
        const v = parseInt(o[f], 10);
        if(!isNaN(v) && v >= 1) out[f] = v;
      }
      if(Object.keys(out).length) sp.exconf[k] = out;
    }
  }
  db.splits.forEach(x => { x.active = false; });
  db.splits.push(sp);
  for(const day of (Array.isArray(src.days) ? src.days : [])){
    if(!day || typeof day !== 'object') continue;
    const exs = (Array.isArray(day.exercises) ? day.exercises : [])
      .filter(e => e && typeof e.name === 'string' && e.name.trim())
      .map(e => {
        const name = e.name.trim().slice(0,120);
        return { id:uid(), name, key:exKey(name) };   /* la clave se recalcula: nunca se confía en la del archivo */
      });
    db.routines.push({ id:uid(), name:String(day.name || 'Día').slice(0,80), split:sp.id, exercises:exs });
  }
  /* los ejercicios NUEVOS llegan con toda su configuración; en los que ya
     conoces manda la tuya (tu máquina, tu tipo, tus notas) */
  if(src.exmeta && typeof src.exmeta === 'object'){
    for(const k in src.exmeta){
      if(db.exmeta[k]) continue;
      const o = src.exmeta[k];
      if(!o || typeof o !== 'object') continue;
      const m = exMeta(k);
      for(const f of ['type','lo','hi','step','rest','muscle','notes','equip','points','base','bar','cap'])
        if(o[f] !== undefined) m[f] = o[f];
      if(o.stack && typeof o.stack === 'object')
        m.stack = { unit:o.stack.unit ?? null, step:o.stack.step ?? null, start:o.stack.start ?? null,
                    extra:o.stack.extra ?? null, extraMax:o.stack.extraMax ?? null };
      if(!TYPE_LABEL.hasOwnProperty(String(m.type))) m.type = 'normal';
      if(m.equip != null && !EQUIP[m.equip]) m.equip = guessEquip(k);
      m.notes = String(m.notes || '').slice(0,300);
    }
  }
  save();
  go({name:'home'});
}

function toggleSplitFailOk(id){
  const sp = db.splits.find(x => x.id === id);
  if(!sp) return;
  sp.failOk = !sp.failOk;
  save(); render();
}
function deleteSplit(id){
  const sp = db.splits.find(x => x.id === id);
  if(!sp) return;
  if(db.splits.length <= 1){
    infoModal('Es tu único split', 'Necesitas al menos uno. Crea otro antes de borrar este, o renómbralo.');
    return;
  }
  const days = splitRoutines(id);
  confirmModal(`¿Borrar “${esc(sp.name)}”?`,
    `Se van también sus ${days.length} día${days.length===1?'':'s'}. Tu historial de sesiones NO se borra, y las marcas de cada ejercicio se conservan: si vuelves a crear ese día, llega con su progreso.`,
    'Borrar split', () => {
      db.routines = db.routines.filter(r => r.split !== id);
      db.splits = db.splits.filter(x => x.id !== id);
      if(!db.splits.some(x => x.active)) db.splits[0].active = true;
      save(); go({name:'splits'});
    });
}
/* mover un día dentro de su split */
function moveRoutine(rid, dir){
  const r = db.routines.find(x => x.id === rid);
  if(!r) return;
  const hermanas = splitRoutines(r.split);
  const i = hermanas.indexOf(r), j = i + dir;
  if(j < 0 || j >= hermanas.length) return;
  const a = db.routines.indexOf(hermanas[i]), b = db.routines.indexOf(hermanas[j]);
  [db.routines[a], db.routines[b]] = [db.routines[b], db.routines[a]];
  save(); render();
}
/* mover o copiar un día a otro split */
function promptMoveRoutine(rid){
  const r = db.routines.find(x => x.id === rid);
  if(!r) return;
  if(db.splits.length < 2){
    infoModal('Solo tienes un split', 'Crea otro desde Rutinas → Cambiar y entonces podrás mover días entre ellos.');
    return;
  }
  window.__moveTo = db.splits.find(x => x.id !== r.split).id;
  window.__moveCopy = false;
  const actual = db.splits.find(x => x.id === r.split);
  openModal(`
    <h2>¿A qué split?</h2>
    <p class="muted">Ahora mismo <b>${esc(r.name)}</b> vive en ${esc(actual ? actual.name : '—')}. Su historial no se
      toca: las sesiones ya guardadas siguen contando igual.</p>
    <div class="stack" id="movelist">
      ${db.splits.map(sp => `
        <button class="opt ${sp.id === window.__moveTo ? 'on' : ''}" type="button" data-sp="${sp.id}"
          onclick="pickMoveTarget('${sp.id}')">
          <b>${esc(sp.name)}</b><span>${sp.active ? 'En curso' : 'Guardado'} · ${splitRoutines(sp.id).length} día${splitRoutines(sp.id).length===1?'':'s'}${sp.id === r.split ? ' · donde está ahora' : ''}</span>
        </button>`).join('')}
    </div>
    <div class="sect">Cómo</div>
    <div class="stack" id="movemode">
      <button class="opt on" type="button" data-copy="0" onclick="pickMoveMode(0)">
        <b>Mover</b><span>Deja de estar en ${esc(actual ? actual.name : '—')}.</span></button>
      <button class="opt" type="button" data-copy="1" onclick="pickMoveMode(1)">
        <b>Copiar</b><span>Queda en los dos, cada uno editable por separado.</span></button>
    </div>
    <button class="btn" style="margin-top:18px" onclick="doMoveRoutine('${rid}')">Aplicar</button>
    <button class="btn ghost" onclick="closeModal()">Cancelar</button>`);
}
function pickMoveTarget(id){
  window.__moveTo = id;
  const list = document.getElementById('movelist');
  if(list) for(const b of list.querySelectorAll('button')) b.classList.toggle('on', b.dataset.sp === id);
}
function pickMoveMode(copy){
  window.__moveCopy = !!copy;
  const list = document.getElementById('movemode');
  if(list) for(const b of list.querySelectorAll('button')) b.classList.toggle('on', b.dataset.copy === String(copy));
}
/* al mover o copiar un día, su config por split lo acompaña (sin pisar la del destino) */
function carryExconf(r, fromId, toId){
  const from = db.splits.find(x => x.id === fromId), to = db.splits.find(x => x.id === toId);
  if(!from || !to || !from.exconf) return;
  if(!to.exconf || typeof to.exconf !== 'object') to.exconf = {};
  for(const ex of r.exercises)
    if(from.exconf[ex.key] && !to.exconf[ex.key])
      to.exconf[ex.key] = JSON.parse(JSON.stringify(from.exconf[ex.key]));
}
function doMoveRoutine(rid){
  const r = db.routines.find(x => x.id === rid);
  const to = window.__moveTo;
  if(!r || !to) return;
  carryExconf(r, r.split, to);
  if(window.__moveCopy){
    const copia = { id:uid(), name:r.name, split:to,
                    exercises:r.exercises.map(e => ({ id:uid(), name:e.name, key:e.key })) };
    db.routines.push(copia);
    save(); closeModal(); go({name:'routine', id:copia.id});
  } else {
    r.split = to;
    save(); closeModal(); render();
  }
}

/* ---------- RUTINA ---------- */
function typePill(key){
  const t = exMeta(key).type;
  return TYPE_LABEL[t] ? `<span class="pill">${TYPE_LABEL[t]}</span>` : '';
}

function routineHeadHTML(){
  const r = db.routines.find(x => x.id === view.id);
  if(!r) return '';
  const g = goalRange();
  if(view.sort) return `
    <button class="back" onclick="toggleSort()">‹ ${esc(r.name)}</button>
    <div class="title sm">Ordenar</div>
    <div class="meta">El orden es el que verás durante la sesión.</div>
    <div class="knurl"></div>`;
  return `
    <button class="back" onclick="go({name:'home'})">‹ Rutinas</button>
    <div class="head-row">
      <div class="title sm">${esc(r.name)}</div>
      <div class="tools">
        <button aria-label="Renombrar día" onclick="promptRenameRoutine('${r.id}')">${svgIcon('edit')}</button>
        ${r.exercises.length > 1 ? `<button aria-label="Reordenar ejercicios" onclick="toggleSort()">${svgIcon('sort')}</button>` : ''}
        ${db.splits.length > 1 ? `<button aria-label="Mover a otro split" onclick="promptMoveRoutine('${r.id}')">${svgIcon('move')}</button>` : ''}
        <button aria-label="Duplicar rutina" onclick="duplicateRoutine('${r.id}')">${svgIcon('copy')}</button>
        <button aria-label="Eliminar rutina" onclick="deleteRoutine('${r.id}')">${svgIcon('trash')}</button>
      </div>
    </div>
    <div class="meta">${r.exercises.length} ejercicio${r.exercises.length===1?'':'s'} · ${g.lo}–${g.hi} reps · 1–3 RIR</div>
    <div class="knurl"></div>`;
}

function viewRoutine(){
  const r = db.routines.find(x => x.id === view.id);
  if(!r) return viewHome();

  /* modo reordenar: solo nombres con flechas ↑↓ */
  if(view.sort){
    const sortItems = r.exercises.map((ex, i) => `
      <div class="rowitem">
        <span class="grow"><span class="row-name">${i+1}. ${esc(exBaseName(ex.name))}</span></span>
        <button class="chev" style="font-size:17px" aria-label="Subir" ${i===0?'disabled style="opacity:.25;font-size:17px"':''}
          onclick="moveEx('${r.id}',${i},-1)">↑</button>
        <button class="chev" style="font-size:17px" aria-label="Bajar" ${i===r.exercises.length-1?'disabled style="opacity:.25;font-size:17px"':''}
          onclick="moveEx('${r.id}',${i},1)">↓</button>
      </div>`).join('');
    return `<div style="margin-top:18px">${sortItems}</div>
      <div class="dock"><button class="btn" onclick="toggleSort()">Listo</button></div>`;
  }

  const items = r.exercises.map(ex => {
    const sugg = computeSuggestion(ex.key);
    const notes = exMeta(ex.key).notes;
    return `
    <div class="card">
      <div class="card-top">
        <button class="grow" style="min-width:0" onclick="openExercise('${r.id}','${ex.id}')">
          <div class="ex-title">${exTitleHTML(ex.name)} ${typePill(ex.key)}</div>
        </button>
        <button class="xbtn" aria-label="Quitar de la rutina"
          onclick="removeExercise('${r.id}','${ex.id}')">✕</button>
        <button class="chev" aria-label="Ver ficha" onclick="openExercise('${r.id}','${ex.id}')">›</button>
      </div>
      ${lastLineHTML(ex.key)}
      ${notes ? `<div class="exnote">${esc(notes)}</div>` : ''}
      ${verdictHTML(sugg, true)}
      ${rangeBarsHTML(ex.key, sugg)}
    </div>`;
  }).join('');

  const empty = `<div class="empty">
    <div class="big">Rutina vacía</div>
    <p>Agrega los ejercicios de esta rutina.</p>
    <p class="muted">Escribe el nombre abajo — si ya lo entrenaste antes, el coach trae su progresión.</p>
  </div>`;

  return `
    <div style="margin-top:2px">${items || empty}</div>
    <form class="row" style="margin-top:14px" onsubmit="addExercise(event,'${r.id}')" autocomplete="off">
      <div class="acwrap">
        <input type="text" id="newex" placeholder="Agregar ejercicio (ej. Press banca)" autocomplete="off"
          oninput="acUpdate('${r.id}')" onfocus="acUpdate('${r.id}')" onblur="acHide()">
        <div class="aclist" id="aclist" style="display:none" role="listbox"></div>
      </div>
      <button class="btn quiet" style="width:auto;flex:none;padding:12px 16px;font-size:13.5px" type="submit">Agregar</button>
    </form>
    ${ r.exercises.length ? `
      <div class="dock">
        <button class="btn" onclick="startSession('${r.id}')">Empezar sesión</button>
        <button class="deload" onclick="confirmModal('¿Sesión de descarga?','El coach recalcula todo: ~10 % menos carga y la mitad de las series. Ideal tras semanas duras o cuando aparece el aviso de fatiga. No afecta tu progresión: la próxima sesión normal retoma donde ibas.','Empezar descarga',() => startSession('${r.id}', true), true)">
          ${svgIcon('deload')} Empezar como descarga
        </button>
      </div>` : '' }`;
}

/* ---------- FICHA DE EJERCICIO (progreso + ajustes) ---------- */
function openExercise(rid, exid){
  const r = db.routines.find(x => x.id === rid);
  const ex = r && r.exercises.find(e => e.id === exid);
  if(!ex) return;
  go({ name:'exercise', key:ex.key, exname:ex.name, rid });
}

function exerciseHistory(key){
  const out = [];
  for(const h of db.history){
    const e = h.entries.find(x => x.key === key);
    if(e && e.sets.length) out.push({ date:h.date, sets:e.sets });
  }
  out.sort((a,b) => a.date < b.date ? -1 : 1);
  return out;
}

function exerciseHeadHTML(){
  const eq = exEquip(view.exname);
  const volver = (view.from === 'session' && db.active)
    ? `<button class="back" onclick="go({name:'session'})">‹ Sesión en curso</button>`
    : `<button class="back" onclick="go({name:'routine', id:'${view.rid}'})">‹ Volver</button>`;
  return `
    ${volver}
    <div class="title big">${esc(exBaseName(view.exname))}</div>
    ${eq ? `<div class="title-sub">${esc(eq)}</div>` : '<div style="height:12px"></div>'}
    <div class="knurl"></div>`;
}

const TYPE_HINT = {
  normal:   'Tú levantas la carga. Progresas subiendo kilos cuando llenas el rango de reps.',
  asistido: 'Una máquina o banda te ayuda. Los kg que anotas son la ayuda: progresar = usar menos kg.',
  corporal: 'Sin peso externo. Progresas sumando reps o series; si usas lastre, anótalo como peso.',
  tiempo:   'Isométricos y sostenidos: mides segundos, no reps. Cada serie trae cronómetro con alarma.',
};

function viewExercise(){
  const key = view.key, meta = exMeta(key);
  const g = goalRange();
  const p = prog(key);
  const hist = exerciseHistory(key);
  const corporal = meta.type === 'corporal';
  const porTiempo = meta.type === 'tiempo';
  const repsMode = corporal || porTiempo;   /* la métrica es reps/segundos, no e1RM */
  const pts = hist.map(h => ({
    date: h.date,
    v: repsMode ? Math.max(...h.sets.map(s => s.r)) : Math.round(fromKgEx(key, bestE1RM(h.sets))*10)/10
  })).filter(p => p.v > 0);
  window.__chartPts = pts;
  window.__chartUnit = porTiempo ? 's' : (corporal ? 'reps' : uLabelEx(key));
  const best = pts.length ? Math.max(...pts.map(p => p.v)) : 0;

  const headLabel = porTiempo ? 'Tu mejor tiempo' : (corporal ? 'Tu récord de reps' : '1RM estimado');
  const unitLabel = porTiempo ? 's' : (corporal ? 'reps' : uLabelEx(key));

  /* «tu carga de trabajo es el X % de esa marca» */
  let pctLine = '';
  if(!repsMode && meta.type !== 'asistido' && hist.length){
    const wNow = workWeight(hist[hist.length-1].sets);
    const bestKg = Math.max(0, ...hist.map(h => bestE1RM(h.sets)));
    if(wNow > 0 && bestKg > 0){
      pctLine = `<div class="pr-d">Tu carga de trabajo (${fmtWEx(key, wNow)} ${uLabelEx(key)}) es el
        <b>${Math.round(wNow / bestKg * 100)} %</b> de esa marca.</div>`;
    }
  }
  const whatIs = porTiempo
    ? `<div class="pr-d">Tu mejor tiempo sostenido en una serie.</div>`
    : corporal
    ? `<div class="pr-d">Tus mejores reps en una serie.</div>`
    : `<div class="pr-d">El peso máximo que podrías levantar una sola vez, calculado desde tus series.
        <span class="linkish" role="button" tabindex="0" onclick="e1rmInfo()">¿Cómo se calcula?</span></div>`;

  const panel = pts.length ? `
    <div class="panel">
      <div class="pr"><div class="n">${fmtNum(best)}</div><div class="u">${unitLabel}</div></div>
      ${pctLine || whatIs}
      ${ pts.length >= 2 ? `
        <div class="chart"><canvas id="exchart" height="120"></canvas></div>
        <div class="axis">
          <span>${fmtDateShort(pts[0].date)}</span>
          <span id="charttip">${pts.length} sesiones</span>
          <span>${fmtDateShort(pts[pts.length-1].date)}</span>
        </div>`
        : `<div class="hint">Registra al menos 2 sesiones para ver la gráfica.</div>` }
    </div>`
    : `<div class="panel"><div class="muted">Todavía no hay registros de este ejercicio.
        Cuando entrenes, aquí verás tu progreso.</div></div>`;

  const rotation = (p.stall >= 6 && meta.muscle && meta.muscle !== 'none') ? (() => {
    const vars = [...allExerciseNames()]
      .filter(([k]) => k !== key && exMeta(k).muscle === meta.muscle)
      .slice(0, 3).map(([, info]) => esc(exBaseName(info.name)));
    return `<div class="note">
      <div class="note-t">Rotación sugerida · ${p.stall} sesiones sin avanzar</div>
      <div class="note-d">Cambiarlo por una variante del mismo músculo durante 4–6 semanas suele reactivar
        el progreso (estímulo nuevo, mismas ganancias). Después puedes volver.
        ${vars.length ? `Variantes que ya conoces: <b>${vars.join(', ')}</b>.` : ''}</div>
    </div>`;
  })() : '';

  const seg = ['normal','asistido','corporal','tiempo'].map(t => {
    const label = { normal:'Normal', asistido:'Asistido', corporal:'Corporal', tiempo:'Tiempo' }[t];
    return `<button class="${meta.type===t?'on':''}" onclick="setExType('${key}','${t}')">${label}</button>`;
  }).join('');

  const recent = [...hist].reverse().slice(0, 6).map(h => `
    <div class="exline">
      <span class="tiny">${fmtDate(h.date)}</span>
      <span class="sets">${h.sets.map(s => fmtSet(key, s) + (s.rir != null ? `@${s.rir}` : '')).join(' · ')}</span>
    </div>`).join('');

  return `
    <div class="sect">${headLabel}</div>
    ${panel}
    ${rotation}

    <div class="sect">Cómo se progresa</div>
    <div class="seg4">${seg}</div>
    <div class="hint">${TYPE_HINT[meta.type] || ''}</div>

    <div class="sect">Cómo se carga</div>
    <div class="stack">
      ${EQUIP_KEYS.map(k => `
        <button class="opt ${meta.equip === k ? 'on' : ''}" onclick="setExEquip('${key}','${k}')">
          <b>${EQUIP[k].label}</b><span>${EQUIP[k].desc}</span>
        </button>`).join('')}
    </div>
    ${ !meta.equip ? `<div class="hint">Sin elegir, el coach progresa igual pero no puede decirte cómo
      cargar nada. Se adivina del nombre del ejercicio; toca el que corresponda si falló.</div>` : '' }
    ${ equipConfigHTML(key, meta) }
    ${ db.gyms.length > 1 && meta.equip ? `<div class="hint">Esto es de <b>${esc(db.gym.name)}</b> —
      cada gimnasio guarda su propia configuración de máquinas y equipo.</div>` : '' }

    <div class="sect">Ajustes del ejercicio</div>
    <div class="list">
      <div class="line">
        <div class="l-t">${porTiempo ? 'Rango de segundos' : 'Rango de reps'}</div>
        <div class="l-v">
          <input type="number" inputmode="numeric" min="1" placeholder="${porTiempo ? TIEMPO_RANGE.lo : g.lo}"
            value="${meta.lo ?? ''}" aria-label="Mínimo" oninput="setExRange('${key}','lo',this.value)">
          <span style="color:var(--dim)">–</span>
          <input type="number" inputmode="numeric" min="2" placeholder="${porTiempo ? TIEMPO_RANGE.hi : g.hi}"
            value="${meta.hi ?? ''}" aria-label="Máximo" oninput="setExRange('${key}','hi',this.value)">
        </div>
      </div>
      <div class="line">
        <div class="l-t">Salto mínimo</div>
        <div class="l-v"><select class="inline" onchange="setExStep('${key}',this.value)">${stepOptionsHTML(meta.step)}</select></div>
      </div>
      ${ meta.type === 'normal' ? `
      <div class="line">
        <div><div class="l-t">Peso máximo</div><div class="l-d">El tope de esa máquina o mancuerna</div></div>
        <div class="l-v">
          <input type="number" inputmode="decimal" step="any" min="0" placeholder="—" style="width:66px"
            value="${meta.cap != null ? inputWEx(key, meta.cap) : ''}" aria-label="Peso máximo"
            oninput="setExCap('${key}',this.value)">
          <span style="color:var(--dim)">${uLabelEx(key)}</span>
        </div>
      </div>` : '' }
      <div class="line">
        <div class="l-t">Grupo muscular</div>
        <div class="l-v"><select class="inline" onchange="setExMuscle('${key}',this.value)">
          <option value="none" ${!meta.muscle || meta.muscle==='none' ? 'selected':''}>Sin grupo</option>
          ${MUSCLES.map(([k,l]) => `<option value="${k}" ${meta.muscle===k?'selected':''}>${l}</option>`).join('')}
        </select></div>
      </div>
      <div class="line">
        <div class="l-t">Descanso</div>
        <div class="l-v"><select class="inline" onchange="setExRest('${key}',this.value)">
          <option value="auto" ${!meta.rest?'selected':''}>General</option>
          ${[45,60,90,120,150,180,240].map(s => `
            <option value="${s}" ${String(meta.rest)===String(s)?'selected':''}>${fmtClock(s)}</option>`).join('')}
        </select></div>
      </div>
    </div>
    <div class="hint">El rango viene de tu objetivo (${g.lo}–${g.hi}); cámbialo solo para casos especiales
      (ej. abdominales 15–25). ${ (() => {
        const auto = effStep(key, 20);
        return effEquip(key) && effEquip(key) !== 'nada'
          ? `El salto automático sale de cómo se carga: <b>${fmtWEx(key, auto)} ${uLabelEx(key)}</b>. Cámbialo solo si tu gimnasio es raro.`
          : 'El salto mínimo es el aumento más pequeño posible en tu gimnasio.'; })() }
      Si marcas el peso máximo, al alcanzarlo el coach progresa por reps y series en vez de pedirte kilos imposibles.</div>

    ${ (() => {
      if(db.splits.length < 2) return '';
      const spId = ctxSplitId(), sp = db.splits.find(x => x.id === spId);
      if(!sp) return '';
      const oc = (sp.exconf || {})[key] || {};
      /* plegado tras un botón: solo se despliega si ya hay algo configurado
         o si lo pediste — así la ficha no enseña dos bloques casi iguales */
      if(!Object.keys(oc).length && !view.splitConf){
        return `
      <button class="btn quiet sm" style="margin-top:14px" onclick="openSplitConf()">
        Personalizar para este split (${esc(sp.name)})</button>
      <div class="hint">Rango, series y descanso propios solo dentro de “${esc(sp.name)}” —
        lo general de arriba no se toca y sigue rigiendo en tus otros splits.</div>`;
      }
      const phLo = meta.lo ?? (porTiempo ? TIEMPO_RANGE.lo : g.lo);
      const phHi = meta.hi ?? (porTiempo ? TIEMPO_RANGE.hi : g.hi);
      return `
      <div class="sect">Solo en este split — ${esc(sp.name)}</div>
      <div class="list">
        <div class="line">
          <div class="l-t">${porTiempo ? 'Rango de segundos' : 'Rango de reps'}</div>
          <div class="l-v">
            <input type="number" inputmode="numeric" min="1" placeholder="${phLo}"
              value="${oc.lo ?? ''}" aria-label="Mínimo en este split" oninput="setSplitConf('${key}','lo',this.value)">
            <span style="color:var(--dim)">–</span>
            <input type="number" inputmode="numeric" min="2" placeholder="${phHi}"
              value="${oc.hi ?? ''}" aria-label="Máximo en este split" oninput="setSplitConf('${key}','hi',this.value)">
          </div>
        </div>
        <div class="line">
          <div><div class="l-t">Series</div><div class="l-d">Cuántas te propone el coach en este split</div></div>
          <div class="l-v">
            <input type="number" inputmode="numeric" min="1" max="10" placeholder="auto" style="width:52px"
              value="${oc.sets ?? ''}" aria-label="Series en este split" oninput="setSplitConf('${key}','sets',this.value)">
          </div>
        </div>
        <div class="line">
          <div class="l-t">Descanso</div>
          <div class="l-v"><select class="inline" onchange="setSplitConf('${key}','rest',this.value)">
            <option value="auto" ${oc.rest == null ? 'selected' : ''}>El general</option>
            ${[45,60,90,120,150,180,240].map(s => `
              <option value="${s}" ${String(oc.rest)===String(s)?'selected':''}>${fmtClock(s)}</option>`).join('')}
          </select></div>
        </div>
      </div>
      <div class="hint">En blanco se usa lo general de arriba. Esto vive en <b>${esc(sp.name)}</b>: el mismo
        ejercicio en tu otro split usa su propia configuración — así conviven un plan de fuerza
        (4–6 reps, pocas series) y uno de hipertrofia (8–12) sin pisarse. Con las series fijadas,
        el coach tampoco te sumará series extra por estancamiento aquí.</div>`;
    })() }

    <div class="sect">Otra máquina</div>
    <button class="btn quiet sm" onclick="promptDuplicateEx('${key}', '${esc(view.exname).replace(/'/g, "\\'")}')">
      Duplicar para otra máquina</button>
    <div class="hint">Si tu gimnasio tiene este ejercicio en dos aparatos —uno de cable y otro de discos—
      van separados: no pesan lo mismo ni progresan igual.</div>

    <div class="sect">Notas</div>
    <textarea placeholder="Ej. agarre ancho, asiento en 4, bajar lento…"
      oninput="setExNotes('${key}',this.value)">${esc(meta.notes || '')}</textarea>
    <div class="hint">Las verás durante la sesión, debajo del nombre del ejercicio.</div>

    ${ recent ? `

function setExType(key, t){ withExChange(key, () => { exMeta(key).type = t; }); render(); }
function setExPoints(key, n){ withExChange(key, () => { exMeta(key).points = n; }); render(); }
function setExBase(key, v){
  withExChange(key, () => {
    const x = parseFloat(v);
    exMeta(key).base = (isNaN(x) || x <= 0) ? null : Math.round(toKg(x)*1000)/1000;
  });
}
function setExStack(key, field, v){
  withExChange(key, () => {
    const st = exMeta(key).stack;
    if(field === 'unit') st.unit = v;
    else {
      const x = parseFloat(v);
      st[field] = (isNaN(x) || x <= 0) ? null : x;
    }
  });
  if(field === 'unit') render(); else renderStackHint(key);
}
/* al teclear el salto no se re-renderiza todo: solo se refresca la torre */
function renderStackHint(key){
  const el = document.getElementById('stackhint');
  if(!el) return;
  const c = stackConf(key);
  const u = uLabelEx(key);
  el.innerHTML = c
    ? `Así queda la torre: <b>${stackPreview(key, 7).map(fmtNum).join(' · ')} …</b> ${u}.`
    : 'Escribe de cuánto en cuánto sube y te enseño la torre entera.';
}
function setExEquip(key, v){
  withExChange(key, () => {
    const m = exMeta(key);
    m.equip = EQUIP[v] ? v : null;
    if(v !== 'barra') m.bar = null;
  });
  render();
}
function setExBarSel(key, v){
  withExChange(key, () => { exMeta(key).bar = (v === 'auto') ? null : v; });
  render();
}
function setExRange(key, which, val){
  withExChange(key, () => {
    const v = parseInt(val,10);
    exMeta(key)[which] = isNaN(v) ? null : v;
  });
}
function setExStep(key, val){
  withExChange(key, () => { exMeta(key).step = (val === 'auto') ? null : parseFloat(val); });
}
/* opciones de salto en la unidad activa; el valor guardado siempre es kg */
function stepOptionsHTML(cur){
  const lb = db.settings.unit === 'lb';
  const opts = lb
    ? [1.25, 2.5, 5, 10].map(v => [Math.round(v*LB_KG*1000)/1000, v + ' lb'])
    : [0.5, 1, 2, 2.5, 5].map(v => [v, String(v).replace('.',',') + ' kg']);
  let html = `<option value="auto" ${cur == null ? 'selected' : ''}>Auto</option>`;
  let matched = cur == null;
  for(const [kg, label] of opts){
    const sel = cur != null && Math.abs(cur - kg) < 0.01;
    if(sel) matched = true;
    html += `<option value="${kg}" ${sel ? 'selected' : ''}>${label}</option>`;
  }
  if(!matched) html += `<option value="${cur}" selected>Actual: ${fmtW(cur)} ${uLabel()}</option>`;
  return html;
}
function openSplitConf(){ view.splitConf = true; render(); }
/* con la sesión en curso, cambiar las series del split ajusta las filas ya
   creadas: crecen con filas vacías, y solo se quitan colas SIN anotar */
function syncActiveSets(key){
  if(!db.active) return;
  const want = splitSetsOverride(key);
  if(!want) return;
  for(const ex of db.active.exercises){
    if(ex.key !== key) continue;
    while(ex.sets.length < want) ex.sets.push({ w:'', r:'', rir:'' });
    while(ex.sets.length > want){
      const last = ex.sets[ex.sets.length - 1];
      if(last.done || (last.w !== '' && last.w !== undefined) ||
         (last.r !== '' && last.r !== undefined)) break;   /* lo anotado jamás se borra */
      ex.sets.pop();
    }
  }
}
/* escribir la config por split del ejercicio (rango, series, descanso) */
function setSplitConf(key, field, val){
  const sp = db.splits.find(x => x.id === ctxSplitId());
  if(!sp) return;
  if(!sp.exconf || typeof sp.exconf !== 'object') sp.exconf = {};
  const oc = sp.exconf[key] || (sp.exconf[key] = {});
  const v = parseInt(val, 10);
  if(val === '' || val === 'auto' || isNaN(v) || v < 1) delete oc[field];
  else oc[field] = v;
  if(!Object.keys(oc).length) delete sp.exconf[key];
  refreshActiveSugg(key);
  if(field === 'sets') syncActiveSets(key);
  save();
}
function setExNotes(key, val){ exMeta(key).notes = val.slice(0,300); save(); }
function setExRest(key, val){
  exMeta(key).rest = (val === 'auto') ? null : parseInt(val,10);
  save();
}
function setExMuscle(key, val){ exMeta(key).muscle = val; save(); }
function setExCap(key, val){
  withExChange(key, () => {
    const v = parseFloat(val);
    exMeta(key).cap = (isNaN(v) || v <= 0) ? null : Math.round(toKgEx(key, v)*1000)/1000;
  });
}

/* ---------- SESIÓN ACTIVA ---------- */
/* un ejercicio terminado = todas sus series marcadas o con reps anotadas */
function exDone(ex){
  return ex.sets.length > 0 && ex.sets.every(st => st.done || parseInt(st.r, 10) > 0);
}
/* solo un ejercicio abierto a la vez: el primero sin terminar, o el que elijas */
function sessionOpenIdx(){
  const s = db.active;
  if(typeof s.open === 'number' && s.exercises[s.open]) return s.open;
  const i = s.exercises.findIndex(ex => !exDone(ex));
  return i < 0 ? 0 : i;
}
function openSessionEx(i){
  db.active.open = i; save(); render();
  setTimeout(() => {
    const el = document.getElementById('exb-' + i);
    if(el && el.scrollIntoView) el.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 60);
}
/* el check cierra la serie y arranca el descanso */
function toggleSetDone(xi, si){
  const ex = db.active.exercises[xi];
  const st = ex.sets[si];
  if(st.done){ st.done = false; save(); render(); return; }
  const r = parseInt(st.r, 10);
  if(isNaN(r) || r <= 0){
    const row = document.getElementById(`set-${xi}-${si}`);
    const inp = row && row.querySelectorAll ? row.querySelectorAll('input')[1] : null;
    if(inp && inp.focus) inp.focus();
    return;
  }
  st.done = true;
  db.active.lastLog = Date.now();
  if(!restUntil) startRestAuto(ex.key);
  if(ex.sets.every(x => x.done)){
    const next = db.active.exercises.findIndex((e, i) => i !== xi && !exDone(e));
    if(next >= 0) db.active.open = next;
  }
  save(); render();
}
function editExNotes(xi){
  const ex = db.active.exercises[xi];
  openModal(`

    <button class="btn" style="margin-top:16px" onclick="saveExNotes('${ex.key}')">Guardar</button>

/* peso objetivo de hoy: lo escrito en la serie 1, o lo que sugiere el coach */
function targetWeight(ex){
  const typed = parseFloat(ex.sets[0] && ex.sets[0].w);
  if(!isNaN(typed) && typed > 0) return toKgEx(ex.key, typed);
  if(ex.sugg && ex.sugg.w > 0) return ex.sugg.w;
  return NaN;
}
/* la tira de «cómo cargar» que se cuela bajo el veredicto */

    p.kind === 'placas'

/* abrir la ficha desde la sesión, sin pasar por la rutina.
   Recuerda de dónde vienes para que «volver» te devuelva ahí. */
function openExerciseByKey(key, from){
  for(const r of db.routines){
    const ex = r.exercises.find(e => e.key === key);
    if(ex){ go({ name:'exercise', key, exname:ex.name, rid:r.id, from }); return; }
  }
  const a = db.active && db.active.exercises.find(e => e.key === key);
  if(a) go({ name:'exercise', key, exname:a.name, rid:(db.active.routineId || ''), from });
}
function openExFromSession(xi){
  const ex = db.active && db.active.exercises[xi];
  if(ex) openExerciseByKey(ex.key, 'session');
}

/* al tocar algo de la ficha con una sesión en curso, la sugerencia de hoy
   se recalcula al vuelo: si acabas de decir que es de placas, el coach
   deja de proponer kilos que esa máquina no tiene */
function refreshActiveSugg(key){
  if(!db.active) return;
  for(const ex of db.active.exercises){
    if(ex.key !== key) continue;
    let sg = computeSuggestion(key);
    if(db.active.deload) sg = deloadSugg(key, sg);
    ex.sugg = sg;
  }
}
/* convertir lo escrito a otra unidad SIN acumular error de redondeo:
   la primera conversión fija el peso canónico en kg (st.wkg) y todas
   las siguientes parten de ahí — 10 lb → 4,54 kg → 10 lb, no 10,01.
   Re-escribir el peso borra el canónico (setVal), porque el número
   nuevo es la verdad nueva. */
function convertTypedW(st, uAntes, uAhora){
  if(st.w === '' || st.w === undefined) return;
  const n = parseFloat(st.w);
  if(isNaN(n)) return;
  let kg = parseFloat(st.wkg);
  if(isNaN(kg)) kg = uAntes === 'lb' ? n * LB_KG : n;
  st.wkg = kg;
  const out = uAhora === 'lb' ? kg / LB_KG : kg;
  st.w = String(Math.round(out * 100) / 100);
}
/* si el cambio mueve la unidad del ejercicio (una torre en libras), lo ya
   escrito en la sesión se convierte para que siga significando lo mismo */
function withExChange(key, fn){
  const antes = exUnit(key);
  fn();
  const ahora = exUnit(key);
  if(antes !== ahora && db.active){
    for(const ex of db.active.exercises){
      if(ex.key !== key) continue;
      for(const st of ex.sets) convertTypedW(st, antes, ahora);
    }
  }
  refreshActiveSugg(key);
  save();
}

/* series de los últimos 7 días por grupo muscular + desbalance empuje/jalón (14 días) */
function volumeCardHTML(){
  const now = Date.now();
  const cut7 = new Date(now - 7*864e5).toISOString();
  const cut14 = new Date(now - 14*864e5).toISOString();
  const counts = {}; let untagged = 0, push = 0, pull = 0, any = false;
  for(const h of db.history){
    if(h.date < cut14) continue;
    for(const e of h.entries){
      const m = exMeta(e.key).muscle;
      const n = e.sets.length;
      if(h.date >= cut7){
        any = true;
        if(!m || m === 'none') untagged += n;
        else counts[m] = (counts[m]||0) + n;
      }
      if(m && PUSH_G.includes(m)) push += n;
      if(m && PULL_G.includes(m)) pull += n;
    }
  }
  if(!any) return '';
  /* ordenadas por volumen, no alfabéticamente */
  const rows = MUSCLES.filter(([k]) => counts[k])
    .sort((a,b) => counts[b[0]] - counts[a[0]])
    .map(([k,l]) => {
      const c = counts[k];
      const pct = Math.min(100, c/20*100);
      const cls = c > 20 ? 'hi' : (c >= 10 ? 'ok' : '');
      const tag = c > 20 ? 'alto' : (c >= 10 ? 'óptimo' : 'bajo');
      return `<div class="vol">
        <span class="vol-n">${l}</span>
        <span class="vol-track"><span class="vol-fill ${cls}" style="width:${pct}%;display:block"></span></span>
        <span class="vol-v"><b>${c}</b> ${tag}</span>
      </div>`;
    }).join('');

  let imb = '';
  if(push + pull >= 24 && (push > pull*1.75 || pull > push*1.75)){
    const masEmpuje = push > pull;
    imb = `<div class="note">
      <div class="note-t">Empuje ${push} · jalón ${pull}</div>
      <div class="note-d">Llevas casi el doble de ${masEmpuje?'empuje':'jalón'} que de ${masEmpuje?'jalón':'empuje'} en 14 días.
        Empuje = pecho/hombros/tríceps · jalón = espalda/bíceps. Mantenerlos cerca de 1:1 protege tus hombros:
        suma ${masEmpuje?'remos y jalones':'presses y aperturas'}.</div>
    </div>`;
  }
  return `
    <div class="sect">Series por grupo · 7 días</div>
    ${rows || '<div class="muted">Asigna un grupo muscular a tus ejercicios (tocándolos en su rutina) para ver este resumen.</div>'}
    ${rows ? '<div class="hint">La zona óptima está entre 10 y 20 series semanales por grupo.</div>' : ''}
    ${untagged ? `<div class="hint">${untagged} series sin grupo asignado.</div>` : ''}
    ${imb}`;
}

/* =====================================================================
   HISTORIAL — el panel arriba, el diario abajo
   Primero la respuesta a «¿cómo voy?»: la semana en curso y la fuerza de
   tus levantamientos con su curva. Después «¿qué hice el martes?»: las
   sesiones agrupadas por semana, con los récords marcados.
   ===================================================================== */
/* el lunes de la semana de una fecha */
function weekStart(d){
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
/* «Esta semana», «Semana pasada», «Hace 3 semanas»: lo primero que uno
   quiere saber al bajar por la lista es a qué distancia está mirando */
function weekLabel(ws){
  const diff = Math.round((weekStart(new Date()) - ws) / (7 * 864e5));
  if(diff <= 0) return 'Esta semana';
  if(diff === 1) return 'Semana pasada';
  if(diff < 9) return `Hace ${diff} semanas`;
  const m = Math.round(diff / 4.345);
  return `Hace ${m} ${m === 1 ? 'mes' : 'meses'}`;
}
/* y debajo, las fechas exactas: «1 – 7 sep», «28 ago – 3 sep» */
function weekRange(ws){
  const fin = new Date(ws); fin.setDate(fin.getDate() + 6);
  const mismoMes = ws.getMonth() === fin.getMonth();
  const f = (d, conMes) => d.toLocaleDateString('es',
    conMes ? { day:'numeric', month:'short' } : { day:'numeric' }).replace('.', '');
  const anio = ws.getFullYear() !== new Date().getFullYear() ? ` ${ws.getFullYear()}` : '';
  return `${f(ws, !mismoMes)} – ${f(fin, true)}${anio}`;
}
/* volumen semana a semana, la última es la que está en curso */
function weeklyVolumes(n){
  const base = weekStart(new Date()), out = [];
  for(let i = n - 1; i >= 0; i--){
    const a = new Date(base); a.setDate(a.getDate() - i * 7);
    const b = new Date(a);    b.setDate(b.getDate() + 7);
    let vol = 0, ses = 0;
    for(const h of db.history){
      const t = new Date(h.date);
      if(t >= a && t < b){ ses++; vol += sessionVolume(h.entries); }
    }
    out.push({ start:a, vol, ses, current: i === 0 });
  }
  return out;
}
/* tus levantamientos principales: los que más repites, con su 1RM estimado */
function topLifts(n){
  const cut = new Date(Date.now() - 70 * 864e5).toISOString();
  const per = new Map();
  for(const h of db.history){
    if(h.deload || h.date < cut) continue;
    for(const e of h.entries){
      if(exMeta(e.key).type !== 'normal') continue;
      const v = bestE1RM(e.sets);
      if(!(v > 0)) continue;
      if(!per.has(e.key)) per.set(e.key, { key:e.key, name:e.name, vals:[], first:h.date, last:h.date });
      const o = per.get(e.key);
      o.vals.push(v); o.last = h.date;
      if(h.date < o.first) o.first = h.date;
    }
  }
  return [...per.values()]
    .filter(o => o.vals.length >= 3)
    .sort((a, b) => b.vals.length - a.vals.length ||
                    b.vals[b.vals.length-1] - a.vals[a.vals.length-1])
    .slice(0, n || 3);
}
/* la sesión anterior del mismo día del split, para comparar */
function prevSameRoutine(h){
  let best = null;
  for(const x of db.history){
    if(x.id === h.id || x.deload || x.date >= h.date) continue;
    const same = x.routineId ? x.routineId === h.routineId : x.routineName === h.routineName;
    if(same && (!best || x.date > best.date)) best = x;
  }
  return best;
}

function histPanelHTML(){
  const wk = weeklyVolumes(9);
  const cur = wk[wk.length - 1];
  const cerradas = wk.slice(0, -1).filter(w => w.vol > 0);
  const media = cerradas.length ? cerradas.reduce((a, w) => a + w.vol, 0) / cerradas.length : 0;
  const max = Math.max(...wk.map(w => w.vol), 1);

  let sub;
  if(!cur.ses){
    sub = media > 0
      ? `Todavía no entrenas esta semana. Tu media de las últimas ${cerradas.length} es <b>${fmtInt(fromKg(media))} ${uLabel()}</b>.`
      : `Todavía no entrenas esta semana.`;
  } else if(media > 0){
    const pct = Math.round(cur.vol / media * 100);
    sub = `${nSesiones(cur.ses)} · vas por el <b>${pct} %</b> de tu media
           (${fmtInt(fromKg(media))} ${uLabel()}).`;
  } else {
    sub = `${nSesiones(cur.ses)}. Tu primera semana de registro: desde aquí se mide todo lo demás.`;
  }

  const barras = wk.map(w => `<span class="${w.current ? 'now' : ''}"
    style="height:${Math.max(2, Math.round(w.vol / max * 100))}%"
    title="${fmtInt(fromKg(w.vol))} ${uLabel()}"></span>`).join('');

  const lifts = topLifts(3).map(o => {
    const ahora = o.vals[o.vals.length - 1], antes = o.vals[0];
    const d = ahora - antes;
    const sem = Math.max(1, Math.round((new Date(o.last) - new Date(o.first)) / (7 * 864e5)));
    const signo = d >= 0 ? '+' : '−';
    return `<button class="hp-lift" onclick="openExerciseByKey('${o.key}')">
      <span class="n">${esc(exBaseName(o.name))}
        <i class="${Math.abs(d) < 0.05 ? 'flat' : ''}">${Math.abs(d) < 0.05
          ? `sin cambios en ${sem} semana${sem===1?'':'s'}`
          : `${signo}${fmtE1RM(o.key, Math.abs(d))} en ${sem} semana${sem===1?'':'s'}`}</i></span>
      ${sparkSVG(o.vals.slice(-8), '#D7A44B', { w:78, h:20, p:4, r:3.2 })}
      <span class="v">${fmtE1RM(o.key, ahora)}<i>${uLabelEx(o.key)}</i></span>
    </button>`;
  }).join('');

  return `
    <div style="margin-top:18px">
      <div class="hp-lbl">Peso movido · semana en curso</div>
      <div class="hp-n"><b>${fmtInt(fromKg(cur.vol))}</b><i>${uLabel()}</i></div>
      <div class="hp-sub">${sub}</div>
      ${ max > 1 ? `<div class="hp-bars">${barras}</div>
      <div class="hp-ax"><span>Hace ${wk.length - 1} semanas</span><span>En curso</span></div>` : '' }
    </div>
    ${ lifts ? `<div class="sect">Tu fuerza · 1RM estimado</div>${lifts}
      <div class="hint">Toca cualquiera para ver su ficha y su gráfica completa.</div>` : '' }
    ${ volumeCardHTML() }`;
}

function histDiaryHTML(){

      html += `<div class="hd-wk${html ? '' : ' first'}">

  db.progress = {};
  for(const h of db.history){
    if(h.deload) continue;   /* las descargas no alimentan la progresión */
    for(const e of h.entries) updateProgress(e.key, e.sets, h.date);
  }
  save();
}
function deleteSession(id){

    `${fmtDate(h.date)} · ${h.entries.reduce((a,e)=>a+e.sets.length,0)} series. Las sugerencias del coach se recalculan sin ella. No se puede deshacer.`,
    'Borrar sesión', () => {

function editSession(id){
  const h = db.history.find(x => x.id === id);
  if(!h) return;
  /* el modelo de edición vive SIEMPRE en la unidad activa (strings);
     se convierte a kg una sola vez al guardar — así re-renderizar es seguro */
  window.__edit = {

    entries: h.entries.map(e => ({
      key: e.key, name: e.name,
      sets: e.sets.map(st => ({
        w: st.w != null ? inputWEx(e.key, st.w) : '',

function renderEditModal(){
  const ed = window.__edit;
  if(!ed) return;
  openModal(`

      que olvidaste o quita la que sobra. Al guardar, las sugerencias del coach se recalculan
      con los datos corregidos.</p>
    <div class="stack">
    ${ed.entries.map((e, ei) => `
      <div>
        <div class="ex-title" style="margin-bottom:2px">${exTitleHTML(e.name)}</div>
        <div class="grid-h" style="grid-template-columns:14px 1fr 1fr .8fr 20px">
          <span>#</span><span>${uLabelEx(e.key)}</span><span>reps</span><span>rir</span><span></span></div>
        ${e.sets.map((st, si) => `
          <div class="set" style="grid-template-columns:14px 1fr 1fr .8fr 20px">
            <span class="i">${si+1}</span>
            <input class="cell" type="number" inputmode="decimal" step="any" min="0" value="${st.w}"
              aria-label="Peso en ${uLabelEx(e.key)}" oninput="editVal(${ei},${si},'w',this.value)">
            <input class="cell" type="number" inputmode="numeric" step="1" min="0" value="${st.r}"
              aria-label="Reps" oninput="editVal(${ei},${si},'r',this.value)">
            <input class="cell" type="number" inputmode="numeric" step="1" min="0" max="9" value="${st.rir}" placeholder="–"
              aria-label="RIR" oninput="editVal(${ei},${si},'rir',this.value)">
            <button class="xbtn" aria-label="Quitar serie" onclick="editRemoveSet(${ei},${si})">✕</button>
          </div>`).join('')}
        <button class="addex" style="padding:11px;margin-top:4px" onclick="editAddSet(${ei})">+ Agregar serie</button>
      </div>`).join('')}

    <button class="btn ghost" style="margin-top:8px" onclick="closeModal()">Cancelar</button>`);

function editVal(ei, si, field, val){ window.__edit.entries[ei].sets[si][field] = val; }
function editAddSet(ei){
  const e = window.__edit.entries[ei];
  /* prellenar con la última serie: la olvidada casi siempre es "una más igual" */
  const prev = e.sets[e.sets.length - 1];
  e.sets.push(prev ? { w: prev.w, r: prev.r, rir: '' } : { w:'', r:'', rir:'' });
  renderEditModal();
}
function editRemoveSet(ei, si){
  window.__edit.entries[ei].sets.splice(si, 1);
  renderEditModal();
}
function saveEditedSession(){
  const ed = window.__edit;
  if(!ed) return;
  const entries = [];
  for(const e of ed.entries){
    const sets = e.sets.map(st => {
      let w = parseFloat(st.w);
      if(!isNaN(w)) w = Math.round(toKgEx(e.key, w)*1000)/1000;   /* en la unidad de su máquina → kg */
      const r = parseInt(st.r,10), rir = parseInt(st.rir,10);
      const out = { w, r };
      if(!isNaN(rir)) out.rir = Math.min(9, Math.max(0, rir));
      return out;
    }).filter(st => !isNaN(st.w) && st.w >= 0 && !isNaN(st.r) && st.r > 0);
    if(sets.length) entries.push({ key: e.key, name: e.name, sets });
  }
  window.__edit = null;
  closeModal();
  if(!entries.length){ deleteSession(ed.id); return; }   /* quedó vacía → ofrecer borrarla */
  const h = db.history.find(x => x.id === ed.id);
  h.entries = entries;
  rebuildProgress(); render();
}

/* =====================================================================
   GIMNASIOS
   Cada gimnasio es una plantilla completa: su equipo (discos, barras,
   mancuernas), su unidad y la configuración de SUS máquinas — torres,
   saltos, topes, peso de aparatos. Cambiar de gimnasio ajusta todo de
   golpe; la progresión y el historial no se tocan porque viven en el
   ejercicio, siempre en kg.
   La config de máquinas del gimnasio ACTIVO vive en db.exmeta (como en
   la 1.0); al cambiar se guarda una foto en gym.machines y se aplica la
   del gimnasio nuevo. Así el motor sigue leyendo de un solo sitio.
   ===================================================================== */
const MACHINE_FIELDS = ['equip','points','base','bar','step','cap','stack'];
/* lo que un ejercicio tiene configurado de SU máquina; null si nada */
function machineSnapshot(m){
  const out = {}; let any = false;
  for(const f of MACHINE_FIELDS){
    let v = m[f];
    if(f === 'stack') v = (v && (v.unit != null || v.step != null || v.start != null || v.extra != null))
      ? { unit: v.unit ?? null, step: v.step ?? null, start: v.start ?? null,
          extra: v.extra ?? null, extraMax: v.extraMax ?? null } : null;
    if(v !== null && v !== undefined){ out[f] = v; any = true; }
  }
  return any ? out : null;
}
/* la foto del gimnasio activo: el equipo ya vive ahí, se congela lo de exmeta */
function snapshotActiveGym(){
  const g = db.gym;
  g.machines = {};
  for(const k in db.exmeta){
    const snap = machineSnapshot(db.exmeta[k]);
    if(snap) g.machines[k] = snap;
  }
  g.unit = db.settings.unit;
}
/* volcar las máquinas de un gimnasio sobre exmeta; lo no configurado se
   limpia y el implemento se vuelve a adivinar del nombre */
function applyGymMachines(g){
  const keys = new Set([...Object.keys(db.exmeta), ...Object.keys(g.machines)]);
  for(const k of keys){
    const m = exMeta(k), mc = g.machines[k] || null;
    m.equip  = (mc && EQUIP[mc.equip]) ? mc.equip : guessEquip(k);
    m.points = (mc && mc.points != null) ? mc.points : null;
    m.base   = (mc && mc.base   != null) ? mc.base   : null;
    m.bar    = (mc && mc.bar    != null) ? mc.bar    : null;
    m.step   = (mc && mc.step   != null) ? mc.step   : null;
    m.cap    = (mc && mc.cap    != null) ? mc.cap    : null;
    m.stack  = (mc && mc.stack)
      ? { unit: mc.stack.unit ?? null, step: mc.stack.step ?? null, start: mc.stack.start ?? null,
          extra: mc.stack.extra ?? null, extraMax: mc.stack.extraMax ?? null }
      : { unit:null, step:null, start:null };
  }
}
function setActiveGym(id){
  if(id === db.settings.gymId || !db.gyms.some(g => g.id === id)) return;
  /* con sesión en curso: recordar la unidad de cada ejercicio para convertir lo escrito */
  const antes = {};
  if(db.active) for(const ex of db.active.exercises) antes[ex.key] = exUnit(ex.key);
  snapshotActiveGym();
  db.settings.gymId = id;
  const g = db.gym;
  applyGymMachines(g);
  db.settings.unit = g.unit === 'lb' ? 'lb' : 'kg';
  invalidatePlates();
  if(db.active){
    for(const ex of db.active.exercises){
      const ahora = exUnit(ex.key);
      if(antes[ex.key] && antes[ex.key] !== ahora){
        for(const st of ex.sets) convertTypedW(st, antes[ex.key], ahora);
      }
      refreshActiveSugg(ex.key);
    }
  }
  save(); render();
}
function gymMachineCount(g){
  if(g.id === db.settings.gymId){
    let n = 0;
    for(const k in db.exmeta) if(machineSnapshot(db.exmeta[k])) n++;
    return n;
  }
  return Object.keys(g.machines || {}).length;
}
function gymSummary(g){
  const n = gymMachineCount(g);
  return `${g.unit === 'lb' ? 'Libras' : 'Kilos'} · ${n
    ? `${n} ejercicio${n===1?'':'s'} configurado${n===1?'':'s'}`
    : 'máquinas sin configurar'}`;
}

/* ---------- compartir: el perfil .json de un gimnasio ---------- */
function gymProfile(id){
  const g = db.gyms.find(x => x.id === id);
  if(!g) return null;
  if(g.id === db.settings.gymId) snapshotActiveGym();
  return { app:'hierro', kind:'gimnasio', version:APP_VERSION,
    gym: JSON.parse(JSON.stringify({ name:g.name, unit:g.unit, plates:g.plates,
      bars:g.bars, dumbbells:g.dumbbells, machines:g.machines })) };
}
function exportGym(id){
  const prof = gymProfile(id);
  if(!prof) return;
  const slug = prof.gym.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'perfil';
  const blob = new Blob([JSON.stringify(prof)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `hierro-gimnasio-${slug}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
function importGymFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onerror = () => infoModal('No se pudo leer el archivo', 'Vuelve a intentarlo.');
  reader.onload = () => {
    try{
      const d = JSON.parse(String(reader.result));
      if(!d || d.kind !== 'gimnasio' || !d.gym || typeof d.gym !== 'object') throw new Error('estructura');
      confirmGymImport(d);
    }catch(e){
      infoModal('Archivo no válido', 'No parece un gimnasio de Hierro (el .json que se comparte desde Ajustes → Mi equipo → Gimnasio).');
    }
  };
  reader.readAsText(file);
}
function confirmGymImport(d){
  window.__gymImport = d;
  const n = Object.keys(d.gym.machines || {}).length;
  confirmModal(`¿Agregar el gimnasio “${esc(d.gym.name || 'Sin nombre')}”?`,
    `Trae su equipo${n ? ` y la configuración de ${n} ejercicio${n===1?'':'s'}` : ''}. Se agrega como
     un gimnasio más y te cambia ahí — tus rutinas y tu historial no se tocan.`,
    'Agregar y entrenar ahí', applyGymImport, true);
}

  const g = normGym(JSON.parse(JSON.stringify(d.gym)), db.settings.unit);
  g.id = uid();   /* nunca chocar con uno ya existente */
  db.gyms.push(g);
  save();
  setActiveGym(g.id);
}

/* ¿esta lista sigue siendo el juego estándar intacto de esa unidad?
   (mismos pesos, mismos pares, nada agregado ni destildado) */
function gymKindPristine(kind, unit){
  const cur = db.gym[kind], def = defaultGym(unit)[kind];
  if(!Array.isArray(cur) || cur.length !== def.length) return false;
  return cur.every((x, i) => {
    const d = def[i];
    if(x.custom || Math.abs(x.kg - d.kg) > 1e-6) return false;
    if(kind === 'plates') return x.on === d.on && x.pairs === d.pairs;
    if(kind === 'bars')   return x.on === d.on && x.def === d.def;
    return x.on === d.on;
  });
}
/* rehacer una lista con el juego estándar de la unidad actual: el remedio
   para un inventario EDITADO que se sembró en la otra unidad */
function askResetGymKind(kind){
  const t = { plates:'los discos', bars:'las barras', dumbbells:'las mancuernas' }[kind];
  confirmModal(`¿Restaurar ${t}?`,
    `Se reemplaza la lista actual de este gimnasio por el juego estándar en
     ${uLabel() === 'lb' ? 'libras' : 'kilos'}. Lo que agregaste o destildaste a mano se pierde.`,
    'Restaurar', () => {
      db.gym[kind] = defaultGym(db.settings.unit)[kind];
      if(kind === 'plates') invalidatePlates();
      save(); render();
    }, true);
}

function toggleGym(kind, i){
  const it = db.gym[kind][i];
  if(!it) return;
  it.on = !it.on;
  if(kind === 'bars' && !it.on && it.def){
    it.def = false;
    const next = db.gym.bars.find(b => b.on);
    if(next) next.def = true;
  }
  if(kind === 'plates') invalidatePlates();
  save(); render();
}
function setPairs(i, delta){
  const p = db.gym.plates[i];
  if(!p) return;
  p.pairs = Math.max(1, Math.min(20, (p.pairs || 1) + delta));
  invalidatePlates(); save(); render();
}
function setDefaultBar(i){
  db.gym.bars.forEach((b, j) => { b.def = (j === i); });
  save(); render();
}
function removeGym(kind, i){
  db.gym[kind].splice(i, 1);
  if(kind === 'plates') invalidatePlates();
  if(kind === 'bars' && !db.gym.bars.some(b => b.def)){
    const next = db.gym.bars.find(b => b.on);
    if(next) next.def = true;
  }
  save(); render();
}
function promptGymItem(kind){
  const t = { plates:'disco', bars:'barra', dumbbells:'mancuerna' }[kind];
  openModal(`
    <h2>Agregar ${t}</h2>
    <p class="muted">Para lo que se sale del catálogo estándar: discos fraccionales, una barra vieja,
      mancuernas sueltas. El peso se escribe en ${uLabel()}.</p>
    <form onsubmit="addGymItem(event,'${kind}')" class="stack" autocomplete="off">
      ${kind === 'bars' ? `<div class="field"><span>Nombre</span>
        <input type="text" id="gymName" placeholder="Ej. Barra de trap" autocomplete="off"></div>` : ''}
      <div class="field"><span>Peso (${uLabel()})</span>
        <input type="number" inputmode="decimal" step="any" min="0" id="gymW" placeholder="0"></div>
      <button class="btn" type="submit">Agregar</button>
      <button class="btn ghost" type="button" onclick="closeModal()">Cancelar</button>
    </form>`);
  setTimeout(() => document.getElementById(kind === 'bars' ? 'gymName' : 'gymW')?.focus(), 60);
}
function addGymItem(ev, kind){
  ev.preventDefault();
  const v = parseFloat(document.getElementById('gymW').value);
  if(isNaN(v) || v <= 0) return;
  const kg = Math.round(toKg(v) * 1000) / 1000;
  if(db.gym[kind].some(x => Math.abs(x.kg - kg) < 1e-9)){
    closeModal();
    infoModal('Ya lo tienes', `${fmtW(kg)} ${uLabel()} ya está en la lista.`);
    return;
  }
  if(kind === 'plates') db.gym.plates.push({ kg, pairs:1, on:true, custom:true });
  else if(kind === 'bars'){
    const nm = (document.getElementById('gymName').value || '').trim();
    db.gym.bars.push({ id:uid(), name: nm || `Barra de ${fmtW(kg)} ${uLabel()}`, kg, on:true, def:false, custom:true });
  }
  else db.gym.dumbbells.push({ kg, on:true, custom:true });
  if(kind === 'plates') invalidatePlates();
  save(); closeModal(); render();
}
function applyDbRange(){
  const from = parseFloat(document.getElementById('dbFrom').value);
  const to   = parseFloat(document.getElementById('dbTo').value);
  const step = parseFloat(document.getElementById('dbStep').value);
  if(isNaN(from) || isNaN(to) || isNaN(step) || step <= 0 || to < from){
    infoModal('Rango no válido', 'Revisa los tres números: el salto tiene que ser mayor que cero y el final no puede ser menor que el inicio.');
    return;
  }
  if((to - from) / step > 200){
    infoModal('Rango demasiado largo', 'Salen más de 200 mancuernas. Sube el salto o acorta el rango.');
    return;
  }
  confirmModal('¿Rehacer la lista?',
    `Se reemplazan las mancuernas actuales por el rango ${fmtNum(from)} – ${fmtNum(to)} ${uLabel()} de ${fmtNum(step)} en ${fmtNum(step)}. Las que destildaste se pierden.`,
    'Generar', () => {
      const out = [];
      for(let v = from; v <= to + 1e-9; v += step)
        out.push({ kg: Math.round(toKg(v) * 1000) / 1000, on:true });
      db.gym.dumbbells = out;
      save(); render();
    }, true);
}

function addExercise(ev, rid){
  ev.preventDefault();
  const inp = document.getElementById('newex');
  const name = inp.value.trim();
  if(!name) return;
  const r = db.routines.find(x => x.id === rid);
  const key = exKey(name);
  if(r.exercises.some(e => e.key === key)){
    inp.value = ''; acHide();
    infoModal('Ya está en la rutina', `“${esc(name)}” ya es parte de esta rutina.`);
    return;
  }
  /* si ya existe en otra rutina/historial, reusar su nombre exacto para unir historiales */
  const known = allExerciseNames().get(key);
  r.exercises.push({ id:uid(), name: known ? known.name : name, key });
  if(/assisted|asistid/i.test(name)) exMeta(key).type = 'asistido';
  if(!exMeta(key).muscle){ const g = guessMuscle(name); if(g) exMeta(key).muscle = g; }
  if(!exMeta(key).equip){ const e = guessEquip(name); if(e) exMeta(key).equip = e; }
  save(); render();
  setTimeout(() => { const i = document.getElementById('newex'); if(i){ i.focus(); } }, 30);
}

/* ---------- autocompletado de ejercicios ---------- */
function allExerciseNames(){
  const seen = new Map();   /* key → { name, src } */
  for(const r of db.routines) for(const ex of r.exercises)
    if(!seen.has(ex.key)) seen.set(ex.key, { name: ex.name, src: r.name });
  for(const h of db.history) for(const e of h.entries)
    if(!seen.has(e.key)) seen.set(e.key, { name: e.name, src: 'historial' });
  return seen;
}
function acNorm(s){
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}
/* resalta la coincidencia sobre el nombre original (ignora acentos/mayúsculas) */
function acHighlight(name, q){
  const map = []; let norm = '';
  for(let i = 0; i < name.length; i++){
    const c = acNorm(name[i]);
    for(const ch of c){ norm += ch; map.push(i); }
  }
  const idx = norm.indexOf(q);
  if(idx < 0 || !q) return esc(name);
  const a = map[idx], b = map[idx + q.length - 1] + 1;
  return esc(name.slice(0,a)) + '<b>' + esc(name.slice(a,b)) + '</b>' + esc(name.slice(b));
}
function acUpdate(rid){
  const inp = document.getElementById('newex');
  const list = document.getElementById('aclist');
  if(!inp || !list) return;
  const q = acNorm(inp.value.trim());
  if(!q){ list.style.display = 'none'; return; }
  const r = db.routines.find(x => x.id === rid);
  const inRoutine = new Set(r ? r.exercises.map(e => e.key) : []);

  for(const [key, info] of allExerciseNames()){
    if(inRoutine.has(key)) continue;
    const idx = acNorm(info.name).indexOf(q);
    if(idx < 0) continue;
    /* ranking: empieza igual < empieza una palabra < contiene */
    const norm = acNorm(info.name);
    const rank = idx === 0 ? 0 : (norm[idx-1] === ' ' || norm[idx-1] === '(' ? 1 : 2);
    cands.push({ key, name: info.name, src: info.src, rank });
  }
  cands.sort((a,b) => a.rank - b.rank || a.name.localeCompare(b.name));
  const top = cands.slice(0, 6);
  window.__ac = top;
  if(!top.length){ list.style.display = 'none'; return; }
  list.innerHTML = top.map((c, i) => `
    <button type="button" role="option" onmousedown="event.preventDefault(); acPick('${rid}',${i})">
      <span>${acHighlight(c.name, q)}</span>
      <span class="from">${esc(c.src)}</span>
    </button>`).join('');
  list.style.display = '';
}

/* comparación en vivo del volumen del ejercicio contra su última sesión */
function vsLastInfo(xi){
  const ex = db.active.exercises[xi];
  const meta = exMeta(ex.key);
  if(meta.type === 'asistido') return null;      /* menos ayuda ≠ menos volumen */
  const last = lastEntry(ex.key);
  if(!last) return null;
  const repsMode = meta.type === 'corporal' || meta.type === 'tiempo';
  const prevVol = last.entry.sets.reduce((a,s) => a + (repsMode ? s.r : s.w * s.r), 0);
  if(prevVol <= 0) return null;
  let vol = 0, done = 0;
  for(const st of ex.sets){
    const r = parseInt(st.r, 10);
    if(isNaN(r) || r <= 0) continue;
    if(repsMode){ vol += r; done++; }
    else {
      const w = parseFloat(st.w);
      if(!isNaN(w) && w >= 0){ vol += toKgEx(ex.key, w) * r; done++; }
    }
  }
  if(!done) return null;
  return { pct: Math.round(vol / prevVol * 100), beat: vol > prevVol };
}
function updateVsChip(xi){
  const el = document.getElementById('vs-' + xi);
  if(!el) return;
  const info = vsLastInfo(xi);
  if(!info){ el.textContent = ''; return; }
  el.style.color = info.beat ? 'var(--up)' : 'var(--dim)';
  el.textContent = info.beat
    ? `Superaste el volumen de la última sesión · ${info.pct} %`
    : `Volumen vs última sesión · ${info.pct} %`;
}

function syncPlaceholders(xi){
  const ex = db.active.exercises[xi];

  ex.sets.forEach((st, si) => {
    const filledW = st.w !== '' && st.w !== undefined;
    const filledR = st.r !== '' && st.r !== undefined;
    if(filledW) lastW = st.w;
    if(filledR) lastR = st.r;
    const row = document.getElementById(`set-${xi}-${si}`);
    if(!row || !row.querySelectorAll) return;
    const inps = row.querySelectorAll('input');
    if(!filledW && inps[0] && lastW !== '') inps[0].placeholder = lastW;
    if(!filledR && inps[1] && lastR !== '') inps[1].placeholder = lastR;
  });
}
