<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#08080A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hierro">
<meta name="color-scheme" content="dark">
<title>Hierro — tu registro de gimnasio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --void:#08080A;
    --surface:#0E0F11;
    --surface-2:#141619;
    --well:#1B1E22;
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.13);
    --bone:#F3F1EC;
    --ash:#9A9DA4;
    --dim:#5F6268;
    --up:#7FD3A8;
    --hold:#D7A44B;
    --danger:#E4685A;
    --sans:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  html,body{height:100%}
  body{
    background:var(--void);color:var(--bone);
    font-family:var(--sans);font-synthesis:none;
    font-size:15px;line-height:1.5;
    overscroll-behavior-y:contain;
  }
  #app{
    max-width:460px;margin:0 auto;min-height:100dvh;
    display:flex;flex-direction:column;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }
  main{flex:1;padding:0 20px 32px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .num{font-variant-numeric:tabular-nums}
  .grow{flex:1;min-width:0}
  .row{display:flex;align-items:center;gap:10px}
  .stack{display:flex;flex-direction:column;gap:10px}

  /* ---------- moleteado (textura de barra) ---------- */
  .knurl{
    height:7px;flex:none;
    background-image:
      repeating-linear-gradient(45deg,var(--line-2) 0 1px,transparent 1px 5px),
      repeating-linear-gradient(-45deg,var(--line-2) 0 1px,transparent 1px 5px);
    opacity:.85;
  }

  /* ---------- cabecera ---------- */
  header.app{
    padding:calc(14px + env(safe-area-inset-top, 0px)) 20px 0;
    flex:none;
  }
  header.app.sticky{position:sticky;top:0;z-index:30;background:var(--void)}
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .mark{
    font-size:10px;letter-spacing:.3em;font-weight:700;font-stretch:75%;
    text-transform:uppercase;color:var(--dim);
  }
  .goal{
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ash);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap;
  }
  .title{font-size:32px;font-weight:700;font-stretch:115%;letter-spacing:-.035em;line-height:1;margin:10px 0 12px}
  .title.sm{font-size:25px;margin:0}
  .title.big{font-size:27px;margin:12px 0 2px}
  .title-sub{font-size:22px;font-weight:500;font-stretch:110%;letter-spacing:-.03em;color:var(--dim);line-height:1.1;margin-bottom:12px}
  .back{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);display:flex;align-items:center;gap:7px;padding:2px 0 6px;
  }
  .meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin:9px 0 12px}
  .tools{display:flex;gap:16px;color:var(--dim);flex:none}
  .tools button{display:flex;align-items:center;color:inherit}
  .tools svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- tipografía utilitaria ---------- */
  .sect{
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    font-weight:600;font-stretch:80%;margin:26px 0 11px;
  }
  .sect:first-child{margin-top:18px}
  .hint{font-size:11.5px;line-height:1.55;color:var(--dim);margin-top:9px}
  .hint b{color:var(--ash);font-weight:500}
  .muted{color:var(--ash);font-size:13.5px;line-height:1.55}
  .tiny{font-size:11.5px;color:var(--dim);line-height:1.5}
  .linkish{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}

  /* ---------- botones ---------- */
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
  .clickable:focus-visible, summary:focus-visible{
    outline:2px solid var(--hold);outline-offset:2px;border-radius:8px;
  }
  .btn{
    display:block;width:100%;text-align:center;border-radius:13px;padding:17px;
    font-size:14.5px;font-weight:600;letter-spacing:-.01em;
    background:var(--bone);color:#0B0B0D;border:1px solid var(--bone);
    transition:transform .06s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.ghost{background:transparent;border-color:var(--line-2);color:var(--bone);font-weight:500}
  .btn.quiet{background:var(--surface);border-color:var(--line);color:var(--bone);font-weight:500}
  .btn.danger{background:transparent;border-color:rgba(228,104,90,.32);color:var(--danger);font-weight:500}
  .btn.sm{padding:12px;font-size:13.5px;border-radius:11px}
  .deload{
    display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;width:100%;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  }
  .deload svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .dock{
    position:sticky;bottom:calc(62px + env(safe-area-inset-bottom));z-index:20;
    margin:18px -20px 0;padding:16px 20px 10px;
    background:linear-gradient(transparent,var(--void) 26%);
  }
  .chev{color:var(--dim);font-size:15px;flex:none;line-height:1}
  .xbtn{
    color:var(--dim);font-size:13px;flex:none;line-height:1;padding:4px 2px;
  }
  .xbtn:hover{color:var(--danger)}

  /* ---------- inputs ---------- */
  input[type=text], input[type=number], select, textarea{
    background:var(--well);border:1px solid transparent;border-radius:10px;
    color:var(--bone);padding:12px;font:inherit;width:100%;
  }
  input[type=number]{font-family:var(--mono);text-align:center;font-variant-numeric:tabular-nums}
  input::placeholder, textarea::placeholder{color:var(--dim)}
  input.sugg::placeholder{color:#7a6635}
  textarea{resize:vertical;min-height:70px;font-size:14px;line-height:1.55}
  select{
    -webkit-appearance:none;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 15px) 50%, calc(100% - 10px) 50%;
    background-size:5px 5px, 5px 5px;background-repeat:no-repeat;padding-right:30px;
  }
  select.inline{
    background-color:transparent;border-color:transparent;width:auto;flex:none;
    font-family:var(--mono);font-size:13px;color:var(--ash);padding:6px 26px 6px 8px;text-align:right;
  }
  .field{display:flex;flex-direction:column;gap:6px}
  .field > span{font-size:10px;font-weight:600;font-stretch:80%;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .field > span.plain{text-transform:none;letter-spacing:0;font-weight:400;font-size:11.5px;line-height:1.5}

  /* ---------- resumen de la semana ---------- */
  .strip{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .strip div{flex:1;padding:16px 4px 14px;text-align:center;border-right:1px solid var(--line)}
  .strip div:last-child{border-right:0}
  .strip .n{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:-.02em}
  .strip .n i{font-style:normal;font-size:12px;color:var(--dim)}
  .strip .l{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:7px}

  /* ---------- filas simples ---------- */
  .rowitem{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:17px 0;border-bottom:1px solid var(--line);width:100%;
  }
  .row-name{font-size:16px;font-weight:600;letter-spacing:-.015em}
  .row-sub{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px}

  /* ---------- tarjeta de ejercicio ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;width:100%}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .ex-title{font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
  .ex-title em{font-style:normal;color:var(--dim);font-weight:400}
  .last{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim);margin-top:6px}
  .last b{color:var(--ash);font-weight:400}
  .exnote{font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.5}

  .verdict{display:flex;align-items:baseline;gap:9px;margin-top:11px}
  .dot{width:5px;height:5px;border-radius:50%;flex:none;transform:translateY(-2px)}
  .dot.up{background:var(--up)}
  .dot.hold{background:var(--hold)}
  .v-text{font-size:13px;letter-spacing:-.005em;line-height:1.45}
  .v-text b{font-family:var(--mono);font-weight:500}
  .v-text.up b{color:var(--up)}
  .v-text.hold b{color:var(--hold)}
  .why{font-size:11.5px;line-height:1.5;color:var(--dim);margin-top:6px;padding-left:14px}

  .steps{display:flex;align-items:center;gap:12px;margin-top:13px}
  .bars{display:flex;gap:5px;flex:1}
  .bars i{flex:1;height:3px;border-radius:2px;background:var(--well)}
  .bars i.up{background:var(--up)}
  .bars i.hold{background:var(--hold)}
  .steps-v{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap}
  .steps-v b{color:var(--ash);font-weight:400}

  /* ---------- avisos del coach ---------- */
  .note{border-left:1px solid var(--hold);padding:2px 0 2px 14px;margin:18px 0}
  .note.up{border-left-color:var(--up)}
  .note.bad{border-left-color:var(--danger)}
  .note-t{font-size:12.5px;color:var(--hold);line-height:1.45}
  .note.up .note-t{color:var(--up)}
  .note.bad .note-t{color:var(--danger)}
  .note-d{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.5}
  .note-a{
    margin-top:9px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);text-decoration:underline;text-underline-offset:3px;
  }

  /* ---------- pestañas inferiores ---------- */
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:rgba(8,8,10,.94);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabs .inner{max-width:460px;margin:0 auto;display:flex;padding:12px 0 10px}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--dim)}
  .tab.on{color:var(--bone)}
  .tab span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;font-stretch:80%}
  .tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- sesión en curso ---------- */
  .sess-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .clock{font-family:var(--mono);font-size:36px;font-weight:400;letter-spacing:-.05em;line-height:1}
  .sess-meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:9px}
  .sess-actions{display:flex;flex-direction:column;align-items:flex-end;gap:9px;flex:none}
  .end{
    border:1px solid rgba(228,104,90,.32);color:var(--danger);border-radius:999px;padding:9px 16px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  }
  .unitbtn{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;
  }
  .rest{margin:16px 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 15px;width:100%}
  .rest-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .rest-l{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .rest-t{font-family:var(--mono);font-size:17px;color:var(--bone)}
  .rest-track{height:2px;background:var(--well);border-radius:2px;margin-top:13px;overflow:hidden}
  .rest-fill{height:100%;width:0%;background:var(--bone);border-radius:2px;transition:width .9s linear}
  .rest.on .rest-t{color:var(--hold)}
  .rest.on .rest-fill{background:var(--hold)}
  .rest.done{border-color:rgba(127,211,168,.35)}
  .rest.done .rest-t,.rest.done .rest-l{color:var(--up)}
  .rest.done .rest-fill{background:var(--up)}

  .ex-open{background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:16px;margin-bottom:10px}
  .ex-done,.ex-next{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  }
  .ex-done .ex-title{font-size:14px;color:var(--ash);font-weight:500}
  .ex-next .ex-title{font-size:14px;font-weight:500}
  .mini-check{width:20px;height:20px;border-radius:6px;background:var(--up);display:flex;align-items:center;justify-content:center;flex:none}
  .mini-check svg{width:12px;height:12px;stroke:#0B0B0D;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

  .grid-h,.set{display:grid;grid-template-columns:14px 1fr 1fr .8fr 42px 20px;gap:6px;align-items:center}
  .grid-h{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);margin:16px 0 9px;
  }
  .grid-h span:nth-child(2),.grid-h span:nth-child(3),.grid-h span:nth-child(4){text-align:center}
  .set{margin-bottom:8px}
  .set .i{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center}
  .set .i.play{color:var(--hold);font-size:13px;padding:0;text-align:center}
  .cell{
    background:var(--well);border-radius:10px;padding:12px 2px;text-align:center;
    font-family:var(--mono);font-size:15px;border:1px solid transparent;color:var(--bone);
  }
  .cell::placeholder{color:var(--dim)}
  .set.now .cell{border-color:var(--line-2);background:var(--surface-2)}
  .set.done .cell{background:transparent;border-color:transparent;color:var(--ash)}
  .ck{
    height:42px;width:100%;border-radius:10px;border:1px solid var(--line-2);
    display:flex;align-items:center;justify-content:center;color:var(--dim);
  }
  .ck svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .ck.on{background:var(--up);border-color:var(--up);color:#0B0B0D}
  .ex-actions{
    display:flex;gap:18px;border-top:1px solid var(--line);margin-top:14px;padding-top:14px;
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
    flex-wrap:wrap;
  }
  .ex-actions button{color:inherit}
  .vschip{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-align:center;margin-top:10px}
  .addex{
    width:100%;border:1px dashed var(--line-2);border-radius:14px;padding:15px;text-align:center;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  }

  /* ---------- objetivo / opciones tipo tarjeta ---------- */
  .goals{display:flex;gap:8px}
  .goal-c{flex:1;border:1px solid var(--line);border-radius:13px;padding:13px 12px;background:transparent}
  .goal-c.on{border-color:rgba(215,164,75,.45);background:rgba(215,164,75,.06)}
  .goal-c .g-t{font-size:14px;font-weight:600;letter-spacing:-.015em}
  .goal-c.on .g-t{color:var(--hold)}
  .goal-c .g-d{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:6px}

  /* ---------- filas de ajuste ---------- */
  .line{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);width:100%}
  .line:last-child{border-bottom:0}
  .l-t{font-size:14.5px;font-weight:500;letter-spacing:-.01em}
  .l-d{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.5}
  .l-v{font-family:var(--mono);font-size:13px;color:var(--ash);display:flex;align-items:center;gap:8px;flex:none}
  .l-v svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .l-v.dim{color:var(--dim)}
  .list{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px}
  .list .line{padding:15px 0}
  .pill-sw{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;flex:none}
  .pill-sw button{font-family:var(--mono);font-size:12px;padding:8px 16px;border-radius:8px;color:var(--dim)}
  .pill-sw button.on{background:var(--well);color:var(--bone);box-shadow:inset 0 0 0 1px var(--line-2)}
  .tog{width:44px;height:26px;border-radius:999px;background:var(--well);position:relative;flex:none}
  .tog i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:left .16s ease}
  .tog.on{background:var(--hold)}
  .tog.on i{left:21px;background:#0B0B0D}
  .seg4{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:2px}
  .seg4 button{flex:1;text-align:center;font-size:12.5px;padding:11px 2px;border-radius:9px;color:var(--dim)}
  .seg4 button.on{background:var(--well);color:var(--bone);font-weight:600;box-shadow:inset 0 0 0 1px var(--line-2)}

  /* ---------- ficha de ejercicio ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px 14px}
  .pr{display:flex;align-items:flex-end;gap:9px}
  .pr .n{font-family:var(--mono);font-size:46px;font-weight:400;letter-spacing:-.05em;line-height:.9}
  .pr .u{font-family:var(--mono);font-size:13px;color:var(--dim);padding-bottom:5px}
  .pr-d{font-size:12px;color:var(--ash);margin-top:11px;line-height:1.5}
  .pr-d b{font-family:var(--mono);font-weight:400;color:var(--bone)}
  .chart{margin-top:18px}
  .chart canvas{display:block;width:100%;touch-action:pan-y}
  .axis{
    display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:14px;
  }

  /* ---------- volumen semanal ---------- */
  .vol{display:flex;align-items:center;gap:12px;padding:10px 0}
  .vol-n{width:66px;font-size:13px;color:var(--ash);flex:none}
  .vol-track{flex:1;height:3px;background:var(--well);border-radius:2px;overflow:hidden}
  .vol-fill{height:100%;background:var(--dim);border-radius:2px}
  .vol-fill.ok{background:var(--up)}
  .vol-fill.hi{background:var(--hold)}
  .vol-v{width:62px;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--dim);flex:none}
  .vol-v b{color:var(--bone);font-weight:500}

  /* ---------- historial ---------- */
  details.hist{border-bottom:1px solid var(--line)}
  details.hist summary{list-style:none;cursor:pointer}
  details.hist summary::-webkit-details-marker{display:none}
  .log{padding:16px 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .log-n{font-size:15px;font-weight:500;letter-spacing:-.01em}
  .log-m{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:6px}
  .log-v{font-family:var(--mono);font-size:13px;color:var(--ash);white-space:nowrap;flex:none}

  .fin-ax{
    display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;

  .fin-total .v{font-family:var(--mono);font-size:18px;color:var(--bone);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  .fin-dock{

  .btn.health{

  /* ---------- historial: el panel arriba, el diario abajo ---------- */
  .hp-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

  .hp-bars span.now{background:transparent;border:1px dashed rgba(127,211,168,.6);border-bottom:0}
  .hp-ax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8.5px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:7px}
  .hp-lift{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);width:100%}
  .hp-lift .n{flex:1;min-width:0;font-size:12.5px;color:var(--bone);letter-spacing:-.01em;text-align:left}
  .hp-lift .n i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--up);margin-top:4px}
  .hp-lift .n i.flat{color:var(--dim)}
  .hp-lift svg{width:78px;height:24px;flex:none}
  .hp-lift .v{width:58px;flex:none;text-align:right;font-family:var(--mono);font-size:12.5px;
    color:var(--ash);font-variant-numeric:tabular-nums}
  .hp-lift .v i{font-style:normal;font-size:8.5px;color:var(--dim);display:block;margin-top:3px}

  .hd-wk{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
    margin:30px 0 2px;padding-bottom:9px;border-bottom:1px solid var(--line-2)}

    color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums}
  details.hd{border-bottom:1px solid var(--line)}
  details.hd summary{list-style:none;cursor:pointer}
  details.hd summary::-webkit-details-marker{display:none}
  .hd-row{display:flex;align-items:center;gap:11px;padding:12px 0;width:100%}

  .hd-row .d b{display:block;font-family:var(--mono);font-size:15px;color:var(--ash);
    font-variant-numeric:tabular-nums;line-height:1;font-weight:400}
  .hd-row .d i{display:block;font-style:normal;font-family:var(--mono);font-size:8px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:3px}

<body>
<div id="app">
  <header class="app" id="topbar"></header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs"></nav>
<div id="modalhost"></div>
<div id="toasthost"></div>

<script>
'use strict';
/* =====================================================================
   Hierro — registro de entrenamiento con progresión basada en evidencia
   Motor: doble progresión (reps → peso) con RIR, incrementos adaptativos
   por ejercicio, tipos normal / asistido / peso corporal, 1RM estimado
   (Epley) y progresión de volumen ante estancamiento.
   Referencias: Pelland 2025 (volumen), Robinson 2024 (cercanía al fallo),
   Kassiano 2026 (sobrecarga progresiva), NMA 2025 (autorregulación).
   ===================================================================== */

const LS_KEY = 'hierro.v1';
/* Versionado semántico: MAYOR.MENOR.PARCHE
     MAYOR  cambia cuando algo deja de ser compatible — por ejemplo si un
            respaldo viejo ya no se pudiera restaurar.
     MENOR  cuando entran funciones nuevas sin romper nada.
     PARCHE cuando solo se arreglan fallos.
   Tiene que ir SIEMPRE igual que CACHE en sw.js; hay un test que lo
   comprueba, porque olvidar uno de los dos es el fallo fácil. */
const APP_VERSION = '2.1.1';
let updateReady = false, updateDismissed = false;

/* Aviso de versión nueva, abajo y por encima de todo.
   Nunca durante una sesión: ahí estorba y da miedo tocarlo. Se espera a
   que termines y aparece entonces — la actualización no corre prisa. */
function showUpdateToast(){
  if(!updateReady || updateDismissed || db.active){
    document.getElementById('toasthost').innerHTML = '';
    return;
  }
  document.getElementById('toasthost').innerHTML = `
    <div class="toast" role="status">
      <div class="t">
        <b>Versión nueva lista</b>
        <span>Tus rutinas y tu historial no se tocan.</span>
      </div>
      <button class="no" onclick="dismissUpdate()">Ahora no</button>
      <button class="go" onclick="applyUpdate()">Actualizar</button>
    </div>`;
}
function dismissUpdate(){ updateDismissed = true; showUpdateToast(); }
function applyUpdate(){ save(); location.reload(); }

const GOALS = {
  hipertrofia: { label:'Hipertrofia', lo:8,  hi:12, rest:90,  desc:'Ganar músculo · series de 8–12 reps' },
  fuerza:      { label:'Fuerza',      lo:4,  hi:6,  rest:180, desc:'Levantar más pesado · series de 4–6 reps' },
  ambas:       { label:'Ambas',       lo:6,  hi:10, rest:120, desc:'Fuerza y músculo · series de 6–10 reps' },
};
const INC_START = 0.025, INC_MIN = 0.0125, INC_MAX = 0.06;
const MAX_SETS_SUGG = 5;
const TYPE_LABEL = { normal:'', asistido:'Asistido', corporal:'Peso corporal', tiempo:'Por tiempo' };
const TIEMPO_RANGE = { lo:20, hi:45 };   /* segundos por defecto para isométricos */
const MUSCLES = [
  ['pecho','Pecho'], ['espalda','Espalda'], ['hombros','Hombros'],
  ['biceps','Bíceps'], ['triceps','Tríceps'], ['pierna','Pierna'],
  ['gluteos','Glúteos'], ['core','Core']
];
const PUSH_G = ['pecho','hombros','triceps'], PULL_G = ['espalda','biceps'];
const LB_KG = 0.45359237;

/* =====================================================================

/* inventario de arranque: el juego estándar del país según la unidad */
function defaultGym(unit){
  const lb = unit === 'lb';
  const k = v => lb ? Math.round(v * LB_KG * 1000)/1000 : v;
  const plates = (lb ? [45,35,25,10,5,2.5] : [25,20,15,10,5,2.5,1.25])
    .map(v => ({ kg:k(v), pairs:2, on:true }));
  const bars = (lb
    ? [['oly','Olímpica',45,true,true],['short','Olímpica corta',35,true,false],['ez','Barra Z',15,true,false],
       ['straight','Barra recta',25,false,false],['smith','Multipower',45,false,false]]
    : [['oly','Olímpica',20,true,true],['short','Olímpica corta',15,true,false],['ez','Barra Z',7,true,false],
       ['straight','Barra recta',10,false,false],['smith','Multipower',20,false,false]]
  ).map(([id,name,kg,on,def]) => ({ id, name, kg:k(kg), on, def }));
  const dumbbells = [];
  if(lb){ for(let v = 5; v <= 50; v += 5) dumbbells.push({ kg:k(v), on:true }); }
  else {
    for(let v = 1; v <= 24; v++) dumbbells.push({ kg:v, on:true });
    for(let v = 26; v <= 40; v += 2) dumbbells.push({ kg:v, on:true });
  }
  return { plates, bars, dumbbells };
}

function normalize(d){
  d = (d && typeof d === 'object') ? d : {};
  d.settings = (d.settings && typeof d.settings === 'object') ? d.settings : {};
  if(d.settings.goal === undefined) d.settings.goal = null;
  if(d.settings.rest === undefined) d.settings.rest = 'auto';
  if(d.settings.screenOn === undefined) d.settings.screenOn = 'on';
  if(d.settings.notify === undefined) d.settings.notify = 'off';
  if(d.settings.health === undefined) d.settings.health = 'off';
  if(d.settings.unit !== 'lb') d.settings.unit = 'kg';
  d.routines = Array.isArray(d.routines) ? d.routines : [];
  d.history  = Array.isArray(d.history)  ? d.history  : [];
  d.progress = (d.progress && typeof d.progress === 'object') ? d.progress : {};
  d.exmeta   = (d.exmeta   && typeof d.exmeta   === 'object') ? d.exmeta   : {};
  d.active   = d.active || null;
  /* splits: las rutinas son los días de un plan ordenado */
  d.splits = Array.isArray(d.splits) ? d.splits : [];
  const huerfanas = d.routines.filter(r => !r.split || !d.splits.some(sp => sp.id === r.split));
  if(huerfanas.length || (!d.splits.length && d.routines.length)){
    let sp = d.splits.find(x => x.active) || d.splits[0];
    if(!sp){
      const nombres = d.routines.map(r => r.name);
      sp = { id:'sp' + Math.random().toString(36).slice(2,8),
             name: (nombres.length && nombres.length <= 3) ? nombres.join(' / ') : 'Mi entrenamiento',
             active:true, created:new Date().toISOString() };
      d.splits.push(sp);
    }
    for(const r of huerfanas) r.split = sp.id;
  }
  if(d.splits.length && !d.splits.some(sp => sp.active)) d.splits[0].active = true;
  /* config por split: reglas propias de un ejercicio dentro de ese plan */
  for(const sp of d.splits) if(!sp.exconf || typeof sp.exconf !== 'object') sp.exconf = {};

  /* gimnasios: cada uno guarda su equipo, su unidad y la config de sus
     máquinas. El único d.gym de la 1.0 pasa a ser el primero de la lista. */
  const legacy = Object.getOwnPropertyDescriptor(d, 'gym');
  delete d.gym;
  d.gyms = (Array.isArray(d.gyms) ? d.gyms : []).filter(g => g && typeof g === 'object');
  if(!d.gyms.length){
    const base = (legacy && legacy.value && typeof legacy.value === 'object') ? legacy.value : {};
    d.gyms.push(Object.assign({ name:'Mi gimnasio' }, base));
  }
  for(const g of d.gyms) normGym(g, d.settings.unit);
  if(!d.gyms.some(g => g.id === d.settings.gymId)) d.settings.gymId = d.gyms[0].id;
  /* la unidad visible manda; el gimnasio activo la recuerda para cuando vuelvas */
  d.gyms.find(g => g.id === d.settings.gymId).unit = d.settings.unit;
  /* d.gym sigue siendo "el equipo": apunta al gimnasio activo. No se
     serializa (los datos viven en d.gyms) y asignarle un inventario entero
     —como hacen los tests— cae sobre el activo. */
  Object.defineProperty(d, 'gym', {
    configurable: true,
    get(){ return d.gyms.find(g => g.id === d.settings.gymId) || d.gyms[0]; },
    set(v){
      if(!v || typeof v !== 'object') return;
      const g = d.gyms.find(x => x.id === d.settings.gymId) || d.gyms[0];
      for(const k of ['plates','bars','dumbbells']) if(Array.isArray(v[k])) g[k] = v[k];
    }
  });
  return d;
}
/* deja un gimnasio completo: id, nombre, unidad, equipo y máquinas */
function normGym(g, unitFallback){
  if(!g.id) g.id = uid();
  if(!g.name || typeof g.name !== 'string') g.name = 'Mi gimnasio';
  if(g.unit !== 'kg' && g.unit !== 'lb') g.unit = unitFallback === 'lb' ? 'lb' : 'kg';
  const def = defaultGym(g.unit);
  for(const k of ['plates','bars','dumbbells'])
    if(!Array.isArray(g[k]) || !g[k].length) g[k] = def[k];
  if(!g.machines || typeof g.machines !== 'object') g.machines = {};
  return g;
}

}

function exMeta(key){
  if(!db.exmeta[key]) db.exmeta[key] = { type:'normal', lo:null, hi:null, step:null, notes:'', rest:null, muscle:null, equip:null, bar:null };
  const m = db.exmeta[key];
  /* migración de la taxonomía vieja: máquina → placas, otro → nada */
  if(m.equip === 'maquina') m.equip = 'placas';
  else if(m.equip === 'otro') m.equip = 'nada';
  if(m.points === undefined) m.points = null;   /* null → 2 (los dos lados) */

  if(!m.stack || typeof m.stack !== 'object') m.stack = { unit:null, step:null, start:null };

}

function effRange(key){
  const m = exMeta(key);
  const g = m.type === 'tiempo' ? TIEMPO_RANGE : goalRange();
  const oc = splitConf(key) || {};   /* el split en contexto puede pisar el rango */
  let lo = parseInt(oc.lo ?? m.lo, 10), hi = parseInt(oc.hi ?? m.hi, 10);
  if(isNaN(lo) || lo < 1) lo = g.lo;
  if(isNaN(hi) || hi < 1) hi = g.hi;
  if(hi <= lo) hi = lo + 1;
  return { lo, hi };
}
function effStep(key, w){
  const st = parseFloat(exMeta(key).step);
  if(!isNaN(st) && st > 0) return st;
  const eq = effEquip(key);
  /* con discos, el salto mínimo es el disco menor repetido en cada punto */
  if(eq === 'barra' || eq === 'discos'){
    const s = plateMinStep(effPoints(key));
    if(s > 0) return s;
  }
  /* con mancuernas, subir un escalón del rack son dos mancuernas más */
  if(eq === 'mancuerna'){
    const s = dumbbellMinStep(effPoints(key));
    if(s > 0) return s;
  }
  /* en una torre, el salto es el de la máquina — o el del ajuste fino si lo
     tiene, que es justo para eso — pasado a kg sin redondear
     (el peso final se ancla a la placa exacta más adelante) */
  if(eq === 'placas'){
    const c = stackConf(key);
    if(c) return (c.extra > 0 ? c.extra : c.step) * stackFactor(c);
  }
  return roundStep(w);
}

/* 1RM estimado — fórmula de Epley: peso × (1 + reps/30) */
function epley(w, r){ return (r > 0 && w > 0) ? w * (1 + r/30) : 0; }
function bestE1RM(sets){ return Math.max(0, ...sets.map(s => epley(s.w, s.r))); }
function avgRIR(sets){
  const rs = sets.map(s => s.rir).filter(x => x !== undefined && x !== null && !isNaN(x));
  return rs.length ? rs.reduce((a,b) => a+b, 0) / rs.length : null;
}

/* último registro histórico de un ejercicio (opcional: solo antes de una fecha).
   Las sesiones de descarga no cuentan: son mantenimiento, no datos de progresión.
   Hay dos hilos: el del split en contexto (ctx) y el global (any). El coach
   ancla en el del split — así un plan de fuerza (30 kg × 6) y uno de
   hipertrofia (16 kg × 15) del mismo ejercicio no se pisan los pesos. */
function historySplitId(h){
  const known = h.routineId && db.routines.find(r => r.id === h.routineId);
  const r = known || db.routines.find(r => r.name === h.routineName);
  return (r && r.split) || null;
}
function lastEntries(key, beforeISO){
  const ctx = ctxSplitId();
  let any = null, inCtx = null;
  for(const s of db.history){
    if(s.deload) continue;
    if(beforeISO && s.date >= beforeISO) continue;
    const e = s.entries.find(x => x.key === key);
    if(!e || !e.sets.length) continue;
    if(!any || s.date > any.session.date) any = { entry:e, session:s };
    if(ctx && historySplitId(s) === ctx && (!inCtx || s.date > inCtx.session.date))
      inCtx = { entry:e, session:s };
  }
  return { ctx: inCtx, any };
}
function lastEntry(key, beforeISO){
  const r = lastEntries(key, beforeISO);
  return r.ctx || r.any;
}

/* transformar la sugerencia normal en objetivo de descarga:
   ~10 % menos carga y la mitad de las series (50 % del volumen) */
function deloadSugg(key, sugg){
  if(!sugg) return null;
  const meta = exMeta(key);
  const { lo } = effRange(key);
  const sets = Math.max(1, Math.ceil(sugg.sets / 2));
  const why = `Sesión de descarga: ~10 % menos carga y la mitad de las series. Recuperas sin perder el hábito, y la próxima sesión normal retoma tu progresión exactamente donde iba.`;
  if(meta.type === 'asistido' && sugg.w > 0){
    const w = sugg.w + effStep(key, sugg.w);
    return { w, reps: lo, sets, type:'hold',
      msg:`Descarga: <b>${fmtWEx(key, w)} ${uLabelEx(key)} de ayuda × ${lo}</b> en ${sets} serie${sets===1?'':'s'}`, why };
  }
  if(meta.type === 'tiempo'){
    const reps = Math.max(10, Math.round(sugg.reps * 0.7 / 5) * 5);
    return { w: sugg.w, reps, sets, type:'hold',
      msg:`Descarga: <b>${reps} s</b> en ${sets} serie${sets===1?'':'s'}`, why };
  }
  if(meta.type === 'corporal' || sugg.w === 0){
    const reps = Math.max(1, Math.round(sugg.reps * 0.7));
    return { w: sugg.w, reps, sets, type:'hold',
      msg:`Descarga: <b>${reps} reps</b> en ${sets} serie${sets===1?'':'s'}`, why };
  }
  let w = roundToStep(sugg.w * 0.9, effStep(key, sugg.w));
  if(w <= 0) w = sugg.w;
  w = fitWeight(key, w) || w;
  return { w, reps: lo, sets, type:'hold',
    msg:`Descarga: <b>${fmtWEx(key, w)} ${uLabelEx(key)} × ${lo}</b> en ${sets} serie${sets===1?'':'s'}`, why };
}

/* peso "de trabajo": el más usado en la sesión; empate → el mayor */
function workWeight(sets){
  const count = {};
  for(const s of sets) count[s.w] = (count[s.w]||0) + 1;
  let best = null, n = 0;
  for(const w in count){
    const wn = parseFloat(w);
    if(count[w] > n || (count[w] === n && wn > best)){ best = wn; n = count[w]; }
  }
  return best;
}
function roundStep(wKg){
  if(db.settings.unit === 'lb'){
    /* pasos nativos de discos en lb para que las sugerencias salgan "limpias" (95, 100…) */
    const wLb = wKg / LB_KG;
    const stepLb = wLb >= 45 ? 5 : (wLb >= 25 ? 2.5 : 1);
    return stepLb * LB_KG;
  }
  return wKg >= 20 ? 2.5 : (wKg >= 10 ? 1 : 0.5);
}
function roundToStep(w, st){ st = st || roundStep(w); return Math.round(w/st)*st; }

/* =====================================================================
   CALCULADORA DE CARGA
   Con el inventario del gimnasio se sabe qué pesos existen de verdad:
   sirven para redondear las sugerencias y para dibujar la barra.
   ===================================================================== */
function effEquip(key){
  const e = exMeta(key).equip;
  return EQUIP[e] ? e : null;
}
/* dónde van los discos: 1 pitón, 2 lados o 4 pitones */
function effPoints(key){
  const n = parseInt(exMeta(key).points, 10);
  /* con mancuernas solo hay dos casos: una en cada mano, o una sola */
  if(effEquip(key) === 'mancuerna') return n === 1 ? 1 : 2;
  return (n === 1 || n === 2 || n === 4) ? n : 2;
}
/* peso propio del aparato: la barra, o el carro si lo anotaste */
function effBase(key){
  if(effEquip(key) === 'barra'){ const b = barFor(key); return b ? b.kg : 0; }
  const v = parseFloat(exMeta(key).base);
  return (!isNaN(v) && v > 0) ? v : 0;
}

/* ---------- inventario ---------- */
function availablePlates(){
  return db.gym.plates
    .filter(p => p.on && p.kg > 0 && p.pairs > 0)
    .map(p => ({ kg:p.kg, n:p.pairs }))
    .sort((a,b) => b.kg - a.kg);
}
function availableBars(){ return db.gym.bars.filter(b => b.on && b.kg > 0); }
function availableDumbbells(){
  return db.gym.dumbbells.filter(d => d.on && d.kg > 0).map(d => d.kg).sort((a,b) => a - b);
}
/* la barra del ejercicio: la que fijó el usuario, o la predeterminada */
function barFor(key){
  const bars = availableBars();
  if(!bars.length) return null;
  const id = exMeta(key).bar;
  return (id && bars.find(b => b.id === id)) || bars.find(b => b.def) || bars[0];
}

/* ---------- torre de placas ----------
   Unas suben de 5 en 5 lb y otras de 5 en 5 kg: la unidad es de la
   máquina, no del usuario. */
function stackConf(key){
  const st = exMeta(key).stack || {};
  const step = parseFloat(st.step);
  if(isNaN(step) || step <= 0) return null;
  const start = parseFloat(st.start);
  /* ajuste fino: discos añadidos, palanca o pin giratorio que suman
     peso ENCIMA de la placa elegida (ej. torre de 10 en 10 lb con dos
     discos de 5,5 al costado → puedes sumar 5,5 u 11) */
  const extra = parseFloat(st.extra);
  const hasExtra = !isNaN(extra) && extra > 0;
  const exMax = parseFloat(st.extraMax);
  return {
    unit: st.unit === 'lb' ? 'lb' : 'kg',
    step,
    start: (!isNaN(start) && start > 0) ? start : step,
    extra: hasExtra ? extra : 0,
    extraMax: hasExtra ? ((!isNaN(exMax) && exMax >= extra) ? exMax : extra) : 0,
  };
}
function stackFactor(conf){ return conf.unit === 'lb' ? LB_KG : 1; }
/* peso en kg → la combinación placa + ajuste fino más cercana de esa torre.
   En empate gana la más pesada (sobrecarga), igual que en el resto del equipo. */
function stackSnap(key, kg){
  const c = stackConf(key);
  if(!c) return null;
  const f = stackFactor(c);
  const want = kg / f;
  const nJ = c.extra > 0 ? Math.floor(c.extraMax / c.extra + 1e-9) : 0;
  let best = null;
  for(let j = 0; j <= nJ; j++){
    const add = Math.round(j * c.extra * 1000) / 1000;
    let i = Math.round((want - add - c.start) / c.step);
    if(i < 0) i = 0;
    const value = Math.round((c.start + i * c.step + add) * 1000) / 1000;
    const d = Math.abs(value - want);
    if(!best || d < best.d - 1e-9 || (Math.abs(d - best.d) < 1e-9 && value > best.value))
      best = { d, unit:c.unit, step:c.step, index:i + 1, value, extra:add,
               kg: Math.round(value * f * 1000) / 1000 };
  }
  delete best.d;
  return best;
}
/* «Placa 3 + 5,5» — el sufijo solo cuando hay ajuste fino puesto */
function stackExtraLabel(sn){ return sn.extra > 0 ? ` + ${fmtNum(sn.extra)}` : ''; }
/* los primeros escalones, para compararlos con lo que dice la máquina */
function stackPreview(key, n){
  const c = stackConf(key);
  if(!c) return [];
  return Array.from({length: n || 7}, (_, i) => Math.round((c.start + i * c.step) * 1000) / 1000);
}

/* ---------- discos ----------
   Con N puntos de carga cada disco hay que repetirlo N veces: un par
   (2 discos) solo alcanza para 2 pitones. */
function maxPerPoint(pairs, points){ return Math.floor(pairs * 2 / points); }
function plateMinStep(points){
  const p = availablePlates().filter(x => maxPerPoint(x.n, points) >= 1);
  return p.length ? p[p.length-1].kg * points : 0;
}

/* sumas por punto que se pueden armar → la combinación con menos discos */
let _plateIdx = {};
function plateIndex(points){
  const plates = availablePlates();
  const ck = JSON.stringify(plates) + '|' + points;
  if(_plateIdx[points] && _plateIdx[points].ck === ck) return _plateIdx[points];
  const map = new Map([[0, []]]);
  for(const p of plates){
    const max = maxPerPoint(p.n, points);
    if(max < 1) continue;
    for(const [sum, list] of [...map]){
      let s = sum, l = list;
      for(let i = 1; i <= max; i++){
        s = Math.round((s + p.kg) * 1000) / 1000;
        l = l.concat(p.kg);
        const prev = map.get(s);
        if(!prev || prev.length > l.length) map.set(s, l);
      }
    }
  }
  _plateIdx[points] = { ck, map, sums: [...map.keys()].sort((a,b) => a - b) };
  return _plateIdx[points];
}
function invalidatePlates(){ _plateIdx = {}; }

/* el valor de `list` más cercano a w; en empate gana el mayor (sobrecarga) */
function nearestIn(list, w){
  if(!list.length) return null;
  let best = list[0];
  for(const v of list){
    const d = Math.abs(v - w), bd = Math.abs(best - w);
    if(d < bd - 1e-9 || (Math.abs(d - bd) < 1e-9 && v > best)) best = v;
  }
  return best;
}
function nearestDumbbell(w){ return nearestIn(availableDumbbells(), w); }
/* los totales que puedes armar: cada mancuerna × las que agarras */
function dumbbellTotals(points){
  return availableDumbbells().map(d => Math.round(d * points * 1000) / 1000);
}
/* el salto más pequeño: el hueco menor del rack, multiplicado por las manos */
function dumbbellMinStep(points){
  const d = availableDumbbells();
  let gap = 0;
  for(let i = 1; i < d.length; i++){
    const g = d[i] - d[i-1];
    if(g > 0 && (!gap || g < gap)) gap = g;
  }
  return gap * points;
}

/*  loadPlan(key, pesoKg) → null si no aplica, o
    { kind, base, points, perPoint:[kg], perPointKg, total, exact, target,
      bar?, stack?, dumbbell? }                                            */
function loadPlan(key, targetKg){
  const eq = effEquip(key);
  if(!eq || eq === 'nada') return null;

  if(eq === 'mancuerna'){
    /* lo que anotas es el TOTAL: dos mancuernas de 10 son 20 kg */
    const n = effPoints(key);
    const total = nearestIn(dumbbellTotals(n), targetKg);
    if(total == null) return null;
    return { kind:'mancuerna', points:n, dumbbell: Math.round(total / n * 1000) / 1000, total,
             exact: Math.abs(total - targetKg) < 1e-9, target:targetKg };
  }
  if(eq === 'placas'){
    const sn = stackSnap(key, targetKg);
    if(!sn) return null;
    return { kind:'placas', stack:sn, total:sn.kg,
             exact: Math.abs(sn.kg - targetKg) < 1e-9, target:targetKg };
  }

  const points = effPoints(key);
  const bar = eq === 'barra' ? barFor(key) : null;
  if(eq === 'barra' && !bar) return null;
  const base = eq === 'barra' ? bar.kg : effBase(key);
  const idx = plateIndex(points);
  if(!idx.sums.length) return null;
  const want = (targetKg - base) / points;
  const side = want < 0 ? 0 : nearestIn(idx.sums, want);
  const total = Math.round((base + points * side) * 1000) / 1000;
  return {
    kind: eq, bar, base, points,
    perPoint: idx.map.get(side) || [], perPointKg: side,
    total, exact: Math.abs(total - targetKg) < 1e-9, target: targetKg,
  };
}
/* la barra es el caso de dos puntos: se conserva el nombre viejo */
function barLoad(key, targetKg){
  const p = loadPlan(key, targetKg);
  if(!p || p.kind !== 'barra') return null;
  return Object.assign({}, p, { plates:p.perPoint, perSide:p.perPointKg });
}

/* redondea un peso al más cercano que se pueda armar con el equipo */
function fitWeight(key, w){
  const p = loadPlan(key, w);
  return (p && p.total > 0) ? p.total : w;
}
/* ajusta la sugerencia del coach a un peso real y lo explica */
const FIT_WHY = {
  barra:'Con tus discos', discos:'Con tus discos',
  placas:'La torre de esta máquina sube a saltos:', mancuerna:'Con tus mancuernas',
};
function fitSuggestion(key, sugg){
  const meta = exMeta(key);
  if(!sugg || meta.type !== 'normal' || !(sugg.w > 0)) return sugg;
  const eq = effEquip(key);
  if(!eq || eq === 'nada') return sugg;
  const fitted = fitWeight(key, sugg.w);
  if(!(fitted > 0) || Math.abs(fitted - sugg.w) < 1e-9) return sugg;
  const before = `${fmtWEx(key, sugg.w)} ${uLabelEx(key)}`;
  const after  = `${fmtWEx(key, fitted)} ${uLabelEx(key)}`;
  /* si al redondear se ven igual, el ajuste es invisible: no hay nada que explicar */
  if(before === after){ sugg.w = fitted; return sugg; }
  sugg.msg = sugg.msg.replace(before, after);
  sugg.why = `${FIT_WHY[eq]} ${after} es lo más cercano a ${before}. ` + sugg.why;
  sugg.wanted = sugg.w;
  sugg.w = fitted;
  return sugg;
}

/*  computeSuggestion(key) → null (primera vez) o
    { w, reps, sets, type, msg, why }                                   */
function computeSuggestion(key){
  const both = lastEntries(key);
  const last = both.ctx || both.any;
  if(!last) return null;

  const meta = exMeta(key);
  const { lo, hi } = effRange(key);
  const p = prog(key);
  const sets = last.entry.sets;
  const w = workWeight(sets);
  const atW = sets.filter(s => s.w === w);
  const repsAtW = atW.map(s => s.r).sort((a,b) => a - b);
  /* con 4+ series se ignora la peor: que la última se caiga es fatiga normal, no mal peso */
  const minAll = repsAtW[0];
  const minR = repsAtW.length >= 4 ? repsAtW[1] : repsAtW[0];
  const maxR = repsAtW[repsAtW.length - 1];
  const nSets = sets.length;
  const rir = avgRIR(atW);
  const step = effStep(key, w);

  /* vuelta tras una pausa: la fuerza cae tras ~2 semanas sin un ejercicio → descontar.
     La pausa se mide sobre el MOVIMIENTO en cualquier split: si lo seguiste
     entrenando en otro plan, no hay desentrenamiento que descontar */
  const gapDays = Math.floor((Date.now() - new Date(both.any.session.date).getTime()) / 864e5);
  if(gapDays >= 14){
    const factor = gapDays < 28 ? 0.925 : (gapDays < 60 ? 0.85 : 0.8);
    const weeks = Math.round(gapDays / 7);
    let back;
    if(meta.type === 'asistido' && w > 0){
      const nw = roundToStep(w * (2 - factor), step);
      back = { w:nw, reps:lo, type:'back',
        msg:`Vuelta tras ~${weeks} semanas: <b>${fmtWEx(key, nw)} ${uLabelEx(key)} de ayuda × ${lo}</b>`,
        why:`Llevas ${gapDays} días sin este ejercicio. Retoma con algo más de asistencia; en 1–2 sesiones vuelves a tu marca.` };
    } else if(meta.type === 'tiempo'){
      const target = Math.max(lo, Math.round(maxR * factor / 5) * 5);
      back = { w, reps:target, type:'back',
        msg:`Vuelta tras ~${weeks} semanas: apunta a <b>${target} s</b>`,
        why:`Llevas ${gapDays} días sin este ejercicio. Retoma sin exigirte el récord; en 1–2 sesiones recuperas el nivel.` };
    } else if(meta.type === 'corporal' || w === 0){
      const target = Math.max(lo, Math.round(maxR * factor));
      back = { w, reps:target, type:'back',
        msg:`Vuelta tras ~${weeks} semanas: apunta a <b>${target} reps</b>`,
        why:`Llevas ${gapDays} días sin este ejercicio. Retoma sin exigirte el récord; en 1–2 sesiones recuperas el nivel.` };
    } else {
      let nw = roundToStep(w * factor, step);
      if(nw <= 0) nw = w;
      back = { w:nw, reps:lo, type:'back',
        msg:`Vuelta tras ~${weeks} semanas: <b>${fmtWEx(key, nw)} ${uLabelEx(key)} × ${lo}</b> (~${Math.round((1-factor)*100)} % menos)`,
        why:`Llevas ${gapDays} días sin hacer este ejercicio y la fuerza cae un poco con la pausa. Arranca más liviano — en 1–2 sesiones estás de vuelta en ${fmtWEx(key, w)} ${uLabelEx(key)}. Esto evita lesiones y agujetas brutales.` };
    }
    back.sets = splitSetsOverride(key) || Math.max(1, nSets - (gapDays >= 28 ? 1 : 0));
    return back;
  }

  let sugg;

  if(meta.type === 'asistido' && w > 0){
    /* asistido: los kg son AYUDA → progresar = bajar kg */
    if(minR >= hi){
      const nw = Math.max(0, roundToStep(w - step, step));
      sugg = (nw <= 0 || w <= 2.5)
        ? { w:0, reps:lo, type:'up',
            msg:`¡Prueba <b>sin asistencia</b>!`,
            why:`Llegaste a ${hi} reps con solo ${fmtWEx(key, w)} ${uLabelEx(key)} de ayuda. Intenta la versión libre y registra 0 kg.` }
        : { w:nw, reps:lo, type:'up',
            msg:`Baja la ayuda: <b>${fmtWEx(key, nw)} ${uLabelEx(key)} × ${lo}</b>`,
            why:`En asistidos, menos peso de ayuda = más difícil = progreso. Llegaste a ${hi} reps con ${fmtWEx(key, w)} ${uLabelEx(key)} de ayuda.` };
    } else if(minR < lo){
      if(p.fail >= 2){
        sugg = { w:w + step, reps:lo, type:'deload',
          msg:`Sube la ayuda a <b>${fmtWEx(key, w + step)} ${uLabelEx(key)}</b> y reconstruye`,
          why:`Van ${p.fail} sesiones sin sostener el rango (${lo}–${hi}). Con un poco más de asistencia vuelves a progresar.` };
      } else {
        sugg = { w, reps:lo, type:'hold',
          msg:`Misma ayuda (<b>${fmtWEx(key, w)} ${uLabelEx(key)}</b>): busca al menos ${lo} reps`,
          why:`Consolida el rango (${lo}–${hi}) antes de bajar la asistencia.` };
      }
    } else {
      const target = Math.min(hi, maxR + 1);
      sugg = { w, reps:target, type:'reps',
        msg:`Misma ayuda (<b>${fmtWEx(key, w)} ${uLabelEx(key)}</b>), apunta a <b>${target} reps</b>`,
        why:`Cuando llegues a ${hi} reps en todas las series, te sugeriré bajar la ayuda.` };
    }
  } else if(meta.type === 'tiempo'){
    /* isométricos: progresar = más segundos (de 5 en 5); lastre opcional */
    if(minR >= hi){
      sugg = { w, reps:maxR + 5, type:'up',
        msg:`Suma tiempo: apunta a <b>${maxR + 5} s</b>`,
        why:`Sostuviste ${hi}+ segundos en todas las series. Progresa de 5 en 5; si se vuelve muy fácil, agrega lastre y registra ese peso.` };
    } else if(minR < lo){
      sugg = { w, reps:lo, type:'hold',
        msg:`Busca al menos <b>${lo} s</b> por serie`,
        why:`Consolida el rango (${lo}–${hi} s) antes de sumar tiempo.` };
    } else {
      const target = Math.min(hi, maxR + 5);
      sugg = { w, reps:target, type:'reps',
        msg:`Apunta a <b>${target} s</b>`,
        why:`Cinco segundos más que la última vez ya es progreso.` };
    }
  } else if(meta.type === 'corporal' || w === 0){
    /* peso corporal (o sin peso externo): progresar = más reps / series / lastre */
    if(minR >= hi){
      sugg = { w, reps:maxR + 1, type:'up',
        msg:`Suma reps: apunta a <b>${maxR + 1}</b> por serie`,
        why:`Sin peso externo progresas sumando reps o series. Si ya es muy fácil, agrega lastre (peso extra, ej. mochila o disco) y regístralo.` };
    } else if(minR < lo){
      sugg = { w, reps:lo, type:'hold',
        msg:`Busca al menos <b>${lo} reps</b> por serie`,
        why:`Consolida el rango (${lo}–${hi}); si no llegas, usa una variante más fácil o la versión asistida.` };
    } else {
      sugg = { w, reps:Math.min(hi, maxR + 1), type:'reps',
        msg:`Apunta a <b>${Math.min(hi, maxR + 1)} reps</b>`,
        why:`Una rep más que la última vez ya es progreso.` };
    }
  } else {
    /* normal: doble progresión reps → peso, modulada por RIR si lo registras */
    const cap = parseFloat(meta.cap);
    const hasCap = !isNaN(cap) && cap > 0;
    const atCap = hasCap && w >= cap - 1e-9;
    if(minR >= hi){
      if(atCap){
        /* la máquina no da más → progresión por reps abiertas (y series, vía estancamiento) */
        sugg = { w, reps:maxR + 1, type:'reps',
          msg:`Tope de la máquina: mantén <b>${fmtWEx(key, w)} ${uLabelEx(key)}</b> y apunta a <b>${maxR + 1} reps</b>`,
          why:`Marcaste ${fmtWEx(key, cap)} ${uLabelEx(key)} como máximo disponible en este equipo. Sin más peso, el progreso sigue por reps y series — y cuando lo superes con holgura, considera una variante más difícil o agregar lastre.` };
      } else {
        const boost = (rir !== null && rir >= 3) ? 1.7 : 1;
        let nw = roundToStep(w * (1 + p.inc * boost), step);
        if(nw - w < step/2) nw = w + step;   /* progreso real de al menos un paso (evita errores de redondeo) */
        const capped = hasCap && nw > cap;
        if(capped) nw = cap;                 /* último salto: justo hasta el tope */
        sugg = { w:nw, reps:lo, type:'up',
          msg:`Sube el peso: <b>${fmtWEx(key, nw)} ${uLabelEx(key)} × ${lo}</b>${capped ? ' (tope de la máquina)' : ''}`,
          why:`Llegaste a ${hi} reps en todas las series con ${fmtWEx(key, w)} ${uLabelEx(key)}.` +
              (boost > 1 ? ` Además te sobraban reps (RIR ${Math.round(rir)}), así que el salto es un poco mayor.`
                         : ` Toca progresar la carga (~${(p.inc*100).toFixed(1)} %).`) +
              (capped ? ' Con este salto llegas al máximo del equipo.' : '') };
      }
    } else if(minR < lo){
      if(p.fail >= 2){
        let nw = roundToStep(w * 0.95, step);
        if(w - nw < step/2) nw = w - step;   /* retroceso real de al menos un paso */
        if(nw <= 0) nw = w;
        sugg = { w:nw, reps:lo, type:'deload',
          msg:`Baja un poco: <b>${fmtWEx(key, nw)} ${uLabelEx(key)} × ${lo}</b>`,
          why:`Van ${p.fail} sesiones sin sostener el rango con ${fmtWEx(key, w)} ${uLabelEx(key)}. Retroceder ~5 % y volver a construir es lo que mejor funciona.` };
      } else {
        sugg = { w, reps:lo, type:'hold',
          msg:`Consolida <b>${fmtWEx(key, w)} ${uLabelEx(key)}</b>: busca al menos ${lo} reps por serie`,
          why:`La última vez alguna serie quedó bajo el rango (${lo}–${hi}). Repite el peso dejando 1–3 reps en reserva antes de subir.` };
      }
    } else if(rir !== null && rir >= 4 && !atCap){
      let nw = roundToStep(w * (1 + p.inc), step);
      if(nw - w < step/2) nw = w + step;   /* progreso real de al menos un paso (evita errores de redondeo) */
      if(hasCap && nw > cap) nw = cap;
      sugg = { w:nw, reps:lo, type:'up',
        msg:`Sube ya el peso: <b>${fmtWEx(key, nw)} ${uLabelEx(key)} × ${lo}</b>`,
        why:`Registraste RIR ${Math.round(rir)} (te sobraban ~${Math.round(rir)} reps): ese peso te queda liviano, no hace falta esperar al tope del rango.` };
    } else {
      const target = Math.min(hi, maxR + 1);
      sugg = { w, reps:target, type:'reps',
        msg:`Mismo peso (<b>${fmtWEx(key, w)} ${uLabelEx(key)}</b>), apunta a <b>${target} reps</b>`,
        why:`Doble progresión: primero llena el rango de reps (${lo}–${hi}), después sube el peso.` };
    }
  }

  fitSuggestion(key, sugg);
  /* series fijadas en el split: mandan sobre el conteo del historial y
     desactivan los ajustes automáticos de volumen (serie extra, concentrar) */
  const fixedSets = splitSetsOverride(key);
  sugg.sets = fixedSets || nSets;
  if(!fixedSets && p.stall >= 3 && nSets < MAX_SETS_SUGG && sugg.type !== 'up' && sugg.type !== 'deload'){
    sugg.sets = nSets + 1;
    sugg.msg += ` · y suma una serie extra (${nSets + 1} en total)`;
    sugg.why = `Varias sesiones sin avanzar: más volumen semanal también genera progreso (con retornos decrecientes). ` + sugg.why;
  }
  /* consolidación de series: 5+ series del mismo ejercicio rinden poco por sesión
     (Pelland 2025 per-session: retornos decrecientes fuertes tras 3-4 series) */
  if(!fixedSets && nSets >= 5 && meta.type === 'normal'){
    const target = Math.max(3, nSets - 2);
    const flat = (maxR - minAll) <= 1;   /* reps casi idénticas en todas → mucha reserva */
    let nwC = 0;
    if(sugg.type === 'reps' && flat && minR >= lo){
      nwC = roundToStep(w * (1 + p.inc), step);
      if(nwC - w < step/2) nwC = w + step;
      const capC = parseFloat(meta.cap);
      if(!isNaN(capC) && capC > 0 && nwC > capC) nwC = capC;   /* respeta el tope de la máquina */
    }
    if(nwC > w + 1e-9){
      const reps = Math.min(hi, Math.max(lo, maxR));
      sugg = { w: nwC, reps, sets: target, type:'up',
        msg:`Concentra el trabajo: <b>${fmtWEx(key, nwC)} ${uLabelEx(key)} × ${reps}</b> en <b>${target} series</b> (antes ${nSets})`,
        why:`Hiciste ${nSets} series casi idénticas (${minAll}–${maxR} reps): te sobra reserva, y a partir de la 4ª serie del mismo ejercicio el beneficio por sesión cae en picada. Con ${target} series intensas (RIR 1–3) y algo más de peso logras lo mismo en menos tiempo.` };
    } else {
      sugg.sets = target;
      sugg.msg += ` · en <b>${target} series</b> (antes ${nSets})`;
      sugg.why = `${nSets} series del mismo ejercicio rinden poco a partir de la 4ª (retornos decrecientes por sesión): con ${target} series intensas logras prácticamente lo mismo y llegas con menos fatiga a las últimas. ` + sugg.why;
    }
  }
  if(p.stall >= 6 && sugg.type !== 'up'){
    sugg.why = `Lleva ${p.stall} sesiones estancado: considera rotarlo por una variante del mismo músculo durante 4–6 semanas — un estímulo nuevo suele reactivar el progreso. ` + sugg.why;
  }
  return sugg;
}

/* actualizar el estado adaptativo tras guardar una sesión */
function updateProgress(key, newSets, dateISO){
  const p = prog(key);
  const prev = lastEntry(key, dateISO);
  if(!prev || !newSets.length) return;

  const meta = exMeta(key);
  const { lo, hi } = effRange(key);
  const dir = meta.type === 'asistido' ? -1 : 1;   /* asistido: menos kg = progreso */
  const wNow = workWeight(newSets);
  const atW = newSets.filter(s => s.w === wNow);
  const repsNow = atW.map(s => s.r).sort((a,b) => a - b);
  const minR = repsNow.length >= 4 ? repsNow[1] : repsNow[0];   /* misma tolerancia que el coach */
  const maxR = repsNow[repsNow.length - 1];
  const wPrev = workWeight(prev.entry.sets);
  const prevAtW = prev.entry.sets.filter(s => s.w === wPrev);
  const maxRPrev = Math.max(...prevAtW.map(s => s.r));

  if(wNow * dir > wPrev * dir){
    if(minR >= lo){                       /* progresó la carga y aguantó el rango */
      p.fail = 0; p.stall = 0;
      if(minR >= hi) p.inc = Math.min(INC_MAX, p.inc * 1.15);
    } else {                              /* progresó la carga y no llegó al rango */
      p.fail++; p.stall = 0;
      p.inc = Math.max(INC_MIN, p.inc * 0.7);
    }
  } else if(wNow === wPrev){
    p.fail = (minR < lo) ? p.fail + 1 : 0;
    /* sin mejora de reps = estancamiento (también por encima del rango, ej. tope de máquina) */
    p.stall = (maxR <= maxRPrev) ? p.stall + 1 : 0;
  } else {                                /* retrocedió la carga (deload propio) */
    p.fail = 0; p.stall = 0;
    p.inc = Math.max(INC_MIN, p.inc * 0.85);
  }
  save();
}

/* =====================================================================

/* Cada pantalla recuerda por dónde ibas. Al volver de la ficha de un
   ejercicio retomas la lista donde estaba, no arriba del todo. */
const scrollMem = {};
function viewKey(v){
  if(!v || !v.name) return 'home';
  if(v.name === 'routine')  return 'routine:' + v.id + (v.sort ? ':orden' : '');
  if(v.name === 'exercise') return 'exercise:' + v.key;
  if(v.name === 'gym')      return 'gym:' + (v.kind || 'plates');
  if(v.name === 'split')    return 'split:' + v.id;
  return v.name;
}
function scrollNow(){ return window.scrollY || window.pageYOffset || 0; }
function go(v){
  scrollMem[viewKey(view)] = scrollNow();
  view = v;
  render();
  const y = scrollMem[viewKey(v)] || 0;
  window.scrollTo(0, y);
  /* tras pintar, el alto puede cambiar (gráfica, fuentes): se reintenta */
  if(typeof requestAnimationFrame === 'function') requestAnimationFrame(() => window.scrollTo(0, y));
}

/* barras segmentadas = el rango de reps, llenas con lo de la última sesión */
function rangeBarsHTML(key, sugg){
  const last = lastEntry(key);
  if(!last) return '';
  const { lo, hi } = effRange(key);
  const sets = last.entry.sets;
  const w = workWeight(sets);
  const reps = sets.filter(s => s.w === w).map(s => s.r).sort((a,b) => a - b);
  if(!reps.length) return '';
  const minR = reps.length >= 4 ? reps[1] : reps[0];
  const span = Math.max(1, hi - lo + 1);
  const n = Math.min(span, 6);
  let filled = Math.round((minR - lo + 1) / span * n);
  filled = Math.max(0, Math.min(n, filled));
  const cls = (sugg && sugg.type === 'up') ? 'up' : 'hold';
  const bars = Array.from({length:n}, (_,i) => `<i class="${i < filled ? cls : ''}"></i>`).join('');
  const u = exMeta(key).type === 'tiempo' ? ' s' : '';
  return `<div class="steps">
    <div class="bars">${bars}</div>
    <div class="steps-v"><b>${minR}</b>/${hi}${u}${filled >= n ? ' · rango lleno' : ''}</div>
  </div>`;
}

/* «ÚLTIMA · 18×12 · 18×12» */

  const last = lastEntry(key);
  if(!last) return `<div class="last">Sin registros todavía</div>`;
  const sets = last.entry.sets;
  const shown = sets.slice(0, 4).map(s => `<b>${fmtSet(key, s)}</b>`).join(' · ');
  return `<div class="last">${label || 'Última'} · ${shown}${sets.length > 4 ? ' · …' : ''}</div>`;
}

/* =====================================================================
   DIBUJO DEL EQUIPO
   ===================================================================== */
function plateColor(kg){
  const table = PLATE_COLORS[db.settings.unit === 'lb' ? 'lb' : 'kg'];
  const v = fromKg(kg);
  for(const [w, c] of table) if(Math.abs(v - w) < 0.05) return c;
  return v >= 15 ? '#7E828A' : '#5F6268';
}
function plateDims(kg){
  for(const [w, d, t] of PLATE_DIMS) if(kg >= w - 0.01) return { d, t };
  return { d:36, t:5 };
}
/* la barra de frente: los discos de un lado se espejan en el otro */
function barbellSVG(perSide, opts){
  opts = opts || {};
  const scale = opts.scale || 1, h = opts.h || 116;
  const W = 340, cx = W/2, cy = h/2, collar = 30 * scale;
  let out = `<rect x="10" y="${cy - 2.5*scale}" width="${W-20}" height="${5*scale}" rx="${2.5*scale}" fill="#6E727A"/>`;
  for(const dir of [-1, 1])
    out += `<rect x="${cx + dir*collar - (dir < 0 ? 5*scale : 0)}" y="${cy - 9*scale}" width="${5*scale}" height="${18*scale}" rx="1.5" fill="#8B8F96"/>`;
  for(const dir of [-1, 1]){
    let x = cx + dir*(collar + 3*scale);
    for(const kg of perSide){
      const dm = plateDims(kg);
      /* a escala pequeña un disco de 1,25 sería un pelo: se le da grosor mínimo visible */
      const t = Math.max(dm.t*scale, 4), d = dm.d*scale;
      const px = dir > 0 ? x : x - t;
      out += `<rect x="${px.toFixed(1)}" y="${(cy - d/2).toFixed(1)}" width="${t.toFixed(1)}" height="${d.toFixed(1)}" rx="${(2.5*scale).toFixed(1)}" fill="${plateColor(kg)}" stroke="rgba(0,0,0,.35)" stroke-width="1"/>`;
      x += dir*(t + 2*scale);
    }
    const cl = dir > 0 ? x : x - 6*scale;
    out += `<rect x="${cl.toFixed(1)}" y="${(cy - 11*scale).toFixed(1)}" width="${Math.max(6*scale, 4).toFixed(1)}" height="${(22*scale).toFixed(1)}" rx="2" fill="#3E4247"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:${h}px;display:block" aria-hidden="true">${out}</svg>`;
}
/* un pitón corto con sus discos: aparatos de un lado y prensas */
function postSVG(perPost, opts){
  opts = opts || {};
  const scale = opts.scale || 1, h = opts.h || 92;
  const W = 340, cy = h/2;
  const dims = perPost.map(plateDims);
  const load = dims.reduce((a, d) => a + Math.max(d.t*scale, 4) + 2*scale, 0);
  const rod = 8*scale + load + Math.max(6*scale, 4) + 12*scale;
  const x0 = (W - (13 + rod)) / 2;
  let out = `<rect x="${x0}" y="${cy-34*scale}" width="13" height="${68*scale}" rx="4" fill="#2A2D31"/>`;
  out += `<rect x="${x0+13}" y="${cy-2.5*scale}" width="${rod}" height="${5*scale}" rx="${2.5*scale}" fill="#6E727A"/>`;
  out += `<rect x="${x0+13}" y="${cy-9*scale}" width="${5*scale}" height="${18*scale}" rx="1.5" fill="#8B8F96"/>`;
  let x = x0 + 13 + 8*scale;
  perPost.forEach((kg, i) => {
    const t = Math.max(dims[i].t*scale, 4), d = dims[i].d*scale;
    out += `<rect x="${x.toFixed(1)}" y="${(cy-d/2).toFixed(1)}" width="${t.toFixed(1)}" height="${d.toFixed(1)}" rx="${(2.5*scale).toFixed(1)}" fill="${plateColor(kg)}" stroke="rgba(0,0,0,.35)"/>`;
    x += t + 2*scale;
  });
  out += `<rect x="${x.toFixed(1)}" y="${(cy-11*scale).toFixed(1)}" width="${Math.max(6*scale,4).toFixed(1)}" height="${(22*scale).toFixed(1)}" rx="2" fill="#3E4247"/>`;
  return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:${h}px;display:block" aria-hidden="true">${out}</svg>`;
}
/* la torre de placas con el pin puesto.
   Las placas se estrechan para que la torre entera quepa en el alto que
   se pida: si se saliera, se recortaría y el pin parecería estar en otra
   placa — que es justo lo que hay que evitar. */
function stackSVG(sel, total, opts){
  opts = opts || {};
  const h = opts.h || 150, W = 110;
  const n = Math.max(total, sel, 1);
  const gapR = 0.28;
  const slab = Math.min(9, (h - 12) / (n + gapR * (n - 1)));
  const gap = slab * gapR;
  const alto = n*slab + (n-1)*gap;
  const top = (h - alto) / 2;
  const pin = Math.max(3, slab * 0.55);

  let out = `<rect x="${W/2-4}" y="${(top-6).toFixed(1)}" width="8" height="${(alto+12).toFixed(1)}" rx="3" fill="#2A2D31"/>`;
  for(let i = 0; i < n; i++){
    const y = top + i*(slab+gap), on = i < sel;
    out += `<rect x="18" y="${y.toFixed(1)}" width="${W-36}" height="${slab.toFixed(1)}" rx="2.5"
      fill="${on ? '#8B8F96' : '#1B1E22'}" stroke="${on ? 'rgba(0,0,0,.35)' : 'rgba(255,255,255,.07)'}"/>`;
  }
  const py = top + (sel-1)*(slab+gap) + slab/2;
  out += `<rect x="${W-22}" y="${(py-pin/2).toFixed(1)}" width="20" height="${pin.toFixed(1)}" rx="${(pin/2).toFixed(1)}" fill="#D7A44B"/>`;
  out += `<circle cx="${W-4}" cy="${py.toFixed(1)}" r="${Math.max(3, pin*0.8).toFixed(1)}" fill="#D7A44B"/>`;
  return `<svg viewBox="0 0 ${W} ${h}" style="width:${W}px;height:${h}px;display:block;flex:none" aria-hidden="true">${out}</svg>`;
}

/* ---------- fatiga sistémica: si retrocede casi todo a la vez, falta descanso ---------- */
function systemicFatigue(){
  const cut = new Date(Date.now() - 10*864e5).toISOString();
  if(db.settings.fatigueDismissed && db.settings.fatigueDismissed > cut) return null;
  const perKey = new Map();
  for(const h of db.history) for(const e of h.entries){
    if(h.deload || !e.sets.length) continue;   /* una descarga no es retroceso */
    if(!perKey.has(e.key)) perKey.set(e.key, []);
    perKey.get(e.key).push({ date:h.date, sets:e.sets });
  }
  let evaluated = 0, regressed = 0;
  for(const [key, arr] of perKey){
    arr.sort((a,b) => a.date < b.date ? -1 : 1);
    const lastE = arr[arr.length-1], prev = arr[arr.length-2];
    if(!prev || lastE.date < cut) continue;                        /* no entrenado en la ventana */
    if(new Date(lastE.date) - new Date(prev.date) > 45*864e5) continue;  /* comparación sin sentido */
    const repsMode = ['corporal','tiempo'].includes(exMeta(key).type);
    const mNow = repsMode ? Math.max(...lastE.sets.map(s=>s.r)) : bestE1RM(lastE.sets);
    const mPrev = repsMode ? Math.max(...prev.sets.map(s=>s.r)) : bestE1RM(prev.sets);
    if(mPrev <= 0) continue;
    evaluated++;
    if(mNow < mPrev * 0.98) regressed++;
  }
  return (evaluated >= 4 && regressed / evaluated >= 0.5) ? { regressed, evaluated } : null;
}
function dismissFatigue(){
  db.settings.fatigueDismissed = new Date().toISOString();
  save(); render();
}
function daysSinceBackup(){

}

/* hábito de entrenar al fallo: mayoría de RIR 0 en varias sesiones recientes */
function failureHabit(){
  if(db.settings.rirDismissed &&
     (Date.now() - new Date(db.settings.rirDismissed).getTime()) < 14*864e5) return null;
  /* las sesiones de un split marcado «al fallo a propósito» no cuentan:
     ahí el RIR 0 es el programa, no un hábito por corregir */
  const aProposito = h => {
    const sp = db.splits.find(x => x.id === historySplitId(h));
    return !!(sp && sp.failOk);
  };
  const recent = db.history.filter(h => !aProposito(h)).slice(-5);
  let withData = 0, failSessions = 0;
  for(const h of recent){
    const rirs = h.entries.flatMap(e => e.sets)
      .map(s => s.rir).filter(x => x !== undefined && x !== null);
    if(rirs.length < 3) continue;
    withData++;
    if(rirs.filter(x => x === 0).length / rirs.length >= 0.6) failSessions++;
  }
  return (withData >= 2 && failSessions >= 2) ? { failSessions } : null;
}
function dismissRIR(){
  db.settings.rirDismissed = new Date().toISOString();
  save(); render();
}

/* =====================================================================
   SPLITS
   Las rutinas son los días de un plan ordenado. Saber el orden es lo que
   permite decir qué toca hoy — y guardar un plan sin perder nada, porque
   el progreso vive en el ejercicio, no en la rutina.
   ===================================================================== */
function activeSplit(){ return db.splits.find(s => s.active) || db.splits[0] || null; }

/* ---------- configuración por split ----------
   El mismo ejercicio puede pedir otra cosa en cada plan: 8–12 reps en el
   split de hipertrofia y 4–6 con menos series en el de fuerza. Lo fijado
   aquí vive en el split (sp.exconf[key]) y solo pisa lo general. */
let ctxSplitOverride = null;   /* para juzgar la progresión con el split correcto al guardar */
function ctxSplitId(){
  if(ctxSplitOverride) return ctxSplitOverride;
  /* una sesión en curso manda: su rutina dice de qué split es */
  if(db.active){
    const r = db.routines.find(x => x.id === db.active.routineId);
    if(r && r.split) return r.split;
  }
  /* viendo una rutina, o la ficha de un ejercicio abierta desde una */
  if(view && view.name === 'routine' && view.id){
    const r = db.routines.find(x => x.id === view.id);
    if(r && r.split) return r.split;
  }
  if(view && view.name === 'exercise' && view.rid){
    const r = db.routines.find(x => x.id === view.rid);
    if(r && r.split) return r.split;
  }
  const sp = activeSplit();
  return sp ? sp.id : null;
}
function splitConf(key){
  const id = ctxSplitId();
  const sp = id && db.splits.find(x => x.id === id);
  return (sp && sp.exconf && sp.exconf[key]) || null;
}
/* series fijadas para este split, o null para dejar decidir al coach */
function splitSetsOverride(key){
  const oc = splitConf(key);
  const n = oc ? parseInt(oc.sets, 10) : NaN;
  return (!isNaN(n) && n >= 1) ? Math.min(10, n) : null;
}
function splitRoutines(id){ return db.routines.filter(r => r.split === id); }
/* a qué día pertenece una sesión: manda el id, y el nombre solo se usa
   cuando no lo hay (historial viejo o importado). Si no, dos días con el
   mismo nombre en splits distintos se robarían las sesiones. */
function sessionRoutine(h, days){
  const known = db.routines.some(r => r.id === h.routineId);
  return (h.routineId && known)
    ? days.find(r => r.id === h.routineId)
    : days.find(r => r.name === h.routineName);
}
function splitSessions(id){
  const days = splitRoutines(id);
  return db.history.filter(h => !!sessionRoutine(h, days));
}
/* el día que toca: el siguiente al último que entrenaste, dando la vuelta */
function nextDay(){
  const sp = activeSplit();
  if(!sp) return null;
  const days = splitRoutines(sp.id);
  if(!days.length) return null;
  let lastI = -1, lastH = null;
  for(const h of db.history){
    const r = sessionRoutine(h, days);
    if(r && (!lastH || h.date > lastH.date)){ lastI = days.indexOf(r); lastH = h; }
  }
  const idx = lastI < 0 ? 0 : (lastI + 1) % days.length;
  return { split:sp, routine:days[idx], idx, total:days.length,
           last: lastH ? { name: days[lastI].name, date: lastH.date } : null };
}
function daysAgoText(iso){
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 864e5);
  return d <= 0 ? 'hoy' : (d === 1 ? 'ayer' : `hace ${d} días`);
}
