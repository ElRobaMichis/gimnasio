}

/* =====================================================================
   CALENTAMIENTO CALCULADO
   Evidencia: escalera específica 40–80 % de la carga de trabajo con reps
   decrecientes (Ribeiro 2021); cargas moderadas necesitan 0–2 series
   (Ribeiro 2020); pesado → llegar a ~80 % con intención de velocidad
   (scoping review 2025); músculo ya caliente → menos (Iversen 2021).
   ===================================================================== */
function warmupPlan(xi){
  const s = db.active, ex = s.exercises[xi];
  const meta = exMeta(ex.key);
  const { hi } = effRange(ex.key);

  /* peso de trabajo de hoy: lo escrito en la serie 1, o la sugerencia del coach */
  let W = NaN;
  const typed = parseFloat(ex.sets[0] && ex.sets[0].w);
  if(!isNaN(typed) && typed > 0) W = toKg(typed);
  else if(ex.sugg && ex.sugg.w > 0) W = ex.sugg.w;

  /* ¿el músculo ya viene caliente de un ejercicio anterior de esta sesión? */
  let first = true;
  if(meta.muscle && meta.muscle !== 'none'){
    for(let i = 0; i < xi; i++){
      if(exMeta(s.exercises[i].key).muscle === meta.muscle){ first = false; break; }
    }
  } else first = (xi === 0);

  if(meta.type === 'tiempo'){
    const target = ex.sugg ? ex.sugg.reps : hi;
    const easy = Math.max(10, Math.round(target * 0.5 / 5) * 5);
    return { rows: [`1 serie × ${easy} s suaves (misma posición, lejos del límite)`], first,
             note: 'En isométricos basta una serie corta para activar el patrón.' };
  }
  if(meta.type === 'corporal'){
    const target = ex.sugg ? ex.sugg.reps : hi;
    const easy = Math.max(3, Math.round(target * 0.5));
    return { rows: [`1 serie × ${easy} reps fáciles (misma técnica, lejos del fallo)`], first,
             note: 'En peso corporal basta una serie suave del mismo movimiento para activar el patrón.' };
  }
  if(isNaN(W) || W <= 0) return null;         /* aún no hay peso de referencia */
  if(meta.type === 'asistido'){
    const helpW = roundToStep(W * 1.5, effStep(ex.key, W));
    return { rows: [`1 serie × 6 con más ayuda (~${fmtW(helpW)} ${uLabel()})`], first,
             note: 'En asistidos, calentar = misma técnica con bastante más asistencia.' };
  }
  if(W <= 12){
    return { rows: [], first, W,
             note: 'Peso ligero: la evidencia muestra que con cargas moderadas el calentamiento específico aporta poco. Si es tu primer ejercicio del día, haz 1 serie suave del mismo movimiento y listo.' };
  }
  const heavy = hi <= 7;    /* rango de fuerza → cargas relativas altas */
  const scheme = heavy
    ? (first ? [[0.4,5],[0.6,3],[0.8,2]] : [[0.55,3],[0.8,2]])
    : (first ? [[0.5,6],[0.75,3]]        : [[0.7,4]]);
  const rows = [], seen = new Set();
  for(const [pct, reps] of scheme){
    const wk = roundToStep(W * pct);
    if(wk <= 0 || wk >= W || seen.has(wk)) continue;
    seen.add(wk);
    rows.push(`${fmtW(wk)} ${uLabel()} × ${reps}`);
  }
  return { rows, first, W, heavy,
           note: rows.length ? null : 'El peso de trabajo es tan bajo que no salen escalones útiles: 1 serie suave alcanza.' };
}

function showWarmup(xi){
  const ex = db.active.exercises[xi];
  const plan = warmupPlan(xi);
  if(!plan){
    infoModal('Calentamiento', 'Escribe primero el peso de hoy en la serie 1 (o entrena una vez este ejercicio) y te calculo la escalera de calentamiento.');
    return;
  }
  const list = plan.rows.map((r, i) => `
    <div class="row" style="padding:6px 0;border-bottom:1px dashed #232833">
      <span style="width:22px;text-align:center;color:var(--mut);font-weight:700" class="num">${i+1}</span>
      <b class="num">${r}</b>
    </div>`).join('')
    + (plan.W && plan.rows.length ? `
    <div class="row" style="padding:8px 0">
      <span style="width:22px;text-align:center;color:var(--good)">→</span>
      <b>Series de trabajo: ${fmtW(plan.W)} ${uLabel()}</b>
    </div>` : '');
  openModal(`
    <h2>🔥 Calentamiento — ${esc(ex.name)}</h2>
    ${ plan.first ? '' : `<p class="muted" style="margin-bottom:10px">Este músculo ya viene caliente de un ejercicio anterior: con menos alcanza.</p>` }
    ${ list ? `<div style="margin-bottom:12px">${list}</div>` : '' }
    ${ plan.note ? `<p class="muted" style="margin-bottom:12px">${plan.note}</p>` : '' }
    <p class="tiny" style="line-height:1.6;margin-bottom:14px">
      Descansa solo 30–60 s entre series de calentamiento y mueve el peso con <b>intención de velocidad</b>
      (activa sin fatigar). <b>No registres estas series en la app</b> — solo las de trabajo.
      ${ plan.first && xi === 0 ? ' Antes del primer ejercicio del día, 5 min de cardio suave suman — sobre todo en pierna (+8 % de rendimiento en la evidencia).' : '' }
    </p>
    <button class="btn" onclick="closeModal()">Listo</button>`);
}

/* =====================================================================
   TIMER DE DESCANSO
   ===================================================================== */
function restSecs(key){
  const r = db.settings.rest;
  if(r === 'off') return null;
  if(key){                       /* descanso propio del ejercicio, si lo configuró */
    const er = parseInt(exMeta(key).rest, 10);
    if(!isNaN(er) && er > 0) return er;
  }
  if(r && r !== 'auto'){ const n = parseInt(r,10); if(!isNaN(n) && n > 0) return n; }
  return GOALS[db.settings.goal || 'ambas'].rest;
}
function startRestAuto(key){
  const s = restSecs(key); if(!s) return;
  restUntil = Date.now() + s*1000;
  tickRest();
}
function toggleRest(){
  if(restUntil) restUntil = null;
  else startRestAuto();
  tickRest();
}
/* ---------- notificaciones del sistema (opt-in) ---------- */
function canNotify(){
  return db.settings.notify === 'on' &&
         typeof Notification !== 'undefined' && Notification.permission === 'granted';
}
/* solo avisa cuando la app NO está a la vista: en pantalla, el sonido/vibración bastan */
function notify(title, body, tag){
  if(!canNotify()) return;
  if(typeof document !== 'undefined' && document.visibilityState === 'visible') return;
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready
        .then(reg => reg.showNotification(title, { body, tag, icon:'icon-192.png', badge:'icon-192.png' }))
        .catch(() => {});
    } else {
      new Notification(title, { body, tag });
    }
  }catch(e){}
}
function enableNotifications(){
  if(typeof Notification === 'undefined'){
    infoModal('No disponible en este navegador',
      'En iPhone, las notificaciones solo funcionan con la app instalada en la pantalla de inicio (Safari → Compartir → Añadir a pantalla de inicio) y iOS 16.4 o más nuevo. Instálala y actívalas desde ahí.');
    return;
  }
  Notification.requestPermission().then(perm => {
    if(perm === 'granted'){
      db.settings.notify = 'on'; save(); render();
      infoModal('Notificaciones activadas ✓',
        'Te avisaré cuando termine tu descanso y si una sesión queda abierta sin actividad — solo cuando la app no esté a la vista.');
    } else {
      db.settings.notify = 'off'; save(); render();
      if(perm === 'denied') infoModal('Permiso bloqueado',
        'El navegador tiene bloqueadas las notificaciones para esta app. Para permitirlas: ajustes del navegador/teléfono → notificaciones de este sitio → permitir, y vuelve a intentarlo.');
    }
  });
}
function disableNotifications(){ db.settings.notify = 'off'; save(); render(); }

/* sesión olvidada: abierta 15+ min sin anotar nada */
function checkIdleSession(){
  if(!db.active) return;
  const last = db.active.lastLog || db.active.start;
  if(Date.now() - last > 15*60*1000 && !(db.active.idleNotified > last)){
    db.active.idleNotified = Date.now();
    save();
    notify('⏱️ Tu sesión sigue en curso',
      'Llevas 15 min sin anotar series. ¿Seguimos? Si ya acabaste, entra y toca “Terminar” para guardarla.', 'hierro-idle');
  }
}

/* pantalla siempre encendida durante la sesión (Wake Lock) */
let wakeLock = null;
async function acquireWake(){
  try{
    if('wakeLock' in navigator && db.settings.screenOn !== 'off' && db.active && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  }catch(e){}
}
function releaseWake(){
  try{ if(wakeLock) wakeLock.release(); }catch(e){}
  wakeLock = null;
}

function beep(){
  try{
    if(navigator.vibrate) navigator.vibrate([200,120,200]);
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    for(const [f, t] of [[880, 0], [1175, 0.22]]){
      const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
      o.connect(gn); gn.connect(audioCtx.destination);
      o.frequency.value = f;
      gn.gain.setValueAtTime(0.18, t0 + t);
      gn.gain.exponentialRampToValueAtTime(0.001, t0 + t + 0.25);
      o.start(t0 + t); o.stop(t0 + t + 0.3);
    }
  }catch(e){}
}
function tickRest(){
  const el = document.getElementById('restchip');
  if(!el) return;
  const total = restSecs();
  if(restUntil === null){
    if(el.className !== 'restchip'){ el.className = 'restchip'; el.textContent = `▶ Descanso (${fmtClock(total || 0)})`; }
    return;
  }
  const rem = Math.ceil((restUntil - Date.now())/1000);
  if(rem <= 0){
    restUntil = null;
    beep();
    notify('✅ Descanso listo', '¡A la siguiente serie!', 'hierro-rest');
    el.className = 'restchip done';
    el.textContent = '✓ Descanso listo — ¡a la siguiente serie!';
    setTimeout(() => { if(restUntil === null) tickRest(); }, 4000);
    /* forzar refresco del texto al estado normal después del aviso */
    setTimeout(() => { const e2 = document.getElementById('restchip'); if(e2 && restUntil === null){ e2.className='restchip'; e2.textContent = `▶ Descanso (${fmtClock(restSecs() || 0)})`; } }, 4200);
    return;
  }
  el.className = 'restchip on';
  el.textContent = `⏸ Descanso: ${fmtClock(rem)}`;
}

/* =====================================================================
   GRÁFICA DE PROGRESO (canvas, una serie: 1RM estimado o reps)
   ===================================================================== */
function drawChart(){
  const cv = document.getElementById('exchart');
  if(!cv) return;
  const pts = window.__chartPts || [];
  if(pts.length < 2) return;
  const W = cv.parentElement.clientWidth, H = 190;
  const dpr = window.devicePixelRatio || 1;
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  const padL = 38, padR = 14, padT = 16, padB = 22;
  const dmin = Math.min(...pts.map(p=>p.v)), dmax = Math.max(...pts.map(p=>p.v));
  let lo = dmin, hi = dmax;
  if(lo === hi){ lo -= 1; hi += 1; }
  const span = hi - lo; lo -= span*0.12; hi += span*0.12;
  const X = i => padL + (W-padL-padR) * (pts.length === 1 ? 0.5 : i/(pts.length-1));
  const Y = v => padT + (H-padT-padB) * (1 - (v-lo)/(hi-lo));

  /* rejilla recesiva: 3 líneas con valor */
  ctx.font = '10px -apple-system, sans-serif';
  ctx.lineWidth = 1;
  for(const v of [dmin, (dmin+dmax)/2, dmax]){
    const y = Y(v);
    ctx.strokeStyle = '#262b34';
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W-padR, y); ctx.stroke();
    ctx.fillStyle = '#8e94a0'; ctx.textAlign = 'left';
    ctx.fillText(fmtNum(Math.round(v*10)/10), 2, y+3.5);
  }
  /* línea de la serie */
  ctx.strokeStyle = '#f5c242'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  pts.forEach((p,i) => i ? ctx.lineTo(X(i), Y(p.v)) : ctx.moveTo(X(0), Y(p.v)));
  ctx.stroke();
  /* puntos: discretos, último enfatizado con anillo de superficie */
  pts.forEach((p,i) => {
    const last = i === pts.length-1;
    ctx.beginPath();
    ctx.arc(X(i), Y(p.v), last ? 4.5 : 2.5, 0, 7);
    ctx.fillStyle = '#f5c242'; ctx.fill();
    if(last){ ctx.strokeStyle = '#181b21'; ctx.lineWidth = 2; ctx.stroke(); }
  });
  /* etiqueta directa solo en el último punto */
  const lastP = pts[pts.length-1];
  ctx.fillStyle = '#eae6dc'; ctx.font = '700 12px -apple-system, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(fmtNum(lastP.v), Math.min(X(pts.length-1)+4, W-padR), Math.max(12, Y(lastP.v)-9));
  /* fechas primera y última */
  ctx.fillStyle = '#8e94a0'; ctx.font = '10px -apple-system, sans-serif';
  ctx.textAlign = 'left';  ctx.fillText(fmtDateShort(pts[0].date), padL, H-6);
  ctx.textAlign = 'right'; ctx.fillText(fmtDateShort(lastP.date), W-padR, H-6);

  /* interacción: tocar/mover muestra el detalle de la sesión más cercana */
  const pick = ev => {
    const rect = cv.getBoundingClientRect();
    const x = ev.clientX - rect.left;
    let i = Math.round((x - padL) / ((W-padL-padR) / (pts.length-1)));
    i = Math.max(0, Math.min(pts.length-1, i));
    const tip = document.getElementById('charttip');
    if(tip) tip.innerHTML = `<b style="color:var(--ink)">${fmtDate(pts[i].date)}</b> · ${fmtNum(pts[i].v)} ${window.__chartUnit}`;
  };
  cv.onpointerdown = pick;
  cv.onpointermove = ev => { if(ev.buttons || ev.pointerType === 'mouse') pick(ev); };
}

/* =====================================================================
   IMPORTACIÓN DESDE HEVY (CSV)
   ===================================================================== */
function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    }
    else if(c === '"') q = true;
    else if(c === ',') { row.push(cur); cur = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i+1] === '\n') i++;
      row.push(cur); cur = '';
      if(row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    }
    else cur += c;
  }
  if(cur !== '' || row.length){ row.push(cur); if(row.length > 1 || row[0] !== '') rows.push(row); }
  return rows;
}

const HEVY_MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseHevyDate(s){
  const m = /(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4}),?\s+(\d{1,2}):(\d{2})\s*([ap]m)?/i.exec(s || '');
  if(!m) return null;
  const mo = HEVY_MONTHS[m[2].toLowerCase()];
  if(mo === undefined) return null;
  let h = parseInt(m[4],10);
  const ap = (m[6]||'').toLowerCase();
  if(ap === 'pm' && h < 12) h += 12;
  if(ap === 'am' && h === 12) h = 0;
  return new Date(parseInt(m[3],10), mo, parseInt(m[1],10), h, parseInt(m[5],10));
}

function importHevy(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onerror = () => infoModal('No se pudo leer el archivo', 'Vuelve a intentarlo o revisa que sea el CSV exportado por Hevy.');
  reader.onload = () => {
    try{
      const rows = parseCSV(String(reader.result));
      const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
      const col = n => head.indexOf(n);
      const iT = col('title'), iS = col('start_time'), iE = col('end_time'),
            iX = col('exercise_title'), iTy = col('set_type'),
            iR = col('reps'), iRPE = col('rpe');
      /* Hevy exporta según la unidad de la cuenta: weight_kg (kg) o weight_lbs (libras) */
      let iW = col('weight_kg'), wFactor = 1, wUnit = 'kg';
      if(iW < 0){
        iW = col('weight_lbs');
        if(iW >= 0){ wFactor = LB_KG; wUnit = 'lb'; }
      }
      if(iT < 0 || iS < 0 || iX < 0 || iR < 0){
        infoModal('Formato no reconocido', 'El archivo no parece una exportación de Hevy: faltan las columnas title, start_time, exercise_title o reps.');
        return;
      }
      const sessions = new Map();
      let skippedWarmup = 0;
      for(const r of rows){
        const start = parseHevyDate(r[iS]);
        if(!start || !r[iX]) continue;
        if(iTy >= 0 && (r[iTy]||'').toLowerCase() === 'warmup'){ skippedWarmup++; continue; }
        const reps = parseInt(r[iR],10);
        if(isNaN(reps) || reps <= 0) continue;              /* cardio / series sin reps */
        let w = iW >= 0 ? parseFloat(r[iW]) : NaN;
        if(isNaN(w) || w < 0) w = 0;                        /* peso corporal → 0 kg */
        w = Math.round(w * wFactor * 1000) / 1000;          /* si venía en lb, a kg (canónico) */
        const skey = (r[iT]||'Hevy') + '|' + r[iS];
        if(!sessions.has(skey)){
          const end = iE >= 0 ? parseHevyDate(r[iE]) : null;
          sessions.set(skey, {
            hevyKey: skey, title: r[iT] || 'Hevy',
            date: start.toISOString(),
            duration: (end && end > start) ? Math.floor((end - start)/1000) : 0,
            ex: new Map()
          });
        }
        const s = sessions.get(skey);
        if(!s.ex.has(r[iX])) s.ex.set(r[iX], []);
        const set = { w, r: reps };
        if(iRPE >= 0){
          const rpe = parseFloat(r[iRPE]);
          if(!isNaN(rpe) && rpe > 0) set.rir = Math.max(0, Math.min(5, Math.round(10 - rpe)));
        }
        s.ex.get(r[iX]).push(set);
      }
      const existingMap = new Map(db.history.filter(h => h.hevyKey).map(h => [h.hevyKey, h]));
      const news = [], repairs = [];
      for(const s of sessions.values()){
        if(!s.ex.size) continue;
        const old = existingMap.get(s.hevyKey);
        if(!old){ news.push(s); continue; }
        /* auto-reparación: la sesión existe pero se importó sin pesos (bug previo con
           CSV en libras) y el archivo sí trae pesos → se actualiza en vez de saltarse */
        const oldAllZero = old.entries.every(e => e.sets.every(st => !st.w));
        const incomingHasW = [...s.ex.values()].some(sets => sets.some(st => st.w > 0));
        if(oldAllZero && incomingHasW) repairs.push(s);
      }
      if(!news.length && !repairs.length){
        infoModal('Nada nuevo para importar', sessions.size
          ? 'Todas las sesiones del archivo ya están en tu historial, con sus pesos correctos.'
          : 'No se encontraron sesiones con series de peso y reps en el archivo.');
        return;
      }
      window.__hevyImport = { news, repairs };
      const titles = [...new Set(news.concat(repairs).map(s => s.title))];
      const nSets = news.reduce((a,s) => a + [...s.ex.values()].reduce((b,x) => b + x.length, 0), 0);
      openModal(`
        <h2>Importar de Hevy</h2>
        <p class="muted">${news.length ? `Se encontraron <b style="color:var(--ink)">${news.length} sesiones</b> nuevas (${nSets} series) de: ${titles.map(esc).join(', ')}.` : ''}
          ${repairs.length ? `<b style="color:var(--acc)">${repairs.length} sesiones que se habían importado sin pesos se repararán</b> con los pesos correctos del archivo.` : ''}
          Pesos del archivo detectados en <b style="color:var(--ink)">${wUnit === 'lb' ? 'libras' : 'kilos'}</b>${wUnit === 'lb' ? ' — se convierten automáticamente (internamente todo vive en kg)' : ''}.
          ${skippedWarmup ? `Se omiten ${skippedWarmup} series de calentamiento.` : ''}
          Las rutinas que no existan se crean con los ejercicios de la sesión más reciente.</p>
        <button class="btn btn-acc" onclick="applyHevyImport()">Importar todo</button>
        <button class="btn btn-ghost" style="margin-top:8px" onclick="closeModal()">Cancelar</button>`);
    }catch(err){
      infoModal('No se pudo importar', 'El archivo no se pudo procesar: ' + esc(err.message));
    }
  };
  reader.readAsText(file);
}

function applyHevyImport(){
  const { news = [], repairs = [] } = window.__hevyImport || {};
  if(!news.length && !repairs.length){ closeModal(); return; }
  for(const s of news){
    db.history.push({
      id: uid(), hevyKey: s.hevyKey, routineId: null,
      routineName: s.title, date: s.date, duration: s.duration,
      entries: [...s.ex.entries()].map(([name, sets]) => ({ key: exKey(name), name, sets }))
    });
  }
  /* reparar sesiones importadas sin pesos por el bug de weight_lbs */
  for(const s of repairs){
    const old = db.history.find(h => h.hevyKey === s.hevyKey);
    if(!old) continue;
    old.entries = [...s.ex.entries()].map(([name, sets]) => ({ key: exKey(name), name, sets }));
    if(!old.duration && s.duration) old.duration = s.duration;
    /* deshacer el "peso corporal" mal asignado cuando ahora sí hay pesos */
    for(const [nm, sets] of s.ex){
      const m = exMeta(exKey(nm));
      if(m.type === 'corporal' && sets.some(x => x.w > 0)){
        m.type = /assisted/i.test(nm) ? 'asistido' : 'normal';
      }
    }
  }
  db.history.sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));

  /* detectar tipo automáticamente: "(Assisted)" → asistido; todo a 0 kg → corporal */
  const traits = new Map();
  for(const s of news) for(const [nm, sets] of s.ex){
    const k = exKey(nm);
    const t = traits.get(k) || { zero:true, assisted:/assisted/i.test(nm) };
    if(sets.some(x => x.w > 0)) t.zero = false;
    traits.set(k, t);
  }
  for(const [k, t] of traits){
    const m = exMeta(k);
    if(m.type === 'normal'){
      if(t.assisted) m.type = 'asistido';
      else if(t.zero) m.type = 'corporal';
    }
  }

  /* crear rutinas que falten, con los ejercicios de la sesión más reciente de cada título */
  const byTitle = new Map();
  for(const s of news){
    const c = byTitle.get(s.title);
    if(!c || s.date > c.date) byTitle.set(s.title, s);
  }
  let newRoutines = 0;
  for(const [title, s] of byTitle){
    if(db.routines.some(r => r.name.trim().toLowerCase() === title.trim().toLowerCase())) continue;
    db.routines.push({ id: uid(), name: title,
      exercises: [...s.ex.keys()].map(n => ({ id: uid(), name: n, key: exKey(n) })) });
    newRoutines++;
  }

  /* tipos y grupos musculares de lo recién importado */
  migrateTypes();

  /* reconstruir el estado adaptativo reproduciendo todo el historial en orden */
  db.progress = {};
  for(const h of db.history)
    for(const e of h.entries) updateProgress(e.key, e.sets, h.date);

  window.__hevyImport = null;
  save(); closeModal();
  openModal(`
    <h2>Importación lista 💪</h2>
    <p class="muted">${news.length ? `${news.length} sesiones agregadas al historial` : ''}${news.length && newRoutines ? ` y ${newRoutines} rutina${newRoutines===1?'':'s'} creada${newRoutines===1?'':'s'}` : ''}${news.length && repairs.length ? '. ' : ''}
      ${repairs.length ? `${repairs.length} sesiones reparadas con sus pesos correctos.` : ''}
      Los ejercicios asistidos y de peso corporal se detectaron solos, y las sugerencias del coach ya usan todo tu historial.</p>
    <button class="btn btn-acc" onclick="closeModal(); go({name:'home'})">Ver rutinas</button>
    <button class="btn btn-ghost" style="margin-top:8px" onclick="closeModal(); go({name:'history'})">Ver historial</button>`);
}

function rirInfo(){
  infoModal('¿Qué es el RIR?', `
    <b style="color:var(--ink)">RIR = “reps en reserva”</b>: cuántas repeticiones MÁS podrías haber hecho
    al terminar la serie.<br><br>
    · Hiciste 10 reps pero podías hacer 12 → RIR 2.<br>
    · No podías hacer ni una más → RIR 0 (llegaste al fallo).<br><br>
    <b style="color:var(--ink)">¿Para qué sirve?</b> La ciencia dice que lo ideal es entrenar dejando
    1–3 reps en reserva: suficiente esfuerzo para crecer, sin el desgaste de ir al fallo siempre.<br><br>
    <b style="color:var(--ink)">Es opcional</b>, pero si lo anotas el coach afina mejor: si pones RIR 4+
    (te sobraban muchas reps), te sugerirá subir el peso antes; si pones RIR 0 seguido, sabrá que ese peso
    te queda pesado.`);
}
function e1rmInfo(){
  infoModal('¿Qué es el 1RM estimado?', `
    Tu <b style="color:var(--ink)">1RM</b> (repetición máxima) es el peso más pesado que podrías levantar
    UNA sola vez. No hace falta probarlo de verdad (¡ni es recomendable!): se puede
    <b style="color:var(--ink)">estimar</b> desde cualquier serie con una fórmula
    (Epley: peso × (1 + reps/30)).<br><br>
    Por ejemplo: 60 kg × 10 reps ≈ 80 kg de 1RM estimado.<br><br>
    <b style="color:var(--ink)">¿Para qué sirve?</b> Es la mejor forma de ver tu progreso real:
    aunque una semana hagas 8 reps y otra 11, o cambies de rango, el 1RM estimado
    los vuelve comparables. La gráfica de cada ejercicio muestra cómo evoluciona.`);
}
function asistInfo(){
  infoModal('¿Qué son los ejercicios asistidos?', `
    Son ejercicios donde una máquina o banda elástica <b style="color:var(--ink)">te ayuda</b> a completar
    el movimiento, típicamente dominadas y fondos asistidos.<br><br>
    <b style="color:var(--ink)">Clave:</b> los kg que marcas en la máquina son la AYUDA que recibes,
    no el peso que levantas. Por eso aquí el progreso funciona al revés:<br><br>
    · Menos kg de ayuda = más difícil = <b style="color:var(--ink)">progreso</b> ✓<br>
    · Más kg de ayuda = más fácil.<br><br>
    Si marcas un ejercicio como “Asistido” (tocándolo en su rutina), el coach lo entiende y te sugiere

    detectan solos.`);
}
function coachInfo(){
  infoModal('¿Cómo me sugiere progresar el coach?', `
    Usa <b style="color:var(--ink)">doble progresión</b>, el método con más respaldo científico:<br><br>
    1. Cada ejercicio tiene un rango de reps según tu objetivo (ej. 8–12).<br>
    2. Con el mismo peso, intenta sumar reps sesión a sesión.<br>
    3. Cuando llegas al tope del rango en TODAS las series → sube el peso (~2,5 %) y vuelve a empezar
    desde el piso del rango.<br><br>
    Además se adapta a ti, por ejercicio: si fallas tras subir, los saltos se hacen más pequeños;
    si no sostienes el rango 2 veces seguidas, te propone bajar ~5 % y reconstruir; si te estancas
    varias sesiones, te suma una serie (más volumen = más progreso). En peso corporal progresas por
    reps y en asistidos bajando la ayuda.<br><br>
    Sobre las series: la zona ideal es <b style="color:var(--ink)">2–4 series por ejercicio</b> —
    a partir de la 4ª el beneficio por sesión cae en picada. Si vienes haciendo 5 o más, el coach
    te sugerirá concentrar el trabajo en menos series más intensas. Con 4+ series, la peor no cuenta
    para evaluar tu progreso (que la última se caiga es fatiga normal).<br><br>
    Regla de oro: termina tus series dejando 1–3 reps en reserva (RIR 1–3) — esfuerzo alto sin
    ir al fallo cada vez.`);
}

function afterRender(){
  if(view.name === 'session' && db.active){
    const tick = () => {
      const el = document.getElementById('clock');
      if(!el || !db.active) return;
      el.textContent = fmtClock(Math.floor((Date.now() - db.active.start)/1000));
      tickRest();
    };
    tick();
    timerInt = setInterval(tick, 1000);
    acquireWake();
  }
  if(view.name === 'exercise') drawChart();
}

/* migración: detectar asistidos/corporales en historial ya importado */
function migrateTypes(){
  const traits = new Map();
  for(const h of db.history) for(const e of h.entries){
    if(db.exmeta[e.key]) continue;   /* ya configurado por el usuario */
    const t = traits.get(e.key) || { zero:true, assisted:/assisted|asistid/i.test(e.name) };
    if(e.sets.some(x => x.w > 0)) t.zero = false;
    traits.set(e.key, t);
  }
  let changed = false;
  for(const [k, t] of traits){
    if(t.assisted){ exMeta(k).type = 'asistido'; changed = true; }
    else if(t.zero){ exMeta(k).type = 'corporal'; changed = true; }
  }
  /* grupos musculares: adivinar donde falte (el usuario puede corregir en la ficha) */
  for(const [key, info] of allExerciseNames()){
    const m = exMeta(key);
    if(m.muscle === undefined || m.muscle === null){
      const g = guessMuscle(info.name);
      if(g){ m.muscle = g; changed = true; }
    }
  }
  if(changed) save();
}
