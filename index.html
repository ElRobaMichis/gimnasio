/* ---------- FICHA DE EJERCICIO (progreso + ajustes) ---------- */
function openExercise(rid, exid){
  const r = db.routines.find(x => x.id === rid);
  const ex = r && r.exercises.find(e => e.id === exid);
  if(!ex) return;
  go({ name:'exercise', key:ex.key, exname:ex.name, rid });
}

function exerciseHistory(key){
  const out = [];
  for(const h of db.history){
    const e = h.entries.find(x => x.key === key);
    if(e && e.sets.length) out.push({ date:h.date, sets:e.sets });
  }
  out.sort((a,b) => a.date < b.date ? -1 : 1);
  return out;
}

function exerciseHeadHTML(){
  const eq = exEquip(view.exname);
  const volver = (view.from === 'session' && db.active)
    ? `<button class="back" onclick="go({name:'session'})">‹ Sesión en curso</button>`
    : `<button class="back" onclick="go({name:'routine', id:'${view.rid}'})">‹ Volver</button>`;
  return `
    ${volver}
    <div class="title big">${esc(exBaseName(view.exname))}</div>
    ${eq ? `<div class="title-sub">${esc(eq)}</div>` : '<div style="height:12px"></div>'}
    <div class="knurl"></div>`;
}

const TYPE_HINT = {
  normal:   'Tú levantas la carga. Progresas subiendo kilos cuando llenas el rango de reps.',
  asistido: 'Una máquina o banda te ayuda. Los kg que anotas son la ayuda: progresar = usar menos kg.',
  corporal: 'Sin peso externo. Progresas sumando reps o series; si usas lastre, anótalo como peso.',
  tiempo:   'Isométricos y sostenidos: mides segundos, no reps. Cada serie trae cronómetro con alarma.',
};

function viewExercise(){
  const key = view.key, meta = exMeta(key);
  const g = goalRange();
  const p = prog(key);
  const hist = exerciseHistory(key);
  const corporal = meta.type === 'corporal';
  const porTiempo = meta.type === 'tiempo';
  const repsMode = corporal || porTiempo;   /* la métrica es reps/segundos, no e1RM */
  const pts = hist.map(h => ({
    date: h.date,
    v: repsMode ? Math.max(...h.sets.map(s => s.r)) : Math.round(fromKgEx(key, bestE1RM(h.sets))*10)/10
  })).filter(p => p.v > 0);
  window.__chartPts = pts;
  window.__chartUnit = porTiempo ? 's' : (corporal ? 'reps' : uLabelEx(key));
  const best = pts.length ? Math.max(...pts.map(p => p.v)) : 0;

  const headLabel = porTiempo ? 'Tu mejor tiempo' : (corporal ? 'Tu récord de reps' : '1RM estimado');
  const unitLabel = porTiempo ? 's' : (corporal ? 'reps' : uLabelEx(key));

  /* «tu carga de trabajo es el X % de esa marca» */
  let pctLine = '';
  if(!repsMode && meta.type !== 'asistido' && hist.length){
    const wNow = workWeight(hist[hist.length-1].sets);
    const bestKg = Math.max(0, ...hist.map(h => bestE1RM(h.sets)));
    if(wNow > 0 && bestKg > 0){
      pctLine = `<div class="pr-d">Tu carga de trabajo (${fmtWEx(key, wNow)} ${uLabelEx(key)}) es el
        <b>${Math.round(wNow / bestKg * 100)} %</b> de esa marca.</div>`;
    }
  }
  const whatIs = porTiempo
    ? `<div class="pr-d">Tu mejor tiempo sostenido en una serie.</div>`
    : corporal
    ? `<div class="pr-d">Tus mejores reps en una serie.</div>`
    : `<div class="pr-d">El peso máximo que podrías levantar una sola vez, calculado desde tus series.
        <span class="linkish" role="button" tabindex="0" onclick="e1rmInfo()">¿Cómo se calcula?</span></div>`;

  const panel = pts.length ? `
    <div class="panel">
      <div class="pr"><div class="n">${fmtNum(best)}</div><div class="u">${unitLabel}</div></div>
      ${pctLine || whatIs}
      ${ pts.length >= 2 ? `
        <div class="chart"><canvas id="exchart" height="120"></canvas></div>
        <div class="axis">
          <span>${fmtDateShort(pts[0].date)}</span>
          <span id="charttip">${pts.length} sesiones</span>
          <span>${fmtDateShort(pts[pts.length-1].date)}</span>
        </div>`
        : `<div class="hint">Registra al menos 2 sesiones para ver la gráfica.</div>` }
    </div>`
    : `<div class="panel"><div class="muted">Todavía no hay registros de este ejercicio.
        Cuando entrenes, aquí verás tu progreso.</div></div>`;

  const rotation = (p.stall >= 6 && meta.muscle && meta.muscle !== 'none') ? (() => {
    const vars = [...allExerciseNames()]
      .filter(([k]) => k !== key && exMeta(k).muscle === meta.muscle)
      .slice(0, 3).map(([, info]) => esc(exBaseName(info.name)));
    return `<div class="note">
      <div class="note-t">Rotación sugerida · ${p.stall} sesiones sin avanzar</div>
      <div class="note-d">Cambiarlo por una variante del mismo músculo durante 4–6 semanas suele reactivar
        el progreso (estímulo nuevo, mismas ganancias). Después puedes volver.
        ${vars.length ? `Variantes que ya conoces: <b>${vars.join(', ')}</b>.` : ''}</div>
    </div>`;
  })() : '';

  const seg = ['normal','asistido','corporal','tiempo'].map(t => {
    const label = { normal:'Normal', asistido:'Asistido', corporal:'Corporal', tiempo:'Tiempo' }[t];
    return `<button class="${meta.type===t?'on':''}" onclick="setExType('${key}','${t}')">${label}</button>`;
  }).join('');

  const recent = [...hist].reverse().slice(0, 6).map(h => `
    <div class="exline">
      <span class="tiny">${fmtDate(h.date)}</span>
      <span class="sets">${h.sets.map(s => fmtSet(key, s) + (s.rir != null ? `@${s.rir}` : '')).join(' · ')}</span>
    </div>`).join('');

  return `
    <div class="sect">${headLabel}</div>
    ${panel}
    ${rotation}

    <div class="sect">Cómo se progresa</div>
    <div class="seg4">${seg}</div>
    <div class="hint">${TYPE_HINT[meta.type] || ''}</div>

    <div class="sect">Cómo se carga</div>
    <div class="stack">
      ${EQUIP_KEYS.map(k => `
        <button class="opt ${meta.equip === k ? 'on' : ''}" onclick="setExEquip('${key}','${k}')">
          <b>${EQUIP[k].label}</b><span>${EQUIP[k].desc}</span>
        </button>`).join('')}
    </div>
    ${ !meta.equip ? `<div class="hint">Sin elegir, el coach progresa igual pero no puede decirte cómo
      cargar nada. Se adivina del nombre del ejercicio; toca el que corresponda si falló.</div>` : '' }
    ${ equipConfigHTML(key, meta) }

    <div class="sect">Ajustes del ejercicio</div>
    <div class="list">
      <div class="line">
        <div class="l-t">${porTiempo ? 'Rango de segundos' : 'Rango de reps'}</div>
        <div class="l-v">
          <input type="number" inputmode="numeric" min="1" placeholder="${porTiempo ? TIEMPO_RANGE.lo : g.lo}"
            value="${meta.lo ?? ''}" aria-label="Mínimo" oninput="setExRange('${key}','lo',this.value)">
          <span style="color:var(--dim)">–</span>
          <input type="number" inputmode="numeric" min="2" placeholder="${porTiempo ? TIEMPO_RANGE.hi : g.hi}"
            value="${meta.hi ?? ''}" aria-label="Máximo" oninput="setExRange('${key}','hi',this.value)">
        </div>
      </div>
      <div class="line">
        <div class="l-t">Salto mínimo</div>
        <div class="l-v"><select class="inline" onchange="setExStep('${key}',this.value)">${stepOptionsHTML(meta.step)}</select></div>
      </div>
      ${ meta.type === 'normal' ? `
      <div class="line">
        <div><div class="l-t">Peso máximo</div><div class="l-d">El tope de esa máquina o mancuerna</div></div>
        <div class="l-v">
          <input type="number" inputmode="decimal" step="any" min="0" placeholder="—" style="width:66px"
            value="${meta.cap != null ? inputWEx(key, meta.cap) : ''}" aria-label="Peso máximo"
            oninput="setExCap('${key}',this.value)">
          <span style="color:var(--dim)">${uLabelEx(key)}</span>
        </div>
      </div>` : '' }
      <div class="line">
        <div class="l-t">Grupo muscular</div>
        <div class="l-v"><select class="inline" onchange="setExMuscle('${key}',this.value)">
          <option value="none" ${!meta.muscle || meta.muscle==='none' ? 'selected':''}>Sin grupo</option>
          ${MUSCLES.map(([k,l]) => `<option value="${k}" ${meta.muscle===k?'selected':''}>${l}</option>`).join('')}
        </select></div>
      </div>
      <div class="line">
        <div class="l-t">Descanso</div>
        <div class="l-v"><select class="inline" onchange="setExRest('${key}',this.value)">
          <option value="auto" ${!meta.rest?'selected':''}>General</option>
          ${[45,60,90,120,150,180,240].map(s => `
            <option value="${s}" ${String(meta.rest)===String(s)?'selected':''}>${fmtClock(s)}</option>`).join('')}
        </select></div>
      </div>
    </div>
    <div class="hint">El rango viene de tu objetivo (${g.lo}–${g.hi}); cámbialo solo para casos especiales
      (ej. abdominales 15–25). ${ (() => {
        const auto = effStep(key, 20);
        return effEquip(key) && effEquip(key) !== 'nada'
          ? `El salto automático sale de cómo se carga: <b>${fmtWEx(key, auto)} ${uLabelEx(key)}</b>. Cámbialo solo si tu gimnasio es raro.`
          : 'El salto mínimo es el aumento más pequeño posible en tu gimnasio.'; })() }
      Si marcas el peso máximo, al alcanzarlo el coach progresa por reps y series en vez de pedirte kilos imposibles.</div>

    <div class="sect">Otra máquina</div>
    <button class="btn quiet sm" onclick="promptDuplicateEx('${key}', '${esc(view.exname).replace(/'/g, "\\'")}')">
      Duplicar para otra máquina</button>
    <div class="hint">Si tu gimnasio tiene este ejercicio en dos aparatos —uno de cable y otro de discos—
      van separados: no pesan lo mismo ni progresan igual.</div>

    <div class="sect">Notas</div>
    <textarea placeholder="Ej. agarre ancho, asiento en 4, bajar lento…"
      oninput="setExNotes('${key}',this.value)">${esc(meta.notes || '')}</textarea>
    <div class="hint">Las verás durante la sesión, debajo del nombre del ejercicio.</div>

    ${ recent ? `
      <div class="sect">Últimas sesiones</div>
      <div class="list" style="padding:4px 16px">${recent}</div>
      <div class="hint">Formato: ${uLabelEx(key)}×reps. El “@2” es tu RIR — las reps que te quedaban.</div>` : '' }`;
}

/* la configuración propia de cada forma de cargar */
function equipConfigHTML(key, meta){
  const eq = effEquip(key);
  if(eq === 'barra' || eq === 'discos'){
    const pts = effPoints(key);
    const minStep = plateMinStep(pts);
    const bars = availableBars(), cur = barFor(key);
    return `
      <div class="sect">¿Dónde van los discos?</div>
      <div class="stack">
        ${POINTS.map(([n, t, d]) => `
          <button class="opt ${pts === n ? 'on' : ''}" onclick="setExPoints('${key}',${n})">
            <b>${t}</b><span>${d}</span>
          </button>`).join('')}
      </div>
      <div class="list" style="margin-top:14px">
        ${ eq === 'barra' ? `
        <div class="line">
          <div><div class="l-t">Barra</div><div class="l-d">${cur ? `${esc(cur.name)} · ${fmtW(cur.kg)} ${uLabel()}` : 'Ninguna disponible'}</div></div>
          <div class="l-v"><select class="inline" onchange="setExBarSel('${key}',this.value)">
            <option value="auto" ${!meta.bar ? 'selected' : ''}>Predeterminada</option>
            ${bars.map(b => `<option value="${b.id}" ${meta.bar === b.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}
          </select></div>
        </div>` : `
        <div class="line">
          <div><div class="l-t">El aparato vacío pesa</div><div class="l-d">Si no lo sabes, déjalo en blanco</div></div>
          <div class="l-v">
            <input type="number" inputmode="decimal" step="any" min="0" placeholder="—"
              value="${meta.base != null ? inputW(meta.base) : ''}" aria-label="Peso del aparato"
              oninput="setExBase('${key}',this.value)">
            <span style="color:var(--dim)">${uLabel()}</span>
          </div>
        </div>` }
      </div>
      <div class="hint">${ minStep > 0
        ? `Con ${pts === 1 ? 'un solo pitón' : (pts === 2 ? 'dos lados' : 'cuatro pitones')}, el salto más pequeño que puedes armar es <b>${fmtW(minStep)} ${uLabel()}</b>${pts > 1 ? ` — un disco de ${fmtW(minStep/pts)} en cada uno` : ''}.`
        : 'Marca algún disco en Ajustes → Mi equipo para poder calcular la carga.' }
        ${ eq === 'discos' ? ' Dejar el peso en blanco no rompe nada: el coach compara tus series entre sí.' : '' }</div>`;
  }

  if(eq === 'mancuerna'){
    const n = effPoints(key);
    const step = dumbbellMinStep(n);
    return `
      <div class="sect">¿Cuántas agarras?</div>
      <div class="stack">
        ${DB_POINTS.map(([v, t, d]) => `
          <button class="opt ${n === v ? 'on' : ''}" onclick="setExPoints('${key}',${v})">
            <b>${t}</b><span>${d}</span>
          </button>`).join('')}
      </div>
      <div class="hint">${ n === 2
        ? `Anota siempre el <b>total de las dos</b>: 10 en cada mano son <b>20 ${uLabel()}</b>. Así el número
           que ves es el peso que de verdad moviste, y se puede comparar con las barras y las máquinas.`
        : 'Anota el peso de esa mancuerna.' }
        ${ step > 0 ? ` El escalón más pequeño de tu rack es <b>${fmtW(step)} ${uLabel()}</b>${n === 2 ? ' — subir una talla en cada mano' : ''}.` : '' }</div>`;
  }

  if(eq === 'placas'){
    const c = stackConf(key);
    const u = (meta.stack && meta.stack.unit === 'lb') ? 'lb' : 'kg';
    const prev = stackPreview(key, 7);
    return `
      <div class="sect">La torre de esta máquina</div>
      <div class="list">
        <div class="line">
          <div><div class="l-t">Unidad de la máquina</div><div class="l-d">Lo que está escrito en las placas</div></div>
          <div class="pill-sw">
            <button class="${u === 'kg' ? 'on' : ''}" onclick="setExStack('${key}','unit','kg')">kg</button>
            <button class="${u === 'lb' ? 'on' : ''}" onclick="setExStack('${key}','unit','lb')">lb</button>
          </div>
        </div>
        <div class="line">
          <div><div class="l-t">Sube de</div><div class="l-d">De una placa a la siguiente</div></div>
          <div class="l-v">
            <input type="number" inputmode="decimal" step="any" min="0" placeholder="—"
              value="${meta.stack && meta.stack.step != null ? meta.stack.step : ''}" aria-label="Salto de la torre"
              oninput="setExStack('${key}','step',this.value)">
            <span style="color:var(--dim)">${u}</span>
          </div>
        </div>
        <div class="line">
          <div><div class="l-t">Empieza en</div><div class="l-d">La placa más ligera</div></div>
          <div class="l-v">

              value="${meta.stack && meta.stack.start != null ? meta.stack.start : ''}" aria-label="Primera placa"
              oninput="setExStack('${key}','start',this.value)">
            <span style="color:var(--dim)">${u}</span>
          </div>
        </div>

      <div class="hint" id="stackhint">${ c
        ? `Así queda la torre: <b>${prev.map(fmtNum).join(' · ')} …</b> ${u}. Compárala con los números de la
           máquina — si no cuadran, corrige el salto. Este ejercicio se anota y se muestra en ${u}, aunque el
           resto de la app esté en ${db.settings.unit === 'lb' ? 'libras' : 'kilos'}.`
        : 'Escribe de cuánto en cuánto sube y te enseño la torre entera para que la compares con la máquina. No hace falta saberlo de memoria: se ajusta de pie frente al aparato.' }</div>`;
  }
  return '';
}

function setExType(key, t){ withExChange(key, () => { exMeta(key).type = t; }); render(); }
function setExPoints(key, n){ withExChange(key, () => { exMeta(key).points = n; }); render(); }
function setExBase(key, v){
  withExChange(key, () => {
    const x = parseFloat(v);
    exMeta(key).base = (isNaN(x) || x <= 0) ? null : Math.round(toKg(x)*1000)/1000;
  });
}
function setExStack(key, field, v){
  withExChange(key, () => {
    const st = exMeta(key).stack;
    if(field === 'unit') st.unit = v;
    else {
      const x = parseFloat(v);
      st[field] = (isNaN(x) || x <= 0) ? null : x;
    }
  });
  if(field === 'unit') render(); else renderStackHint(key);
}
/* al teclear el salto no se re-renderiza todo: solo se refresca la torre */
function renderStackHint(key){
  const el = document.getElementById('stackhint');
  if(!el) return;
  const c = stackConf(key);
  const u = uLabelEx(key);
  el.innerHTML = c
    ? `Así queda la torre: <b>${stackPreview(key, 7).map(fmtNum).join(' · ')} …</b> ${u}.`
    : 'Escribe de cuánto en cuánto sube y te enseño la torre entera.';
}
function setExEquip(key, v){
  withExChange(key, () => {
    const m = exMeta(key);
    m.equip = EQUIP[v] ? v : null;
    if(v !== 'barra') m.bar = null;
  });
  render();
}
function setExBarSel(key, v){
  withExChange(key, () => { exMeta(key).bar = (v === 'auto') ? null : v; });
  render();
}
function setExRange(key, which, val){
  withExChange(key, () => {
    const v = parseInt(val,10);
    exMeta(key)[which] = isNaN(v) ? null : v;
  });
}
function setExStep(key, val){
  withExChange(key, () => { exMeta(key).step = (val === 'auto') ? null : parseFloat(val); });
}
/* opciones de salto en la unidad activa; el valor guardado siempre es kg */
function stepOptionsHTML(cur){
  const lb = db.settings.unit === 'lb';
  const opts = lb
    ? [1.25, 2.5, 5, 10].map(v => [Math.round(v*LB_KG*1000)/1000, v + ' lb'])
    : [0.5, 1, 2, 2.5, 5].map(v => [v, String(v).replace('.',',') + ' kg']);
  let html = `<option value="auto" ${cur == null ? 'selected' : ''}>Auto</option>`;
  let matched = cur == null;
  for(const [kg, label] of opts){
    const sel = cur != null && Math.abs(cur - kg) < 0.01;
    if(sel) matched = true;
    html += `<option value="${kg}" ${sel ? 'selected' : ''}>${label}</option>`;
  }
  if(!matched) html += `<option value="${cur}" selected>Actual: ${fmtW(cur)} ${uLabel()}</option>`;
  return html;
}
function setExNotes(key, val){ exMeta(key).notes = val.slice(0,300); save(); }
function setExRest(key, val){
  exMeta(key).rest = (val === 'auto') ? null : parseInt(val,10);
  save();
}
function setExMuscle(key, val){ exMeta(key).muscle = val; save(); }
function setExCap(key, val){
  withExChange(key, () => {
    const v = parseFloat(val);
    exMeta(key).cap = (isNaN(v) || v <= 0) ? null : Math.round(toKgEx(key, v)*1000)/1000;
  });
}

/* ---------- SESIÓN ACTIVA ---------- */
/* un ejercicio terminado = todas sus series marcadas o con reps anotadas */
function exDone(ex){
  return ex.sets.length > 0 && ex.sets.every(st => st.done || parseInt(st.r, 10) > 0);
}
/* solo un ejercicio abierto a la vez: el primero sin terminar, o el que elijas */
function sessionOpenIdx(){
  const s = db.active;
  if(typeof s.open === 'number' && s.exercises[s.open]) return s.open;
  const i = s.exercises.findIndex(ex => !exDone(ex));
  return i < 0 ? 0 : i;
}
function openSessionEx(i){
  db.active.open = i; save(); render();
  setTimeout(() => {
    const el = document.getElementById('exb-' + i);
    if(el && el.scrollIntoView) el.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 60);
}
/* el check cierra la serie y arranca el descanso */
function toggleSetDone(xi, si){
  const ex = db.active.exercises[xi];
  const st = ex.sets[si];
  if(st.done){ st.done = false; save(); render(); return; }
  const r = parseInt(st.r, 10);
  if(isNaN(r) || r <= 0){
    const row = document.getElementById(`set-${xi}-${si}`);
    const inp = row && row.querySelectorAll ? row.querySelectorAll('input')[1] : null;
    if(inp && inp.focus) inp.focus();
    return;
  }
  st.done = true;
  db.active.lastLog = Date.now();
  if(!restUntil) startRestAuto(ex.key);
  if(ex.sets.every(x => x.done)){
    const next = db.active.exercises.findIndex((e, i) => i !== xi && !exDone(e));
    if(next >= 0) db.active.open = next;
  }
  save(); render();
}
function editExNotes(xi){
  const ex = db.active.exercises[xi];
  openModal(`
    <h2>Notas — ${esc(exBaseName(ex.name))}</h2>
    <p class="muted">Se guardan en el ejercicio y las verás cada vez que lo entrenes.</p>
    <textarea id="exnotes" placeholder="Ej. agarre ancho, asiento en 4, bajar lento…">${esc(exMeta(ex.key).notes || '')}</textarea>
    <button class="btn" style="margin-top:16px" onclick="saveExNotes('${ex.key}')">Guardar</button>
    <button class="btn ghost" onclick="closeModal()">Cancelar</button>`);
  setTimeout(() => document.getElementById('exnotes')?.focus(), 60);
}
function saveExNotes(key){
  const t = document.getElementById('exnotes');
  if(t) setExNotes(key, t.value);
  closeModal(); render();
}

/* la cabecera de la columna del peso: en mancuernas a dos manos avisa
   ahí mismo, que es justo donde se teclea */
function weightColLabel(key, t){
  if(t === 'corporal' || t === 'tiempo') return 'lastre';
  if(t === 'asistido') return 'ayuda';
  if(effEquip(key) === 'mancuerna' && effPoints(key) === 2) return uLabelEx(key) + ' total';
  return uLabelEx(key);
}

/* aviso de una sola vez, como el de Hevy: en mancuernas se anota el total */
function dbNoticeHTML(key){
  if(db.settings.dbNoticeSeen) return '';
  if(effEquip(key) !== 'mancuerna' || effPoints(key) !== 2) return '';
  return `<div class="note" style="margin:13px 0 0">
    <div class="note-t">Anota el total de las dos mancuernas</div>
    <div class="note-d">Si agarras 10 en cada mano, escribe <b>20</b>. Así el número es el peso que de
      verdad moviste, se puede comparar con las barras y las máquinas, y la app sabe qué par bajar del
      rack. Es la misma convención que usa Hevy.</div>
    <button class="note-a" onclick="dismissDbNotice()">Entendido — no mostrar más</button>
  </div>`;
}
function dismissDbNotice(){
  db.settings.dbNoticeSeen = new Date().toISOString();
  save(); render();
}

/* peso objetivo de hoy: lo escrito en la serie 1, o lo que sugiere el coach */
function targetWeight(ex){
  const typed = parseFloat(ex.sets[0] && ex.sets[0].w);
  if(!isNaN(typed) && typed > 0) return toKgEx(ex.key, typed);
  if(ex.sugg && ex.sugg.w > 0) return ex.sugg.w;
  return NaN;
}
/* la tira de «cómo cargar» que se cuela bajo el veredicto */
function loadStripHTML(xi){
  const ex = db.active.exercises[xi];
  const key = ex.key;
  if(exMeta(key).type !== 'normal') return '';
  const w = targetWeight(ex);
  if(!(w > 0)) return '';
  const p = loadPlan(key, w);
  if(!p) return '';
  const note = p.exact ? '' : (
    p.kind === 'placas'
      ? `La torre sube a saltos: ${fmtWEx(key, p.total)} ${uLabelEx(key)} es la placa más cercana a ${fmtWEx(key, w)}.`
      : p.kind === 'mancuerna'
      ? `Tu gimnasio no tiene ${fmtW(w)} ${uLabel()}: lo más cercano es ${fmtW(p.total)}.`
      : `Con tus discos, ${fmtW(p.total)} ${uLabel()} es lo más cercano a ${fmtW(w)}.`);
  const wrap = inner => `<button class="load" onclick="showLoad(${xi})">${inner}
    ${note ? `<div class="why" style="padding-left:0;margin-top:9px">${note}</div>` : ''}</button>`;

  if(p.kind === 'placas'){
    return wrap(`
      <div class="load-row">
        <span class="load-l">Pon el pin en</span>
        <span class="load-v">Placa ${p.stack.index} · <b>${fmtNum(p.stack.value)} ${p.stack.unit}</b> <span class="chev">›</span></span>
      </div>
      <div style="display:flex;justify-content:center;padding:10px 0 2px">${stackSVG(p.stack.index, Math.max(p.stack.index + 4, 12), { h:140 })}</div>`);
  }
  if(p.kind === 'mancuerna'){
    return wrap(`
      <div class="load-row">
        <span class="load-l">${p.points === 1 ? 'Agarra' : 'Una en cada mano'}</span>
        <span class="load-v">${p.points} × <b>${fmtW(p.dumbbell)} ${uLabel()}</b> <span class="chev">›</span></span>
      </div>
      ${dumbbellSVG(p.dumbbell)}
      <div class="load-row" style="margin-top:6px">
        <span class="load-l">El total que anotas</span>
        <span class="load-v"><b>${fmtW(p.total)} ${uLabel()}</b></span>
      </div>`);
  }
  /* barra y discos: uno o varios puntos de carga */
  const label = p.points === 1 ? 'Todo en un solo lado'
              : (p.points === 2 ? 'Por lado' : `En cada uno de los ${p.points} pitones`);
  const draw = p.points === 2
    ? barbellSVG(p.perPoint, { h:86, scale:0.72 })
    : postSVG(p.perPoint, { h:84, scale:0.72 });
  return wrap(`
    <div class="load-row">
      <span class="load-l">${p.kind === 'barra' ? 'Cargar la barra' : 'Cargar el aparato'}</span>
      <span class="load-v">${fmtW(p.total)} ${uLabel()} <span class="chev">›</span></span>
    </div>
    ${draw}
    <div class="load-row" style="margin-top:8px">
      <span class="load-l">${label}</span>
      <span class="load-v">${pointTextHTML(p.perPoint)}</span>
    </div>`);
}

/* el detalle: el dibujo en grande y la cuenta completa */
function showLoad(xi){
  const ex = db.active.exercises[xi];
  const key = ex.key;
  const w = targetWeight(ex);
  if(!(w > 0)) return;
  const p = loadPlan(key, w);
  if(!p){
    infoModal('Todavía no puedo calcularlo',
      'Dime cómo se carga este ejercicio en su ficha (tócalo desde la rutina) y aquí te enseño cómo montarlo.');
    return;
  }
  const title = esc(exBaseName(ex.name));

  if(p.kind === 'placas'){
    openModal(`
      <h2>Placa ${p.stack.index} · ${fmtNum(p.stack.value)} ${p.stack.unit}</h2>
      <p class="muted">${title} · serie de trabajo</p>
      <div style="display:flex;justify-content:center;margin:6px 0 4px">${stackSVG(p.stack.index, Math.max(p.stack.index + 4, 14), { h:190 })}</div>
      <div class="hint">Cuenta ${p.stack.index} placa${p.stack.index === 1 ? '' : 's'} desde arriba.
        La torre empieza en ${fmtNum(p.stack.value - (p.stack.index-1)*p.stack.step)} y sube de
        ${fmtNum(p.stack.step)} en ${fmtNum(p.stack.step)} ${p.stack.unit}.
        ${p.exact ? '' : `El objetivo era ${fmtWEx(key, p.target)} ${uLabelEx(key)}; esta es la placa más cercana.`}</div>
      <button class="btn" style="margin-top:18px" onclick="closeModal()">Listo</button>
      <button class="btn ghost" onclick="closeModal(); openExerciseByKey('${key}')">Ajustar la torre</button>`);
    return;
  }
  if(p.kind === 'mancuerna'){
    openModal(`
      <h2>${p.points} × ${fmtW(p.dumbbell)} ${uLabel()}</h2>
      <p class="muted">${title} · serie de trabajo</p>
      ${dumbbellSVG(p.dumbbell, { h:96 })}
      <div class="hint">${ p.points === 2
        ? `Una mancuerna de <b>${fmtW(p.dumbbell)}</b> en cada mano. En la app anotas el <b>total de las dos</b>: ${fmtW(p.total)} ${uLabel()}.`
        : `Una sola mancuerna de <b>${fmtW(p.dumbbell)} ${uLabel()}</b>.` }
        ${p.exact ? '' : ` El salto exacto pedía ${fmtW(p.target)} ${uLabel()}, pero con las mancuernas de tu gimnasio no se puede armar.`}</div>
      <button class="btn" style="margin-top:18px" onclick="closeModal()">Listo</button>
      <button class="btn ghost" onclick="closeModal(); go({name:'gym', kind:'dumbbells'})">Editar mancuernas</button>`);
    return;
  }

  const label = p.points === 1 ? 'Todo en un solo lado'
              : (p.points === 2 ? 'Por lado' : `En cada pitón`);
  const draw = p.points === 2
    ? barbellSVG(p.perPoint, { h:126 })
    : postSVG(p.perPoint, { h:112 });
  const cuenta = p.kind === 'barra'
    ? `${esc(p.bar.name)} <b>${fmtW(p.base)}</b> + discos <b>${fmtW(p.points * p.perPointKg)}</b>`
    : (p.base > 0 ? `Aparato <b>${fmtW(p.base)}</b> + discos <b>${fmtW(p.points * p.perPointKg)}</b>`
                  : `Discos <b>${fmtW(p.points * p.perPointKg)}</b>`);
  openModal(`
    <h2>Cargar ${fmtW(p.total)} ${uLabel()}</h2>
    <p class="muted">${title} · serie de trabajo</p>
    ${draw}
    ${ p.points !== 2 ? `<div class="load-row" style="margin-top:4px">
      <span class="load-l">Son ${p.points} punto${p.points === 1 ? '' : 's'} de carga</span>
      <span class="load-v">${p.points} × ${fmtW(p.perPointKg)} = <b>${fmtW(p.points * p.perPointKg)} ${uLabel()}</b></span>
    </div>` : '' }
    <div class="sect">${label}</div>
    <div class="list">${plateListHTML(p.perPoint, p.points) ||
      `<div class="line"><div class="l-t">Sin discos</div><div class="l-v">${p.kind === 'barra' ? 'solo la barra' : 'aparato vacío'}</div></div>`}</div>
    <div class="hint">${cuenta} = <b>${fmtW(p.total)} ${uLabel()}</b>.
      ${p.exact ? '' : `El objetivo era ${fmtW(p.target)} ${uLabel()}; esto es lo más cercano que puedes armar.`}</div>
    <button class="btn" style="margin-top:18px" onclick="closeModal()">Listo</button>
    ${ p.kind === 'barra' ? `<button class="btn ghost" onclick="closeModal(); pickBar('${key}')">Cambiar de barra</button>` : '' }`);
}

/* abrir la ficha desde la sesión, sin pasar por la rutina.
   Recuerda de dónde vienes para que «volver» te devuelva ahí. */
function openExerciseByKey(key, from){
  for(const r of db.routines){
    const ex = r.exercises.find(e => e.key === key);
    if(ex){ go({ name:'exercise', key, exname:ex.name, rid:r.id, from }); return; }
  }
  const a = db.active && db.active.exercises.find(e => e.key === key);
  if(a) go({ name:'exercise', key, exname:a.name, rid:(db.active.routineId || ''), from });
}
function openExFromSession(xi){
  const ex = db.active && db.active.exercises[xi];
  if(ex) openExerciseByKey(ex.key, 'session');
}

/* al tocar algo de la ficha con una sesión en curso, la sugerencia de hoy
   se recalcula al vuelo: si acabas de decir que es de placas, el coach
   deja de proponer kilos que esa máquina no tiene */
function refreshActiveSugg(key){
  if(!db.active) return;
  for(const ex of db.active.exercises){
    if(ex.key !== key) continue;
    let sg = computeSuggestion(key);
    if(db.active.deload) sg = deloadSugg(key, sg);
    ex.sugg = sg;
  }
}
/* si el cambio mueve la unidad del ejercicio (una torre en libras), lo ya
   escrito en la sesión se convierte para que siga significando lo mismo */
function withExChange(key, fn){
  const antes = exUnit(key);
  fn();
  const ahora = exUnit(key);
  if(antes !== ahora && db.active){
    const f = (ahora === 'lb') ? 1/LB_KG : LB_KG;
    for(const ex of db.active.exercises){
      if(ex.key !== key) continue;
      for(const st of ex.sets){
        const n = parseFloat(st.w);
        if(st.w !== '' && st.w !== undefined && !isNaN(n)) st.w = String(Math.round(n * f * 100) / 100);
      }
    }
  }
  refreshActiveSugg(key);
  save();
}

/* elegir barra para este ejercicio, desde la sesión o desde la ficha */
function pickBar(key){
  const bars = availableBars();
  if(!bars.length){
    infoModal('Sin barras configuradas', 'Marca al menos una barra en Ajustes → Mi equipo.');
    return;
  }
  const cur = barFor(key);
  openModal(`
    <h2>¿Con qué barra?</h2>
    <p class="muted">Solo para este ejercicio. Cambia la cuenta de los discos, no tu historial.</p>
    <div class="stack">
      ${bars.map(b => `
        <button class="opt ${cur && cur.id === b.id ? 'on' : ''}" onclick="setExBar('${key}','${b.id}')">
          <b>${esc(b.name)}</b><span>${fmtW(b.kg)} ${uLabel()}${b.def ? ' · predeterminada' : ''}</span>
        </button>`).join('')}
    </div>
    <button class="btn ghost" style="margin-top:14px" onclick="closeModal()">Cancelar</button>`);
}
function setExBar(key, id){
  withExChange(key, () => { exMeta(key).bar = id; });
  closeModal(); render();
}

function sessionHeadHTML(){
  const s = db.active;
  const total = s.exercises.reduce((a, ex) => a + ex.sets.length, 0);
  const done = s.exercises.reduce((a, ex) => a + ex.sets.filter(st => parseInt(st.r, 10) > 0).length, 0);
  const rest = restSecs();
  return `
    <div class="sess-top">
      <div class="grow">
        <div class="clock" id="clock">0:00</div>
        <div class="sess-meta">${esc(s.routineName)} · ${done} de ${total} series${s.deload ? ' · descarga' : ''}</div>
      </div>
      <div class="sess-actions">
        <button class="end" onclick="askFinish()">Terminar</button>
        <button class="unitbtn" aria-label="Cambiar unidad de peso" onclick="askUnitSwitch()">${uLabel()} ⇄</button>
      </div>
    </div>
    ${ rest ? `
    <button class="rest" id="rest" onclick="toggleRest()">
      <div class="rest-row">
        <span class="rest-l" id="restlabel">Descanso</span>
        <span class="rest-t" id="resttime">${fmtClock(rest)}</span>
      </div>
      <div class="rest-track"><div class="rest-fill" id="restfill"></div></div>
    </button>` : '<div style="height:16px"></div>' }`;
}

function viewSession(){
  const s = db.active;
  const openIdx = sessionOpenIdx();

  const blocks = s.exercises.map((ex, xi) => {
    const meta = exMeta(ex.key);
    const t = meta.type;
    const { lo, hi } = effRange(ex.key);

    if(xi !== openIdx){
      if(exDone(ex)){
        const hecho = ex.sets.filter(st => parseInt(st.r,10) > 0)
          .map(st => `<b>${fmtSet(ex.key, { w: toKg(parseFloat(st.w) || 0), r: parseInt(st.r,10) })}</b>`).join(' · ');
        return `
        <button class="ex-done" id="exb-${xi}" onclick="openSessionEx(${xi})">
          <span class="grow">
            <span class="ex-title" style="display:block">${exTitleHTML(ex.name)}</span>
            <span class="last" style="display:block">Hecho · ${hecho}</span>
          </span>
          <span class="mini-check">${svgIcon('check')}</span>
        </button>`;
      }
      const next = ex.sugg
        ? `Siguiente · <b>${fmtSet(ex.key, { w: ex.sugg.w, r: ex.sugg.reps })}</b>`
        : 'Siguiente · primera vez';
      return `
      <button class="ex-next" id="exb-${xi}" onclick="openSessionEx(${xi})">
        <span class="grow">
          <span class="ex-title" style="display:block">${exTitleHTML(ex.name)}</span>
          <span class="last" style="display:block">${next}</span>
        </span>
        <span class="chev">›</span>
      </button>`;
    }

    let firstMsg = '';
    if(!ex.sugg){
      if(t === 'corporal') firstMsg = `Primera vez. Haz las reps que puedas con buena técnica (ideal ${lo}–${hi} por serie). El peso puedes dejarlo en blanco; si usas lastre, anótalo.`;
      else if(t === 'tiempo') firstMsg = `Primera vez. Mide los segundos que sostienes con buena técnica (ideal ${lo}–${hi} s). Toca el ▶ de cada serie para usar el cronómetro con alarma.`;
      else if(t === 'asistido') firstMsg = `Primera vez. Anota la AYUDA de la máquina o banda (en ${uLabelEx(ex.key)}). Elige una ayuda con la que logres ${lo}–${hi} reps quedándote 1–3 en reserva.`;
      else if(effEquip(ex.key) === 'mancuerna') firstMsg = `Primera vez. Anota el <b>total de las dos mancuernas</b>: si agarras 10 en cada mano, escribe ${fmtWEx(ex.key, 20)}. Busca un peso con el que hagas ${lo}–${hi} reps quedándote 1–3 en reserva.`;
      else firstMsg = `Primera vez con este ejercicio. Elige un peso con el que puedas hacer ${lo}–${hi} reps quedándote 1–3 en reserva (sin llegar al fallo). Desde la próxima, te sugiero la progresión.`;
    }

    return `
    <div class="ex-open" id="exb-${xi}">
      <button class="ex-title" style="width:100%" onclick="openExFromSession(${xi})">
        ${exTitleHTML(ex.name)} ${typePill(ex.key)} <span class="chev" style="font-size:13px">›</span>
      </button>
      ${lastLineHTML(ex.key)}
      ${ meta.notes ? `<div class="exnote">${esc(meta.notes)}</div>` : '' }
      ${ ex.sugg ? verdictHTML(ex.sugg, true) : `<div class="why" style="padding-left:0;margin-top:10px">${firstMsg}</div>` }
      ${ dbNoticeHTML(ex.key) }
      ${ loadStripHTML(xi) }
      <div class="grid-h">
        <span>${t === 'tiempo' ? '▶' : '#'}</span>
        <span>${weightColLabel(ex.key, t)}</span>
        <span>${t === 'tiempo' ? 'seg' : 'reps'}</span>
        <span class="linkish" role="button" tabindex="0" onclick="rirInfo()">rir</span>
        <span></span><span></span>
      </div>
      <div id="sets-${xi}">
        ${ ex.sets.map((st, si) => setRowHTML(xi, si, st, ex.sugg, t)).join('') }
      </div>
      <div class="vschip" id="vs-${xi}"></div>
      <div class="ex-actions">
        <button onclick="addSet(${xi})">+ Serie</button>
        <button onclick="showWarmup(${xi})">Calentamiento</button>
        <button onclick="editExNotes(${xi})">Notas</button>
        <button onclick="openExFromSession(${xi})">Ajustes</button>
      </div>
    </div>`;
  }).join('');

  return `<div style="margin-top:2px">${blocks}
    <button class="addex" onclick="promptAddExercise()">+ Agregar ejercicio a la sesión</button>
  </div>`;
}

function setRowHTML(xi, si, st, sugg, t){
  const tiempo = t === 'tiempo';
  const key = db.active ? db.active.exercises[xi].key : null;
  const pw = sugg ? fmtWEx(key, sugg.w) : ((t === 'corporal' || tiempo) ? '0' : uLabelEx(key));
  const pr = sugg ? sugg.reps : (tiempo ? 'seg' : 'reps');
  const cls = sugg ? ' sugg' : '';
  const done = !!st.done;
  const ex = db.active ? db.active.exercises[xi] : null;
  const firstOpen = ex ? ex.sets.findIndex(x => !x.done) : -1;
  const now = !done && si === firstOpen;
  const idxCell = tiempo
    ? `<button class="i play" aria-label="Cronómetro serie ${si+1}" onclick="startSetTimer(${xi},${si})">▶</button>`
    : `<span class="i">${si+1}</span>`;
  return `
  <div class="set${done ? ' done' : ''}${now ? ' now' : ''}" id="set-${xi}-${si}">
    ${idxCell}
    <input class="cell${cls}" type="number" inputmode="decimal" step="any" min="0"
      placeholder="${pw}" value="${st.w ?? ''}"
      aria-label="Peso serie ${si+1}"
      oninput="setVal(${xi},${si},'w',this.value)">

/* ---------- HISTORIAL ---------- */
/* series de los últimos 7 días por grupo muscular + desbalance empuje/jalón (14 días) */
function volumeCardHTML(){
  const now = Date.now();
  const cut7 = new Date(now - 7*864e5).toISOString();
  const cut14 = new Date(now - 14*864e5).toISOString();
  const counts = {}; let untagged = 0, push = 0, pull = 0, any = false;
  for(const h of db.history){
    if(h.date < cut14) continue;
    for(const e of h.entries){
      const m = exMeta(e.key).muscle;
      const n = e.sets.length;
      if(h.date >= cut7){
        any = true;
        if(!m || m === 'none') untagged += n;
        else counts[m] = (counts[m]||0) + n;
      }
      if(m && PUSH_G.includes(m)) push += n;
      if(m && PULL_G.includes(m)) pull += n;
    }
  }
  if(!any) return '';
  /* ordenadas por volumen, no alfabéticamente */
  const rows = MUSCLES.filter(([k]) => counts[k])
    .sort((a,b) => counts[b[0]] - counts[a[0]])
    .map(([k,l]) => {
      const c = counts[k];
      const pct = Math.min(100, c/20*100);
      const cls = c > 20 ? 'hi' : (c >= 10 ? 'ok' : '');
      const tag = c > 20 ? 'alto' : (c >= 10 ? 'óptimo' : 'bajo');
      return `<div class="vol">
        <span class="vol-n">${l}</span>
        <span class="vol-track"><span class="vol-fill ${cls}" style="width:${pct}%;display:block"></span></span>
        <span class="vol-v"><b>${c}</b> ${tag}</span>
      </div>`;
    }).join('');

  let imb = '';
  if(push + pull >= 24 && (push > pull*1.75 || pull > push*1.75)){
    const masEmpuje = push > pull;
    imb = `<div class="note">
      <div class="note-t">Empuje ${push} · jalón ${pull}</div>
      <div class="note-d">Llevas casi el doble de ${masEmpuje?'empuje':'jalón'} que de ${masEmpuje?'jalón':'empuje'} en 14 días.
        Empuje = pecho/hombros/tríceps · jalón = espalda/bíceps. Mantenerlos cerca de 1:1 protege tus hombros:
        suma ${masEmpuje?'remos y jalones':'presses y aperturas'}.</div>
    </div>`;
  }
  return `
    <div class="sect">Series por grupo · 7 días</div>
    ${rows || '<div class="muted">Asigna un grupo muscular a tus ejercicios (tocándolos en su rutina) para ver este resumen.</div>'}
    ${rows ? '<div class="hint">La zona óptima está entre 10 y 20 series semanales por grupo.</div>' : ''}
    ${untagged ? `<div class="hint">${untagged} series sin grupo asignado.</div>` : ''}
    ${imb}`;
}

/* ---------- editar / borrar sesiones ---------- */
function rebuildProgress(){
  db.history.sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  db.progress = {};
  for(const h of db.history){
    if(h.deload) continue;   /* las descargas no alimentan la progresión */
    for(const e of h.entries) updateProgress(e.key, e.sets, h.date);
  }
  save();
}
function deleteSession(id){
  const h = db.history.find(x => x.id === id);
  if(!h) return;
  confirmModal(`¿Borrar la sesión de ${esc(h.routineName)}?`,
    `${fmtDate(h.date)} · ${h.entries.reduce((a,e)=>a+e.sets.length,0)} series. Las sugerencias del coach se recalculan sin ella. No se puede deshacer.`,
    'Borrar sesión', () => {
      db.history = db.history.filter(x => x.id !== id);
      rebuildProgress(); render();
    });
}
function editSession(id){
  const h = db.history.find(x => x.id === id);
  if(!h) return;
  /* el modelo de edición vive SIEMPRE en la unidad activa (strings);
     se convierte a kg una sola vez al guardar — así re-renderizar es seguro */
  window.__edit = {
    id: h.id, routineName: h.routineName, date: h.date,
    entries: h.entries.map(e => ({
      key: e.key, name: e.name,
      sets: e.sets.map(st => ({
        w: st.w != null ? inputWEx(e.key, st.w) : '',
        r: st.r != null ? String(st.r) : '',
        rir: (st.rir === undefined || st.rir === null) ? '' : String(st.rir)
      }))
    }))
  };
  renderEditModal();
}
function renderEditModal(){
  const ed = window.__edit;
  if(!ed) return;
  openModal(`
    <h2>Editar sesión</h2>
    <p class="muted">${esc(ed.routineName)} · ${fmtDate(ed.date)}. Corrige valores, agrega la serie
      que olvidaste o quita la que sobra. Al guardar, las sugerencias del coach se recalculan
      con los datos corregidos.</p>
    <div class="stack">
    ${ed.entries.map((e, ei) => `
      <div>
        <div class="ex-title" style="margin-bottom:2px">${exTitleHTML(e.name)}</div>
        <div class="grid-h" style="grid-template-columns:14px 1fr 1fr .8fr 20px">
          <span>#</span><span>${uLabelEx(e.key)}</span><span>reps</span><span>rir</span><span></span></div>
        ${e.sets.map((st, si) => `
          <div class="set" style="grid-template-columns:14px 1fr 1fr .8fr 20px">
            <span class="i">${si+1}</span>
            <input class="cell" type="number" inputmode="decimal" step="any" min="0" value="${st.w}"
              aria-label="Peso en ${uLabelEx(e.key)}" oninput="editVal(${ei},${si},'w',this.value)">
            <input class="cell" type="number" inputmode="numeric" step="1" min="0" value="${st.r}"
              aria-label="Reps" oninput="editVal(${ei},${si},'r',this.value)">
            <input class="cell" type="number" inputmode="numeric" step="1" min="0" max="9" value="${st.rir}" placeholder="–"
              aria-label="RIR" oninput="editVal(${ei},${si},'rir',this.value)">
            <button class="xbtn" aria-label="Quitar serie" onclick="editRemoveSet(${ei},${si})">✕</button>
          </div>`).join('')}
        <button class="addex" style="padding:11px;margin-top:4px" onclick="editAddSet(${ei})">+ Agregar serie</button>
      </div>`).join('')}
    </div>
    <button class="btn" style="margin-top:16px" onclick="saveEditedSession()">Guardar cambios</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeModal()">Cancelar</button>`);
}
function editVal(ei, si, field, val){ window.__edit.entries[ei].sets[si][field] = val; }
function editAddSet(ei){
  const e = window.__edit.entries[ei];
  /* prellenar con la última serie: la olvidada casi siempre es "una más igual" */
  const prev = e.sets[e.sets.length - 1];
  e.sets.push(prev ? { w: prev.w, r: prev.r, rir: '' } : { w:'', r:'', rir:'' });
  renderEditModal();
}
function editRemoveSet(ei, si){
  window.__edit.entries[ei].sets.splice(si, 1);
  renderEditModal();
}
function saveEditedSession(){
  const ed = window.__edit;
  if(!ed) return;
  const entries = [];
  for(const e of ed.entries){
    const sets = e.sets.map(st => {
      let w = parseFloat(st.w);
      if(!isNaN(w)) w = Math.round(toKgEx(e.key, w)*1000)/1000;   /* en la unidad de su máquina → kg */
      const r = parseInt(st.r,10), rir = parseInt(st.rir,10);
      const out = { w, r };
      if(!isNaN(rir)) out.rir = Math.min(9, Math.max(0, rir));
      return out;
    }).filter(st => !isNaN(st.w) && st.w >= 0 && !isNaN(st.r) && st.r > 0);
    if(sets.length) entries.push({ key: e.key, name: e.name, sets });
  }
  window.__edit = null;
  closeModal();
  if(!entries.length){ deleteSession(ed.id); return; }   /* quedó vacía → ofrecer borrarla */
  const h = db.history.find(x => x.id === ed.id);
  h.entries = entries;
  rebuildProgress(); render();
}

function toggleGym(kind, i){
  const it = db.gym[kind][i];
  if(!it) return;
  it.on = !it.on;
  if(kind === 'bars' && !it.on && it.def){
    it.def = false;
    const next = db.gym.bars.find(b => b.on);
    if(next) next.def = true;
  }
  if(kind === 'plates') invalidatePlates();
  save(); render();
}
function setPairs(i, delta){
  const p = db.gym.plates[i];
  if(!p) return;
  p.pairs = Math.max(1, Math.min(20, (p.pairs || 1) + delta));
  invalidatePlates(); save(); render();
}
function setDefaultBar(i){
  db.gym.bars.forEach((b, j) => { b.def = (j === i); });
  save(); render();
}
function removeGym(kind, i){
  db.gym[kind].splice(i, 1);
  if(kind === 'plates') invalidatePlates();
  if(kind === 'bars' && !db.gym.bars.some(b => b.def)){
    const next = db.gym.bars.find(b => b.on);
    if(next) next.def = true;
  }
  save(); render();
}
function promptGymItem(kind){
  const t = { plates:'disco', bars:'barra', dumbbells:'mancuerna' }[kind];
  openModal(`
    <h2>Agregar ${t}</h2>
    <p class="muted">Para lo que se sale del catálogo estándar: discos fraccionales, una barra vieja,
      mancuernas sueltas. El peso se escribe en ${uLabel()}.</p>
    <form onsubmit="addGymItem(event,'${kind}')" class="stack" autocomplete="off">
      ${kind === 'bars' ? `<div class="field"><span>Nombre</span>
        <input type="text" id="gymName" placeholder="Ej. Barra de trap" autocomplete="off"></div>` : ''}
      <div class="field"><span>Peso (${uLabel()})</span>
        <input type="number" inputmode="decimal" step="any" min="0" id="gymW" placeholder="0"></div>
      <button class="btn" type="submit">Agregar</button>
      <button class="btn ghost" type="button" onclick="closeModal()">Cancelar</button>
    </form>`);
  setTimeout(() => document.getElementById(kind === 'bars' ? 'gymName' : 'gymW')?.focus(), 60);
}
function addGymItem(ev, kind){
  ev.preventDefault();
  const v = parseFloat(document.getElementById('gymW').value);
  if(isNaN(v) || v <= 0) return;
  const kg = Math.round(toKg(v) * 1000) / 1000;
  if(db.gym[kind].some(x => Math.abs(x.kg - kg) < 1e-9)){
    closeModal();
    infoModal('Ya lo tienes', `${fmtW(kg)} ${uLabel()} ya está en la lista.`);
    return;
  }
  if(kind === 'plates') db.gym.plates.push({ kg, pairs:1, on:true, custom:true });
  else if(kind === 'bars'){
    const nm = (document.getElementById('gymName').value || '').trim();
    db.gym.bars.push({ id:uid(), name: nm || `Barra de ${fmtW(kg)} ${uLabel()}`, kg, on:true, def:false, custom:true });
  }
  else db.gym.dumbbells.push({ kg, on:true, custom:true });
  if(kind === 'plates') invalidatePlates();
  save(); closeModal(); render();
}
function applyDbRange(){
  const from = parseFloat(document.getElementById('dbFrom').value);
  const to   = parseFloat(document.getElementById('dbTo').value);
  const step = parseFloat(document.getElementById('dbStep').value);
  if(isNaN(from) || isNaN(to) || isNaN(step) || step <= 0 || to < from){
    infoModal('Rango no válido', 'Revisa los tres números: el salto tiene que ser mayor que cero y el final no puede ser menor que el inicio.');
    return;
  }
  if((to - from) / step > 200){
    infoModal('Rango demasiado largo', 'Salen más de 200 mancuernas. Sube el salto o acorta el rango.');
    return;
  }
  confirmModal('¿Rehacer la lista?',
    `Se reemplazan las mancuernas actuales por el rango ${fmtNum(from)} – ${fmtNum(to)} ${uLabel()} de ${fmtNum(step)} en ${fmtNum(step)}. Las que destildaste se pierden.`,
    'Generar', () => {
      const out = [];
      for(let v = from; v <= to + 1e-9; v += step)
        out.push({ kg: Math.round(toKg(v) * 1000) / 1000, on:true });
      db.gym.dumbbells = out;
      save(); render();
    }, true);
}

  const known = allExerciseNames().get(key);

  if(/assisted|asistid/i.test(name)) exMeta(key).type = 'asistido';
  if(!exMeta(key).muscle){ const g = guessMuscle(name); if(g) exMeta(key).muscle = g; }
  if(!exMeta(key).equip){ const e = guessEquip(name); if(e) exMeta(key).equip = e; }

/* ---------- autocompletado de ejercicios ---------- */
function allExerciseNames(){
  const seen = new Map();   /* key → { name, src } */
  for(const r of db.routines) for(const ex of r.exercises)
    if(!seen.has(ex.key)) seen.set(ex.key, { name: ex.name, src: r.name });
  for(const h of db.history) for(const e of h.entries)
    if(!seen.has(e.key)) seen.set(e.key, { name: e.name, src: 'historial' });
  return seen;
}
function acNorm(s){
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}
/* resalta la coincidencia sobre el nombre original (ignora acentos/mayúsculas) */
function acHighlight(name, q){
  const map = []; let norm = '';
  for(let i = 0; i < name.length; i++){
    const c = acNorm(name[i]);
    for(const ch of c){ norm += ch; map.push(i); }
  }
  const idx = norm.indexOf(q);
  if(idx < 0 || !q) return esc(name);
  const a = map[idx], b = map[idx + q.length - 1] + 1;
  return esc(name.slice(0,a)) + '<b>' + esc(name.slice(a,b)) + '</b>' + esc(name.slice(b));
}
function acUpdate(rid){
  const inp = document.getElementById('newex');
  const list = document.getElementById('aclist');
  if(!inp || !list) return;
  const q = acNorm(inp.value.trim());
  if(!q){ list.style.display = 'none'; return; }
  const r = db.routines.find(x => x.id === rid);
  const inRoutine = new Set(r ? r.exercises.map(e => e.key) : []);
  const cands = [];
  for(const [key, info] of allExerciseNames()){
    if(inRoutine.has(key)) continue;
    const idx = acNorm(info.name).indexOf(q);
    if(idx < 0) continue;
    /* ranking: empieza igual < empieza una palabra < contiene */
    const norm = acNorm(info.name);
    const rank = idx === 0 ? 0 : (norm[idx-1] === ' ' || norm[idx-1] === '(' ? 1 : 2);
    cands.push({ key, name: info.name, src: info.src, rank });
  }
  cands.sort((a,b) => a.rank - b.rank || a.name.localeCompare(b.name));
  const top = cands.slice(0, 6);
  window.__ac = top;
  if(!top.length){ list.style.display = 'none'; return; }
  list.innerHTML = top.map((c, i) => `
    <button type="button" role="option" onmousedown="event.preventDefault(); acPick('${rid}',${i})">
      <span>${acHighlight(c.name, q)}</span>
      <span class="from">${esc(c.src)}</span>
    </button>`).join('');
  list.style.display = '';
}
function acPick(rid, i){
  const c = (window.__ac || [])[i];
  if(!c) return;
  const r = db.routines.find(x => x.id === rid);
  if(!r || r.exercises.some(e => e.key === c.key)) return;
  r.exercises.push({ id:uid(), name: c.name, key: c.key });
  if(!exMeta(c.key).equip){ const e = guessEquip(c.name); if(e) exMeta(c.key).equip = e; }
  save(); render();
  setTimeout(() => { const inp = document.getElementById('newex'); if(inp) inp.focus(); }, 30);
}
function acHide(){
  setTimeout(() => { const l = document.getElementById('aclist'); if(l) l.style.display = 'none'; }, 150);
}

  ev.preventDefault();
  const from = window.__dupFrom;
  const name = document.getElementById('dupname').value.trim();
  if(!from || !name) return;
  const key = exKey(name);

    return;
  }
  const src = exMeta(from);
  db.exmeta[key] = { type:src.type, lo:src.lo, hi:src.hi, step:null, notes:'', rest:src.rest,
                     muscle:src.muscle, equip:null, bar:null, points:null, base:null,
                     stack:{ unit:null, step:null, start:null } };
  /* se añade a las mismas rutinas donde está el original */
  for(const r of db.routines){
    const i = r.exercises.findIndex(e => e.key === from);
    if(i >= 0 && !r.exercises.some(e => e.key === key))
      r.exercises.splice(i + 1, 0, { id:uid(), name, key });

/* comparación en vivo del volumen del ejercicio contra su última sesión */
function vsLastInfo(xi){
  const ex = db.active.exercises[xi];
  const meta = exMeta(ex.key);
  if(meta.type === 'asistido') return null;      /* menos ayuda ≠ menos volumen */
  const last = lastEntry(ex.key);
  if(!last) return null;
  const repsMode = meta.type === 'corporal' || meta.type === 'tiempo';
  const prevVol = last.entry.sets.reduce((a,s) => a + (repsMode ? s.r : s.w * s.r), 0);
  if(prevVol <= 0) return null;
  let vol = 0, done = 0;
  for(const st of ex.sets){
    const r = parseInt(st.r, 10);
    if(isNaN(r) || r <= 0) continue;
    if(repsMode){ vol += r; done++; }
    else {
      const w = parseFloat(st.w);
      if(!isNaN(w) && w >= 0){ vol += toKgEx(ex.key, w) * r; done++; }
    }
  }
  if(!done) return null;
  return { pct: Math.round(vol / prevVol * 100), beat: vol > prevVol };
}
function updateVsChip(xi){
  const el = document.getElementById('vs-' + xi);
  if(!el) return;
  const info = vsLastInfo(xi);
  if(!info){ el.textContent = ''; return; }
  el.style.color = info.beat ? 'var(--up)' : 'var(--dim)';
  el.textContent = info.beat
    ? `Superaste el volumen de la última sesión · ${info.pct} %`
    : `Volumen vs última sesión · ${info.pct} %`;
}

/* al escribir peso o reps, las series vacías siguientes heredan ese valor como sugerencia */
function syncPlaceholders(xi){
  const ex = db.active.exercises[xi];
  let lastW = '', lastR = '';
  ex.sets.forEach((st, si) => {
    const filledW = st.w !== '' && st.w !== undefined;
    const filledR = st.r !== '' && st.r !== undefined;
    if(filledW) lastW = st.w;
    if(filledR) lastR = st.r;
    const row = document.getElementById(`set-${xi}-${si}`);
    if(!row || !row.querySelectorAll) return;
    const inps = row.querySelectorAll('input');
    if(!filledW && inps[0] && lastW !== '') inps[0].placeholder = lastW;
    if(!filledR && inps[1] && lastR !== '') inps[1].placeholder = lastR;
  });
}

  db.active.exercises.push({ key, name: finalName, sugg,
    sets: Array.from({length: Math.max(1, n)}, () => ({w:'', r:'', rir:''})) });
  if(window.__keepRoutine){
    const r = db.routines.find(x => x.id === db.active.routineId);
    if(r && !r.exercises.some(e => e.key === key)) r.exercises.push({ id: uid(), name: finalName, key });
  }
  save(); closeModal(); render();
  setTimeout(() => {
    const el = document.getElementById('exb-' + (db.active.exercises.length - 1));
    if(el && el.scrollIntoView) el.scrollIntoView({ behavior:'smooth' });
  }, 80);
}

/* ---------- cronómetro por serie (ejercicios por tiempo) ---------- */
let setTimerInt = null;
let setTimerState = null;
function startSetTimer(xi, si){
  const ex = db.active && db.active.exercises[xi];
  if(!ex) return;
  const typed = parseInt(ex.sets[si].r, 10);
  const target = (!isNaN(typed) && typed > 0) ? typed
    : (ex.sugg && ex.sugg.reps ? ex.sugg.reps : effRange(ex.key).lo);
  clearInterval(setTimerInt);
  setTimerState = { xi, si, target, phase:'prep', count:3 };
  openModal(`
    <h2 style="text-align:center;font-size:17px">${esc(ex.name)} · serie ${si+1}</h2>
    <div class="clock num" id="settimer" style="font-size:76px;text-align:center;margin:10px 0 2px">3</div>
    <p class="tiny" id="settimerhint" style="text-align:center;margin-bottom:16px">Prepárate… objetivo: ${target} s</p>
    <button class="btn" onclick="stopSetTimer(true)">Terminar antes</button>
    <button class="btn ghost" style="margin-top:8px" onclick="stopSetTimer(false)">Cancelar</button>`);
  setTimerInt = setInterval(() => {
    const el = document.getElementById('settimer');
    const st = setTimerState;
    if(!el || !st){ clearInterval(setTimerInt); return; }
    if(st.phase === 'prep'){
      st.count--;
      if(st.count <= 0){
        st.phase = 'run'; st.count = st.target;
        beep();
        const h = document.getElementById('settimerhint');
        if(h) h.textContent = '¡Sostén!';
      }
      el.textContent = st.count;
    } else {
      st.count--;
      el.textContent = Math.max(0, st.count);
      if(st.count <= 0) finishSetTimer(st.target);
    }
  }, 1000);
}
function finishSetTimer(seconds){
  const st = setTimerState;
  clearInterval(setTimerInt);
  setTimerState = null;
  if(!st) return;
  beep();
  setVal(st.xi, st.si, 'r', String(seconds));
  closeModal(); render();
}
function stopSetTimer(early){
  const st = setTimerState;
  clearInterval(setTimerInt);
  setTimerState = null;
  if(early && st && st.phase === 'run'){
    const elapsed = st.target - Math.max(0, st.count);
    if(elapsed > 0){ setVal(st.xi, st.si, 'r', String(elapsed)); closeModal(); render(); return; }
  }
  closeModal();
}

function collectEntries(s){
  const entries = [];
  for(const ex of s.exercises){
    const corp = ['corporal','tiempo'].includes(exMeta(ex.key).type);
    const sets = ex.sets.map(st => {
      let w = parseFloat(st.w);
      if(isNaN(w) && corp && st.r !== '' && st.r !== undefined) w = 0;  /* corporal/tiempo: peso en blanco = 0 */
      if(!isNaN(w)) w = Math.round(toKgEx(ex.key, w)*1000)/1000;        /* lo escrito está en la unidad de esa máquina → kg */
      const r = parseInt(st.r,10);
      const out = { w, r };
      const rir = parseInt(st.rir,10);
      if(!isNaN(rir)) out.rir = Math.min(9, Math.max(0, rir));
      return out;
    }).filter(st => !isNaN(st.w) && st.w >= 0 && !isNaN(st.r) && st.r > 0);
    if(sets.length) entries.push({ key:ex.key, name:ex.name, sets });
  }
  return entries;
}

function askFinish(){
  const s = db.active;
  const done = collectEntries(s).reduce((a,e) => a + e.sets.length, 0);
  const dur = Math.floor((Date.now() - s.start)/1000);
  if(!done){
    confirmModal('No registraste ninguna serie', 'Si terminas ahora, la sesión se descarta sin guardarse.',
      'Descartar sesión', () => { db.active = null; restUntil = null; releaseWake(); save(); go({name:'home'}); });
    return;
  }
  confirmModal('¿Terminar la sesión?',
    `Llevas ${fmtDur(dur)} y registraste ${done} serie${done===1?'':'s'}. Se guarda en tu historial y las sugerencias se actualizan.`,
    'Terminar y guardar', finishSession, true);
}

/* mejor marca previa de un ejercicio: e1RM (normal) o reps máximas (corporal) */
/* récord en asistidos: la MENOR ayuda con la que se logró el piso del rango */
function bestAssistBefore(key){
  const { lo } = effRange(key);
  let best = Infinity;
  for(const h of db.history){
    if(h.deload) continue;
    const e = h.entries.find(x => x.key === key);
    if(!e) continue;
    for(const st of e.sets) if(st.r >= lo && st.w < best) best = st.w;
  }
  return best;
}

function bestMetricBefore(key){
  const repsMode = ['corporal','tiempo'].includes(exMeta(key).type);
  let best = 0;
  for(const h of db.history){
    const e = h.entries.find(x => x.key === key);
    if(!e) continue;
    const v = repsMode ? Math.max(0, ...e.sets.map(st => st.r)) : bestE1RM(e.sets);
    if(v > best) best = v;
  }
  return best;
}

function finishSession(){
  const s = db.active;
  const entries = collectEntries(s);
  const isDeload = !!s.deload;

  /* récords personales: comparar contra la mejor marca histórica ANTES de guardar
     (una descarga nunca compite por récords) */
  const prs = [];
  if(!isDeload) for(const e of entries){
    const meta = exMeta(e.key);
    if(meta.type === 'asistido'){
      /* asistido: el récord es lograr el rango con MENOS ayuda */
      const { lo } = effRange(e.key);
      const prevBest = bestAssistBefore(e.key);
      const nowBest = Math.min(...e.sets.filter(st => st.r >= lo).map(st => st.w), Infinity);
      if(prevBest !== Infinity && nowBest < prevBest - 1e-9){
        prs.push(`${esc(e.name)}: <b style="color:var(--hold)">${nowBest === 0 ? '¡sin asistencia!' : fmtWEx(e.key, nowBest) + ' ' + uLabelEx(e.key) + ' de ayuda'}</b> <span class="tiny">(antes ${fmtWEx(e.key, prevBest)})</span>`);
      }
      continue;
    }
    const repsMode = ['corporal','tiempo'].includes(meta.type);
    const prev = bestMetricBefore(e.key);
    const now = repsMode ? Math.max(0, ...e.sets.map(st => st.r)) : bestE1RM(e.sets);
    if(prev > 0 && now > prev){
      const fv = v => repsMode ? fmtNum(Math.round(v*10)/10) : fmtWEx(e.key, Math.round(v*10)/10);
      const unit = meta.type === 'tiempo' ? 's' : (meta.type === 'corporal' ? 'reps' : uLabelEx(e.key));
      prs.push(`${esc(e.name)}: <b style="color:var(--hold)">${fv(now)} ${unit}</b> <span class="tiny">(antes ${fv(prev)})</span>`);
    }
  }

  const rec = {
    id: s.id, routineId: s.routineId, routineName: s.routineName,
    date: new Date().toISOString(),
    duration: Math.floor((Date.now() - s.start)/1000),
    entries
  };
  if(isDeload) rec.deload = true;
  /* nota educativa: sesión mayormente al fallo (RIR 0) */
  const rirAll = entries.flatMap(e => e.sets).filter(s => s.rir !== undefined && s.rir !== null);
  const zeros = rirAll.filter(s => s.rir === 0).length;
  const failNote = (rirAll.length >= 4 && zeros / rirAll.length >= 0.7) ? `
    <div class="note" style="margin:0 0 18px">
      <div class="note-t">Hoy llegaste al fallo (RIR 0) en ${zeros} de ${rirAll.length} series</div>
      <div class="note-d">Ir al fallo da casi el mismo músculo que quedarte a 1–3 reps de él,
        pero alarga la recuperación 24–48 h. Prueba dejar 1–2 reps en reserva en la mayoría de series —
        progresarás igual y llegarás con más energía a la próxima sesión.</div>
    </div>` : '';

  db.history.push(rec);
  db.active = null;
  restUntil = null;
  showUpdateToast();   /* si había una actualización esperando, ya puede salir */
  releaseWake();
  save();
  if(!isDeload) for(const e of entries) updateProgress(e.key, e.sets, rec.date);
  closeModal();
  if(isDeload){
    openModal(`
      <h2>Descarga guardada</h2>
      <p class="muted">${fmtDur(rec.duration)} · ${entries.reduce((a,e)=>a+e.sets.length,0)} series suaves.
        Esta sesión no toca tu progresión ni tus récords: la próxima sesión normal retoma
        exactamente donde ibas, con el cuerpo más fresco.</p>
      <button class="btn" onclick="closeModal(); go({name:'home'})">Listo</button>`);
    return;
  }
  openModal(`
    <h2>${prs.length ? '¡Sesión con récord!' : 'Sesión guardada'}</h2>
    <p class="muted">${fmtDur(rec.duration)} · ${entries.reduce((a,e)=>a+e.sets.length,0)} series.
      ${prs.length ? '' : 'La próxima vez verás las sugerencias actualizadas en cada ejercicio.'}</p>
    ${prs.length ? `<div class="note up" style="margin:0 0 18px">
      <div class="note-t">${prs.length===1?'Nuevo récord':'Nuevos récords'}</div>
      <div class="note-d">${prs.join('<br>')}</div></div>` : ''}
    ${failNote}
    <button class="btn" onclick="closeModal(); go({name:'history'})">Ver historial</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeModal(); go({name:'home'})">Volver al inicio</button>`);
}

function askUnitSwitch(target){
  const nu = target || (db.settings.unit === 'lb' ? 'kg' : 'lb');

     Puedes alternar cuando quieras (ej. si entrenas en otro gimnasio).`,
    `Cambiar a ${nu}`, () => setUnit(nu), true);
}
function setUnit(u){
  if(db.settings.unit === u) return;
  /* convertir lo ya escrito en la sesión activa (estaba en la unidad anterior) */
  if(db.active){
    const f = (u === 'lb') ? 1/LB_KG : LB_KG;
    for(const ex of db.active.exercises){
      if(pinnedUnit(ex.key)) continue;   /* esa torre tiene su propia unidad */
      for(const st of ex.sets){
        const n = parseFloat(st.w);
        if(st.w !== '' && st.w !== undefined && !isNaN(n)){
          st.w = String(Math.round(n * f * 100) / 100);
        }
      }
    }
  }
  db.settings.unit = u;
  /* regenerar sugerencias: sus textos llevan la unidad y el redondeo cambia */
  if(db.active) for(const ex of db.active.exercises) ex.sugg = computeSuggestion(ex.key);
  save(); render();
}

/* =====================================================================
   CALENTAMIENTO CALCULADO
   Evidencia: escalera específica 40–80 % de la carga de trabajo con reps
   decrecientes (Ribeiro 2021); cargas moderadas necesitan 0–2 series
   (Ribeiro 2020); pesado → llegar a ~80 % con intención de velocidad
   (scoping review 2025); músculo ya caliente → menos (Iversen 2021).
   ===================================================================== */
function warmupPlan(xi){
  const s = db.active, ex = s.exercises[xi];
  const meta = exMeta(ex.key);
  const { hi } = effRange(ex.key);

  /* peso de trabajo de hoy: lo escrito en la serie 1, o la sugerencia del coach */
  let W = NaN;
  const typed = parseFloat(ex.sets[0] && ex.sets[0].w);
  if(!isNaN(typed) && typed > 0) W = toKg(typed);
  else if(ex.sugg && ex.sugg.w > 0) W = ex.sugg.w;

  /* ¿el músculo ya viene caliente de un ejercicio anterior de esta sesión? */
  let first = true;
  if(meta.muscle && meta.muscle !== 'none'){
    for(let i = 0; i < xi; i++){
      if(exMeta(s.exercises[i].key).muscle === meta.muscle){ first = false; break; }
    }
  } else first = (xi === 0);

  if(meta.type === 'tiempo'){
    const target = ex.sugg ? ex.sugg.reps : hi;
    const easy = Math.max(10, Math.round(target * 0.5 / 5) * 5);
    return { rows: [`1 serie × ${easy} s suaves (misma posición, lejos del límite)`], first,
             note: 'En isométricos basta una serie corta para activar el patrón.' };
  }
  if(meta.type === 'corporal'){
    const target = ex.sugg ? ex.sugg.reps : hi;
    const easy = Math.max(3, Math.round(target * 0.5));
    return { rows: [`1 serie × ${easy} reps fáciles (misma técnica, lejos del fallo)`], first,
             note: 'En peso corporal basta una serie suave del mismo movimiento para activar el patrón.' };
  }
  if(isNaN(W) || W <= 0) return null;         /* aún no hay peso de referencia */
  if(meta.type === 'asistido'){
    const helpW = roundToStep(W * 1.5, effStep(ex.key, W));
    return { rows: [`1 serie × 6 con más ayuda (~${fmtWEx(ex.key, helpW)} ${uLabelEx(ex.key)})`], first,
             note: 'En asistidos, calentar = misma técnica con bastante más asistencia.' };
  }
  if(W <= 12){
    return { rows: [], first, W,
             note: 'Peso ligero: la evidencia muestra que con cargas moderadas el calentamiento específico aporta poco. Si es tu primer ejercicio del día, haz 1 serie suave del mismo movimiento y listo.' };
  }
  const heavy = hi <= 7;    /* rango de fuerza → cargas relativas altas */
  const scheme = heavy
    ? (first ? [[0.4,5],[0.6,3],[0.8,2]] : [[0.55,3],[0.8,2]])
    : (first ? [[0.5,6],[0.75,3]]        : [[0.7,4]]);
  const rows = [], steps = [], seen = new Set();
  for(const [pct, reps] of scheme){
    let wk = roundToStep(W * pct);
    wk = fitWeight(ex.key, wk) || wk;   /* que el escalón se pueda armar de verdad */
    if(wk <= 0 || wk >= W || seen.has(wk)) continue;
    seen.add(wk);
    rows.push(`${fmtWEx(ex.key, wk)} ${uLabelEx(ex.key)} × ${reps}`);
    steps.push({ w:wk, reps });
  }
  return { rows, steps, first, W, heavy,
           note: rows.length ? null : 'El peso de trabajo es tan bajo que no salen escalones útiles: 1 serie suave alcanza.' };
}

/* un escalón del calentamiento con su carga dibujada */
function warmStepHTML(key, label, value, w, work){
  const p = loadPlan(key, w);
  const head = `
    <div class="load-row">
      <span class="load-l"${work ? ' style="color:var(--up)"' : ''}>${label}</span>
      <span class="load-v"><b${work ? ' style="color:var(--up)"' : ''}>${value}</b></span>
    </div>`;
  let body = '';
  if(p && p.kind === 'placas'){
    body = `<div style="display:flex;justify-content:center;padding:6px 0 2px">
        ${stackSVG(p.stack.index, Math.max(p.stack.index + 4, 12), { h:104 })}</div>
      <div class="load-row"><span class="load-l">Pon el pin en</span>
        <span class="load-v">Placa <b>${p.stack.index}</b></span></div>`;
  } else if(p && (p.kind === 'barra' || p.kind === 'discos')){
    const lbl = p.points === 1 ? 'En un solo lado' : (p.points === 2 ? 'Por lado' : `En cada pitón`);
    body = (p.points === 2 ? barbellSVG(p.perPoint, { h:62, scale:0.52 })
                           : postSVG(p.perPoint, { h:62, scale:0.52 }))
      + `<div class="load-row"><span class="load-l">${lbl}</span>
         <span class="load-v">${pointTextHTML(p.perPoint)}</span></div>`;
  }
  return `<div class="warm${work ? ' work' : ''}">${head}${body}</div>`;
}

function showWarmup(xi){
  const ex = db.active.exercises[xi];
  const plan = warmupPlan(xi);
  if(!plan){
    infoModal('Calentamiento', 'Escribe primero el peso de hoy en la serie 1 (o entrena una vez este ejercicio) y te calculo la escalera de calentamiento.');
    return;
  }
  const eqW = effEquip(ex.key);
  const drawn = ['barra','discos','placas'].includes(eqW) && (plan.steps || []).length && plan.W > 0
    && !!loadPlan(ex.key, plan.W);
  const list = drawn
    ? plan.steps.map((st, i) => warmStepHTML(ex.key, `Serie ${i+1}`, `${fmtWEx(ex.key, st.w)} ${uLabelEx(ex.key)} × ${st.reps}`, st.w, false)).join('')
      + warmStepHTML(ex.key, 'Trabajo', `${fmtWEx(ex.key, plan.W)} ${uLabelEx(ex.key)}`, plan.W, true)
    : plan.rows.map((r, i) => `
      <div class="exline">
        <span class="tiny">Serie ${i+1}</span>
        <span class="sets" style="font-size:13px;color:var(--bone)">${r}</span>
      </div>`).join('')
      + (plan.W && plan.rows.length ? `
      <div class="exline">
        <span class="tiny" style="color:var(--up)">Trabajo</span>
        <span class="sets" style="font-size:13px;color:var(--up)">${fmtWEx(ex.key, plan.W)} ${uLabelEx(ex.key)}</span>
      </div>` : '');
  openModal(`
    <h2>Calentamiento — ${esc(exBaseName(ex.name))}</h2>
    ${ plan.first ? '' : `<p class="muted" style="margin-bottom:10px">Este músculo ya viene caliente de un ejercicio anterior: con menos alcanza.</p>` }
    ${ list ? (drawn ? `<div style="margin-bottom:14px">${list}</div>`
                     : `<div class="list" style="padding:4px 16px;margin-bottom:14px">${list}</div>`) : '' }
    ${ plan.note ? `<p class="muted" style="margin-bottom:12px">${plan.note}</p>` : '' }
    <p class="tiny" style="line-height:1.6;margin-bottom:14px">
      Descansa solo 30–60 s entre series de calentamiento y mueve el peso con <b>intención de velocidad</b>
      (activa sin fatigar). <b>No registres estas series en la app</b> — solo las de trabajo.
      ${ plan.first && xi === 0 ? ' Antes del primer ejercicio del día, 5 min de cardio suave suman — sobre todo en pierna (+8 % de rendimiento en la evidencia).' : '' }
    </p>
    <button class="btn" onclick="closeModal()">Listo</button>`);
}

/* =====================================================================
   TIMER DE DESCANSO
   ===================================================================== */
function restSecs(key){
  const r = db.settings.rest;
  if(r === 'off') return null;
  if(key){                       /* descanso propio del ejercicio, si lo configuró */
    const er = parseInt(exMeta(key).rest, 10);
    if(!isNaN(er) && er > 0) return er;
  }
  if(r && r !== 'auto'){ const n = parseInt(r,10); if(!isNaN(n) && n > 0) return n; }
  return GOALS[db.settings.goal || 'ambas'].rest;
}
function startRestAuto(key){
  const s = restSecs(key); if(!s) return;
  restUntil = Date.now() + s*1000;
  tickRest();
}
function toggleRest(){
  if(restUntil) restUntil = null;
  else startRestAuto();
  tickRest();
}
/* ---------- notificaciones del sistema (opt-in) ---------- */
function canNotify(){
  return db.settings.notify === 'on' &&
         typeof Notification !== 'undefined' && Notification.permission === 'granted';
}
/* solo avisa cuando la app NO está a la vista: en pantalla, el sonido/vibración bastan */
function notify(title, body, tag){
  if(!canNotify()) return;
  if(typeof document !== 'undefined' && document.visibilityState === 'visible') return;
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready
        .then(reg => reg.showNotification(title, { body, tag, icon:'icon-192.png', badge:'icon-192.png' }))
        .catch(() => {});
    } else {
      new Notification(title, { body, tag });
    }
  }catch(e){}
}
function enableNotifications(){
  if(typeof Notification === 'undefined'){
    infoModal('No disponible en este navegador',
      'En iPhone, las notificaciones solo funcionan con la app instalada en la pantalla de inicio (Safari → Compartir → Añadir a pantalla de inicio) y iOS 16.4 o más nuevo. Instálala y actívalas desde ahí.');
    return;
  }
  Notification.requestPermission().then(perm => {
    if(perm === 'granted'){
      db.settings.notify = 'on'; save(); render();
      infoModal('Notificaciones activadas ✓',
        'Te avisaré cuando termine tu descanso y si una sesión queda abierta sin actividad — solo cuando la app no esté a la vista.');
    } else {
      db.settings.notify = 'off'; save(); render();
      if(perm === 'denied') infoModal('Permiso bloqueado',
        'El navegador tiene bloqueadas las notificaciones para esta app. Para permitirlas: ajustes del navegador/teléfono → notificaciones de este sitio → permitir, y vuelve a intentarlo.');

}

/* sesión olvidada: abierta 15+ min sin anotar nada */
function checkIdleSession(){
  if(!db.active) return;
  const last = db.active.lastLog || db.active.start;
  if(Date.now() - last > 15*60*1000 && !(db.active.idleNotified > last)){
    db.active.idleNotified = Date.now();
    save();
    notify('Tu sesión sigue en curso',
      'Llevas 15 min sin anotar series. ¿Seguimos? Si ya acabaste, entra y toca “Terminar” para guardarla.', 'hierro-idle');
  }
}

/* pantalla siempre encendida durante la sesión (Wake Lock) */
let wakeLock = null;
async function acquireWake(){
  try{
    if('wakeLock' in navigator && db.settings.screenOn !== 'off' && db.active && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  }catch(e){}
}
function releaseWake(){
  try{ if(wakeLock) wakeLock.release(); }catch(e){}
  wakeLock = null;
}

function beep(){
  try{
    if(navigator.vibrate) navigator.vibrate([200,120,200]);
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    for(const [f, t] of [[880, 0], [1175, 0.22]]){
      const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
      o.connect(gn); gn.connect(audioCtx.destination);
      o.frequency.value = f;
      gn.gain.setValueAtTime(0.18, t0 + t);
      gn.gain.exponentialRampToValueAtTime(0.001, t0 + t + 0.25);
      o.start(t0 + t); o.stop(t0 + t + 0.3);
    }
  }catch(e){}
}
function tickRest(){
  const box = document.getElementById('rest');
  if(!box) return;
  const t = document.getElementById('resttime');
  const l = document.getElementById('restlabel');
  const f = document.getElementById('restfill');
  const total = restSecs() || 0;
  if(restUntil === null){
    if(box.className !== 'rest'){
      box.className = 'rest';
      if(l) l.textContent = 'Descanso';
      if(t) t.textContent = fmtClock(total);
      if(f) f.style.width = '0%';
    }
    return;
  }
  const rem = Math.ceil((restUntil - Date.now())/1000);
  if(rem <= 0){
    restUntil = null;
    beep();
    notify('Descanso listo', '¡A la siguiente serie!', 'hierro-rest');
    box.className = 'rest done';
    if(l) l.textContent = 'Listo';
    if(t) t.textContent = '¡Vamos!';
    if(f) f.style.width = '100%';
    setTimeout(() => { if(restUntil === null) tickRest(); }, 4000);
    setTimeout(() => {
      const b2 = document.getElementById('rest');
      if(b2 && restUntil === null){
        b2.className = 'rest';
        const l2 = document.getElementById('restlabel');
        const t2 = document.getElementById('resttime');
        const f2 = document.getElementById('restfill');
        if(l2) l2.textContent = 'Descanso';
        if(t2) t2.textContent = fmtClock(restSecs() || 0);
        if(f2) f2.style.width = '0%';
      }
    }, 4200);
    return;
  }
  box.className = 'rest on';
  if(l) l.textContent = 'Descansando';
  if(t) t.textContent = fmtClock(rem);
  if(f) f.style.width = (total ? Math.max(0, Math.min(100, (1 - rem/total) * 100)) : 0) + '%';
}

/* =====================================================================
   GRÁFICA DE PROGRESO (canvas, una serie: 1RM estimado o reps)
   ===================================================================== */
function drawChart(){
  const cv = document.getElementById('exchart');
  if(!cv) return;
  const pts = window.__chartPts || [];
  if(pts.length < 2) return;
  const W = cv.parentElement.clientWidth, H = 120;
  const dpr = window.devicePixelRatio || 1;
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  const padL = 4, padR = 8, padT = 10, padB = 10;
  const dmin = Math.min(...pts.map(p=>p.v)), dmax = Math.max(...pts.map(p=>p.v));
  let lo = dmin, hi = dmax;
  if(lo === hi){ lo -= 1; hi += 1; }
  const span = hi - lo; lo -= span*0.14; hi += span*0.14;
  const X = i => padL + (W-padL-padR) * (pts.length === 1 ? 0.5 : i/(pts.length-1));
  const Y = v => padT + (H-padT-padB) * (1 - (v-lo)/(hi-lo));

  /* rejilla recesiva: tres líneas sin números — el valor vive en el titular */
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
  for(const frac of [0, 0.5, 1]){
    const y = padT + (H-padT-padB) * frac;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  /* línea de la serie */
  ctx.strokeStyle = '#F3F1EC'; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  pts.forEach((p,i) => i ? ctx.lineTo(X(i), Y(p.v)) : ctx.moveTo(X(0), Y(p.v)));
  ctx.stroke();
  /* cada punto es una sesión; el último se resalta */
  pts.forEach((p,i) => {
    const last = i === pts.length-1;
    ctx.beginPath();
    ctx.arc(X(i), Y(p.v), last ? 3.6 : 2.4, 0, 7);
    ctx.fillStyle = last ? '#F3F1EC' : '#8B8E94';
    ctx.fill();
  });

  /* interacción: tocar o arrastrar muestra el detalle de la sesión más cercana */
  const pick = ev => {
    const rect = cv.getBoundingClientRect();
    const x = ev.clientX - rect.left;
    let i = Math.round((x - padL) / ((W-padL-padR) / (pts.length-1)));
    i = Math.max(0, Math.min(pts.length-1, i));
    const tip = document.getElementById('charttip');
    if(tip) tip.innerHTML = `${fmtDateShort(pts[i].date)} · ${fmtNum(pts[i].v)} ${window.__chartUnit}`;
  };
  cv.onpointerdown = pick;
  cv.onpointermove = ev => { if(ev.buttons || ev.pointerType === 'mouse') pick(ev); };
}
